; Proyek gas. Bangun: pio run -e lorawan   (atau -e seluler / -e meshtastic)
; Salin include/config.example.h -> include/config.h dan isi (config.h tidak masuk git).
[common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
build_flags = -Iinclude -DCORE_DEBUG_LEVEL=0
lib_deps =


[env:lorawan]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = ${common.build_flags} -DMODE_LORAWAN
lib_deps =
  ${common.lib_deps}
  jgromes/RadioLib@6.6.0

[env:seluler]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = ${common.build_flags} -DMODE_SELULER
lib_deps =
  ${common.lib_deps}
  vshymanskyy/TinyGSM@0.12.0

[env:meshtastic]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = ${common.build_flags} -DMODE_MESHTASTIC
lib_deps = ${common.lib_deps}
