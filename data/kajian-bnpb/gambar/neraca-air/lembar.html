igcaption><img src="neraca-peta-ddl.png" style="width:16.5cm"><p class="s"><b>Sumber:</b> Pengolahan data Pantau Bencana, model neraca air kajian ini; bukan status resmi (batas tetap, SA/DA = 1 memisahkan defisit dan surplus)</p><p class="s"><b>Catatan:</b> SA = limpasan lokal model; DA = penduduk x 1.600 m³/kapita/tahun; rasio di bawah 1 = defisit.</p><p class="s"><b>Mesin:</b> peta, G19, mode docx, 16,5 x 7,17 cm</p></figure><figure><figcaption><b>Gambar uji 4</b> Pangsa aliran masuk dari kab/kota hulu dalam ketersediaan air tahunan per kab/kota di Pulau Jawa, rerata 1991–2025 (%)</figcaption><img src="neraca-peta-aliran-hulu.png" style="width:16.5cm"><p class="s"><b>Sumber:</b> Pengolahan data Pantau Bencana, penelusuran aliran HydroBASINS level 9; estimasi model (batas tetap seperlima)</p><p class="s"><b>Catatan:</b> Ketersediaan = limpasan lokal + aliran masuk dari hulu, sesudah pemakaian di hulu.</p><p class="s"><b>Mesin:</b> peta, G19, mode docx, 16,5 x 7,17 cm</p></figure><figure><figcaption><b>Gambar uji 5</b> Kab/kota dengan neraca Juni–Oktober negatif per skenario iklim, rerata 1991–2025 dan tahun kering 1997, 2015, 2019, 2023</figcaption><img src="neraca-batang-skenario.png" style="width:16.5cm"><p class="s"><b>Sumber:</b> Pengolahan data Pantau Bencana, model neraca air kajian ini; estimasi model, kebutuhan 2025</p><p class="s"><b>Catatan:</b> Bias tahun kering bergantung tahun: 1997 melebih-lebihkan kekurangan, 2019 dan 2023 meremehkannya di sebagian muara.</p><p class="s"><b>Mesin:</b> batang, G1, mode docx, 16,5 x 6,93 cm</p></figure><figure><figcaption><b>Gambar uji 6</b> Limpasan lokal dan kebutuhan konsumtif bulanan Pulau Jawa, rerata 1991–2025 dan kebutuhan 2025 (juta m³)</figcaption><img src="neraca-garis-bulanan.png" style="width:16.5cm"><p class="s"><b>Sumber:</b> Pengolahan data Pantau Bencana, model neraca air kajian ini; estimasi model</p><p class="s"><b>Mesin:</b> garis, di luar tabel B5.10: Dua seri dua belas bulan untuk membandingkan musim pasokan dan kebutuhan; batang kelompok tidak tersedia di perender, mode docx, 16,5 x 7,92 cm</p></figure>
