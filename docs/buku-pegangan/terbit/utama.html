n `git rev-parse HEAD`.\n\n### Status tiap repo\n\nDicek 7 Okt 2026 lewat keberadaan berkas.\n\n| Komponen | Pangantara (MBG) | Gemah Ripah (GR) | Betutu Sambe (BS) | Worth It |\n| --- | --- | --- | --- | --- |\n| `.husky` pre-commit / pre-push | ada, 718 / 1.045 baris | ada, 15 / 65 baris | ada, 15 / 65 baris | ada, 15 / 65 baris |\n| pre-push: worktree isi commit, antre, vonis | ada | belum (dicatat sebagai pekerjaan nanti di kepala berkas) | belum | belum |\n| `lint:ratchet` | ada | belum (`npm run lint` polos) | belum | belum |\n| `.claude/pelunas/`, `scripts/pelunas/` | ada, 1.302 entri | belum | belum | belum |\n| `pelunas-push.sh` + launchd | ada, terpasang | belum | belum | belum |\n| `night-shift.md`, `routines.json` | ada | belum | belum | belum |\n| Routine malam | 9 terdaftar | hanya `pembaru-buku-pegangan-gr` | hanya `pembaru-buku-pegangan-bs` | belum |\n| `.nvmrc` | 24 | 24 | 24 | 22 |\n\nUrutan menyusul yang disarankan: GR dan BS mengambil langkah 3 dan 4 (ratchet, buku vonis), lalu 6 dan 9 (routine `pelunas-backlog` dengan `night-shift.md` yang disesuaikan); Worth It mulai dari langkah 11 dan penyamaan Node.\n\n### Ranjau dan tindakannya\n\nCocokkan gejala, ikuti tindakan, jangan diagnosis dari nol. Perbaiki dari keluaran gerbang yang dijalankan ulang (`npx tsc --noEmit`), bukan dari tempelan dialog yang hanya potret satu momen.\n\n| Gejala | Sebab | Tindakan |\n| --- | --- | --- |\n| Push merah dengan stack trace V8, nol error TS, hijau kalau diulang saat sepi | Sebab: 28 Agt 2026 Node menghitung plafon heap dari memori yang sedang tersedia (sekitar 2 GB di mesin 8 GB) dan `tsc` melewatinya saat mesin ramai | `NODE_OPTIONS=--max-old-space-size=4096` di pre-push dan script `typecheck`; jangan buang gerbangnya |\n| Typecheck gagal exit 137 atau 143, daftar error kosong | Sebab: 12 Agt 2026 tiga sesi menjalankan `tsc` barengan di mesin yang bertumpu swap, jetsam membunuh `tsc` gerbang | bukan vonis kode; tutup sesi atau `tsc` lain, push ulang, jangan `--no-verify` |\n| Vonis kosong disertai `cd: .../gerbang-push-<pid>: No such file or directory`, atau menyebut simbol yang `grep`-nya nol hasil | Sebab: 6 Sep 2026 worktree sementara gerbang disapu gerbang lain, lalu gerbang jatuh memeriksa isi disk | bukan salah commitmu; vonis atas isi disk tidak dibukukan; push lagi sekali, `git worktree prune` |\n| Push dari worktree pelunas mendarat tanpa satu baris `Gerbang push:` | Sebab: 6 Sep 2026 `.husky/_` tidak ter-track, worktree baru lahir tanpanya dan `core.hooksPath` relatif menunjuk direktori kosong, git diam saja | salin `.husky/_` ke worktree (jangan symlink); `ls .husky/_/pre-push` sebelum percaya pushnya bergerbang |\n| Semua task malam berhenti di langkah 0 | Sebab: 9 Sep 2026 `hostname` turun dari jaringan jadi `Mac` karena `HostName` tak diset | `giliran-mesin.sh` mencocokkan tiga sumber; jangan menurunkan `mesin_24jam` jadi nama generik, itu membuka laptop |\n| Commit routine tertahan di `HEAD` terlepas, spanduk \"buku basi\" menyala lagi | Sebab: 31 Agt 2026 prompt menulis \"lalu push ke main\" tanpa refspec | selalu `git push origin HEAD:main`; routine terjadwal tidak punya Stop hook yang mendorong untuknya |\n| Prompt di `~/.claude` basi atau hilang tanpa jejak | Sebab: 31 Agt 2026 salinan prompt kehilangan baris refspec eksplisit dan dua commit terdampar | prompt tipis menunjuk kontrak, registri `routines.json`, gerbang routine terdaftar; pasang ulang bundel hanya setelah keputusan yang cuma ada di sisi terpasang dipindah ke kontrak |\n| Run Actions gagal dalam 3 detik, `steps: 0`, log kosong | Sebab: 27 Agt 2026 kuota menit habis, sebagian besar terbakar cron yang ditagih semenit penuh per run | baca anotasi (`gh api .../check-runs/<id>/annotations`); longgarkan cron atau pindahkan ke Vercel Cron; vonis `ci-kuota-habis` itu transien |\n| Push hijau mendarat, tidak ada deploy baru, status commit `Vercel: failure` | Sebab: 22 Sep 2026 `vercel.json` meminta memori 3008 di plan Hobby (plafon 2048), deploy ditolak sebelum build | turunkan ke 2048; cek lewat `gh api repos/<org>/<repo>/commits/<sha>/status` |\n\nAturan umum: gerbang yang salah tuduh diperbaiki pengecualiannya dengan alasan tertulis, bukan redaksi komentarnya dan bukan aturannya dihapus.\n\nBab 28\n\n## Deploy dan jalur produksi\n\n### Siapa memeriksa apa\n\n- Lima pemeriksa berbeda cakupan, jadi hijau di satu tempat bukan jaminan: pre-commit (lint fix, prettier, restage), pre-push (tsc inkremental, lint, uji terkait diff atas pohon yang didorong), Stop hook akhir giliran agent (tsc inkremental, lint, uji terkait diff, tahan push bila gagal, tulis sha lolos supaya pre-push tidak dobel), CI tiap push ke main (typecheck, lint, test penuh, build), build Vercel (next build, TS dan eslint ikut menggagalkan). Gagalnya terlihat di dialog, stderr, tab Actions, dashboard.\n- Membaca kombinasi: Vercel READY dan CI merah berarti test merah (Vercel tidak menjalankan test, app tetap sehat); keduanya ERROR berarti TS atau eslint; Vercel ERROR dan CI hijau berarti beda lingkungan (Node, env var, casing berkas); push ditolak dan CI tidak jalan berarti urusan git/berkas; semua hijau tapi app salah berarti runtime; BLOCKED (bukan ERROR) berarti author commit bukan member team.\n- Pre-push wajib menjalankan test, bukan menyerahkannya ke CI. Sebab: dari 34 run CI merah (71 run), 22 gagal di Test dan tidak dijaga pre-push sampai 4 Agt 2026, karena jalur commit dominan adalah GUI yang tak pernah menyentuh Stop hook; typecheck 12 (dijaga sejak 2 Agt 2026), lint 0, build 0. Satu test pernah merah 18 jam melewati 10 run.\n- Gerbang lokal menjalankan uji **terkait** diff, suite penuh di CI; ini keputusan pemilik, bukan pelemahan (MBG 7 Okt 2026: 655 berkas uji, push 4 sampai 10 menit, Node abort empat kali sehari saat sekitar 10 agent paralel). Pemilihnya (MBG: `scripts/mesin/uji-terkait.mjs`) mengambil `vitest related` atas berkas yang berubah, uji yang ikut berubah, pemindai yang menyebut path yang berubah, daftar inti (uji yang pernah menahan push dalam 60 hari menurut buku vonis), dan pemindai berat per area. Ragu (diff tak terbaca, lebih dari 300 berkas, package-lock, vitest.config, atau tsconfig berubah, buku vonis tak terbaca) berarti suite penuh; jalan keluar sadar `MBG_UJI_PENUH=1`; cek tipe inkremental, dimatikan `MBG_TSC_DINGIN=1`; lama tiap langkah dicatat. `ci.yml` tetap penuh, dijaga `gerbang-uji-terkait`. Risikonya \"hijau di sini, merah di CI\" untuk pemindai yang tak menyebut berkas yang berubah; obatnya bukan melonggarkan CI, gerbang yang berulang naik ke daftar inti atau masuk daftar berat. Versi gugur: pre-push menjalankan suite penuh.\n- CI merah umumnya berarti \"melanggar gerbang\", bukan app rusak; perbaikan cepat, mahal bila dibiarkan menumpuk jadi satu run empat pelanggaran dari empat sesi.\n\n### Aturan terkunci\n\n- Author commit wajib identitas yang terdaftar sebagai member team (MBG: mbgbangkabelitung). Sebab: author lain membuat deploy BLOCKED, ke-push tapi tak pernah live dan mudah terlewat. Perbaikan terlanjur: git commit --amend --reset-author.\n- Region fungsi sedekat database (MBG: \"regions\": \\[\"hnd1\"\\] di vercel.json karena DB di Tokyo; TTFB pernah 1,3 detik). JSON tak bisa berkomentar, jadi alasannya tinggal di dokumen. (WI: Supabase terpisah di org PANGANTARA Singapore, Vercel region sin1.)\n- ignoreBuildErrors dan ignoreDuringBuilds tetap false: membaliknya menukar \"deploy gagal 3 menit\" dengan \"app rusak di produksi tanpa peringatan\".\n- NEXT_DIST_DIR wajib path relatif. Sebab: 27 Jul 2026 path absolut tetap di-join ke root project, 830 berkas plus satu webpack pack 359 MB ke-index, push jebol batas blob 100 MB.\n- Jangan melemahkan gerbang demi mengejar deploy; bila gerbang salah tuduh, perbaiki pengecualiannya dengan alasan tertulis, jangan hapus aturan.\n- Node CI harus sama dengan Node Vercel; pin lewat .nvmrc di repo, bukan hanya setelan proyek.\n- Semua kerja mendarat di main, tanpa branch dan PR (MBG vonis pemilik 3 Sep 2026; GR dan BS: repo cuma punya branch main, worktree dan branch agent dihapus sesudah push; satu repo per usaha). Sebab: branch tidak pernah di-review manusia, basi terhadap main (dua PR malam: 522 dan 257 berkas selisih untuk 19 baris eslint), dan tiap branch menambah antrean push di gerbang yang sama.\n- Bila dua pekerja berkas yang sama: stage berkas yang kamu sunting saja, jangan git add -A. Cek git status --porcelain sebelum menyunting; kotor yang bukan milikmu berarti milik sesi lain. Vonis gerbang yang menyebut berkas yang tidak kamu sentuh biasanya tabrakan sesi. Jangan dua sesi di satu working tree. Satu vonis push berlaku untuk seluruh mesin.\n- Berkas hasil generate diselesaikan mesin: tandai merge=ours di .gitattributes, tarik lewat skrip (tidak memakai git stash) lalu build ulang. Prompt routine terpasang wajib identik dengan bundel bekalnya dan jalur mesin absolut ditahan di pre-commit (sebab: 37 commit menumpuk sekitar 23 jam, 13 Sep 2026).\n- Identitas mesin dibaca dari nama komputer yang stabil, bukan hostname turunan jaringan (10 Sep 2026). Mesin 24 jam (MBG: Mac mini, bukan laptop) menjalankan pelunas push, penjaga CI, penjaga produksi, dan task malam; task yang sama di laptop dihapus agar dua pemicu tidak saling menimpa. Perubahan berkas yang disalin ke direktori mesin menuntut pasang ulang (sebab: 22 Sep 2026 penjaga CI menjalankan salinan tanggal 12 Sep).\n- Jam berat: panen dan tulis massal tidak di jam kerja, jadwal dalam WIB (WI BS: zona Asia/Jakarta di kode; BS WIB bukan WITA walau usaha di Bali), job pg_cron yang menulis massal tidak berjadwal tiap menit, tiap cron terdaftar di katalog.\n\n### Protokol tiga lapis\n\n- Tiap kegagalan yang dilaporkan (dialog Commit/Push failed, Actions merah, Vercel ERROR/BLOCKED, \"kok belum live\") ditutup tiga lapis: (1) perbaiki kodenya sampai perkakas yang merah hijau dan commit benar-benar ter-push; (2) catat satu baris di katalog ranjau berikut entri bertanggal; (3) pasang penjaga di titik paling hulu yang masih bisa memeriksanya dan pernah dibuat merah sekali dengan sengaja. Berhenti di lapis 1 sama dengan setengah pekerjaan: kelas yang cuma ditambal sekali meledak lagi dan lebih mahal.\n- Bila kelas memang tak bisa dimesinkan, tulis alasannya di bagian \"lubang yang masih terbuka\"; yang tidak sah adalah diam.\n- Buku vonis push (MBG, 5 Sep 2026): tiap push yang ditahan membuka satu entri; gerbang menahan push berikutnya selama ada entri terbuka. Menutup entri butuh gerbang atau alasan tertulis; kelas yang berulang wajib pelajaran (gerbang yang kedua kalinya lolos berarti gerbangnya yang salah). Vonis transien jangan ditutup berdasarkan \"hijau di disk\": jalankan ulang gerbang yang dituduh dan baca angkanya (disk sesi lain sedang bergerak).\n- Tempat memasang gerbang dari paling hulu: assertion di tes gerbang deploy, pre-commit, pre-push, Stop hook, lalu trigger DB plus cron sapuan untuk data yang bisa rusak dari jalur tulis mana pun. Gerbang yang menjaga sebab belum tentu menjaga diagnosisnya (entri vonis lahir bergejala kosong, tiga kali sehari, 10 Sep 2026): jaga juga kelengkapan gejala di buku vonis.\n- Gerbang menjaga rantai (pemanggil tetap memanggil yang asli), bukan alamat rumah isi; gerbang yang mengeja jalur berkas wajib punya assertion bahwa jalur itu masih mengenai sesuatu, supaya mati berisik. Gerbang cocok-teks wajib pesan sebagai argumen kedua. Pesan vonis \"sudah mendarat\" maksimal 14 baris dan baris isi terakhirnya mengulang bahwa kerja sudah live (9 Sep 2026: dialog GitHub Desktop memuat sekitar 14 baris, vonis 21 baris).\n- Gerbang cermin dan sumbernya: pemindai wajib memindai git ls-files atau mengabaikan salinan Finder/iCloud (\"WilayahScope 2.tsx\"), karena CI clone bersih selalu hijau sedangkan salinan hanya lahir di mesin lokal (20 Sep 2026: 476 salinan, 206 gerbang memindai filesystem, 32 error palsu dan enam ratchet naik).\n- Diagnosa 60 detik: gh run list --limit 5, gh run view \\<id> --log-failed, git log --oneline -3; di Vercel list_deployments untuk state, build logs dengan errorsOnly untuk sebab, runtime logs bila READY tapi app salah. Urutan baca: state dulu (BLOCKED, CANCELED, ERROR beda), error pertama bukan terakhir (yang di bawah longsoran), cocokkan jalur dengan tabel kombinasi, baru buka kode. Bila build gagal tanpa satu baris error, baca log mentah, jangan percaya penyaring.\n\n### Batas platform: gagal karena angka\n\n- Kodenya benar, testnya hijau, platform yang menolak: hanya ketahuan saat deploy. Cek sebelum menambah. Hobby Vercel: 12 serverless function per deployment (MBG: 127 route.ts dibundel jadi 10), cron maksimal sekali sehari, timeout fungsi 30 s (Pro 300 s), memori build 8192 MB (lewat berarti dibatalkan, cari heap out of memory), durasi build 45 menit. (WI: cron tiap 30 menit butuh Pro.) GitHub: berkas maksimal 100 MB (push ditolak), peringatan 50 MiB, satu push maksimal 2 GB.\n- Build Vercel gagal tanpa log hanya tiga sebab di luar kode: vercel.json tidak sah, Ignored Build Step menolak, atau commit dari bukan member team.\n- Build Vercel yang merayap sampai `BUILD_EXCEEDED_MAXIMUM_TIME` dengan log berhenti di \"Linting and checking validity of types\" tanpa error adalah heap Node yang habis, bukan kode: cek tipe dingin repo besar melewati 4 GB dan GC meronta tanpa crash. Plafon heap dipasang di **skrip** build (`\"build\": \"NODE_OPTIONS=\\\"--max-old-space-size=6144 $NODE_OPTIONS\\\" next build\"`), bukan env CI, karena Vercel tidak membaca `ci.yml`. Menambah sumber daya, bukan melonggarkan: `ignoreBuildErrors` tetap false. Tandanya errorCode deploy, bukan log (MBG 7 Okt 2026, dua deploy produksi beruntun jatuh sekitar 43 menit sesudah \"Compiled successfully\"; gerbang `gerbang-heap-typecheck`).\n- Kuota database: Supabase memasang default_transaction_read_only saat disk melewati kuota paket (Free 500 MB, Pro 8 GB), dan semua tulisan gagal dengan pesan \"gagal menyimpan\". Sebab: 3 Sep 2026 pg_cron akun massal menambah 37 ribu akun, DB sudah 1,1 GB, semua tulis produksi gagal sekitar lima menit; kejadian dua kali sehari. Disiplinnya: terbitkan akun massal per provinsi lewat tombol, cron massal nasional dilarang sampai paket naik. Pasang alarm kuota yang berbunyi sebelum produksi berhenti menulis (RPC db_kuota_ringkas dibaca System Health plus alert WA), ambang dari env bukan konstanta. Laporan \"tidak bisa simpan\": jalankan show default_transaction_read_only sebelum menyalahkan kode. set default_transaction_read_only = off per sesi tidak cukup dalam satu request MCP; yang jalan begin read write; ...; commit;.\n- Suite integrasi DB tidak pernah jalan di produksi. Sebab: 9 Sep 2026 login mati untuk semua akun 18:50 sampai 19:56 WIB (dashboard \"Unhealthy\", tanpa deploy) karena workflow E2E menembak DB produksi (compute nano 0,5 GB, jatah burst IO harian); delapan run hari itu, satu 40 menit, menghabiskan jatah; satu select makan 13 sampai 20 detik, server auth berbatas 10 detik memutus tiap login sebagai 500. Membatalkan run tidak memulihkan, restart proyek yang memulihkan. Susunannya: cermin terenkripsi berumur pendek sekali sehari (03:00 WIB), dipulihkan ke Postgres lokal runner (127.0.0.1:54322) tanpa menyentuh secret DATABASE_URL, skrip uji menolak host Supabase mana pun. Laporan \"semua orang tidak bisa login\": baca auth_logs (context deadline exceeded) dan postgres_logs (duration puluhan detik pada query sepele); itu mesin tercekik, bukan akun.\n- Memulihkan cermin adalah langkah setup, dan setup gagal tanpa gejala: kolom generated (auth.users.confirmed_at) tidak boleh ditulis lewat COPY, jadi pulihkan lewat tabel singgah di pg_temp (skema auth milik supabase_auth_admin) dengan daftar kolom dari information_schema.columns is_generated = 'NEVER' di katalog lokal; muat data cermin dulu, akun belakangan dengan on conflict do nothing (isi dump bukan kontrak); relasi produksi yang tak ada di runner (stack lokal selalu di belakang GoTrue produksi) disaring lewat selisih daftar COPY dengan pg_class runner, blok yang dibuang wajib kosong, dan tabel platform yang berisi di produksi tapi tak ada di runner tetap merah; setval atas sekuens yang belum ada di skema gugur (46 kali, 5 Okt 2026). Instalasi alat uji (psql) diulang tiga kali, bukan ujinya, dan tidak dipasang ulang bila sudah ada.\n- Daftar kolom aman untuk membaca bukan daftar sah untuk menulis; tanyakan \"ada?\" lewat katalog, bukan \"boleh ditulis?\" (has_table_privilege hanya untuk tabel yang ada).\n- Cermin harus ditambah migrasi repo yang stempelnya lebih baru dari yang terakhir masuk produksi, karena paths: migrasi di workflow adalah janji bahwa yang berubah itulah yang diuji. Batasnya stempel terbaru, bukan selisih himpunan (produksi 1.050 migrasi terapan lawan 883 berkas). Sebab: 11 Sep 2026 tiga run merah menuduh kode benar, tiga entri vonis menahan tiap push. Migrasi yang gagal diterapkan di sini merah karena yang tak mendarat di salinan produksi tak akan mendarat di produksi.\n- Env var baru wajib masuk .env.example dan diisi di Vercel; NEXT_PUBLIC\\_\\* ter-inline saat build, jadi mengubahnya wajib redeploy.\n- Migrasi dasar skema yang lahir di produksi dulu sebelum migrasi dicatat tidak bisa diputar ulang lokal; jangan tambah migrasi CREATE TYPE demi lokal. Pakai stack review lokal berskema salinan produksi. (WI: karena DB belum tayang, 16 migrasi digulung jadi baseline bersih dengan perbaikan keamanan di dalamnya, bukan ditambal.)\n- Server crawler hanya menyentuh sumber publik; endpoint yang \"kelihatan ada\" dibuktikan lewat browser dulu sebelum ditulis jadi cron. Rujukan data eksternal tanpa API publik terdokumentasi diimpor manual (MBG: harga pangan Babel 2 sampai 3 Sep 2026, Bapanas 401 tanpa kunci), tanpa tombol tarik dan tanpa WA.\n\n### Keamanan dan cangkok fondasi\n\n- Penjagaan hidup di database, bukan di tampilan. Tiga lapis: middleware mengarahkan, guard di tiap route, RLS dan trigger di DB. Satu peta peran dibaca nav dan guard; halaman baru wajib didaftarkan, bawaannya ditolak (BS: PAGE_ACCESS; gerbang halaman).\n- Objek DB baru tidak boleh terbuka untuk anon: tutup dengan event trigger yang mencabut anon dan public dari tiap view/fungsi baru dari jalur mana pun, karena DDL lewat MCP apply_migration tidak lewat berkas dan semua gerbang repo buta (MBG: kunci_anon).\n- Rute publik baru butuh dua baris di middleware default-deny (konstanta path dan sebutan di rantai isPublic sebelum redirect); uji dengan curl tanpa cookie, bukan browser yang sedang login (MBG 20 Agt 2026: QR tercetak di kertas mendarat di /login).\n- Celah umum yang wajib dicari saat audit proyek baru atau hasil cangkok (WI, 3 Okt 2026): saldo kredit bisa diubah sendiri oleh user, fungsi terbuka, SSRF di fetch server; izin extension terlalu lebar, harga dari klien, webhook tanpa tanda tangan, kode server bocor ke klien, pemanggilan AI tanpa kuota. Pelunasan menimpa status sebelum cek idempoten, saldo naik walau log kredit bentrok, antrean menggantung tak dipulihkan. Klaim README tentang tahap selesai diverifikasi ke kode, bukan dipercaya.\n- Aturan keputusan (WI): data panen tidak masuk DB sebelum celah keamanan tertutup (urutan: dasar, tampilan, keamanan, lalu fitur); satu rumus per besaran; model AI hanya mengekstrak atribut dan tidak menentukan angka; kredit dipotong hanya saat vonis berhasil; angka kartu tidak dari teks model; harga properti tampil berlabel \"harga minta\" dengan ambang listing unik per kelurahan (WI: 30 dan 75).\n- Pola data dan uang (GR dan BS, penjagaan di DB): nomor dokumen satu lajur JENIS-YYMM-NNNN; jurnal otomatis per dokumen sumber, jurnal tak seimbang ditolak bukan dibulatkan; satu rumus harga; stok tak boleh minus; dokumen yang uangnya bergerak terkunci dan pembayaran tak boleh melebihi tagihan; tutup buku bulanan menolak jurnal bulan tertutup, buka lagi butuh owner, alasan, audit; cocok mutasi bank otomatis hanya bila kandidat tunggal; harga dan HPP dibekukan di baris saat insert; status hanya maju lewat RPC dan status bayar diset trigger; PostgREST memotong 1000 baris tanpa error jadi pakai pengambil semua; keputusan data pemilik dicatat sebagai migrasi berkomentar alasan, bukan update diam; data dummy terpisah (is_dummy) tanpa bercampur stok, HPP, nomor asli, dengan tombol isi dummy sejak awal, Super Admin saja.\n- Satu peran Super Admin dicatat per proyek (BS: satu orang saja, tidak seperti GR). Layanan eksternal yang tak dipakai ditulis (BS: WA otomatis dan Anthropic tidak dipakai, AI lewat Groq dan Gemini, WA manual lewat wa.me; Supabase Free dengan cadangan harian modul sendiri).\n- Pilihan infra yang belum diputus jangan ditebak, tulis rekomendasi dan tunggu pemilik (WI: Supabase dan Vercel belum dibuat; paket Vercel dan jam routine menunggu pemilik). Gerbang bawaan fase awal proyek baru: husky, CI, gerbang deploy, penangkap error, vercel.json dengan cron, header keamanan, armada agent beserta ilmunya (WI Fase 0, 28 agent: 9 pengerja Sonnet, 6 platform Sonnet, 6 pemeriksa pola Haiku, 7 pemeriksa nalar Sonnet).\n- Routine pembaru buku pegangan tiap malam memeriksa apakah sumber selera berubah sejak stempel di kop, menambah entri Riwayat, lalu menerbitkan ulang ke alamat yang sama; hari tanpa perubahan dilewati tanpa menulis (GR 21.27 WIB, BS 21.43 WIB, di mesin 24 jam). Kanon selera lengkap tinggal di satu skill bersama, buku per proyek merujuknya.\n\nBab 29\n\n## Penegakan: hook dan gerbang mekanis\n\n### Prinsip dan anggaran konteks\n\n- Aturan tanpa gerbang mekanis dianggap belum jadi. Tiap aturan baru mendarat di tiga tempat: sumbernya (satu aturan satu rumah), gerbang mekanisnya, dan halaman buku pegangan. Kalau memang tidak bisa dimesinkan, tulis alasannya di berkas ranjau. Diam bukan jawaban yang sah.\n- Gerbang yang caranya menyuruh semua orang membaca semua aturan juga belum jadi. Pakai tiga lapis: (1) penunjuk di berkas induk (CLAUDE.md, AGENTS.md) yang cuma menyebut alamat berkas untuk tiap situasi; (2) suntikan per kebutuhan lewat PreToolUse hook, sekali per jenis berkas per sesi, berlaku ulang tiap 30 menit, tidak memblokir, fail-open total, dokumen .md dilewati; (3) gerbang mekanis yang tidak butuh konteks (test memindai sumber, hook menolak edit, trigger DB menutup jalur). Lapis 3 yang terpenting: aturan yang dimesinkan berhenti memakan token dan berhenti bergantung pada ingatan. Sebab: paket brief 55 berkas (MBG) berukuran 206.806 token, lebih besar dari satu jendela konteks, dan sebelum 28 Jul 2026 sembilan berkas berlabel wajib tidak dibaca satu pun.\n- Berkas induk adalah indeks, bukan tempat menumpuk cerita. Katalog hook cukup satu baris tabel per hook; alasan dan insiden tinggal di berkas ranjau dan di kepala hooknya. Jaga ukuran berkas induk dengan gerbang (CLAUDE.md maksimal 20.000 karakter, indeks MEMORY.md 24.000 karakter), dan adu daftar hook di settings dengan baris tabelnya dua arah: hook baru yang tak terdaftar ditolak, baris hantu untuk hook yang sudah dicabut juga ditolak. Sebab: 21 Agt 2026 bab hook (MBG) menyebut 12 hook padahal settings mendaftarkan 16, dan yang kena tolakan membacanya sebagai app rusak. Bab itu susut dari 9.757 ke 5.818 karakter sambil naik dari 12 ke 16 hook.\n- Memori yang menunjuk berkas mati membusuk tanpa tanda karena memori tidak pernah gagal build. Gerbangnya: tiap berkas repo yang disebut memori wajib masih ada atau ditandai mati di barisnya (dicoret atau memuat kata vonis). Yang ditolak penyebutan seolah masih hidup, bukan penyebutan berkas matinya. Sebab: sapuan 2 Sep 2026 menemukan enam memori menunjuk berkas yang sudah tidak ada (MBG).\n- Hook repo cuma hidup kalau sesinya dibuka di root repo. Sesi dari home dir memuat nol gerbang hulu tanpa tanda. Pasang penambal di luar repo (\\~/.claude/hooks) dan ulangi pendaftarannya tangan di mesin baru. Sebab: 11 Agt 2026 satu kelas bug mendarat dua kali berturut karena ini (MBG).\n- Satu worktree bisa dipegang banyak sesi. SessionStart menghitung sesi dan memperingatkan di atas ambang (batas_sesi di .claude/mode-agent.json). Aturan kerjanya: jangan git add -A, stage berkas yang disunting saja, cek git status --porcelain sebelum menyunting, dan cek list_migrations remote sebelum menulis migrasi. Vonis merah yang menyebut berkas yang tidak kamu sentuh hampir selalu tabrakan sesi, bukan kerusakan. Satu vonis push berlaku untuk seluruh mesin. Sebab: 6 Sep 2026 satu TS2304 menahan push semua sesi, saat itu sembilan sesi bersamaan.\n- Antrian proses berat: tsc, vitest, build, dan build knowledge graph antre di satu lock global, maksimal satu proses berat per mesin. Jangan disiasati. Sebab: pernah enam tsc jalan barengan sampai laptop 6 core lumpuh.\n- Batas agent paralel: paling banyak empat subagent hidup per sesi, foreground dan background dihitung sama; yang kelima ditahan hook PreToolUse (MBG: `blok-agent-kebanyakan.mjs`, uji `gerbang-batas-agent`). Fail-open: penanda basi sendiri sesudah 5 menit menunggu atau 3 jam hidup; sesi terkunci dibuka dengan menghapus `$TMPDIR/mbg-batas-agent/<session_id>/` atau `MBG_BATAS_AGENT=0`. Sebab: vonis MBG 7 Okt 2026 *\"Batasi agent paralel ke 3-4\"*, satu sesi meluncurkan 44 subagent, sekitar 10 berbarengan di mesin 10 core, Node abort empat kali.\n- Kanon dan arahan yang disuntik hook masuk **sekali** per kelas per sesi, bukan berulang tiap 30 menit; kedaluwarsa berbasis `-mmin` dilarang kembali (MBG 7 Okt 2026: *\"Kurangi muatan hook. Kanon cukup disuntik sekali\"*, 10 KB plus 25 sampai 30 KB terulang di sesi panjang; gerbang `gerbang-muatan-hook`).\n- Kebijakan test dari sesi agent: perubahan visual tidak di-test atau typecheck manual (pemilik cek di browser); perubahan DB, logika, atau fitur baru jalankan vitest tertarget per berkas; suite penuh dari sesi ditolak hook dan dijalankan Stop hook di akhir giliran. Jangan dobel jalankan di tengah giliran.\n\n### Cara kerja ratchet dan plafon\n\n- Ratchet adalah gerbang yang menjaga satu arah: angka utang boleh turun, tidak boleh naik. Dipakai untuk utang lama yang terlalu banyak dilunasi sekaligus (any, berkas besar, peringatan lint, impor mati, tipe ganda, route tanpa pembungkus, route AI tanpa kuota, objek SQL tanpa vonis, assertion tanpa pesan). Yang lama tidak ditagih, yang baru wajib lahir benar.\n- Menaikkan angka plafon bukan perbaikan, karena diffnya satu angka dan hasilnya hijau. Perbaikan yang benar: buang any-nya, pecah berkasnya, hapus yang sudah punya padanan, sampai muat di plafon lama. Pesan gagal yang berbunyi \"turunkan batas\" adalah perintah sesudah pelunasan, bukan jalan keluar. Satu-satunya kenaikan sah adalah koreksi hitung (angka dihitung dengan cara yang sama persis dengan gerbangnya), dan komentarnya wajib menyebut kata koreksi beserta sebab hitungnya. Sebab: plafon BahanBakuTable.tsx naik 2954 ke 2957 pada 31 Agt 2026 tanpa satu baris pun berubah, yang salah catatannya (MBG).\n- Rapatkan plafon begitu utangnya lunas, bahkan sampai nol. Plafon yang tidak dirapatkan cuma menunggu diisi lagi. Sebab: plafon impor mati diturunkan 5 ke 0 (MBG), dan plafon lint dirapatkan mesin lewat Stop hook yang fisiknya tak bisa menaikkan angka (if n >= plafon, continue) sekaligus menulis baris riwayat otomatis berlabel belum ada manusia yang menyatakan sebabnya. Sebab: sampai 6 Sep 2026 perapatan manual membuat tiap pembersihan kecil membayar satu putaran push penuh, dan satu riwayat tercatat dengan sebab yang salah.\n- Perapat otomatis hanya di jalur yang mengukur persis isi commit (index). Eslint melintas pohon di disk, jadi di jalur GUI yang menstage sebagian berkas perapatan tetap manual satu perintah.\n- Sesudah merge dua cabang yang sama-sama menaikkan plafon, baca ulang angkanya dari disk dan daftarkan pada jumlah baris yang persis. Jangan ambil angka salah satu sisi. Sebab: gerbang menjaga berkas yang ada di disk, bukan di salah satu cabang (MBG, 9 Sep 2026).\n- Gerbang berambang menjaga satu garis, bukan satu arah. Berkas di pita ambang minus 50 sampai ambang (batas 1.200 baris) wajib terdaftar di plafon: di bawah ambang daftarkan, di ambang ke atas pecah. Sebab: berkas yang sehari sesudah dipecah duduk di 1.174 baris lolos semua gerbang dan berdiri di ruang yang tak diukur siapa pun (MBG, 8 Sep 2026).\n- Halaman raksasa dipecah jadi modul per tab, lalu plafonnya diturunkan ke ukuran barunya pada hari yang sama (MBG 7 Okt 2026: Pembayaran 4.737 ke 997, Resep 5.197 ke 226, Kalender 4.323 ke 892 baris, semua modul pecahan di bawah 1.150; `gerbang-ukuran-berkas`).\n- Ratchet harus menghitung golongan yang benar. Buang golongan yang salah dari hitungan, lalu rapatkan batasnya; jangan menaikkan batas dan jangan mendaftarkan pengecualian. Sebab: gerbang view tanpa security_invoker merah 8 lawan batas 7 karena sebuah materialized view, yang tidak punya opsi itu sama sekali. Batas turun 7 ke 6 (MBG).\n- Dua gerbang yang saling mendorong di satu berkas berplafon diselesaikan dengan memindah berkasnya, bukan melonggarkan salah satu gerbang. Tiap gerbang yang mewajibkan penambahan ke berkas berplafon adalah pemicu terjadwal untuk plafon itu; periksa sisa anggaran hari itu, bukan apakah suntingan hari ini muat. Gerbang pelindung ukuran menolak hanya suntingan yang keadaan sesudahnya menembus ambang (simulasikan potongan Edit ke isi disk), ambangnya dibaca dari gerbang uji bukan disalin, dan suntingan yang mengecilkan berkas yang sudah kelewat tidak diblokir. Sebab: 11 Sep 2026 CLAUDE.md 26.100 karakter, seratus di atas ambang, menahan 16 commit (MBG).\n- Gerbang tanpa pintu darurat akan dicabut orang di hari pertama ia salah menahan. Pasang jalan keluar yang sah: jalur pulih sendiri, pengecualian bertanda, atau prompt \"kerjakan sendiri\". Ambang gerbang sengaja sempit: satu tuduhan palsu membuat gerbang dimatikan, satu yang terlewat cuma dikembalikan ke pre-push. Contoh: impor ganda hanya menuduh nama lokal yang diikat pernyataan import, karena rule eslint bawaan menuduh 22 kali dengan 11 yang sah (MBG).\n- Gerbang hulu hanya menolak karena fakta dengan pengganti pasti, bukan penilaian selera. Ongkos telatnya satu putaran push penuh, dan satu hook yang menutup kelas sekali berarti tiap sesi tak perlu mengulang pelajarannya.\n\n### Cara menulis gerbang yang tidak gagal diam\n\n- Gerbang menguji invarian, bukan ejaan. Jangan memaku nama simbol, bentuk satu ekspresi, bentuk yang sudah dicabut, ejaan satu baris yang pemiliknya prettier, atau nama berkas migrasi. Uji perilakunya; untuk berkas migrasi, resolusikan migrasi berstempel paling akhir yang memasang objeknya lalu baca badannya. Sebab: 6 Sep 2026 tiga varian ejaan meledak sehari dan menahan push seluruh worktree; 10 Sep 2026 satu asersi /const RELEVAN = \\\\// merah karena prettier memindah regex ke baris berikutnya setelah saringan dapat cabang baru, menahan 30 commit (MBG).\n- Daftar harapan gerbang diturunkan dari registri yang dijaganya, bukan ditulis tangan; kolom bersyarat diperiksa sama di colgroup, kepala, dan sel. Sebab: MBG 7 Okt 2026, kategori untung koperasi yang lahir belakangan tidak ikut ditutup di sisi Ops dan Ka SPPG kembali melihat Margin per Porsi (`gerbang-kasppg-tanpa-untung`, harapan dari `KATEGORI_TREN`); dua sakelar kategori menggambar metrik yang sama di sisi yang sama (*\"kenapa belanja dan harga di barang ops grafiknya sama?\"*, asersi baru `gerbang-tren-metrik`).\n- Jangan hapus asersi yang basi arahnya; alihkan sasarannya ke bentuk penggantinya dan sebut vonis yang mencabut vonis lama di komentar. Yang dicabut vonis baru adalah bentuk, alasan bentuk itu ada biasanya masih hidup. Dan jangan membalik perubahan benar demi menghijaukan gerbang. Dua sumber kebenaran untuk satu angka selalu berselisih; kalau gerbang lain sudah menjaganya, hapus salinan, jangan perbarui.\n- Gerbang yang membaca berkas basi hijau selamanya dan terbaca seperti penjagaan yang hidup. not.toContain atas migrasi yang sudah ditimpa tak pernah memerah. Pastikan gerbang menjaga daftar yang masih dijalankan.\n- Gerbang yang membaca satu berkas buta begitu berkas dipecah (gerbang ukuran menyuruh memecah, pemindai sumber menghukumnya). Damaikan dengan satu pembaca bersama yang menggabungkan isi berkas dengan berkas yang diimpornya dari direktori yang sama, satu tingkat saja. Cari badan fungsi, bukan berkas: pengecualian per berkas mengebalkan semua komponen lain di dalamnya (satu pengecualian pernah menyembunyikan 19 tabel, 17 Agt 2026). Gerbang yang menunjuk berkas lewat nama diperbarui alamatnya, bukan asersinya dicabut.\n- Pemotong teks yang tidak menemukan penandanya wajib meledak, bukan memulangkan potongan pendek; nol cocokan tidak pernah boleh diam (tambahkan asersi yang memerahkan nol cocokan, longgarkan pola terhadap koma ekor hasil prettier). Sebab: slice(0, indexOf('$$;') + 3) memulangkan \"cr\" untuk fungsi as $function$, dan satu gerbang cakupan memotong sampai ujung berkas selama setengah bulan; Math.min() atas daftar kosong menghasilkan Infinity (MBG, 9 Sep 2026). Pakai satu pemotong bersama yang membaca tag dollar quoting dan melempar kalau tak ketemu.\n- Pemindai sumber mentah menuduh komentarnya: kosongkan komentar lebih dulu tanpa menggeser nomor baris, baris // dulu lalu blok / / (komentar kadang memuat glob seperti app/\\*\\*), dan awas jendela berbasis jarak karakter yang bergeser. Sebab: 13 Sep 2026 gerbang ambilSemua menuduh tiga berkas benar; diterapkan ke enam gerbang lagi 16 Sep 2026 dan satu dari dua coretan ratchet ternyata utang terselubung (MBG).\n- Pemindai wajib memeriksa tiap pemanggilan, bukan baris yang bentuknya kebetulan cocok (handler bernama, atribut bersyarat yang memecah ke baris berikutnya, state berbahasa Inggris, handler yang dioper sebagai prop). Nama tangkapan yang disulam ke new RegExp wajib disaring dulu (/^\\[\\\\w$\\]+$/) agar metakarakter tak meledakkan pemindai.\n- Hook yang membaca aturan dari gerbang hilir bisa mati diam saat aturan direvisi. Jangkarkan ke potongan pesan assertion yang paling inti dan pendek, bukan kalimat penuh, dan tembak hooknya dengan payload sungguhan di gerbang uji yang menuntut kata deny. Sebab: 18 Agt 2026 revisi peraturan 61 menulis ulang pesannya, hook memulangkan daftar kosong dan berhenti menolak tanpa tanda (MBG).\n- Assertion cocok-teks wajib berpesan yang menyebut invarian yang dijaga, bukan sintaksnya. Utang assertion lama dicatat per berkas dan hanya boleh menyusut; jangan menyulam pesan ke ratusan assertion sekaligus. Sebab: 13 Agt 2026 toMatch tanpa pesan mencetak isi berkas lalu regex, dan dialog push 7 commit tidak memberi satu kalimat pun untuk memutuskan kodenya atau gerbangnya yang salah; 144 assertion di 14 berkas lama (MBG).\n- Penyaring data yang terlalu galak gagal diam: sapuan yang pulang dengan satu baris terbaca sebagai datanya sudah benar. Tanya \"nama ini disebut atau tidak di hierarki jawaban\", bukan \"di tingkat berapa\"; yang tidak disebut bukan berbeda; angka adalah identitas, bukan ejaan; pelonggaran nama dibayar pagar jarak (hasil lebih dari 50 km ditolak); pembuka singkatan dipanggil paling akhir dan hanya menyerap satu kata atau tepat sebanyak hurufnya. Sebab: sapuan 460 titik 6 Sep 2026 pulang dengan satu baris, setelah ditambal menulis 147 dan 87 (MBG, scripts/lib/wilayah-cocok.mjs).\n- Vonis yang arahnya sesuai harapan paling jarang diperiksa: angka yang naik sesudah sapuan wajib memaksa \"kenapa naik\", dan pembanding teks dinormalkan (lowercase) di sisi pembaca juga, dengan pembanding seluruh isi tabel bukan batch. Sebab: view melaporkan 1.489 titik bentrok, 559 (38 persen) palsu karena kapitalisasi beda dibaca dua desa; benarnya 75 baris (MBG, 6 Sep 2026).\n- Contoh obat di pesan tolakan wajib lolos semua gerbang lain di repo yang sama, karena contoh itu pasti disalin. Sebab: hook generik-lepas menyarankan T extends Record\\<string, any>, lalu satu any baru menembus ratchet di berkas yang sama sore harinya (MBG, 9 Sep 2026).\n- Shell: grep -c mencetak 0 dan keluar 1, jadi $(grep -c ... || echo 0) memulangkan \"0\\\\n0\". Pisahkan penangkapan dari pemulihan: n=$(grep -c 'pola' \"$f\" 2>/dev/null); case \"$n\" in '' | *\\[!0-9\\]*) n=0 ;; esac. Pasang gerbang untuk bentuk ini di semua skrip, bukan tambalan per tempat. Sebab: hook pengingat berhenti mengingatkan tepat saat buku bersih (MBG, 9 Sep 2026).\n- Berkas .json rusak mematikan gerbang yang membacanya, dan tak diperiksa hook sintaks yang cuma mengerti JS dan TS. Parse tiap .json ter-stage di pre-commit dan Stop hook, buat pembaca melewati berkas rusak bukan melempar, dan pulihkan dari riwayat git, jangan hapus entrinya. Pemeriksa marker konflik wajib juga membaca berkas unmerged. Sebab: satu entri buku vonis rusak karena konflik merge dan dua sesi menulis bersamaan (MBG).\n- Pakai klaim ber-stempel waktu, bukan kunci yang dilepas sebelum barang yang dijaganya dipakai. Syaratnya: sisi penstempel dan pembaca ada dua-duanya, klaim kedaluwarsa (300 detik), pemeriksaan mendahului yang dijaga. Sebab: 1 Sep 2026 mutex dilepas di trap EXIT padahal git commit baru jalan sesudah pre-commit, dan Stop hook mencabut MERGE_HEAD dari bawah commit yang berlangsung (MBG).\n- Satu aturan yang hidup di dua bahasa (SQL dan TS) disandingkan di satu uji yang membaca polanya dari berkas migrasi, berpasangan: yang sama wajib sama, yang beda wajib tetap beda. Sebab: kunci normalisasi wilayah yang rakus melebur 29 pasang kota dan kabupaten senama (gelembung \"Kota Sukabumi\" menghitung 421 koperasi dan 448 SPPG dari keduanya); dibetulkan di fungsinya (kunci naik 489 ke 514, yatim tetap 18, 5, 81), lalu reindex dan refresh materialized view (MBG, 6 Sep 2026).\n- Aset statis (berkas batas peta, ikon) bisa hilang tanpa error. Gerbang tanpa DB memeriksa tiap kode punya berkasnya, isinya (bukan cuma keberadaan), dan ambang ukuran (700 KB per provinsi); kalau lewat, naikkan toleransi penyederhanaan, bukan ambang (MBG).\n- Port antar-harness (skill di dua direktori) tidak boleh diam-diam ketinggalan: gerbang memeriksa berkas yang ada di asli tapi tak di port dan port di bawah 60 persen ukuran aslinya; references netral disatukan lewat symlink; port yang sengaja tertinggal terdaftar dan hanya boleh menyusut (MBG).\n- Paket yang memasang hook atau menulis settings sendiri ditolak sebagai kelas tersendiri, begitu juga paket yang membawa isi repo ke LLM pihak ketiga. Routine pemasang paket wajib memotret settings.json dan memulihkannya kalau hook hilang (gerbang menjalankan pemulihan sungguhan di direktori sementara), dan vonis tolak punya daftar yang dibaca mesin (paket-tolak-cek di AGENTS.md). Sebab: 13 Agt 2026 cavemem install menimpa hooks.Stop dan auto-commit-push mati diam-diam; paket populer (245 rb bintang) tetap ditolak (MBG).\n- Routine terjadwal wajib terdaftar di registri aplikasi, bukan cuma foldernya. Gerbang: tiap routine enabled di tepat satu akun/org dan cwd-nya ada. Prompt routine hidup di luar git, jadi salinan repo disunting di giliran yang sama; wajib refspec eksplisit (git push origin HEAD:main) karena HEAD terlepas membuat push mati. Sebab: 12 Sep 2026 tujuh folder prompt utuh tapi halaman Routines berbunyi \"No routines yet\" (MBG).\n- Otomasi yang menumpang cron lain wajib meninggalkan jejaknya sendiri (baris automation_runs), dan gerbang memaku bahwa ia masih dipanggil di cron induknya, berdiri sesudah flush antrean, dan cron induk masih terjadwal di vercel.json. Penumpang gampang hilang di refactor tanpa error dan tanpa uji merah (MBG).\n- Log yang mencatat dirinya sendiri harus berdesain bisa ditutup: hentikan penghasilnya, jangan hapus isinya, dan cetak daftar entri yang benar-benar menahan beserta perintah menutupnya. Pangkas pangkal path runner dari anggaran teks, jangan naikkan batas. Sebab: 102 dari 364 entri vonis (28 persen) adalah entri berdesain, ulang ke-101 untuk satu utang e2e (MBG, 12 Sep 2026).\n- Kegagalan mesin bukan utang belajar. Pekerja vitest gagal start atau timeout tanpa assertion = kelas mesin-penuh, transien; AssertionError sungguhan di run yang sama kembali ke nama gerbang aslinya dan tidak transien; timeout sendirian tanpa kegagalan pekerja tetap utang penuh. Sebab: ulang ke-23, 12 Sep 2026, mesin penuh subagent dituduh sebagai kode (MBG).\n- Sebuah buku vonis atau jejak yang hanya boleh ditulis pencatatnya (npm run vonis:tutup) dijaga hook; kolom gerbang yang diisi kalimat bebas membuat gerbang pelunas menolak dengan \"penjaga yang tidak ada bukan penjaga\".\n- Lapis PostToolUse Bash dipasang berpasangan untuk hook yang menjaga keadaan berkas (ambang ukuran, ekspor hilang, test lahir via heredoc); hook yang menjaga isi suntingan cukup PreToolUse. Hook bermatcher Edit|Write membaca tool_input.file_path, field yang tidak dipunyai Bash, jadi menambah Bash ke matcher yang sama melahirkan hook yang selalu diam. Sebab: 15 Sep 2026 berkas tumbuh lewat sed dan heredoc dan vonisnya jatuh di pre-push di sesi lain (MBG).\n- Gerbang fungsi SQL yatim memutar ulang seluruh migrasi urut nama tanpa DB, membuang komentar dulu, dan punya penjaga buta (fungsi hidup yang ketemu wajib di atas 400). Ratchet SUDAH_DIKETAHUI hanya menyusut. Pesan merah: buang pemanggilnya lebih dulu atau jangan cabut fungsinya (MBG, 16 Sep 2026, insiden run_finance_automation).\n- Alat ukur yang tidak bisa jalan di suite unit (pembanding antar-halaman butuh browser) dijaga lewat empat hal agar tak buta: penanda anatomi di komponen, pasangan URL tiap kembaran di kanon, baseline pencilan yang tak menggelembung lewat tangan, dan jalurnya di Stop hook (MBG, gerbang-seragam).\n- Halaman buku pegangan terbit ulang ke URL yang sama, disimpan di repo (ARTIFACT.json) bukan di ingatan, dan digerbangi; spanduk basi memeriksa worktree lain dulu. Routine pembaru jalan malam (21.00 sampai 21.43 WIB), hanya menyentuh dokumen, dan berhenti tanpa menulis kalau tak ada aturan yang berubah. Sebab: tanpa URL tersimpan lahir halaman kedua; 28 Agt dan 1 Sep 2026 commit routine menginap di worktree malam (MBG).\n\n### Jenis gerbang\n\n- Hook hulu (PreToolUse): menolak edit sebelum tersimpan karena penggantinya pasti. Dipakai untuk kelas yang ongkos telatnya satu putaran push.\n- Hook hilir (PostToolUse Bash): menyapu sesudah perintah shell jalan; tidak bisa menahan tulisan, tapi berbunyi di giliran yang sama.\n- Stop hook: gerbang akhir giliran, menjalankan suite, perapat plafon, dan commit otomatis.\n- Pre-commit (husky): sintaks ter-stage, JSON, marker konflik.\n- Pre-push dan CI: tests/unit/gerbang-\\*.test.ts yang memindai sumber, ratchet, dan uji integrasi.\n- Gerbang DB: trigger, constraint, RLS, dan tests/e2e/\\*.sql yang menolak dari dalam database.\n- Penegak armada: hook SessionStart, SubagentStop, dan roster.\n- Gerbang vonis pemilik: tiap vonis pemilik yang dijatuhkan berulang dijadikan gerbang (contoh: label berbentuk tulisan, kapital penuh, tabel bergeser). Gerbang boleh dibalik atau dicabut kalau vonisnya berbalik (MBG: gerbang-tabel-geser dibalik 26 Sep 2026, gerbang-operasional-tanpa-ringkasan dihapus).\n\n### Daftar gerbang baku (wajib di tiap proyek)\n\nFormat: nama, lalu yang ditolaknya. Yang berlabel proyek hanya milik proyek itu.\n\n#### Sintaks dan impor (hook hulu)\n\n- blok-sintaks-rusak: berkas hasil edit yang tidak bisa di-parse parser TypeScript (komentar JSX di posisi ekspresi dan TS1005).\n- blok-impor-hilang, blok-panggilan-tanpa-impor, blok-pengikat-hilang, blok-prop-tak-terambil, blok-sebutan-kapital: nama dipakai tanpa pengikat (komponen di JSX, helper, sisa refactor, prop di tipe tapi tak di destrukturisasi, konstanta konstanta kapital). Pesan menyertakan baris import hasil pencarian ekspor, menyarankan, tidak menulis sendiri.\n- blok-ekspor-hilang: impor bernama yang berkas sasarannya tidak mengekspornya. Satu parser dengan pemindai impor yatim agar vonis disk dan pohon tak berbeda.\n- blok-impor-ganda, blok-deklarasi-ganda: nama diikat dua import atau dua const di blok sama (hasil konflik merge menyimpan kedua sisi, atau blok dipindah lalu disisipkan utuh).\n- blok-impor-tak-terpakai: nama diikat tapi tak dipakai; re-ekspor bukan pemakaian.\n- blok-generik-lepas, blok-generik-telanjang, blok-generik-any-sekali: as T di fungsi yang tidak mendeklarasikan T (menilai per deklarasi tingkat atas, bukan per berkas); tipe telanjang yang tidak mengikuti T pemanggil; any lewat batasan generik yang parameternya dipakai sekali.\n- blok-any-penyempitan, blok-rantai-any: any yang menggantikan penyempitan if hilang; callback tanpa anotasi di atas nilai JSON.parse (tegaskan tipe di variabel).\n- blok-elemen-ke-tipe-lokal, blok-null-ke-param, blok-mock-tanpa-parameter, blok-pesan-expect, blok-catch-promiselike, blok-ts-expect-error-impor, blok-flag-regex-baru: kelas TS2345, TS2493, TS2769, TS2339, TS2578, TS1501 (elemen DOM ke tipe lokal; null ke parameter non-nullable; mock tanpa parameter yang dibaca .mock.calls\\[0\\]\\[0\\]; argumen kedua expect() yang bukan string; .catch()/.finally() di atas builder PostgREST yang PromiseLike; @ts-expect-error defensif di impor .mjs; flag regex melampaui target tsconfig, penggantinya \\[\\\\s\\\\S\\], target tidak dinaikkan sambil lalu).\n- blok-hook-bersyarat: React Hook sesudah cabang yang bisa return duluan. Naikkan hooknya.\n- blok-tsc-manual: tsc --noEmit manual dari sesi agent (mesin 6 core).\n\n#### Copy, waktu, dan teks (hook hulu)\n\n- blok-em-dash: em dash penghubung di copy. En dash rentang boleh.\n- blok-kelas-uppercase: kelas kapital penuh baru di app dan components (gerbang hilirnya gerbang-caps-layar).\n- blok-jam-titik: jam berpemisah titik (06.00); format baku 06:00.\n- blok-waktu-utc: tanggal atau bulan dipotong dari new Date().toISOString() (UTC menamai kemarin antara 00:00 dan 07:00 WIB). Pakai helper hariIniIso() atau skrip waktu.mjs.\n- blok-env-tak-terdaftar: process.env.X baru yang belum di .env.example (build hijau, deploy sukses, fitur diam).\n\n#### Migrasi dan DB (hook hulu, juga untuk jalur apply_migration MCP)\n\n- blok-anon-terbuka: view atau fungsi security definer tanpa revoke ... from anon, public di SQL yang sama; tolak juga refleks grant ... to authenticated sebagai penutup anon dan tolak diam. Tiga pertanyaan sebelum grant: fungsi trigger, jangan di-grant; hanya dipanggil fungsi lain atau service-role, jangan di-grant; dipanggil browser, grant tapi badan wajib memeriksa peran. View baru memakai security_invoker = true. Sebab: kelas meledak empat kali, terakhir live di produksi; permukaan RPC tumbuh jadi 242 fungsi security definer (MBG, 2 Sep 2026).\n- blok-trigger-alur-uang: trigger baru di tabel alur uang yang belum bervonis di tests/e2e/cakupan.json (diuji berikut asersi atau dikecualikan beserta alasan). Kesalahannya selalu diam: nominal salah tersimpan rapi.\n- blok-refresh-mv-hilang: create or replace function yang mencabut refresh materialized view dari definisi sebelumnya (replace mengganti seluruh badan).\n- blok-stempel-migrasi-ganda: migrasi baru bersetempel yang sudah dipakai berkas lain (stempel dari jam dinding, dua sesi di menit sama memilih angka sama). Hanya berkas baru yang ditolak.\n- blok-rpc-tanpa-types: .rpc('nama') untuk fungsi yang belum di database.types.ts. Regenerasi types sesudah migrasi diterapkan ke remote, bukan sesudah berkasnya ditulis.\n- blok-fk-pengguna: migrasi yang mengunci akun pengguna dengan foreign key dari jejak kerjanya sendiri (13 Agt 2026, hapus pengguna gagal dengan \"1 gagal, {}\") (MBG).\n- gerbang-penjaga-definisi: migrasi create or replace objek bersama (get_my_role, is_staff, trigger audit, dst.) tanpa header yang menyebut definisi live bertanggal; wajib berangkat dari pg_get_functiondef atau pg_get_viewdef DB, bukan berkas migrasi lama. Sebab: get_my_sppg_ids di-replace 19 kali, satu agen yang menulis dari salinan basi melenyapkan logika agen lain tanpa suara (MBG, 3 Okt 2026).\n- gerbang-rls-initplan: fungsi telanjang di policy yang dievaluasi per baris (my_kdmp_scope, dashboard 2,9 detik). gerbang-nama-tabel-supabase dan gerbang-tabel-ada-di-types: .from() ke tabel yang tak ada dan types yang memuat tabel yang remote tak punya.\n- gerbang-fungsi-sql-yatim dan gerbang view tanpa security_invoker (ratchet): lihat butir ratchet di atas.\n\n#### Penjaga ukuran dan struktur (hook hulu dan gerbang uji)\n\n- blok-berkas-lewat-ambang (pasangan PostToolUse Bash) dan gerbang-ukuran-berkas: berkas non-plafon yang suntingannya menembus 1.200 baris. Pecah, jangan daftarkan pengecualian.\n- gerbang-tipe-ganda (ratchet 43): tipe yang sudah ada disalin ulang, bukan diimpor. Sebab: TS2322 sudah 23 kali menahan push dan errornya muncul di berkas ketiga, bukan pelakunya (13 Sep 2026) (MBG).\n- gerbang-lingkar-impor, gerbang-state-yatim, gerbang-pintu-fitur: lingkaran impor baru; useState yang nilainya tak pernah dibaca; halaman dan komponen tanpa jalan masuk.\n- gerbang-props-halaman: default export page.tsx menerima props selain params dan searchParams (deploy ERROR dua hari padahal push hijau). gerbang-batas-klien: page atau layout server mengimpor nilai non-komponen dari modul use client (tsc dan build lolos, produksi jatuh). gerbang-berkas-kosong: berkas kode 0 byte atau spasi saja.\n- gerbang-select-satu-literal: argumen .select() bukan satu literal string (push tertahan 70 menit, 29 commit).\n- gerbang-csv-formula: pembangun CSV yang tidak meredam karakter awal rumus (= + - @, tab, CR).\n- gerbang-api-aman (ratchet 56 dari 229): route /api yang melempar tanpa pembungkus (balasan 500 kosong; halaman bertoken melihat \"Unexpected end of JSON input\"). Route uang dan order dijamin berpembungkus (GR/MBG, port 3 Okt 2026).\n- gerbang-ai-kuota (ratchet 46 di MBG, antre 3 route di WI): route AI yang memanggil model tanpa rateLimitOk dan balasan tooManyRequests. Kuota fail-open, pembatas biaya bukan gerbang keamanan. Sebab: satu route AI berkonten bebas bisa memutar tagihan penyedia tanpa batas (audit 26 Sep 2026).\n- gerbang-heap-typecheck: CI yang tidak menaikkan plafon heap typecheck dan skrip yang menimpa NODE_OPTIONS pemanggil (OOM 4063 MB). gerbang-deploy: konfigurasi deploy, uji CI tanpa --testTimeout=120000, cermin e2e yang tak membawa policy storage.objects, runner yang tak menyapu dummy cermin sekali sesudah migrasi (MBG). cron-katalog: cron tak terdaftar. gerbang-penjaga-ci: salinan penjaga mesin yang basi.\n- gerbang-model-agent dan gerbang-ilmu-agent: lihat tema Armada agent.\n- gerbang-halaman (WI/GR/BS): halaman tanpa guard peran; PAGE_ACCESS bawaannya menolak. Route admin ber-service-role wajib menolak kursi bukan pusat (gerbang-admin-jabatan, MBG). Sumber, kategori, noindex, analytics-token: sumber tak sah, kategori tanpa mesin, halaman publik tanpa noindex, token di analytics.\n- gerbang-extension-uang (WI): izin extension terlalu lebar, harga dari klien, webhook tanpa tanda tangan. gerbang-angka-vonis (WI): angka kartu dari teks model.\n\n#### Tampilan dan selera (gerbang uji; rinciannya di bab selera)\n\n- gerbang-selera, standar-tabel, kolom-tabel, tanpa-gradien, strip-tanpa-semua, ikon-literal, ikon-formal, legenda-tanpa-chip, kpi-tile, sel-tanpa-titik, tabel-kosong, urutan-blok, isian-angka, rumah-ekspor, salin (GR/BS, prefiks gerbang-): menolak tampilan yang menyimpang dari selera pemilik (tabel di luar dua belas baris standar, gradien, tab Semua, ikon bukan harfiah, legenda yang mengulang chip, tile tanpa data, tabel kosong tanpa kepala, tombol salin link, isian angka yang menerima huruf).\n- gerbang-caps-layar, gerbang-caps-label, gerbang-caps-lock: teks kapital penuh di layar, kertas, label, dan template PDF (.toUpperCase() di seluruh lib/export dan lib/pdf, bukan tiga berkas). Nol kapital penuh kecuali logo, singkatan resmi, dan Title Case dirapikan lewat kode, bukan CSS uppercase.\n- gerbang-inp-transisi: klik yang membekukan layar (transisi menelan chrome kontrol).\n- gerbang-istilah-invoice (GR/BS): kata \"faktur\" di teks yang terlihat; \"Faktur Pajak\" tetap.\n- gerbang-dummy dan gerbang-dummy-layar: lihat tema uji integrasi dan standar dummy; mesin dummy rusak, tombol dummy yang dirender lagi setelah dicabut, layar tanpa dummy.\n\n#### Gerbang khusus proyek (ditandai)\n\n- (MBG) blok-vonis-tangan, blok-skill-branch, blok-sebab-bayar-hilang, blok-lembar-cetak-tak-terdaftar, blok-aksi-berteks, blok-tabel-geser, blok-baris-grup-tangan, blok-sel-menumpuk, blok-blok-dashboard-tanpa-vonis, blok-tabel-aturan-patah, blok-push-berlapis, blok-orkestrasi-lewat: aturan khusus repo itu (kolom Aksi ikon telanjang, repo yang hanya mendorong ke main sehingga skill branch ditolak, push dari sesi agent selama masih ada push lain di mesin). Pelajaran yang bisa dibawa: hook diperluas hanya ke pelanggaran yang pasti.\n- (MBG) puluhan gerbang domain: cakupan wilayah (\"pilihan kosong\" dibaca hilir sebagai \"tanpa batas\"), zona waktu, titik koordinat bentrok, rantai uang dan pasok, mitra, ekspor nasional, panen data (gerbang-scribd-baca memvonis tak ada skrip yang menekan Unduh), gerbang-radar-panen (pemasang yang menimpa .env runtime jadi 0 byte dari .env.local kosong, 1 Okt 2026), gerbang-review-lokal (port ditulis dua kali, LaunchAgent tanpa RunAtLoad dan KeepAlive, review tidak boleh menempel ke produksi).\n- (GR) pola data uang: nomor dokumen, jurnal seimbang, harga_untuk(), stok tidak minus, dokumen terkunci setelah uang bergerak, pembayaran tidak melebihi tagihan, tutup buku menolak jurnal bulan tertutup.\n- (BS) pola pesanan: lokasi_id di tiap transaksi, harga dan HPP dibekukan di item saat insert, status maju hanya lewat RPC, kuota dan batas jam ditolak DB.\n- (WI) gerbang-migrasi, gerbang-test-integrasi (antre 66 objek), gerbang-halaman, gerbang-kategori, gerbang-sumber.\n\nBab 30\n\n## Uji integrasi: perilaku di luar TypeScript wajib diuji sungguhan\n\n- Tiap perilaku yang tinggal di luar TypeScript (trigger, constraint, RLS, fungsi SQL, route handler, alur lintas tabel) wajib punya uji integrasi yang benar-benar menjalankannya. Mock meloloskan persis kelas bug yang paling mahal. Gerbang: gerbang-test-integrasi dan registri tests/e2e/cakupan.json yang memberi tiap objek SQL satu vonis: diuji berikut huruf asersinya di tests/e2e/\\*.sql, atau dikecualikan berikut alasan kenapa ia tidak menyentuh angka uang. Objek tanpa vonis ditolak (WI memulai dengan antre 66 objek yang cuma boleh turun).\n- Trigger baru di tabel alur uang wajib bervonis sebelum dibuat (hook blok-trigger-alur-uang), termasuk lewat apply_migration MCP yang tak melewati gerbang repo. Sebab: kesalahannya selalu diam, nominal salah tersimpan rapi dan baru ketahuan saat membandingkan nota.\n- Uji wajib menjalankan perbaikannya sungguhan, bukan menilai kodenya kelihatan benar. Contoh: gerbang pemulihan settings.json menjalankan pemulihan di direktori sementara, hook ditembak dengan payload sungguhan yang menuntut kata deny.\n- Uji DB dijalankan di cermin database. Runner e2e menyapu dummy cermin sekali sesudah migrasi dan sebelum uji; cermin wajib membawa policy storage.objects karena supabase db dump melewati skema storage; uji lokal yang hijau tapi merah khusus CI (167 K3) dan job yang kena batas 60 menit dihitung sebagai gerbang yang harus dibenahi, bukan diabaikan. Bahan uji tidak diambil dari dua ujung daftar yang sama (kunci primer bentrok di cermin CI), dan e2e tidak mencari admin lewat jabatan is null (MBG).\n- Pasangan wajib: yang seharusnya sama harus sama, yang seharusnya beda harus tetap beda (Kota Pangkal Pinang sama dengan Pangkalpinang, Bangka Barat beda dengan Bangka Selatan). Kunci normalisasi yang terlalu rakus tak terlihat salah dari layar mana pun.\n- Uji yang membuktikan sebuah gerbang harus falsifiabel: sebelum ditutup, buang salah satu langkah dan pastikan satu vonis memerah. Tambahkan penjaga buta (jumlah temuan minimum) agar regex yang berhenti cocok tidak menghijaukan gerbang selamanya.\n- Uji perilaku menjalankan fungsi sungguhan atas data di pasangan yang berpeluang gagal: jalur nol cocok, kolom kosong, kapitalisasi beda, dan batas 1000 baris PostgREST yang dipotong tanpa error (gunakan pembantu ambilSemua(); potong .in() raksasa lewat fetchPotongIn, diuji di fetch-potong-in.test.ts).\n- Tombol dummy dan rantai uang punya uji lintas tabel: tests/e2e/05-dummy-jejak.sql (jejak dummy), 06-rpc-authenticated.sql (asersi C, D, E untuk rpc yang dipanggil browser), 106-kepala-satu-kontak.sql (trigger yang menjaga dua kolom tak berselisih). Trigger penolak ikut diuji (recipes_tolak_nama_gabungan). Kelas v_rantai_tally dan trigger rantai uang yang menelan error diuji (MBG).\n- Skrip coret-coret sekali jalan tidak boleh mendarat di tests/ sebagai test, karena tests/unit satu-satunya tempat yang alias dan server-only-nya sudah beres lalu jadi gerbang push semua orang. Tolakan hook menunjuk rumah penggantinya: scripts/ dijalankan npx tsx, atau migrasi SQL untuk perubahan yang harus bertahan. Sebab: 19 Agt 2026 satu berkas menyapu seluruh tabel kwitansi dengan service role tiap npm test jalan; 8 Sep 2026 berkas uji yang lahir lewat heredoc dan hidup 25 detik cukup melahirkan vonis eslint di sha yang kodenya benar (MBG).\n- Uji unit bermock bukan bukti untuk perilaku DB. Mock boleh untuk logika murni, tapi bukti selesai untuk trigger, RLS, fungsi SQL, dan route adalah uji yang menyentuh DB sungguhan.\n- Perilaku yang tinggal di dua tempat (SQL dan TS) wajib punya uji yang membaca keduanya dari sumber dan mengadu kesamaannya, supaya penyunting satu sisi tak bisa pulang tanpa menyentuh yang lain.\n\nBab 31\n\n## Preflight sebelum bilang selesai\n\nGerbang terakhir. Gagal satu kotak berarti belum selesai, bukan hampir selesai.\n\n### Blok universal (semua mode)\n\n- Mode dan Design Read dinyatakan di awal kerja, bukan direka-reka belakangan.\n- Nol em dash penghubung di seluruh keluaran: judul, label, pil, body, teks tombol, caption, alt text, pesan commit.\n- Dark mode ada di tiap elemen baru dan sudah dibuka di dua mode. Kontras teks lolos WCAG AA 4,5:1 (3:1 untuk 18px ke atas); font 11 sampai 12,5px diperiksa lebih ketat; kontras tombol dan form lolos AA termasuk placeholder, focus ring, dan error text.\n- Keyboard-friendly dan focus-visible jelas di semua kontrol interaktif.\n- Label CTA tidak wrap dua baris di desktop, satu intent CTA satu label. Satu skala radius, satu warna aksen, satu tema per halaman.\n- Siklus state lengkap: loading berbentuk hasil akhir, kosong ramah berarah, error berarah. Loading di dalam tombolnya sendiri dan feedback tekan active:scale-\\[0.98\\].\n- Audit copy: tiap string dibaca ulang, tidak ada kalimat rusak atau frasa yang berbunyi seperti AI berusaha bijak.\n- Nol keterangan kecil (grep -n 'hint=' harus kosong, tiap subtitle= berisi data bukan kalimat). Nol ruang menganga (tiap justify-between dan ml-auto di toolbar ditanya \"kalau dirapatkan, ada yang hilang?\"). Nol baris kedua untuk sel, chip, badge, dan label tombol di desktop. Tidak ada elemen terpotong atau overflow.\n- Tabel lebar digulir dengan kolom pertama menempel (pembungkus .tabel-gulir atau .tabel-muat, bukan overflow-x-auto tulisan tangan), tanpa sel terpotong \"…\", legenda satu baris, ringkasan putih dan tertutup, persen lewat PersenSel dan tanggal lewat TanggalSel (vonis 26 Sep 2026, ikut Gemah Ripah, menggantikan \"tabel muat satu layar\").\n- Popup muncul utuh di tengah layar tanpa digulir (ModalOverlay). Blok isi tabel pakai TabelKartu tanpa judul kedua, aksinya di baris luar kartu dipimpin kotak cari. Baki aksi kartu tidak memikul aksi pindah data (Export, Cetak, Impor, Unduh). Grup dalam tabel bisa dilipat, default tertutup, punya subtotal per kategori dan grand total. Judul seksi pakai ZoneHeading. Satuan sekali saja: di header kalau seragam, kolom Satuan kalau campur.\n- Kembaran layarnya sudah dibuka dan dibandingkan; beda bentuk berarti belum selesai. Nol panah di label aksi (chevron dan panah relasi data tetap sah). Pil aksi sewarna tujuannya dan rincian panjang membuka ke bawah lewat baris colSpan. Aksi temuan konkret dieksekusi langsung ke DB plus catatKeputusanAI, dan tautan lintas halaman dari modal memakai tab baru.\n- Kolom Aksi berisi ikon telanjang (centang emerald, silang rose, tambah emerald, tong sampah rose, pensil amber, WA hijau); artinya turun ke title dan aria-label plus legenda kaki kartu.\n- Bold itu hierarki, bukan penekanan: kalau lebih dari separuh isi satu blok font-bold, tak ada yang menonjol. Yang tebal cuma kepala kolom dan angka kunci.\n- Nol baris untuk keadaan yang tidak ada: daftar tidak mencetak satu baris per record yang sudah beres; kabar baik diringkas satu kalimat atau tidak ada; kalau seluruh daftar kosong, terbit EmptyState yang menyebut nama embernya.\n- Angka dummy berlabel dan ada rencana membersihkannya. min-h-\\[100dvh\\], bukan h-screen; CSS Grid, bukan w-\\[calc(33%-1rem)\\]. Runtuh mobile dinyatakan eksplisit di komponen yang sama untuk tiap layout multi-kolom. package.json dicek sebelum mengimpor apa pun.\n\n### Blok gerak (kalau ada animasi)\n\n- Gate frekuensi: aksi 100 kali atau lebih per hari tidak dianimasi, aksi keyboard tidak pernah. Tiap animasi punya alasan satu kalimat.\n- Durasi UI di bawah 300ms memakai token --dur-*, easing token --ease-*, tanpa ease-in, tanpa transition: all, tanpa scale(0). transform-origin popover mengarah ke pemicunya, modal tetap center. Transition, bukan @keyframes, untuk yang bisa dipicu berulang cepat. Hover di balik @media (hover:hover) and (pointer:fine). Hanya transform dan opacity yang dianimasi.\n- Tidak ada listener scroll non-pasif, useEffect animasi punya cleanup, prefers-reduced-motion dihormati sebagai lebih lembut bukan mati total, exit lebih cepat dari enter, stagger 30 sampai 80ms. Skill review-animations dipanggil.\n- Kalau gestur disentuh: feedback saat pointer-down, pelacakan 1:1 dengan offset genggam, setPointerCapture, animasi bisa direbut, rubber-banding berbatas, dismiss lewat velocity, titik sentuh tambahan diabaikan.\n\n### Mode A: app internal\n\n- Dial 3/3/8, tanpa animasi otomatis dan layout asimetris. Palet per proyek: navy #0b2545 dengan emas tipis dan gradient 135 derajat (MBG), hijau hutan #34471f dengan emas #c9a04a solid (GR), marun #8A1C1F solid (BS), navy dengan emas #c9a227 (WI); WA #25D366.\n- Tabel pakai table-app (table-cards di HP, table-compact kalau berisi input). Angka tabular-nums rata kanan, rupiah id-ID tanpa desimal, jam 06:00 WIB, tanggal panjang id-ID. Header sortable SortTh dan useTableSort, tab PageTabs, segmented SegmentedToggle.\n- Urutan halaman: PageHeader, PageTabs, filter bar, konten, max-w-6xl. Panel rounded-2xl bg-white p-4 shadow-card ring-1 ring-ink/5, space-y-3.5, judul CardTitle tanpa eyebrow, tanpa hero (kecuali produk konsumen publik seperti landing WI). Baris kosong EmptyState berarah tanpa emoji. Kolom harga beli dan profit disembunyikan untuk role dapur, termasuk di ekspor.\n\n### Mode B: halaman eksternal tanpa login\n\n- Dial 3/2/6, payload ringan, LCP di bawah 2,5s, max-w-2xl. Urutan baku: bar status (tanggal, jam WIB per detik, Hari Kerja atau Akhir Pekan, Hubungi Admin, toggle tema), kartu identitas gradient, panel putih, tombol utama full-width sticky bawah (backdrop-blur, safe-area-inset), bottom-sheet konfirmasi (items-end di HP, dialog tengah di desktop; destruktif dua tombol, sekunder lebar 1 dan primer lebar 2).\n- URL slug permanen terbaca, tanpa token acak yang tampil ke manusia. Guard: revoked 410, expired 410 dengan arah tindakan, submitted 409. Link lama tetap hidup, rute lama jadi redirect, opened_at dicatat saat pertama dibuka. Setelah submit link terkunci kecuali domainnya butuh revisi.\n- inputMode benar dan ada ringkasan review sebelum submit. Upload foto: area dashed, capture=\"environment\", batas jumlah jelas, kompresi klien di bawah 5MB. Tiap fitur eksternal lahir bersama tombol WA dan hub pengelolanya; tidak ada fitur yatim.\n- Halaman pesan online publik (BS): empat langkah, jempol-first, target sentuh minimal 44 px, harga dan total selalu tampak, harga dari tabel menu bukan dari klien.\n\nBab 32\n\n## Definisi selesai\n\nSebuah pekerjaan selesai kalau semuanya benar, bukan sebagian.\n\n- Migrasi ter-apply dan teruji, bukan cuma ditulis.\n- typecheck nol error, lint lolos, test hijau sesuai kebijakan test yang berlaku (dari sesi agent per berkas, suite penuh dijalankan Stop hook), build lolos.\n- Build knowledge graph (kg:build) sudah dijalankan kalau struktur kode berubah.\n- Preflight lolos semua kotak sesuai modenya.\n- Commit bersih, lowercase deskriptif berbahasa Indonesia, author pemilik (MBG: mbgbangkabelitung).\n- Data awal digenerate kalau fiturnya butuh, dan tombol dummy mengikuti halaman yang sedang dibuka.\n- Balasan berisi link siap klik dan catatan eksplisit apa yang belum live.\n- Kalau ada nomor yang gagal: sebutkan akar masalahnya dan solusinya. Jangan laporkan selesai dan jangan muter.\n- Kalau dua sumber bertabrakan, sumber lengkap yang menang; kalau dua sumber lengkap bertabrakan pakai kanon, tanggal keputusan terbaru, dan vonis konflik. Jangan membuat salinan aturan ketiga di luar paket: salinan kedua selalu yang basi duluan, dan itu sendiri salah satu aturannya.\n- Keputusan yang sudah diputus pemilik tidak dibuka lagi tanpa pemilik, dan yang belum diputus jangan ditebak.\n- Pekerjaan yang mendarat di branch lain bukan selesai kalau proyeknya mendorong tiap giliran ke main (MBG GR BS: branch cuma main, worktree dan branch agent dihapus sesudah push).\n\nBab 33\n\n## Katalog ranjau\n\nTiap butir pernah memakan berjam-jam. Format: gejala, sebab, tindakan. Jangan diagnosis dari nol; cocokkan gejalanya.\n\n### Jalur commit dan push\n\n| Gejala | Sebab | Tindakan |\n| --- | --- | --- |\n| Impor ada di editor tapi commit tetap TS2304 atau jsx-no-undef | Yang ke-stage snapshot lama, impor belum ikut git add | git add -A lalu commit ulang; kodenya benar |\n| Commit failed, Parsing error ')' expected atau TS1005 di .tsx | Komentar JSX {/ /} di posisi ekspresi (sesudah =>(, &&(, ?(, return() | Jadikan komentar // di atas baris, atau pindah ke atas blok |\n| Commit ditolak untuk error yang di layar sudah tak ada | Yang dilint isi index, bukan disk (file partially staged) | Sudah ditambal: restage otomatis bila versi disk bersih |\n| TS2300 Duplicate identifier atas nama impor setelah merge | Konflik merge diselesaikan menyimpan kedua sisi, dua import untuk satu nama | Gabung jadi satu bar
