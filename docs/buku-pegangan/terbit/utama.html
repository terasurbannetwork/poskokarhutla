si dikatalogkan di satu berkas formasi (jumlah staf mengikuti rasio, mis. 1 tim akuntan per 100 SPPG, 1 tim procurement per 2 kab/kota, 1 tim humas per 50 SPPG), menumpang peran induk, cakupan di satu fungsi. Tiap kursi baru wajib disebut di semua tempat yang membacanya (cabang cakupan dan daftar staf gaji). Struktur bisa berubah (26 Sep 2026: PIC Provinsi dilebur ke General Manager Regional, PIC Kabupaten dicabut, staf per regional 150 SPPG, kelipatan pas tidak menambah kursi): kursi lama tetap di katalog untuk akun lama.\n- Akun massal lahir lewat RPC, username dan sandi awal mengikuti satu lib, must_change_password menjaga. Kunci orang adalah nama lengkap, bukan username dua kata (dua orang bernama depan sama sempat dilebur satu akun, tertangkap uji e2e sebelum produksi). Dua batch serentak dikunci advisory lock, RPC tertutup dari anon dan public.\n- Pil header hanya picker daerah. Panel gambaran umum dibuka dari peta dan mengikuti wilayah yang sedang dibuka peta, tetap memeriksa izin kursinya (13 Sep 2026).\n\n### Peta menjawab sebaran nasional\n\n- Peta menjawab sebaran nasional, bukan cakupan kursi, dan tidak disaring sakelar wilayah. Sebab: 5 sampai 6 Sep 2026 satu baris menyaring daftar provinsi sumber gelembung, tabel, papan peringkat, dan KPI, sehingga layar nasional melapor \"1 wilayah, 105 SPPG\" untuk data nasional tanpa tanda ada yang disembunyikan; vonis dibalik tiga kali (digambar redup, dibuang, tanpa saringan) karena premisnya salah, bukan pilihan redup lawan buang. Gerbang menolak kata saringan wilayah di berkas peta sama sekali, sengaja kasar: yang dilarang adalah gagasan bahwa peta punya cakupan.\n- Kolom nama petugas di tabel peta membaca petugas dapurnya sendiri, bukan kursi atasan. Baris koperasi yatim tidak mencetak nama siapa pun (ia tak punya dapur).\n\n### Panggung dan ubin\n\n- fadeAnimation: false wajib. Leaflet memudarkan ubin lewat requestAnimationFrame yang berhenti saat browser tidak mengecat (layar penuh, tab belakang), ubin tersangkut opacity 0. Sebab: terukur 8 Sep 2026, 22 ubin berstatus loaded, 18 di antaranya opacity 0.\n- Ubin OpenStreetMap, tidak pernah CARTO: CARTO mengunci basemap gratis di balik API key dan yang muncul tulisan miring \"API KEY REQUIRED\" di tiap ubin, kegagalan yang menyamar jadi watermark dengan nol pesan console.\n- Ubin cadangan (Esri World Light Gray Canvas) bertukar sesudah 6 kegagalan, bukan 1: satu gagal lumrah, menukar per kegagalan bikin peta berkedip. Lahir dari vonis 9 Sep 2026 atas peta layar penuh yang kosong (\"Jelek banget\").\n- Pane kartu (tooltip, popup) digantung di wadah peta, bukan map-pane. Sebab: map-pane punya transform plus z-index 400 sehingga stacking context, tooltip 650 dan popup 700 tercat sebagai satu lapis dan papan samping z 600 selalu menang; menaikkan angka di dalam perangkap tak berguna (vonis 9 Sep 2026: \"pop up di atas panel\").\n- Bidang geoJSON dibuat dulu, penanda menyusul: lapis belakangan menutupi yang duluan.\n- Peta publik tak boleh kehilangan bidang wilayah diam-diam: berkas /geo/\\*.json dikecualikan dari matcher middleware, kalau tidak anonim dilempar ke /login dan parse JSON gagal tanpa error.\n- ResizeObserver, bukan trackResize Leaflet yang hanya mendengar jendela. Debounce 160 ms, invalidateSize selalu, fitBounds ulang hanya bila berubah lebih dari 12 persen, supaya reflow kecil tidak melempar balik zoom pengguna.\n\n### Warna, bentuk, penanda\n\n- Jenis dibedakan bentuk, bukan dua warna. Contoh (MBG): koperasi hijau tua #3F7D6E kotak membulat 7px, dapur navy #1d4e89 lingkaran penuh, sekolah dilayani amber #b45309, sekolah belum dilayani abu slate #64748b. Penanda titik 26 kali 26 px, border putih 2px, bayangan 0 2px 6px rgba(15,23,42,.35), glif 14px stroke putih 2,2. Warna dan glif punya satu rumah.\n- Satu warna untuk semua entitas sejenis. Sebab: 8 Sep 2026 pin koperasi diwarnai menurut skor kesiapan lalu dicabut sore itu (\"samakan semua warnanya\"): pada penanda yang sudah membawa arti jenis, warna kedua terbaca sebagai jenis lain. Skor pindah ke lencana kepala popup dan kolom tabel.\n- Lencana nomor di pojok penanda, angkanya sama dengan kolom No papan kontak supaya baris tabel dan penanda bisa dicocokkan tanpa membaca nama.\n- Yang digambar hanya yang lolos boleh-digambar (punya lat dan lng, bukan koordinat ragu). Baris tanpa koordinat tetap ikut RPC dan tabel supaya angkanya sama, tapi tak menyentuh Leaflet: \\[null, null\\] berarti nol koma nol, Samudra Atlantik.\n- Ikon diwarnai menurut latarnya, bukan menurut jenis datanya (peraturan 117, vonis 7 Sep 2026: \"perhatikan warna latarnya juga\"). Gerbang menolak warna jenis di dalam thead mana pun, kepala tabel navy membuat glif berwarna jenis tak terbaca.\n- Gelembung wilayah: garis tengahnya menyandikan jumlah (22 sampai 46 px dari logaritma), jadi lingkaran tak dilebarkan supaya label muat, hurufnya yang mengalah (font adaptif nowrap, lantai 7,5px; lahir saat \"25,6 rb\" pecah dua baris). Urutan tumpuk dari ukuran bukan lintang (bawaan Leaflet menyusun dari Y piksel sehingga gelembung selatan mengubur utara: Sumbar menimpa Riau), yang kecil selalu di atas.\n- Tooltip gelembung dua kolom (grid enam kolom, display: contents per baris), satuan \"KDMP\" dan \"PM\". Kepala kartu gelembung ikut tingkat: navy penuh rata tengah tanpa lambang, putih bila membawa lambang berlatar putih, amber di tingkat kecamatan (bukan hijau atau biru). Tingkat yang tak punya lambang tidak dipaksakan (\"ga usah ada logonya, maksa banget\").\n\n### Popup titik\n\n- Kartu dua kolom, glif menggantikan kata. Lebar akhir min 340px max 400px (riwayat 250 sampai 320, 330 sampai 420, 280 sampai 320 menjelaskan aturannya). Kepala hanya nama (gradien warna jenis, putih rata tengah, nowrap elipsis), baris kedua yang redundan dicabut. Pil kategori atau tahap berdiri sesudah nama. Sejak 9 Sep 2026 skor 0 sampai 100 diganti tahap enam anak tangga berikut tanggal (\"mau bentuknya kaya status\").\n- Badan grid dua kolom repeat(2, minmax(0,1fr)), bukan flex-wrap (kolom selebar isi bikin dua kartu berhenti sebanding), karena whitespace berlebih divonis. Label kolom kiri glif SVG dan artinya dibaca sekali di legenda kaki peta; gerbang menuntut tiap glif popup punya entri legenda tingkat titik.\n- Baris yang kosong tetap dicetak \"Belum terdata\" dengan ikon aksi mati (WA mati, pensil). Sebab: tiga vonis berturut 8 Sep 2026; lajur ikon yang kadang kosong bikin tiap baris punya lebar sendiri, dan ikon yang hilang terbaca \"tidak bisa dihubungi\" padahal artinya \"belum diisi\".\n- Nama panjang disingkat lewat fungsi singkat (namaDapurTampil), bukan dielipsis titik-titik. Kartu selalu minggir ke samping jangkarnya (bukan hanya saat kepotong tepi atas) dan tidak boleh menutup label yang dihover; semua bindPopup memakai opsi tak-terpotong.\n- Di popup, td tidak boleh display flex atau grid (kolom lenyap tanpa error), href masuk atribut lewat fungsi lolos, tidak pernah mentah. Penanda sekolah membuka kartu lewat hover, bukan klik.\n- Nol baris kedua, nol teks kepotong (peraturan 113 dan 114): tiap nilai nowrap plus elipsis, br dilarang dan gerbang memindai seluruh direktori peta, bukan hanya pembuat popup (cakupan sempit pernah meloloskan tiga tooltip rute yang memaksa br). Hanya alamat yang boleh melipat. Yang boleh dipotong hanya nama orang, nama wilayah, alamat (tooltip menyimpan versi penuh); label, satuan, kepala kolom, legenda tidak pernah, karena itu kata yang kita pilih sendiri dan kalau tidak muat yang salah pilihan katanya. Urutan: singkat katanya, lebarkan wadah, terakhir lebarkan wadah melayang di atas peta karena lebarnya dibayar dengan peta tertutup.\n- nowrap bukan cara memenuhi \"sebaris\": di legenda glif ia menabrak overflow-hidden dan memotong entri pertama dan terakhir (\"lagenda kepotong, gw ga pengen yang kaya gini lagi\"). Ia menukar cacat yang kelihatan (melipat) dengan cacat yang berbohong (entri hilang diam-diam).\n- Aksi di popup peta dititipkan ke kartunya lewat closest('\\[data-aksi\\]'), bukan dipasang per tombol. Sebab: Leaflet memakai ulang objek popup dan mengganti isi lewat innerHTML sehingga penangan per tombol terbuang; kartu yang dibuka kedua kali punya tombol tercetak benar tapi mati (13 Sep 2026; kelas sama sudah dua kali: 5 Sep boolean kedua tak diisi pemanggil, 10 Sep pensil Kepala SPPG mati tiga hari karena data-aksi dirakit tanpa addEventListener). Tiap nama aksi yang dicetak modul popup wajib punya cabang di penanganya, termasuk awalan yang dirakit dari variabel.\n- Ikon rute wajib tampil di popup sekolah, bukan hanya dapur. Jalur pembersih teks dipakai untuk semua RPC titik yang tak punya kembaran publik sebelum dicetak ke kartu. Gambar ulang kisi diukur geometris, bukan lewat querySelector.\n- Kepala kartu koperasi menyebut progres dengan angka (14 Sep 2026: \"dia yang udah bangun 100% mana yang masih progress\"). Tiga patah sekaligus: sumber (pil membaca kolom yang diketik orang, 83.360 dari 83.362 koperasi masih calon nol tanggal), data sudah ada pembaca belum (progres_bangun dari panen, 24.182 koperasi sudah 100 persen), bentuk (isi pil jadi ikon saja tanpa kepala kolom). Invarian: katalog layar urut maju dan kuncinya sama persis dengan CASE kolom generated di migrasi (kunci meleset tidak melempar apa pun, pil mencetak kunci mentah); kartu mencetak angkanya, 99,99 persen tidak dibulatkan jadi 100; tiap ember mencetak pil dan ember tak dikenal tetap terlihat; entitas tanpa data tidak mencetak pil kosong dan dapur tidak meminjam progres koperasi; aturan pembulatan satu rumah.\n\n### Legenda\n\n- Legenda berdiri di kaki peta, bukan di tiap popup, dan entrinya diturunkan dari daftar yang dipakai: legenda yang menyalin akan berbohong pada hari warnanya diubah. Bentuk keping mengikuti apa yang tergambar di tingkat itu. Legenda peta dan legenda tabel dua barang berbeda. Satu keping untuk sekolah, bukan dua.\n- Tinggi pita legenda ditentukan tinggi pil, bukan padding pita. Sebab: empat vonis (8 Sep tiga kali, 9 Sep sekali, \"RAPATKAN\"), padding diturunkan tiga kali (2,5, 1,5, 0,5) dan tetap lebar karena pil yang mengatur; pil diturunkan 20 ke 16px. Gerbang menjaga keduanya dan menuntut ukuran lega tidak ikut mengecil.\n\n### Zoom, kamera, tingkat\n\n- Lima tingkat: nasional, pulau, provinsi, kabupaten/kota, kecamatan, titik. Ambang zoom diambil dari zoom yang memang dihasilkan fitBounds tiap tingkat (contoh: pulau 0, provinsi 6, kabupaten 8, kecamatan 10, titik 12), bukan pembagian rata.\n- Zoom menyetir tingkat dua arah: turun satu anak tangga per panggilan, naik langsung ke tingkat yang benar. Anak yang dituju adalah wilayah yang bidangnya memuat tengah layar (ray casting), jangkar terdekat hanya cadangan saat berkas batas belum tiba (di wilayah memanjang jangkar tetangga yang bulat bisa lebih dekat).\n- Tiap setView dan fitBounds dibungkus gerakKamera(): gerakan kamera menembakkan zoomend dan tanpa penjaga tiap perpindahan tingkat memicu perpindahan berikutnya sampai dasar. Kamera dikunci ke jalur; sorotan pencarian menunggu datanya. Sebab: keluhan \"ga bisa zoom in\" karena kamera membingkai ulang tiap efek penggambar jalan, empat pemicu berbeda.\n- Bingkai lewat kotakInti() (median plus empat kali median jarak, lantai 30 km, tidak pernah menyaring kotak dengan kurang dari 3 titik), bukan kotak mentah. Sebab: 5 Sep 2026 masuk Percut Sei Tuan peta tetap sejauh Aceh karena satu SPPG 250 km dari gerombolnya.\n- Remah roti di kiri atas (kanan kontrol zoom), flex-nowrap, tiap keping selain terakhir tombol, tidak pernah pecah dua baris, kata \"Kota\" atau \"Kabupaten\" dibuang. Remah menggantikan tombol \"Kembali ke X\" dan eyebrow tingkat. Label tingkat di pojok kiri bawah satu-satunya yang menjawab \"sekarang di tingkat apa\". Bar cari peta di baris sendiri di atas, kontrol lapis di bawahnya.\n- Tidak ada clustering marker. Titik berkoordinat sama disebar melingkar (sebarTumpuk) supaya semuanya bisa diklik. Kunci tumpukan 5 desimal (sekitar 1,1 meter), sama dengan pembulatan audit tumpukan di DB (sebelum 8 Sep 2026 enam desimal: dua ambang untuk satu pertanyaan dan tumpang tindih sempurna lolos gerbang), dan jari-jari tumbuh mengikuti jumlah anggota (tumpukan sepuluh di Sagulung dulu berjarak 3,6 px, satu gumpal).\n- Lapis rute memakai jarak jalan (OSRM atau Google), tidak pernah radius (\"jangan cuma garis lurus\", 5 sampai 6 Sep 2026). Garis lurus digambar dulu lalu diganti saat OSRM menjawab; estimasi menit 40 km per jam dengan tanda kurang lebih; radius layanan dicabut. Pil lapis berupa ikon, bukan kata. Satu sakelar sekolah (bukan tiga) menembak tiga sumber bersamaan lalu menggambar berurutan, urutan itulah yang menegakkan dedup per NPSN: satu sekolah satu penanda. Entitas belum dilayani tidak punya rute.\n- Mode presentasi dan panel yatim dicabut utuh (6 Sep 2026): panel tanpa pintu adalah berkas yatim.\n\n### Satu sumber untuk kata \"memasok\" dan dua lapis sekolah\n\n- Pasangan entitas (koperasi dengan dapur) dipakai banyak permukaan sekaligus (rute, popup, tabel wilayah, lembar ekspor) dan semuanya wajib membaca peta pasangan yang sudah dihitung, bukan tautan mentah. Sebab: begitu satu permukaan membaca tautan mentah, dua permukaan di layar yang sama menjawab beda untuk pertanyaan yang sama. Gerbang: tiap sebutan tautan mentah di permukaan peta wajib punya vonis tertulis dan vonis yang menunjuk berkas hilang ditolak.\n- Dua lapis sekolah tidak boleh disatukan: \"sekolah mana yang kita layani\" bukan \"sekolah apa saja yang ada di sini\". Tabel roster operasional per dapur (kunci sppg_id), semesta sekolah se-negeri sebagai latar peta (kunci wilayah, bergerbang is_staff()), dan sisa dari sumber lain sebagai penanda \"belum dilayani\". Jawaban kosong untuk yang pertama terbaca sebagai kosong untuk yang kedua; yang benar menambah lapis kedua dengan penanda dan warna sengaja berbeda, bukan melonggarkan lapis pertama. Sebab: 6 Sep 2026 pil \"Sekolah penerima\" mati di Kec. Ilir Timur Dua, Palembang (\"ga mungkin ga ada sekolah disitu\"); 530.614 baris Dapodik hampir mendarat di roster dan membuat tiap cacahan, dropdown, laporan \"belum dilayani\" salah.\n- Kunci wilayah sekolah dihitung sekali saat impor oleh satu fungsi, disimpan sebagai kolom, dicari lewat b-tree polos, bukan indeks ekspresi atau fungsi SQL per baris (tabel 18 kali lipat tabel dapur, fungsi yang tak bisa di-inline per baris pernah membuat peta menembus statement_timeout untuk semua orang). Importir dan pembaca memanggil fungsi yang sama, maka importirnya ditulis TypeScript bukan .mjs.\n- Koordinat sumber luar tidak dipercaya. Contoh (Dapodik): 1.437 baris tanda terbalik (sekolah Jawa tercatat 7 derajat lintang utara), 18.483 meleset jauh dari sebaran kecamatannya, 88.774 belum diukur. Wasitnya median kecamatan itu sendiri, yang meleset dicoba dibalik tandanya dulu, yang tak terselamatkan ditandai koordinat_ragu dan tidak digambar.\n- Kunci nama wilayah menyeragamkan ejaan lintas sumber: angka jadi digit (bentuk yang tak memihak) hanya di token terakhir (\"Tiga raksa\" bukan \"3RAKSA\"), provinsi disatukan lewat kode BPS (\"D.I. Yogyakarta\" lawan \"Daerah Istimewa Yogyakarta\" tak bisa dipertemukan aturan ejaan), kata \"Kota\" dipertahankan dan spasinya opsional (Karawang \"Kota Baru\" lawan Dapodik \"Kotabaru\"; menuntut spasi melahirkan selisih di 23 dapur). Sebab: \"Ilir Timur Dua\" lawan \"Ilir Timur II\" (BGN 36 lawan 36, Dapodik 53 lawan 35 memakai kedua ejaan) membuat RPC memulangkan nol baris meski 530.614 sekolah sudah masuk.\n- Ukur cakupan, jangan percaya satu kasus yang berhasil: hasil 5.185 dari 5.364 kecamatan berdapur (96,7 persen). Sisa 179 selisih ejaan sungguhan di sumber (\"Baturaden\" lawan \"Baturraden\", satu baris bernama rusak \"anjahe\") tidak dinormalkan karena menebak menempelkan sekolah ke kecamatan tetangga.\n- Satu koordinat sama dengan satu gedung, pembedanya alamat yang dinormalkan (huruf kecil, non-alfanumerik dibuang), bukan desa. Alamat sama di satu titik tetap wajar (satu gedung beberapa dapur, sengaja bukan temuan). Sebab: 6 Sep 2026 Kec. Sagulung, Batam, sepuluh dapur Sungai Pelunggut di satu koordinat dengan tujuh kompleks berbeda; sapuan menghitung 10.507 baris berbagi koordinat, 9.923 beralamat berbeda yang benar-benar salah, 2.631 melintasi desa (yang dilihat vonis lama), 1.676 alamat sama koordinat bercabang, 7.292 lolos dari satu-satunya gerbang; alamat terisi 100 persen (28.731 dari 28.731); tanpa normalisasi 33 baris dituduh keliru.\n- Geocode berdasarkan alamat dulu, nama belakangan. Sebab: sapuan nama (\"apakah Google kenal SPPG Sungai Pelunggut 5\") hanya memindahkan 26 dari 250 baris (10 persen) karena Google memulangkan \"Pelunggut 1\"; sapuan alamat memindahkan 19 dari 24 di Sagulung (79 persen) dan 186 dari 200 di chunk nasional pertama (93 persen), dan geocoding lebih murah dari Places sehingga masuk jatah gratis.\n- Jangan melonggarkan vonis untuk mengejar angka, dan jangan melapor \"sudah bersih\" dari pengamatan peta: peta hanya memperlihatkan kecamatan yang kebetulan dibuka orang, dan kelas cacat ini bertahan tiga bulan karena begitu. Tiga alat tak saling menggantikan: audit (vonis, 8 kelas dua tabel), sapu terjadwal harian (memperbaiki), cron mingguan (melaporkan). Sapuan yang melapor berhasil sambil menulis titik yang sama atau yang masih dihuni lebih buruk daripada tidak menyapu.\n- Satu titik salah melahirkan deretan angka konsisten yang seluruhnya salah (9 Sep 2026: empat baris satu dapur berjarak 310 sampai 318 km dari koperasi sekecamatan karena lintang dapur 0,0258): angka yang saling menguatkan bukan bukti. Pengecualian positif palsu bisa melingkar (butuh jangkar kecamatan, jangkar dari titik yang sudah divonis ragu): putus dengan sumber ketiga yang independen. Utang terbuka dicatat (kepulauan kecil yang semua titiknya masih ragu tak terlihat di peta).\n- Dua pin bertetangga bukan duplikat. Kolom yang membuatnya tampak duplikat (yayasan, kepala yayasan, korwil per kabupaten, jarak, nama yang dibangkitkan dari wilayah) tak pernah bisa membedakan apa pun. Pembeda hanya nomor dari luar (no_bgn dari registri, radar_kode per kelurahan) dan irisan daftar sekolah (nol irisan berarti dua dapur). Jangan pernah menggabung dapur dengan kunci nama. Sebab: sapuan menemukan 442 pasang yang memang satu dapur dua baris (139 berjarak lebih dari 1 km, tak terlihat sebagai pin dobel), tapi penggabungan berdasar nama ternormalkan salah: 321 dari 339 pasang daftar sekolahnya lepas sama sekali, cangkang hidup tanpa sekolah dan ratusan dapur kehilangan radar_id sehingga panen harian tak menautkan ulang. Dibatalkan lewat kolom asal-usul yang kebetulan tak ikut ditimpa. Salah gabung diam dan cuma ditemukan bila jejak asal masih ada; yang salah biar kelihatan di peta dan akan dilaporkan orang.\n- Ekspor dan statistik wilayah tidak dihitung dua kali di dua tempat: dasar yang sama untuk layar, kertas, dan peta (satu penyebut persen, satu aturan merge).\n\n### Performa dan data peta\n\n- Apa pun yang dipakai per klik dan berubah harian dibaca dari matview, bukan dihitung ulang. Sebab: median dihitung ulang tiap klik lewat percentile_cont atas seluruh provinsi, \"kenapa maps lambat sekali\", dibaca dari mv_peta_wilayah: 1.010 ms jadi 94 ms.\n- Apa pun per wilayah di matview ditulis sebagai window function atas partisi, bukan join ke agregat. Sebab: join 110 rb baris ke CTE median jadi nested loop dan mati di statement timeout 2 menit; window function 8,6 detik.\n- Fungsi peta yang menyaring lewat ekspresi terindeks memakai security definer plus is_staff() di baris pertama, dan diukur sebagai authenticated, bukan postgres. Sebab: sebagai postgres 96 ms, sebagai authenticated 6.501 ms karena di bawah RLS kualifikasi wilayah_kunci(kolom) tidak leakproof sehingga planner menyapu 83 rb koperasi. Angka tanpa role bukan angka.\n- Setiap migrasi yang menyentuh nama wilayah (alias kabupaten, ejaan) wajib menyegarkan matview peta, dijaga gerbang. Sebab: alias kabupaten diperbaiki tiga lapis tapi mv_peta_wilayah tertinggal sehari penuh (\"Oku Timur\" 312 KDMP bersebelahan \"Ogan Komering Ulu Timur\" 60 SPPG). Perbaikan yang tidak terlihat sama dengan tidak ada perbaikan.\n- Saringan jarak untuk menandai titik ragu tidak boleh mengira seluruh pulau salah ketik, dan join jangkar adalah left join. Sebab: saringan 120 km menandai 778 dari 968 titik \"ragu\" dan 71 kecamatan hilang dari matview karena inner join. Satu fungsi vonis ragu, ambang ikut sebaran wilayahnya sendiri (Merauke 45.000 km persegi).\n- Argumen opsional yang salahnya berupa \"tidak terjadi apa-apa\" tidak boleh ada: fungsi turun jalur dipanggil tanpa argumen ketiga sehingga memperbesar peta tidak melakukan apa-apa tanpa mengeluh. Fungsi mencari sendiri kode pulaunya dan jumlah parameter dikunci.\n- Pengelompok dan penampung sisa wajib memartisi himpunan yang sama. Sebab: daftar pasok disusun dari titik mentah tapi dikelompokkan dari titik tersaring sehingga koperasi hilang dari layar sepenuhnya, bukan di grup mana pun.\n- Cadangan harga master hanya sah dipajang bila supplier-nya dikenal di himpunan supplier yang sudah disaring wilayah; bahan tanpa supplier (\"Tanpa Sup\") tidak ikut disaring. Sebab: 22 Sep 2026 header Bengkulu Selatan memajang harga master Bangka Belitung persis (Beras Raja 16.005 / 16.800) karena kolom harga master global dibaca tanpa saringan wilayah.\n\nData dan uang\n\nBab 25\n\n## Data dan database\n\n- Zona waktu dibaca dari perangkat, lalu zona dapur atau lokasi, lalu WIB (vonis 5 Sep 2026). Di browser: jam komputer (zona tetangga dipetakan lewat offset +7/+8/+9), GPS hanya bila jamnya bukan itu, lalu kolom iana_timezone, lalu WIB. Cron dan dokumen server tetap memakai zona dapur (pengingat Jayapura berbunyi menurut jam Jayapura). Kolom waktu timestamptz. Jam yang diketik orang lapangan tidak dipatok +07:00 (jamZonaKeIso, awalHariZona): dapur WITA dan WIT salah 1 sampai 2 jam, dan salah offset itu permanen di jejak audit. Di sisi server, oper zona dapur eksplisit (hariIniIso(new Date(), sppg.iana_timezone)): provider zona hidup di browser dan di route handler nilainya selamanya Asia/Jakarta, jadi dokumen dapur WIT pukul 00:30 bertanggal kemarin. Zona per usaha (BS: WIB walau usahanya di Bali; WI: belum ada zona Asia/Jakarta di kode, dicatat untuk fase berikut).\n- Tanggal: hitung di ruang lokal, baca di ruang UTC, mundur satu hari. Bentuk new Date(y, m, 1) lalu toISOString().slice(0, 10) lolos CI di runtime UTC dan salah di peramban pengguna (29 pemanggil, tujuh titik sekelas, 30 Agt 2026). Date lokal ke string lewat isoDate() bersama; tanggalWib() hanya untuk \"sekarang\". Gerbangnya berlingkup berkas, bukan baris: percobaan pertama memeriksa ekspresi penerima menghasilkan nol temuan termasuk di berkas yang terbukti rusak; pemindai yang tak bisa merah bukan gerbang. Yang tak tertangkap: hitungan seluruhnya UTC tetapi jangkarnya salah, butuh uji perilaku.\n- Periode dan kalender mengikuti usaha (MBG: periode keuangan dua mingguan, minggu kerja harga Senin sampai Jumat, operasional Senin sampai Sabtu). Akhir pekan dan libur nasional selalu dibedakan visual. Grup tanggal per minggu berlabel \"14-20 Sep 2026\", tanpa \"Minggu 38\".\n- PostgREST memotong tiap respons di 1000 baris tanpa error. .limit(3000) tidak menolong (max_rows batas server). Pakai pembantu ambilSemua() dengan callback (dari, sampai) => ....range(dari, sampai) untuk tiap query yang bisa lewat 1000 baris, wajib .order('id') sebagai pemecah seri. Builder yang dioper langsung bermutasi di tempat sehingga rentang terakhir terbawa ke semua gelombang paralel (baris kembar dan hilang, 12 Sep 2026, ambang gerbang nol). .eq('aktif', true) bukan pembatas jumlah; yang membatasi hanya .limit, .range, .single, head:true, atau filter ke satu induk. Gerbang memindai sumber terhadap daftar tabel besar; tabel yang tembus sekitar 500 baris didaftarkan, dan daftar itu butuh mata kedua: sapuan harian mengadu cacahan nyata dengan daftarnya (user_profiles melompat dari puluhan ke 29.337 baris, 3 Sep 2026, tanpa satu berkas berubah).\n- Kejadian pembentuk aturan paginasi (MBG, 28 Jul 2026): recipe_items 2.451 baris ditarik tanpa paginasi dan 72 resep tampil \"belum diisi\"; tombol \"Lengkapi\" lalu insert ulang dan kena unique constraint; BOM, biaya, dan audit gizi menghitung dari data separuh. Pola tulis selalu upsert(onConflict), bukan insert polos.\n- RPC set-returning terpotong 1000 baris juga tanpa error. Paginasi .range() ditolak bila tiap halaman menjalankan ulang query berat (4 dtk); pakai pembungkus yang memulangkan seluruh hasil sebagai satu baris jsonb. .in() dengan ribuan id jadi URL puluhan KB yang ditolak sebelum sampai Postgres; patch di satu titik (fetch global klien yang memecah URL lebih dari 6.000 karakter). .limit(500 sampai 999) yang dijumlahkan atau ditampilkan menyajikan angka kekecilan, dan .limit(1000 atau lebih) dilarang (MBG, 6 Okt 2026).\n- Blok yang dibangun untuk puluhan entitas pecah di header ribuan (MBG 7 Okt 2026, header 1.174 SPPG). (1) Cakupan wajib menyeberang ke server (`.in('sppg_id', ids)` atau parameter id di RPC), bukan tarik nasional lalu saring di klien (180.892 baris ditarik). (2) RPC per entitas tanpa parameter cakupan terpotong urut kode: seribu baris pertama habis dipakai provinsi lain; pakai pembungkus jsonb `*_utuh`, nama lama tak boleh dipanggil app (gerbang `gerbang-rpc-utuh`, daftar dibaca dari migrasi). (3) `.overlaps()` tidak dipecah pemecah URL: 14.313 id jadi URL sekitar 140 KB dan \"TypeError: Failed to fetch\" tanpa status (gerbang `gerbang-overlaps-daftar-id`, plafon cuma turun). (4) Pemecah `in.(...)` wajib menghitung partisi dari URL tanpa offset dan limit dan meng-unik-kan daftar; kalau tidak, halaman berbeda berpartisi beda dan diam-diam menggandakan serta menghilangkan baris (6 PO ganda, 6 hilang, faktur terhitung dua kali untuk 90 PO; uji `fetch-potong-in`). (5) Nested loop salah taksir di dalam RPC: `SET enable_nestloop = off` di definisi fungsi (40 ke 4,6 detik); ukur badan fungsi di blok DO dengan variabel, bukan literal.\n- Ongkos per baris yang tak terasa di data kecil meledak sesudah panen data menggelembungkan tabel (MBG 7 Okt 2026: recipes 566 ribu baris, Temuan Resep timeout padahal daftarnya 1.302). Lima bentuk: fungsi plpgsql per baris, `NOT EXISTS` per baris yang membawa ongkos RLS, `count(*)` skalar sebelum join yang sempit, view tanpa cakupan, window `bool_or()` sebelum LIMIT. Ukur tiap cabang union sendiri sebagai admin dan sebagai kursi wilayah; cakupan dulu lewat JOIN, fungsi mahal per nama unik (CTE materialized), keyset per blok. `create or replace view` mengembalikan reloptions, jadi sebut `security_invoker` lagi. Satu halaman sekitar 122 ke 2,1 detik; gerbang `tests/e2e/228-temuan-resep-cepat.sql`.\n- Paginasi layar adalah urusan terpisah dari paginasi database: ambilSemua() bukan pengganti komponen Paginasi. Berkas yang benar soal database paling sering lupa layar karena menarik semua baris sengaja lalu menggambar semuanya (622 kursi dalam satu tabel, 6 Sep 2026; ratusan baris kali belasan sel dibayar main-thread, lihat INP). Saring dulu, baru potong halaman; pencarian tetap global. Lembar cetak dikecualikan. Gerbang ratchet, hanya boleh turun.\n- Jadikan kolom status ber-check constraint, uang numeric, tanpa kolom generated, FK lengkap. Literal status yang ditulis dari badan plpgsql wajib ada di constraint kolomnya. Sebab: run_finance_automation() menulis status yang ditolak constraint, insert gagal, transaksi rollback, dan baris yang harus mengabarkan kegagalan ikut hilang sehingga papan pantau kosong terbaca \"tak ada masalah\" (MBG, 11 Sep 2026).\n- Penjagaan kaitan wajib hidup di database, bukan di tampilan: trigger untuk rantai (penerimaan, stok, status PO, invoice), tiga lapis (middleware mengarahkan, guard tiap route, RLS dan trigger di DB), satu peta peran (PAGE_ACCESS) yang dibaca nav dan guard, halaman baru wajib didaftarkan dengan bawaan ditolak. Trigger yang menelan error (when others then null) di rantai uang dilarang; error dicatat ke tabel log otomasi.\n- RLS: view tidak kena RLS dan fungsi can\\_\\* yang balik NULL lolos di plpgsql; dua kelas ini sudah pernah membocorkan data. Guard di policy dibungkus (select ...) agar jadi InitPlan sekali per query, bukan per baris: tab yang viewnya 1.147 baris selesai 0,9 detik sebagai postgres tetapi 9,35 detik sebagai pengguna, di atas statement_timeout 8 detik; sesudah 76 policy disapu 1,30 detik (MBG, 28 Agt 2026). Guard berupa himpunan (my_sppg_scope()) tidak dibungkus. Guard berlarik besar (83 ribu id, 45 ms per panggilan) pakai kolom IN (select unnest((select fungsi()))), di-hash sekali; any((select larik)) tanpa ::integer\\[\\] gagal; ubah lewat alter policy, bukan drop lalu create. Ukurlah sebagai pengguna sungguhan, karena sebagai postgres RLS tidak jalan. Sapuan pembungkus guard dibangkitkan dari **katalog**, bukan daftar nama: semua fungsi public nol argumen, skalar, STABLE dibungkus lewat ALTER POLICY. Sebab: MBG 7 Okt 2026, empat sapuan sebelumnya membawa daftar nama dan 180 policy masih memanggil guard per baris (`can_read_ops()`, `can_read_profit()`, sebelas lainnya), rekonsiliasi supplier timeout; gerbang unitnya buta karena kelas regex mengecualikan \"(\" sehingga `using (guard())` tak pernah cocok. Kelas yang didefinisikan sifat fungsi tidak dijaga daftar nama. Ukur query PostgREST dengan plan generik (`force_generic_plan` plus prepare), bukan literal: plan generik menaksir fungsi set 1000 baris, obatnya `alter function ... rows 20000` (admin 4.541 ke 92 ms). Gerbang `tests/e2e/225-rls-guard-initplan.sql` dan `gerbang-rls-initplan`.\n- Hak fungsi: revoke dari anon kecuali memang publik. grant ... to authenticated tidak menutup apa pun karena objek baru mewarisi hak PUBLIC. Akses publik lewat API service-role, bukan RLS anon. Fungsi security definer wajib set search_path dan memeriksa peran di badannya (authenticated bukan ambang cukup: 242 fungsi bisa dipanggil siapa pun yang punya sesi lewat /rest/v1/rpc, audit 2 Sep 2026; dicabut 89 fungsi trigger lewat loop atas prorettype = 'trigger' supaya yang lahir besok ikut tertutup, dua orakel identitas, 25 pengisi dummy; 242 turun jadi 134). \"Tidak disebut kode aplikasi\" bukan alasan mencabut: fungsi invoker dipakai trigger, view, policy, dan default kolom. Fungsi baru yang dibuka untuk authenticated wajib memeriksa peran atau staf di badan; daftar lama dibekukan, nama baru ditolak, plafon pintu definer telanjang nol.\n- Gerbang peran di fungsi definer menyaring sesi login tanpa profil, bukan semua yang bukan staf: (select public.is_staff() or auth.role() is distinct from 'authenticated'). Cron, route admin client, halaman token, dan pg_cron punya peran NULL; nilai aman untuk fungsi yang dipakai policy atau trigger adalah kosong atau NULL atau false, bukan raise. Fungsi kamus murni dijadikan security invoker, bukan diberi gerbang palsu (MBG, 4 Okt 2026). get_my_role() memulangkan ENUM, jadi bandingkan ::text (coalesce(get_my_role(), '') gagal 22P02).\n- set search_path hanya untuk security definer. Memasangnya di fungsi invoker mematikan inlining planner: fungsi kecil per baris (wilayah_kunci, jarak_km) jadi 20 kali lebih mahal dan peta tembus statement_timeout (6 Sep 2026). Advisor function_search_path_mutable tidak tahu peran fungsi, jadi jangan menurutinya buta. Gerbang menilai keadaan akhir (create, alter, reset; yang terakhir menang), bukan hanya create function.\n- RPC definer per wilayah wajib menyaring cakupan sendiri di badan fungsi (s.id IN (SELECT get_my_sppg_ids())); RLS tidak menolong karena definer melewatinya. Sebab: kasir dapur S02 melihat matriks porsi 22 dapur (MBG, 18 Agt 2026). Waspadai fungsi yang memeriksa pertanyaan kolom (\"boleh lihat uang?\") tetapi bukan pertanyaan baris (\"dapur mana?\").\n- Drift hak dan objek diukur mesin, bukan dipercaya dari buku migrasi. Buku migrasi hanyalah proksi: MCP apply_migration mencatat versi dengan jam penerapan, jadi membandingkan nama berkas memberi 37 \"belum diterapkan\" yang semuanya salah (6 Sep 2026). Pakai perkakas drift yang menyusun satu query keberadaan objek dan memvonis jawabannya, plus kelas hak (execute yang masih terbuka, definer atau invoker yang beda dari repo), dijalankan harian lewat RPC khusus service_role dengan JSON harapan yang dijaga gerbang. Sebab: migrasi cabut_definer_authenticated tak pernah diterapkan 13 hari, 33 fungsi yang menurut repo tertutup tetap terbuka dan tak ada alat yang melihat (4 Okt 2026). Pencabutan yang tak diukur di katalog sama dengan pencabutan yang tak terjadi.\n- Types database hasil generate (npm run types), dijalankan tiap migrasi baru diterapkan ke remote dan hanya sesudahnya. Basi dua arah dan diam: tabel baru yang belum masuk jatuh ke never dan banjir error TS yang tampak seperti salah kode; kolom lama yang sudah tak ada membuat tsc hijau untuk kode yang pasti gagal di runtime. Error TS yang muncul sesudah regenerate adalah temuan, bukan kerusakan: kejar drift-nya, jangan kembalikan berkas types.\n- Objek DB rumahnya satu: supabase/migrations/. Folder arsip SQL yang tak pernah dijalankan hanya boleh menyusut (berplafon). Sebab: 19 trigger alur uang hidup di produksi tanpa berkas migrasi (28 Agt 2026); DB yang dibangun ulang dari repo tak akan punya perilakunya tanpa error. Skrip sekali jalan di scripts/ (npx tsx). Tiap migrasi baru idempoten, tabel baru ber-RLS, dan tabel yang disentuh sebuah migrasi sudah lahir di stempel yang sama atau lebih tua (migrasi yang memasang trigger di tabel dari masa depan hijau di DB pemilik yang diterapkan tak berurutan, merah di cermin CI). Bila dua migrasi mendefinisikan fungsi sama, bertimestamp terakhir menang; bentuk akhir ditaruh di berkas terakhir. Migrasi yang mengubah signature wajib drop function if exists signature lama, karena create or replace dengan signature baru melahirkan overload kedua dan pemanggil dijawab PGRST203 (MBG, 7 Okt 2026; gerbang memutar ulang seluruh migrasi dan menolak lebih dari satu signature hidup). Sebelum rilis ke produksi dan DB belum tayang, migrasi digulung jadi baseline bersih berisi perbaikan keamanan (WI).\n- Keputusan data pemilik dicatat sebagai migrasi berkomentar alasan, bukan update diam. Perbaikan data yang menulis tabel sumber tetapi tidak menyegarkan rekap yang dibaca layar gagal diam: tiap migrasi yang menulis wilayah wajib menyegarkan materialized view di migrasi yang sama (MBG, 8 Sep 2026: dua gelembung wilayah kembar tetap tampil padahal tabel sumber benar). Kolom turunan yang disimpan (kunci wilayah) tidak punya perintah segar, jadi sediakan skrip penyegar bila rumusnya atau kamus aliasnya berubah. Pengupas awalan wilayah wajib menuntut pemisah (singkatan bertitik); yang lepas memakan nama berawalan sama (21 kecamatan, 940 sekolah, nol error).\n- Matview yang dihitung per wilayah ditulis sebagai window atas partisi (median lewat row_number plus avg() filter), tidak pernah join ke agregat: join ke CTE median jatuh ke nested loop dan mati di timeout 2 menit (110 ribu baris), versi window 8,6 detik. Join jangkar jadi left, kalau tidak 71 kecamatan hilang diam-diam.\n- create index if not exists menguji nama, bukan isi. Dua indeks GIN trigram identik lahir dari dua migrasi (kdmp.nama, 83 ribu baris) dan ongkosnya di sisi tulis yang tak pernah terlihat saat membaca. Gerbang membandingkan tabel, metode, ekspresi kolom, dan WHERE, tanpa nama (memasukkan nama mengulang bug di gerbangnya sendiri).\n- Indeks parsial yang dibuat ulang wajib menyalin semua pengecualian predikat lama (anti_kembar kehilangan potong_bon dan setoran tunai kedua di hari sama gagal 23505). Dua fungsi tidak memakai nama temp table sama. lpad() memotong: lpad(seq, 3, '0') menjadikan kwitansi ke-1000 \".../100\" yang bentrok unique dan trigger menelannya (tagihan lunas tanpa kwitansi); pakai greatest(3, length). Kolom token tiap tabel link eksternal punya default di DB (encode(gen_random_bytes(18), 'hex')); tanpa default, merakit token di aplikasi membuat tiap jalur mengingat panjang dan sumber acaknya sendiri. Uji dari kunci primer di pg_index, bukan mengandaikan kolom id.\n- Temuan advisor yang sengaja dilewat ditulis beralasan supaya tak dinilai ulang tiap sapuan: unused_index (jendela statistik 2,5 hari terlalu pendek untuk laporan bulanan), unindexed_foreign_keys (kolom jejak created_by yang tak pernah jadi saringan), multiple_permissive_policies (pola baca plus tulis_admin disengaja).\n- Kolom baru dan PostgREST: select yang menyebut kolom belum ada ditolak seluruhnya. Tanyakan kolom baru di query terpisah yang gagal lunak, supaya lingkungan yang ketinggalan satu migrasi tidak mematikan kop dan daftar dapur.\n- Satu layar dua sumber: kolom baru wajib menyeberang ke kedua fungsi (peta internal dan peta publik), atau didaftarkan sebagai khusus internal berikut alasannya. Hak fungsi publik diperiksa ulang ke katalog produksi sesudah tiap perubahan signature, karena drop lalu create mengembalikan hak ke bawaan. Sel yang tercetak kosong dan terbaca \"belum terdata\" untuk data yang tak pernah dikirim adalah gejalanya.\n- Layar kosong yang benar tetap wajib menyebut sebabnya (MBG: 83.362 koperasi, nol berstatus aktif, sepuluh layar kosong bersamaan, orang menelusuri kode yang benar berjam-jam). Kalimat sebab hidup di satu konstanta yang disebut tiap komponen yang menyaring status itu. Tabel kosong tetap tergambar (kepala kolom plus satu baris \"Belum ada ...\", bukan EmptyState besar) (BS).\n- \"Belum memilih apa-apa\" tidak boleh berarti \"tanpa batas\". Dua bentuk yang menulis \"kosong\" lalu membacanya \"semua\": activeId ? q.eq('sppg_id', activeId) : q, dan cakupan.size === 0 ? null : cakupan dengan cabang null dibaca hilir \"jangan saring\". Akibat: memilih provinsi Aceh menampilkan dapur Bangka Belitung di bawah judul Aceh, tanpa error (MBG, 15 Sep 2026). Pakai daftar id cakupan, dan saat cakupan kosong pakai id sentinel yang tak pernah cocok. State id dapur yang dioper ke picker lewat satu fungsi pembersih (cakupanSah) karena effect pembersih picker hanya jalan bila picker ter-mount. Komponen yang sudah punya cakupan tidak menarik ulang tabel global tanpa saringan wilayah. Dashboard mengikuti cakupan dan dirinci satu tingkat di bawahnya (nasional jadi provinsi, provinsi jadi kota atau kabupaten, dan seterusnya; tingkat yang kosong di seluruh cakupan turun lagi, label kosong \"Lainnya\").\n- Data yang belum dimuat tidak pernah mendapat angka bawaan. Entitas yang barisnya belum dimuat tanpa entri, bukan nilai default yang menyamar jadi data. Sebab: MBG 7 Okt 2026, pemilih dapur Kalender mencetak \"22 hari kosong\" untuk semua dapur lain karena halaman cuma memuat kalender dapur terpilih sementara hitungan jalan untuk seluruh daftar; obatnya RPC `kalender_hari_terisi_utuh` (INVOKER, tertutup untuk anon). Gerbang `gerbang-kalender-belum` dan `tests/e2e/227-kalender-hari-terisi.sql`.\n- Nama wilayah dari dua sumber tidak dibandingkan mentah (===, includes, has): \"DI Yogyakarta\" lawan \"Daerah Istimewa Yogyakarta\" tidak berbagi huruf yang bisa dipertemukan aturan kunci wilayah, hanya kode BPS yang menyatukan. Pakai kunciProvinsi() yang membungkus kodeProvinsi(x) ?? wilayahKunci(x). Alias nama wilayah (Dapodik \"Pangkajene Kepulauan\" lawan peta \"Pangkajene dan Kepulauan\") diatur sebagai kamus alias di DB dan app.\n- Dua sumber kebenaran dilarang, termasuk daftar yang harus sama isinya: nav dan guard dari satu peta, harga dari satu tabel mingguan, warna dari satu palet, katalog mini-tab sama dengan chip yang dirender halaman, daftar urutan diturunkan dari registrinya (MBG, 19 Agt 2026: URUT_METRIK literal terpisah dari registri METRIK, membuka kartu Tren meruntuhkan seluruh halaman ke error boundary). Syaratnya tiga: tiap kunci urutan ada di registri, tiap entri registri ikut tampil, tiap entri lengkap (label, ikon, penanda uang bertipe boolean). Daftar kategori aplikasi dan database satu daftar termasuk awalan kode dan pemicu norma (check menolak kategori yang barusan dipilih pengguna dari dropdown). Ambang yang hidup di DB dan TypeScript (jenjang emas 85, perak 70, perunggu 50, belum dinilai bukan pembinaan) wajib sama termasuk ejaan labelnya. Dua pembaca satu angka: plafon utang di penegak dan di peta diadu mekanis, dan bunyi pesan asersi bagian dari kontrak (regex pertama menangkap v_n pertama dan tabel memajang 0 yang terbaca \"bersih\").\n- Snapshot data di dokumen (supplier_nama_snapshot, invoice_entity_snapshot): dokumen tidak berubah saat master berubah. Harga dan HPP dibekukan di item pesanan saat insert (BS). Jejak audit dalam catatan teks bertanda kurung: \\[Diajukan supplier via link oleh X\\] | \\[Terlambat 4 hari\\] | \\[Selisih +Rp 12.000 vs estimasi PO\\].\n- Satu bahan satu baris master, satu satuan. Tiap baris resep dan order menunjuk item master lewat item_id dan satuannya sama dengan satuan master (angka disimpan dalam satuan master, diketik dalam g atau ml). Penjagaan di DB lewat trigger yang menautkan item_id lewat nama dan mengonversi satuan dari jalur mana pun (app, GUI, impor, seed, MCP); kamus satuan adalah data. Menaut hanya bila master tunggal (dua aktif bernama sama berarti diam); beda dimensi dilaporkan, tidak dikonversi. Sebab: baris \"Daging Sapi\" ber-item_id NULL dan satuan g: PO \"Tidak ada supplier\" dan nilai 155 kali lipat (90 g dikali harga per kg jadi Rp13,95 juta; 2 Agt 2026). Supplier kedua masuk sebagai kontrak, bukan baris bahan baru: trigger tolak bahan kembar plus indeks parsial unik nama aktif; bahan nonaktif boleh sama nama; penggabungan tidak dimesinkan buta (pemenang dengan pemakaian nyata terbanyak, migrasi berhenti raise exception bila yang kalah masih memikul resep, order, PO, penerimaan, atau stok; yang kalah diarsipkan utuh) (19 Agt 2026: 71 kelompok, 149 baris, 78 kembar).\n- Supplier nonaktif hilang dari semua layar pemilih lewat satu rumah saringan, bukan hanya PO. Bahan yang hanya dipasok supplier mati tetap satu baris tanpa supplier supaya manusia memilih penggantinya, dan DB melaporkan kode supplier hantu.\n- Rantai harga membaca satuan toko, bukan satuan master (satu bahan dijual per ons di satu toko dan per kg di toko lain). Pembaca menerjemahkan harga ke satuan master sebelum diadu; satuan tak sebanding membuang baris; termurah dipilih sesudah konversi. Setiap query harga wajib ikut memilih kolom satuan, karena yang lupa tetap memulangkan baris dan harga dengan konversi yang diam-diam tak terjadi. Harga supplier dibandingkan ke satu batas atas: HET regulasi bila ada, bila tidak rentang pasar impor manual; pasangan satuan tak sebanding dikosongkan dengan tanda peringatan, vonis dari satu fungsi DB dan kembarannya TS (di_atas, di_bawah, wajar, tak_sebanding).\n- Qty belanja dibulatkan ke atas di DB lewat satu fungsi (bulat_qty) yang dipanggil trigger tiap tabel qty, bukan hanya di TypeScript. Sebab: aturan 10 Agt 2026 hidup 20 hari di satu fungsi TS dan 240 baris pecahan lahir lewat RPC dummy dengan insert langsung. Jangan mengembalikan qty bulat dari halaman (membuang angka kebutuhan, DB tak bisa menebak 15,4 dari 16), dan selisih terima mengadu timbangan, bukan angka yang sudah dibulatkan (14,2 dari 15 terbaca \"pas\"). Epsilon SQL dan TS sama dan diadu mekanis.\n- Satu kolom turunan, satu penulis. Harga master bahan ditarik trigger dari harga mingguan termurah, tidak ditulis halaman. Sebab: setelah baris jadi per pasangan (bahan, supplier), penulis terakhir yang menang, bukan yang termurah (35.000 mengangkat diri melawan 27.000, 13 Agt 2026). Halaman hanya menolkan master saat seluruh harga mingguan bahan habis. Satu rumus per besaran di mana pun (harga_untuk, angka_pesanan, sum(qty\\*harga) harian dan PO sama), dan view baru untuk sumbu lain tidak boleh menggantikan view lama bila mengubah hitungan (satu PO yang antarnya tersebar lima hari terhitung lima kali).\n- Rekening yang sudah dikumpulkan tidak ditanyakan dua kali: trigger menaikkan rekening pertama yang masuk dari jalur tulis mana pun (link publik, modal, impor) ke master dan tidak pernah menimpa yang sudah terisi (MBG, 18 Agt 2026: satu staf mengajukan tiga kali dengan dua nomor).\n- Data dummy tidak pernah bercampur dengan data asli: kolom is_dummy terpisah dari stok, HPP, dan nomor asli (GR, BS), dilabeli \"dummy uji tampilan\" atau \"(abaikan)\" dan dibersihkan sesudah uji (MBG). Tombol isi data dummy ada sejak awal, dua ikon, hanya Super Admin; isinya ditentukan halaman yang dibuka. Tiap tabel yang dibaca layar bertombol dummy punya vonis tertulis: induk (master, haram dilahirkan dummy), jejak (log yang lahir dari trigger), luar (lahir saat manusia menekan tombol link atau unggah), antre (utang transaksional, boleh menyusut, tak boleh tumbuh). Sebab: sapuan 30 Agt 2026 menemukan 113 dari 143 tabel tak pernah diisi; gejalanya tab sebelah berangka dan tab ini kosong permanen (rute salah), dan tab \"Selisih\" nol selamanya karena pengisi menyamakan qty_terima dengan qty_pesan (nol di semua baris terbaca rumus rusak). Rantai pengisi adalah tabel keputusan (dummy_rantai), langkah yang jalan dicatat di buku langkah (langkah yang melapor nol baris dicabut lagi), tombol hapus mengosongkan buku itu, dan tabel tanpa kolom id disebut sendiri di blok hapus eksplisit. Pengisi ramah gerbang: aktivasi mengisi prasyarat lewat pintunya dan menyimpan nilai lama untuk dipulihkan, tidak melemahkan gerbang.\n- set_config('statement_timeout', ..., true) di tengah statement tidak berpengaruh: timer dipasang sekali saat statement mulai (16 migrasi no-op, anggaran tetap 8 detik peran authenticated; 30 Agt 2026). Pecah kerja jadi beberapa statement/permintaan HTTP (dummy_isi_mulai memulangkan daftar langkah, dummy_isi_langkah menjalankan satu fungsi per permintaan), cocokkan nama fungsi yang datang dari klien ke daftar rantai sebelum execute (kalau tidak jadi pintu fungsi apa pun di skema public), hapus ber-batas, dan besar potongan di satu fungsi yang dibaca penghitung dan pengiris. Fungsi yang dipotong per hari wajib menerima offset rotasi (p_urut_awal) dan memulai penghitung dari sana; rotasi % 4, % 5, % 3 yang mulai dari satu di tiap potongan membuat tiga dari empat ember status tak pernah lahir. Gerbang \"sudah ada\" mengadu kolom yang sama dengan trigger anti-duplikat (tanggal item, bukan tanggal kepala dokumen) dan menyalin kunci triggernya, tidak mengarang kunci serupa. Bukti obat: jalankan sendiri set statement_timeout = '2s' dengan set_config 120s dan pg_sleep(5), hasilnya tetap 57014.\n- Skala nasional: pilihan konstanta jadi data. Zona waktu (WIB di sekitar 200 titik) jadi kolom per lokasi; enum entitas (yayasan) jadi tabel ber-FK karena alter type tak bisa dibatalkan; identitas penerbit dokumen (badan hukum) jadi tabel yang dibaca kop lewat provider. Salah zona bukan salah label tetapi salah hari. Uji akun massal: ribuan akun menggeser data, bukan kode.\n- Penerimaan data sumber luar yang dipaginasi tanpa urutan tetap kehilangan baris tanpa error: 38.568 baris mendarat sama dengan klaim sumber tetapi hanya 29.621 kunci unik (23 persen hilang; 13 Sep 2026). Bukti kelengkapan hanya jumlah kunci unik di tabel, diadu ke total resmi per irisan yang bisa dipanen habis; sumber tanpa total per irisan belum layak dipercaya. Periksa juga kolomnya (dua endpoint berbentuk sama belum tentu terisi sama: 37.130 butir dari sekitar 1,6 juta), dan hitung laporan akhir dari tabel, bukan dari yang dikirim.\n- Mengambil \"yang pertama\" (order by id limit 1) di satu tempat dan \"yang terakhir\" di tempat lain dari tabel yang sama menabrak kunci primer saat tabel menyusut jadi satu baris di cermin CI. Bahan uji e2e tidak diambil dari dua ujung daftar yang sama. Berkas e2e yang memanggil RPC bergerbang peran memasang klaim sesi.\n- Gerbang yang baru dibuat harus pernah dilihat merah. Sapuan e2e 6 Okt 2026 menemukan 57 merah: 46 karena uji basi terhadap perubahan sengaja, 11 bug produksi. Workflow e2e tidak membatalkan run yang berjalan (cancel-in-progress: false); dengan pembatalan 13 dari 30 run dipotong dan tak satu pun hijau sejak 14 Sep karena suite tak pernah sempat memberi vonis.\n- Perilaku di luar TypeScript (trigger, constraint, RLS, fungsi SQL) wajib punya uji integrasi yang menjalankannya, dan tiap objek SQL punya vonis di registri cakupan (WI: antre 66 objek). Dua bentuk yang sama sunyi: objek jalur uang yang hidup di produksi tanpa berkas migrasi, dan uji yang salinan asumsi kodenya.\n- Hanya satu cabang (main). Worktree dan branch agen dihapus sesudah push (GR). Satu repo per usaha, fondasi disalin dari repo induk dan domain usaha lain tidak ikut (BS). Cangkok, bukan fondasi ulang: yang generik dibawa, modul back-office tidak (WI).\n- Bagi hasil: nol kunci bulan (MBG, vonis 17 Agt 2026). Snapshot melengkapi diri (hanya menambah, tak pernah menyegarkan bulan yang barisnya ada); bukti transfer tidak menuntut periode terkunci; pembekuan dari bukti_url baris itu sendiri, bukan vonis sebulan penuh. Bagian pembagian punya metode (transfer atau tunai) sebagai kolom, tidak ditebak dari rekening kosong (keadaan itu benar dan final untuk tunai). Bagian tunai tetap berjenis transfer dan buktinya tetap foto tanda terima lewat alur unggah yang sama.\n- Kursi lapis koperasi bukan tim pusat dan tidak digaji dari tabel gaji master (MBG, 2 Sep 2026); lapis koperasi berdiri sendiri kecuali lewat jembatan resmi yang didaftarkan di gerbang, dengan entri baru plus uji e2e.\n- Penjual kecil desa lewat koperasi: identitas di tabel supplier jenis warga (WA wajib dan unik per koperasi), kolom sumber diisi trigger dari penjualnya, tidak dari payload, lalu dikunci; setoran lewat satu RPC pintu tunggal (catat masuk plus bayar di tempat satu transaksi). Sebab: setoran non-anggota dicap sumber \"pasar\" dan penjual desa hilang dari angka dampak (MBG, 23 Sep 2026).\n- Koperasi mitra per provinsi tidak eksklusif (satu koperasi melayani banyak provinsi, atur di tingkat provinsi): tabel pemetaan riwayat, ganti = tutup baris lama dan buka baru lewat fungsi. Dua arti \"Koperasi\" di satu kolom pasti salah satunya kalah, jadi kontrolnya terpisah.\n- Satu fungsi satu signature hidup, dan fungsi bersama dengan beberapa sesi penyunting punya pemilik tunggal (resep_lintas_sapu: tiga sesi menimpa fungsi sama, 465 catatan kembar, 96 sisi sayur hilang). Aturan baru = fungsi aturan plus satu baris panggilan di pemilik tunggal, bukan penyapu atau cron baru. Slot yang terisi tidak pernah ditimpa atau dikosongkan diam-diam: yang tak bisa ditaruh dicatat di tabel tertahan dan diputus manusia. Nama campuran dibiarkan utuh di pintu tulis, penyapu malam yang memecahnya.\n- Gambar dan peta: kamera peta dikunci ke jalur supaya efek penggambar tidak memanggil fitBounds berulang dan melempar balik zoom pengguna; file statis publik (/geo/\\*.json) dikecualikan dari matcher middleware agar anonim tak dilempar ke login; titik tanpa koordinat ikut tabel tetapi tak menyentuh peta, lewat penjaga adaKoordinat().\n- Kalender: acara beririsan duduk berdampingan dua lajur (batas selesai \\<= mulai tidak dibelah, maksimum dua lajur, tabrakan ketiga ditumpuk). Mini-tab dan chip yang diganti nama di halaman tidak boleh jadi baris hantu di layar admin.\n- Data dummy wajib tertaut ke hulunya lewat kolom relasi yang dibaca layarnya, bukan lewat tanggal yang kebetulan sama. Tiap fungsi dummy yang melahirkan baris hilir mengisi kolom tautnya ke hulu di `INSERT`-nya, bukan ditambal `UPDATE` belakangan, dan cara memeriksanya bukan melihat tabelnya tetapi membaca saringan yang dipakai layarnya. Gerbangnya daftar `TAUT_WAJIB` (pasangan tabel dan kolom taut) di `gerbang-dummy.test.ts`. Sebab: MBG 29 Agt 2026, Dashboard > Pengeluaran Mingguan dan blok Supplier kosong sesudah tombol dummy dipakai padahal semua barisnya lahir (5 PO, 4 faktur supplier, 3 transfer, 107 rincian bahan, bertanggal persis di periode yang dilihat); yang hilang satu kolom, `supplier_purchase_orders.source_order_ids` kosong, sedangkan rekonsiliasi supplier menjangkar PO ke order yang dinaunginya, bukan ke tanggal. Tiga layar diam bersamaan, tombol melapor sukses dengan jumlah baris benar, dan yang ditelusuri orang berjam-jam adalah rumus yang benar. Vonis: \"ini ketika dummy kok ga keluar ya? Gw pengen keluar ya\".\n- Isi dummy mengikuti urutan FK: induk lahir sebelum anak, karena satu anak yatim dengan FK RESTRICT mematahkan seluruh pembersihan 🧹; dan efek samping trigger (misalnya setoran tunai yang memicu jurnal) wajib berjejak dummy juga (MBG 7 Okt 2026, dummy Yon TP fase 1; dua asersi baru di `gerbang-dummy`).\n- Dua istilah untuk satu orang dijaga trigger, bukan disiplin. Nama dan nomor WA Kepala SPPG dan SPPI (orang yang sama; di layar istilahnya tetap Kepala SPPG) di tabel sumber dijaga trigger yang memastikan kolom kontak dan kolom SPPI selalu sepakat. Nama yang berselisih antarsumber digabung \"A / B\" dan diselesaikan orang lapangan, tidak ditimpa mesin. Nomor ber-peran perwakilan yayasan bukan nomor kepala; bila sumber menyebut dua nomor berbeda, dua-duanya tampil dan tak ada yang dibuang. (MBG: vonis 24 Sep 2026; trigger `sppg_bgn_kepala_satu`; gerbang `tests/e2e/106-kepala-satu-kontak.sql` dan `gerbang-sppi-skep.test.ts`; kolom `jenis_sppg` lahir bersama vonis ini dan sengaja tidak ditampilkan di layar mana pun untuk saat ini.)\n- Fitur yang divonis dicabut selamanya dihapus sampai tuntas: rute, komponen, teks menu, dan tiap pemanggil RPC hilang, sedangkan objek DB-nya dibiarkan; gerbang menjaga ketiadaannya. Sejalan dengan butir ritual yang dibubarkan. (MBG: vonis 25 Sep 2026 \"hilangkan menu Varians BOM selamanya\", RPC `bom_variance` timeout; gerbang `gerbang-tanpa-varians-bom`.)\n- Nama entitas dan teks bebas dibakukan database, lalu disapu harian: bentuk campur (\"Dapur SPPG ...\", \"Jaktim\", \"OKU\", \"Satuan Pelayanan Pemenuhan Gizi(SPPG)\") dibakukan trigger (MBG: `trg_nama_dapur_rapi` lewat `nama_sppg_baku`, `buang_kata_dapur`, `rapikan_nama_dapur`); placeholder \"NA\" tidak ikut dirapikan jadi \"Na\". Keterangan harga \"20gr\" jadi \"20 gr\" lewat trigger generik `rapikan_teks_satuan_trg('kolom')`, dan daftar kolom yang dijaga adalah ratchet `KOLOM_DIJAGA` yang cuma boleh bertambah. Sapuan harian penjaga nama menumpang cron rumah besar; aturan baru lewat agent perapi nama. (MBG: vonis 25 Sep 2026, normalisasi satu Indonesia, otomatis, tidak boleh terulang; gerbang `gerbang-penjaga-nama`, `gerbang-rapikan-teks`.)\n- Satu baris resep sama dengan satu komponen pangan. Piring berisi nasi, lauk, dan sayur dipecah tiga entri (\"Nasi\", \"Ayam Kecap\", \"Acar Timun\"), bukan satu baris bernama gabungan yang dititipkan ke satu komponen. Nama gabungan membuat komponen kalender salah sejak sumbernya: \"Nasi Jagal\" yang terdaftar lauk hewani menghitung nasi sebagai lauk dan gramasi seluruh piring melekat ke satu slot. Penjaganya di DB dan sengaja cuma separuh: trigger menolak bentuk daftar (pemisah koma, plus, &, \"dan\", tanda \\*, potongan kembar) dan diuji `tests/e2e/08-nama-resep-gabungan.sql`; nama tanpa pemisah (\"Nasi Ayam Kecap Acar Timun\") lolos karena mesin tak bisa membedakannya dari resep sah \"Nasi Goreng Telur\", jadi turun ke papan vonis manusia (`resep_nama_campur`); sisa katalog terbaca di view `v_referensi_dua_komponen`. (MBG: vonis 15 Sep 2026 \"kan harusnya dipisah ga sih. Nasi ya Nasi, Ayam Kecap jadi L. Hewaninya, Acar Timun jadi Sayurannya\"; migrasi 20260915151000.)\n- Kursi pengawas satu entitas memantau entitasnya, tidak membaca untung pihak lain, dan penutupannya berlapis: tampilan, nav, dan RPC. (MBG: Ka SPPG, Nutrisionis atau Pengawas Gizi, dan Akuntan Dapur atau Pengawas Keuangan, `KURSI_PENGAWAS_DAPUR` di `lib/rbac.ts`, boleh melihat tren dapurnya tetapi tidak angka yang membuka untung koperasi; vonis 23 Sep 2026 \"intinya gw ga mau dia bisa lihat keuntungan dari koperasi\".) Dashboard: kursi ini ikut jalur ringkasan eksekutif dan tiap blok diperiksa satu per satu, bukan diasumsikan menutup diri (Profit dan Margin, Supplier, Pengeluaran tidak di-mount; Barang Ops jatuh ke blok pagu; Akuntansi versi dapur sendiri; blok tren menutup lima metrik: profit, margin, selisih pagu, profit bahan, bayar; blok harga bahan baku menutup kolom Beli dan Selisih), dengan satu predikat (`kasppgSempit()` di `lib/dashboard/kasppg-sempit.ts`). Nav: ketiga kursi tak membuka Pembayaran, Koordinasi, dan Keputusan (\"ngapain dia bisa liat Pembayaran\"). Resep: tab Resep SPPG terkunci ke dapurnya sendiri dan bar Cakupan tak dirender untuk kursi satu dapur; tab Referensi Resep dibuka lihat saja se-Indonesia untuk lima kursi satu dapur (bukan PIC dapur, yang bisa memegang lebih dari satu dapur) lewat RPC berkeyset (bukan `OFFSET`) ber-`SECURITY INVOKER`. RPC ikut menutup: `dashboard_tren` tidak memulangkan profit, margin per porsi, dan selisih pagu untuk kursi dapur, karena menutup angka di layar saja tak cukup bila RPC bisa dipanggil langsung. Kontrol yang tak berlaku untuk peran tidak dicetak, bukan dimatikan: kolom Aksi yang selalu kosong untuk peran itu dibuang utuh (sel dan kepalanya), dan tombol mati (Buat PO Mingguan, Tolak Temuan, P. Manfaat baca-saja untuk KDMP) tidak dicetak. Request Bahan dibuka untuk kursi pengawas dapur; sebelumnya mereka sama sekali tak bisa request bahan dari Procurement. Gerbang `gerbang-kasppg-tanpa-untung`, `gerbang-kasppg-nav`, `gerbang-resep-satu-dapur`, `gerbang-procurement-kursi-dapur`, `gerbang-procurement-barang-ops`.\n- \"Lihat sebagai\": Super Admin yang ingin melihat layar sebuah kursi masuk sebagai akun uji kursi itu, dengan sesi dan RLS asli, bukan topeng di atas sesi sendiri. Boleh menulis, dan tiap langkahnya tercatat di `audit_log`. Pulang lewat tombol Kembali; cookie asal yang menyimpan jalan pulang ditandatangani dan berumur pendek, diperlakukan seperti kredensial. Hanya akun bernama persis \"Akun Uji \\<kursi>\" yang dipinjam (`NAMA_UJI` di `lib/lihat-sebagai.ts`); akun orang sungguhan tidak pernah bisa dipilih. Dijaga uji unit `lihat-sebagai.test.ts`: pilihan unik, cookie asal bolak-balik utuh, id yang ditukar atau kedaluwarsa ditolak. Pratinjau portal supplier punya aturan sendiri (gerbang `gerbang-pratinjau-mitra`). (MBG: vonis 3 Okt 2026.)\n- Pasangan pasok dibaca dari desa atau kelurahan, dan kardinalitasnya tidak simetris: penugasan resmi memberi satu koperasi tepat satu dapur, tetapi potensi berjalan dua arah tanpa batas (satu dapur boleh punya banyak koperasi yang berada di desa atau kelurahan yang sama). Popup titik karena itu mencetak dua judul berbeda: \"Potensi pemasok\" di titik dapur, \"Potensi SPPG yang bisa dipasok\" di titik koperasi. Jodohnya desa, bukan jarak dan bukan kecamatan, dengan kunci desa yang dinormalkan (huruf kecil, spasi rapat): ejaan datang dari dua daftar berbeda, dan ejaan kapital semua yang gagal berjodoh dengan ejaan biasa untuk desa yang sama adalah kegagalan diam. Yang sudah tertaut dibuang dari daftarnya; indeksnya dibangun sekali per gambar (`seDesa`), bukan disaring ulang per penanda. Ini satu-satunya baris popup yang boleh melipat karena isinya daftar. (MBG: vonis 6 Sep 2026 \"kenapa ga ada ke SPPG sama sekali ya? 1 KDMP 1 SPPG tapi 1 SPPG bisa beberapa KDMP yang penting ada di Kelurahan atau Desa yang sama\"; gerbang `gerbang-peta-kdmp.test.ts`.)\n\nBab 26\n\n## Uang, akuntansi, dan stok\n\n- Nomor dokumen berpola JENIS-YYMM-NNNN dari satu lajur nomor_urut (GR). Variasi per usaha mengikuti kertas yang sudah dipakai: urut, kode, bulan romawi, tahun untuk surat peringatan dan berita acara (MBG); BS-YYMMDD-NN untuk invoice yang mengunci item (BS). Padding nomor memakai greatest(lebar, length) supaya urutan ke-1000 tidak terpotong.\n- Jurnal otomatis per dokumen sumber, dan jurnal tidak seimbang ditolak, tidak dibulatkan. Sumber baru di jalur uang punya tiga syarat diam yang baru ketahuan saat baris pertama lewat: nilai source terdaftar di check, pasangan (source_table, source_id) unik sehingga sisi beban dan sisi transfer berbeda source_table (akhiran :bayar), dan tiap source_event punya baris posting_rules berkategori null sebagai jaring bawah (kalau tidak baris terhitung skipped_invalid dan laporan \"0 gagal\"). Beban dan transfer dipecah: gaji Agustus tetap membebani Agustus walau transfer 5 September (MBG, 13 Agt 2026: gaji, reimbursement, rutin tak punya jalur ke buku besar). Jurnal otomatis dipanggil harian oleh cron untuk rentang yang terlewat (jurnal sempat berhenti sebulan karena hanya lahir dari tombol), draft jurnal untuk pembayaran ditolak disapu, dan memposting tetap keputusan manusia.\n- HPP: pilih metode per usaha, tulis dan bekukan. (GR: rata-rata tertimbang bulanan harga beli aktual, metode sheet dan FIFO ditolak, 26 Sep 2026.) (BS: HPP dibekukan per item saat jual, HPP menu dari komponen, bukan dari harga menu sekarang; sampai rincian bahan diisi, HPP mengikuti sheet berupa angka tetap bertanggal per komponen; paket tambahan dihitung dari susunannya sendiri, mis. matah in jar = 6 porsi sambal plus toples plus stiker, extra ayam suwir = 1/7 ekor tanpa kemasan.) Food cost = HPP / penjualan bersih, target ditulis per usaha (BS: 35 persen). Penjualan bersih = jumlah (qty x harga) dikurangi diskon dan potongan lain yang sah (GR: cashback dipotong dari penjualan bersih, penyebut semua persen margin; baris retur bukan penjualan). Komisi platform dan ongkir yang ditanggung adalah biaya, bukan pemotong omzet (BS: komisi ojol persen per platform dari Pengaturan).\n- Satu rumus harga di DB (GR: harga_untuk(), urutan kontrak, harga khusus, tingkat volume). Harga dan total dokumen tidak pernah dari klien: pesan online selalu dari tabel menu, dan harga nyata dibekukan di baris pesanan saat insert sehingga mengubah harga menu tidak mengubah item lama.\n- Status bayar diset trigger dari jumlah pembayaran, tidak pernah ditulis tangan. Bentuknya dua nilai saja: Belum atau Lunas, tidak ada status \"sebagian\" (GR, 29 Sep 2026); PO wajib diterima lengkap, kiriman kurang berarti ubah qty PO dulu, dan keduanya dikunci di DB. Status pesanan hanya maju lewat satu RPC (BS: baru, diproses, siap, terkirim, selesai, ditambah batal; GR: draf, setujui, proses, kirim, dikirim, selesai, di-set trigger). Persetujuan bayar keluar: diajukan, disetujui, jumlah beku saat diajukan. Pesanan berbayar tidak bisa dihapus atau dibatalkan.\n- Pembayaran tidak boleh melebihi sisa tagihan, dan dokumen yang uangnya sudah bergerak terkunci.\n- Tempo diatur per pelanggan, bukan per segmen: n hari, tanggal bulanan (boleh beberapa), atau mingguan; beli tepat di hari bayar ikut siklus berikutnya (GR, 1 Okt 2026). Tempo tunai ditampilkan ikon berlegenda, tidak pernah kata \"Tunai\".\n- Tutup buku bulanan menolak jurnal ke bulan tertutup. Membuka lagi hanya oleh owner dengan alasan dan jejak audit. Pengecualian vonis: pembagian laba per bulan tidak memakai tombol kunci sama sekali (MBG, 17 Agt 2026), karena kunci yang masuk akal itu menjawab pertanyaan yang akan ditanya lagi (\"kapan angkanya berhenti bergerak?\") dan bagian yang lahir sesudah snapshot menggantung tanpa jalan selesai.\n- Cocok mutasi bank otomatis hanya bila kandidatnya tunggal; yang ambigu diserahkan manusia.\n- Stok tidak boleh minus dan turun lewat trigger; pengecualian hanya lewat izin yang diset owner. Stok awal sekali pakai: diketik owner per barang, tanpa jurnal dan harga, saldo lama ditutup dan dibekukan, barang lewat (tanpa stok) tidak diperiksa kecukupan (GR, 1 Okt 2026). Kuota dan batas jam dijaga DB (BS: pesan online ditolak bila melewati kuota ayam atau batas jam, staf boleh menimpa dengan alasan tercatat).\n- Order bahan hanya lahir dari siklus menu yang sudah final: trigger di DB, definisi final satu rumah (siklus_menu_final), baris siklus yang belum ada dihitung belum final; order lama di periode draft dibiarkan hidup dan disapu harian dengan laporan, tidak dihapus (MBG, 19 Agt 2026: kalender menulis \"terlambat 32 hari\" padahal order sudah submitted).\n- PO tidak boleh dobel: generator menyaring bahan plus hari yang sudah ber-PO aktif di supplier mana pun (bukan hanya supplier ini), trigger menolak draft jadi terkirim bila total melewati qty bulat order (MBG: telur 2.513 butir dipesan ke dua supplier, 20 pasang bahan dan hari). Status PO tak boleh mundur (PO sent padahal 4.748 dari 7.261 sudah diterima; trigger menghitung ulang dan tidak menyentuh yang batal). Tombol kirim WA membaca hasil update dulu. Draf PO yatim (id order dalam array tanpa FK) dijaga trigger. Papan pengawas tally 20 kelas (kosong berarti tally), kelas baru wajib punya kasus uji, dan pembatalan PO historis tetap keputusan manusia.\n- Menu atau pesanan berubah sesudah PO beredar lewat satu pintu dua tahap: pratinjau menulis nol baris dan memulangkan tabel dampak, terapkan menolak bila ada baris bervonis tolak atau status hilir bergeser. Vonis per baris menurut status hilir: belum PO atau PO draft ditulis ulang, PO di tangan supplier jadi revisi (qty berubah, konfirmasi direset, segel ditandai batal tanpa menyentuh hash lama), barang yang sudah ditimbang ditolak karena rencana tidak boleh menghapus fakta gudang. Perubahan bahan mendarat sebagai override per order, tak menyentuh resep yang dipakai tanggal lain. Sebab: edit order_items langsung membuat status kembali draf, PO tidak ikut, hash dokumen tertanda tangan memegang isi lama sehingga verifikasi menyatakan dokumen berubah itu asli, dan tak ada jejak (MBG, 20 Agt 2026).\n- Kurang kirim bukan retur dan tidak melihat kondisi barang: ia peristiwa lain yang wajib bersuara (tabel kurang kirim di layar, sebab masuk invoice lewat satu rumah). Kondisi barang yang dipilih penerima hanya Baik atau Retur (yang diputuskan penerima adalah tindakan, bukan mutu); retur dan kurang kirim jadi lampiran invoice, bukan kolom keterangan. Jumlah invoice dipotong retur yang tidak diganti supplier. Fungsi retur otomatis yang memotong invoice untuk kurang kirim dicabut (jalan 05:45 tiap hari sejak 13 Jul 2026 sampai 13 Sep): gerbang menuntut nol pemanggil di sumber, migrasi benar-benar drop function, dan tak ada migrasi yang menghidupkannya lagi. Tab selisih PO bersumbu dipesan lawan disanggupi (bukan dipesan lawan diterima, yang menjadikan 105 dari 107 baris \"barang belum datang\"), bentuknya data tanpa aksi untuk tab selisih terima, dan membaca tabel hidup (grn_items), bukan tabel jalur mati yang kosong selamanya.\n- Nota supplier yang masuk wajib punya layar yang memvonisnya: kolom status yang hanya ditulis satu arah (menunggu_verifikasi) membuat nota mandek selamanya, dan halaman persetujuan hanya memanen terverifikasi sementara halaman pembayaran tak menyaring status sehingga nota yang sama menagih dengan pil \"Belum Diajukan\" (MBG, 18 Agt 2026). Vonis di dalam popup, dan sebabnya terbaca di kedua layar.\n- Tagihan kembar: nominal sama bukan berarti ditagih dua kali. Supplier mengantar paket sama tiap hari kerja sehingga nota harian bernilai sama; pembedanya hari kirim PO. Panel menyalakan 37 baris curiga padahal nol yang kembar (18 Agt 2026). Nota sekunci jadi satu klaster (bukan pasangan-pasangan: 4 nota melahirkan 6 pasang), uang terancam hanya kelebihannya (nota termahal dianggap sah), dan numeric yang mendarat sebagai string tetap dijumlah, tidak disambung jadi teks.\n- Rantai pembayaran lokal dikunci di tabel, bukan disiplin kode (MBG, vonis 13 Sep 2026: semua pembayaran lokal lewat koperasi): supplier pusat tetap master lama, koperasi mendapat view gabung yang hanya baca; dua kunci beda tipe tetap dua kolom ber-FK plus check (num_nonnulls(...) \\<= 1); uang masuk dan uang keluar dua tabel; tagihan lokal tak punya kolom penunjuk pemasok sehingga tak bisa menagih langsung ke dapur. Penerbit invoice dicap saat insert dan dikunci sesudah draf (dulu dicari saat cetak sehingga invoice lama ganti penerbit begitu tautan pindah). Satu jalur tagih: jalur ganda ditutup sempit (invoice dapur terbit untuk pekan yang punya PO terkirim ke agregatornya), bukan menolak semua invoice dapur beragregator (13.175 dari 13.665 dapur sudah tertaut). Rekening tetap wajib di titik bayar (tolak kosong atau bukan atas nama koperasi); mengubah tujuan transfer uang negara tidak dikerjakan tanpa kalimat pemilik. Order dapur final melahirkan draf PO koperasi otomatis yang selalu draf (kirim keputusan manusia), PO terkirim tak diubah (selisih jadi draf baru), galat sinkron hanya warning.\n- Petty cash harian dengan pagu terhitung dan bukti difoto: pagu = jumlah unit aktif x anggaran bulanan / hari kerja, dibulatkan ke atas ke juta penuh (MBG: SPPG aktif x Rp 8 juta / 20 hari; 4 SPPG jadi Rp 2 juta per hari, 22 jadi Rp 9 juta). Yang menentukan trigger DB: nominal wajib dihitung ulang tiap tulis dari kolom di baris itu, status tak maju ke diambil atau terverifikasi tanpa bukti_url dan nominal_diambil; snapshot jumlah unit, pagu, dan hari kerja disimpan per baris supaya angka lama tak berubah saat unit baru dibuka (17 Agt 2026).\n- Gaji komponen yang bergantung cakupan dihitung fungsi yang membaca cakupan dan dijaga trigger, bukan lump tetap (MBG: gaji tim PIC tiga kali basi, tarif Rp1.400.000 per SPPG, lima lump atas 17 SPPG, padahal 22). Gerbang menjaga rumus dan kedua penjaga tak dicabut migrasi sesudahnya.\n- Pajak: objek dari transaksi riil, bukan ditebak. Tiga invarian dijaga dari SQL migrasi karena logikanya di view: batas 0 persen upah harian diadu ke upah per hari bukan DPP satu periode; draf bukti potong hanya dari baris yang datanya lengkap; kode objek per jenis (MBG: sewa bangunan final 10 persen, sewa kendaraan PPh 23 2 persen). Tiap view pajak baru ditutup dari anon. Pajak final UMKM ikut v1 akuntansi (BS: PPh final).\n- Matriks rantai pasok harian membaca view per hari, panel uang mingguan tetap membaca view per PO. Sebab: target_kirim adalah ember minggu (diisi Senin), bukan tanggal antar (di baris item), jadi tanggal merah memajang kiriman seminggu di kolom Senin dan dua baris divonis macet padahal barang tiba (MBG, 19 Agt 2026).\n- Kategori barang operasional dan norma dihitung dari satu daftar aplikasi dan DB; yang belum ada di katalog dimasukkan dulu, harganya belakangan (MBG, 3 Sep 2026: tiga kategori baru berawalan tiga huruf kapital tanpa angka). Pemicu norma yang tak dikenal RPC menghasilkan qty_hitung NULL diam-diam (case tanpa else) dan layar menyebut \"belum dihitung\".\n- Angka tiap layar dibaca dari satu sumber (BS: v_pesanan_angka, tidak dihitung ulang per tab), dan nilai nol di sel uang tampil redup. Dashboard laporan dikelompokkan per minggu dan per bulan; pesanan impor berstatus Baru bertanggal lewat diimpor sebagai selesai tanpa bayar supaya piutang terlihat, dan keputusan ini perlu diperiksa pemilik (BS: belum diputus).\n- Pelanggan ganda digabung lewat vonis pemilik per kasus dan dicatat sebagai keputusan (GR, SO #389: Warung Gianyar digabung ke SPPG Gianyar, Sapat Ubud ke Tegalalang, 4 Okt 2026); daftar \"belum diputus\" dikosongkan sebelum dianggap selesai. Hal yang belum diputus tidak ditebak.\n- Katering (BS): total paket 10 box atau lebih; pembayaran kasir lewat QRIS statis tanpa gateway, jalur online transfer atau tunai saat diterima, katering boleh DP. Cetak: stiker per box di A4, struk thermal belum v1. Invoice memakai tab tahap proses (tunggakan, daftar, terbit, verifikasi, lunas) dengan periode mingguan, dikelompokkan kategori, wilayah, lalu pelanggan, penanda tangan admin tanpa jabatan, rekening ditulis di invoice (GR).\n- Sejak Pemasok keluar dari PO jadi menu sendiri, sisi jual di baris atas dan sisi beli dan uang di baris bawah (GR: 5 + 5); pembayaran dikelompokkan menurut tujuan bayar (supplier, driver atau gaji, biaya lain), piutang di Invoice, mutasi bank dan rekonsiliasi di Akuntansi. Retur tinggal di rumah jenisnya (PO > Retur ke supplier, Order > Retur dari pelanggan, Stok > Barang Rusak). Harga pasar dicabut utuh dari PO (GR).\n- Satu bahan boleh punya banyak supplier, dan layar wajib memajang semuanya: tabel Bahan Baku berbaris per pasangan (bahan, supplier), satu baris tiap kutipan harga, bukan satu baris per bahan dengan pemenang termurah. Sumber tunggalnya tabel kutipan harga per supplier; kolom supplier di master bahan dan tabel penghubung lama adalah turunan yang dijaga trigger. Menyimpan satu kutipan tidak boleh menyentuh kutipan supplier lain (pola `.eq('item_id', ...).neq('supplier_kode', ...)` haram). Pemilih supplier di Buat PO menyebut harga tiap opsi. Supplier kedua butuh kontrak, bukan bahan baru. (MBG: vonis 13 Agt 2026 \"ini bawang bombai ada di Ferdi Sayur Bumbu, kenapa di Bahan Baku cuma Wildan doang\".)\n- Ember alur bayar hanya untuk yang menunggu pihak luar. Sub-tab \"Daftar Bayar\" sah hanya bila yang ditunggu di luar kendali kita (bahan baku menunggu barang lengkap dan invoice supplier). Kewajiban yang nominalnya sudah pasti tidak punya ember sendiri hanya karena rekeningnya kosong atau bulannya belum dikunci: barisnya tetap Belum Bayar, tombol transfernya yang mati, dan sebabnya tampil sebagai alert berikon di kaki kartu atau, sebagai alternatif, ikon berkode di kolom Aksi yang diterangkan legenda; bukan tabel. Blok sebab hanya sah bila halangannya tak terbaca dari baris datanya sendiri (daftar transfer bagi hasil, tempat baris bisa tertahan karena belum punya baris snapshot). Slot Aksi baris tertahan berwarna merah dengan tanda peringatan, bukan ikon unggah yang diredupkan. Yang bukan transfer sama sekali (bagian anggaran) keluar dari alur jadi grup sendiri; yang belum jadi kewajiban (klaim diajukan) pulang ke tab Persetujuan. Hook `blok-sebab-bayar-hilang.mjs` membaca daftar berkas wajibnya dari assertion di `gerbang-selera.test.ts`. (MBG: vonis 13 Agt 2026 \"kaya gaji ya ga perlu ada Daftarnya ga sih, yaudah Belum bayar aja\"; 14 Agt 2026 \"Belum Jatuh Tempo\" dicabut dari Rutin; 17 Agt 2026 \"ini dijadiin alert aja, icon, gausah sampai dibuat tabel\", lalu \"ini gausah ada alertnya, di kolom aja\".)\n- Akuntansi dan Rekonsiliasi melaporkan uang, tidak membayarkannya: buku besar, neraca, PHU, pajak, pencocokan order dan invoice, bagan akun. Layar yang mengeluarkan uang (bikin atau ubah pos bayar, tombol Bayar, unggah atau verifikasi bukti transfer, tandai lunas) rumahnya cuma Pembayaran, satu tempat. Satu layar tidak berdiri di dua rumah: bila sudah ada di Pembayaran, di Akuntansi ia dibuang (bukan disalin) dan tab lamanya jadi redirect ke record-nya. (MBG: vonis 14 Agt 2026 \"intinya di akuntansi dan rekonsiliasi itu cuma laporan ya, daftarnya; kalo dia ada bayar-bayar gini ya berarti masuknya di bagian pembayaran\".)\n- Pos uang yang berbeda memikul satu alur bayar yang sama, tampilannya ditiru dari yang paling matang. Gaji, Reimbursement, Pengeluaran Rutin, dan Pembagian memakai ambang pindah ember yang sama persis dengan Bahan Baku: Belum Bayar naik ke Verifikasi Pembayaran begitu bukti transfer terunggah (status menunggu), Verifikasi naik ke Lunas begitu buktinya diakui admin, dan bukti yang ditolak pulang ke Belum Bayar alih-alih mengendap di antrean verifikasi. Lapisan tampilan ikut ditiru: kolom No di kiri, kolom Jth Tempo berisi tanggal plus kotak hitung mundur H-n (`<DueCell>`) tepat sebelum kolom uang, strip ember di dalam kartu periode (`<StripEmber>`), dan ikon aksi dari keluarga yang sama. Tenggat bukan karangan per layar: gaji dan bagi hasil jatuh tanggal 5 tiap bulan (`TANGGAL_TRANSFER_BULANAN`), reimbursement jatuh Sabtu minggunya (`tempoMingguan`, direvisi 15 Agt 2026: angka Jumat yang lama salah disalin dari tempo default tabel Per Supplier), dan rutin memakai jadwalnya sendiri sambil melaporkan jatuh tempo terakhir, bukan yang pertama. Di ember Lunas kolom Jth Tempo berganti nama jadi Tanggal Bayar dan isinya jadi tanggal transfer sebenarnya, di kelima tabel termasuk baris anak (baris PO di bawah baris supplier membaca tanggal bayarnya sendiri): tenggat berhenti berarti apa pun begitu uangnya berpindah, dan badge H+n yang tetap tercetak menuduh telat untuk tagihan yang sudah selesai. Kepala kolom yang berganti tanpa selnya ikut berganti (`<DueCell>` tanpa prop `tanggalBayar`) adalah kolom yang judulnya berbohong, dan itu gagal diam. Strip ember hanya dipasang di pos yang tenggatnya benar-benar tersebar; gaji dan pembagian tidak, sebab seluruh barisnya jatuh di tanggal yang sama dan stripnya jadi satu petak berisi dengan empat petak mati (aturan nol ruang menganga). Gerbang `gerbang-alur-bayar-operasional.test.ts`. (MBG: vonis 15 Agt 2026 \"tiru maksimal sistem yang di Pembayaran di Bahan Baku, alurnya prosesnya, informasi yang disampaikan, layoutnya, pemilihan rinciannya\", \"jatuh tempo untuk gajian tuh tanggal 5 setiap bulannya, untuk Pembagian juga tanggal 5\".)\n- Tombol unggah bukti bayar membuka popup yang menyebut ke mana uangnya, tidak langsung pemilih berkas: kartu tujuan transfer (MBG: `components/pembayaran/TujuanTransfer.tsx`) berisi penerima, bank, nomor rekening (tertulis paling besar dengan tombol salin sendiri), atas nama, dan jumlah yang harus ditransfer. Alasannya cara kerja orangnya: yang menekan tombol itu sedang memegang aplikasi bank, dan layar yang cuma meminta foto memaksanya membuka master di tab lain untuk mencari nomor; nomor yang diketik ulang dari ingatan cepat atau lambat salah ketik, dan uang di rekening orang lain tak bisa ditarik balik. Berlaku di kelima pos (Bahan Baku, Gaji, Reimbursement, Pengeluaran Rutin, Pembagian). Rekening yang kosong tidak disembunyikan: tercetak merah \"Belum diisi\". (MBG: vonis 17 Agt 2026 \"unggah bukti bayar maka dia akan keluar pop up, kasih detail jumlah berapa transfer ke bank apa dan nomor rekeningnya berapa\", \"terapkan ke semua yang Pembayaran ya\".)\n- Entitas nonaktif tidak menagih dan kursi kosong tidak digaji: baris penerima terikat entitas yang `aktif=false`, dan baris gaji atau klaim milik master yang `aktif=false`, tidak boleh berdiri di layar yang menyebut uang (Daftar Bayar, Rekonsiliasi Pembagian, matriks Pengeluaran). Yang dilarang menagih, bukan mendaftar: masternya tetap utuh di modal pengelolaan, sebab dari sanalah barisnya hidup lagi begitu entitasnya beroperasi. Bedanya dengan menolkan bobot: baris Rp 0 berpil Belum Bayar tetap terbaca sebagai pekerjaan tertinggal, jadi yang benar barisnya tidak lahir. Penjaga dua sisi wajib sama persis (MBG: `penerimaIkutBayar()` di `lib/bagi-hasil.ts` dan tiga predikat `sppg.aktif` di fungsi SQL pemecah dan pembekuan snapshot). Sebab: MBG 19 Agt 2026, 21 dari 22 SPPG nonaktif dan nol order, tetapi Rp117.150.000 Bagi Hasil Partner dan Rp57.510.000 Dana Kesejahteraan tetap terbit tiap bulan untuk dapur yang belum memasak sepiring pun (\"ini kalau SPPG-nya nggak aktif ya sudah nggak usah keluar di sini dong\").\n- \"Profit\" selalu jual dikurangi beli: harga jual ke pelanggan dikurangi harga beli ke supplier, untung rugi koperasi. Pagu bahan dikurangi tagihan bukan profit dan tak boleh memakai nama itu; ia \"Selisih Pagu\", metrik sendiri yang dicari nol, bukan setinggi mungkin. Sisi beli satu rumah (MBG: view `v_order_item_beli`: supplier utama, lalu label Utama, lalu termurah), dibaca RPC maupun layar. Tiap pemanggil rumus biaya menyebut sisinya (`sisi: 'beli'` atau `'jual'`) lewat `resolveHargaSisi()`, layar yang mengadu biaya dengan pagu selalu sisi jual, dan peran dapur tak masuk daftar boleh-lihat harga beli (daftar TS harus persis sama dengan `can_see_buy_price()` SQL). Sebab: MBG 19 Agt 2026, kartu teratas popup Rincian Profit Harian berbunyi -Rp1.930/PM (pagu dikurangi tagihan) sementara kaki tabel di layar yang sama berbunyi +Rp3.982.025 (jual dikurangi beli): dua angka benar, satu nama, pembaca menyimpulkan hari itu rugi. Gerbang `gerbang-profit-jual-beli.test.ts` (RPC dashboard yang memulangkan kolom bernama profit ditolak, begitu pula `distinct on (sip.item_id)` yang lahir di luar view itu) dan `gerbang-sisi-harga.test.ts`. (Vonis 19 Agt 2026 \"Profit itu adalah Jual - Beli (Margin Koperasi)\", \"yang kaya gitu boleh dibuat Selisih Pagu\".)\n- Satuan itu cara toko menjual, bukan sifat bahannya: satu bahan boleh dijual dengan satuan berbeda di tiap supplier dan satuan itu tak pernah saling ikut. Baris harga per toko memajang satuan miliknya sendiri; satuan master hanya cadangan untuk baris yang belum diisi. Tiap kolom turunan yang membagi harga toko menyamakan satuannya lebih dulu lewat faktor antar-satu
