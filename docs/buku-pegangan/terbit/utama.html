const SUMBER = "Pedoman membangun sistem · selera dan keputusan pemilik\n\n# Buku Pegangan Utama\n\nSatu pedoman utuh untuk membangun dan merawat sistem bisnis: cara kerja, bahasa visual, data dan uang, jalur produksi, sampai bekal proyek baru. Dilebur dari pengalaman MBG Bangka, Gemah Ripah, Betutu Sambe, dan Worth It. Contoh khusus satu proyek ditandai pilnya: MBG GR BS WI\n\nDihimpun 11 Okt 2026\\\nMBG · GR · BS · WI\n\nCari aturan\n\nMulai di sini\n\n[01Onboarding: mulai dari sini](#b01) [02Cara pakai pedoman dan urutan otoritas](#b02) [03Prinsip kerja](#b03) [04Pemutus konflik](#b04)\n\nMenyiapkan mesin dan proyek\n\n[05Memulai proyek baru](#b05) [06Armada agent dan pemilihan model](#b06) [07Koneksi GitHub, Supabase, dan Vercel](#b07) [08Katalog fitur dan modul standar](#b08)\n\nDesain dan tampilan\n\n[09Pemilihan desain](#b09) [10Warna dan merek](#b10) [11Tulisan dan angka](#b11) [12Ikon, chip, legenda, tombol](#b12) [13Tabel](#b13) [14Layout halaman dan navigasi menu](#b14) [15Anatomi dashboard](#b15) [16Form dan input](#b16) [17Gerak dan performa](#b17) [18Produk publik dan anti-slop](#b18)\n\nFitur yang berulang\n\n[19Link eksternal dan halaman tanpa login (Mode B)](#b19) [20WhatsApp dan komunikasi keluar](#b20) [21Ekspor dan dokumen cetak](#b21) [22Mesin ekspor Word, Excel, PDF](#b22) [23AI dan otomasi](#b23) [24Peta dan wilayah](#b24)\n\nData dan uang\n\n[25Data dan database](#b25) [26Uang, akuntansi, dan stok](#b26)\n\nJalur produksi\n\n[27Jalur produksi otomatis: pelunas dan deploy](#b27) [28Deploy dan jalur produksi](#b28) [29Penegakan: hook dan gerbang mekanis](#b29) [30Uji integrasi: perilaku di luar TypeScript wajib diuji sungguhan](#b30) [31Preflight sebelum bilang selesai](#b31) [32Definisi selesai](#b32) [33Katalog ranjau](#b33)\n\nRujukan\n\n[34Resep: langkah demi langkah](#b34) [35Kamus: semua yang pernah dibuat](#b35) [36Riwayat keputusan dan perkara terbuka](#b36)\n\nPresentasi\n\n[37Presentasi dan deck PPT](#b37)\n\nMulai di sini\n\nBab 01\n\n## Onboarding: mulai dari sini\n\nBab ini untuk siapa pun (AI atau orang) yang baru diberi buku ini dan harus langsung bekerja: di mesin baru, proyek baru, atau proyek lama yang baru pertama disentuh. Langkahnya berurutan dan bisa dijalankan apa adanya; rincian tiap topik ada di bab lain dan hanya dirujuk lewat judulnya.\n\n**Pemilik** memutuskan arah produk; kata-katanya yang menentukan, bukan tebakan agent. **Repo sumber** adalah repo matang yang jadi bahan salinan: `pangantara` (MBG, paling lengkap), `gemah-ripah` (toko supplier, ramping), `Betutu Sambe` (F&B), `worth-it` (produk konsumen).\n\n### Untuk AI yang baru diberi buku ini\n\nJangan membaca semuanya. Baca bab yang menjawab tugasmu, berhenti begitu cukup.\n\n| Tugasmu | Baca berurutan |\n| --- | --- |\n| Membenahi app lama | subbab \"Proyek lama yang baru disentuh\", \"Penegakan: hook dan gerbang mekanis\", \"Uji integrasi\", lalu \"Pemilihan desain\" kalau menyentuh tampilan |\n| Membuat proyek baru | subbab \"Proyek baru, hari pertama\", \"Memulai proyek baru\", \"Armada agent dan pemilihan model\", \"Koneksi GitHub, Supabase, dan Vercel\" |\n| Mereview diff atau PR | \"Penegakan: hook dan gerbang mekanis\", \"Uji integrasi\", \"Pemilihan desain\" |\n| Deploy merah, push ditahan | \"Jalur produksi otomatis: pelunas dan deploy\" |\n| Mesin atau akun baru | subbab \"Mesin baru\", lalu \"Koneksi GitHub, Supabase, dan Vercel\" |\n\nSesudah itu, berkas repo (buku ini peta, berkas repo wilayahnya), berhenti begitu cukup:\n\n- `BACA-DULU.md` di akar repo, kalau ada: pintu masuk tunggal.\n- `CLAUDE.md`: fakta dan invarian repo itu; termuat otomatis.\n- Kanon selera `.claude/skills/selera-pinka/references/100-kanon.md`: sekali, sebelum menyentuh tampilan, ekspor, WA, atau otomasi. Di turunan cukup bagian 1 (sepuluh prinsip) dan 4.0 (peraturan kunci).\n- `AGENTS.md`: di `pangantara` hanya bagian 0 (gerbang konteks) dan 1 (tabel router), berkas utuhnya lebih dari 100 ribu karakter; di turunan berkasnya ramping.\n- `ARCHITECTURE.md` (`pangantara`) atau `docs/ARSITEKTUR.md` (turunan): peta modul, tabel, halaman, jadwal.\n- `700-ranjau-deploy.md` (1,7 MB): hanya saat ada yang merah, cocokkan gejalanya, jangan baca utuh.\n\nJangan membaca `docs/BRIEF-TIM-WEBSITE-PINKA/` (sekitar 207 ribu token, salinan untuk manusia): itu memindahkan anggaran dari pekerjaan ke bacaan.\n\nTiga kebiasaan sejak hari pertama: semua teks buatanmu berbahasa Indonesia (istilah teknis dan perintah CLI tetap asli); balasan padat dengan tangga kemalasan (perlu dibuat? sudah ada di repo? stdlib? fitur native? dependensi terpasang? baru kode minimum), dinyalakan hook SessionStart di mesin pemilik; semua kerja ke `main` tanpa branch.\n\n### Empat standar global yang tidak boleh hilang\n\nHidup di `~/.claude/`, berlaku di semua proyek. Yang menahannya bukan berkasnya termuat di konteks, melainkan gerbang mekanis (test atau hook yang menolak pelanggarannya). Aturan tanpa gerbang mekanis dianggap belum jadi.\n\nHanya `RTK.md` yang di-import tiap sesi; sisanya sengaja tidak (DUMMY.md plus INP.md saja sekitar 7,4 ribu token per panggilan, diukur 12 Sep 2026). Empat kalimat yang harus kamu hafal walau berkasnya tidak dibuka:\n\n- Tiap website wajib punya tombol isi data dummy sejak awal: dua ikon, Super Admin saja, isinya ditentukan halaman yang sedang dibuka.\n- Klik tidak boleh membekukan layar. Membungkus seluruh `setState` dalam transition bukan obatnya: chrome kontrol urgent, subtree berat deferred.\n- Tiap perilaku di luar TypeScript wajib punya uji integrasi yang benar-benar menjalankannya. Mock meloloskan kelas bug yang paling mahal.\n- Tiap proyek baru dipasangi armada agent sejak hari pertama. Sub-agent tanpa model tertulis diam-diam ikut Opus.\n\n| Berkas | Buka saat tugasnya | Gerbang yang menahannya |\n| --- | --- | --- |\n| `DUMMY.md` | menyentuh tombol dummy; layar kosong padahal tombol melapor sukses; tabel baru yang dibaca layar bertombol dummy | `gerbang-dummy`, `gerbang-dummy-layar`, `tests/e2e/05-dummy-jejak.sql` |\n| `INP.md` | klik, tab, paginasi, sort yang membekukan layar; overlay INP; kontrol berchrome baru | `gerbang-inp-transisi`, agent `inp-reviewer`, skill `inp-sweep` |\n| `TEST.md` | trigger, constraint, RLS, fungsi SQL, route handler, alur lintas-tabel baru; tergoda memakai mock sebagai bukti | `gerbang-test-integrasi`, `tests/e2e/cakupan.json` |\n| `FITUR.md` | proyek baru, modul besar, menilai \"apa yang belum ada\" | katalog, bukan aturan |\n| `AGEN.md` | proyek atau repo GitHub baru; sub-agent jalan di Opus | hook `armada-agent-proyek.mjs`, env `CLAUDE_CODE_SUBAGENT_MODEL`, `gerbang-model-agent`, `gerbang-ilmu-agent` |\n\n#### Isi pokok tiga standar pertama\n\n**DUMMY.md** (29 Agt 2026, diperluas 30 Agt). Enam syarat: (1) yang diisi periode yang terpampang, bukan hari ini, dan periode yang hidup di state komponen didaftarkan ke satu rumah yang bisa dibaca perkakas luar; (2) gerbang \"sudah ada\" menghitung baris yang masih hidup dan per periode; (3) angka lahir dari rantai sungguhan, bukan konstanta; (4) tiap ember status terisi minimal satu; (5) semua fitur ikut terisi, dibuktikan dengan memanggil fungsi atau endpoint penyuap layar dan memastikan tiap kolom bukan nol; (6) layar muat ulang penuh sesudah isi dan hapus. Sebab butir 3: 29 Agt 2026, 30 penerima karangan di dapur 2.272 orang membuat profit negatif dan dilaporkan sebagai bug rumus. Tiga kelas gagal senyap (30 Agt 2026: 113 dari 143 tabel tak pernah diisi): A, tabel dibaca banyak halaman tapi ditulis satu modul; B, dua sisi yang dibandingkan layar disamakan sehingga selisih selalu nol; C, buku langkah mencatat fungsi yang melahirkan nol baris (harus dicabut dari buku). Arsitektur: `dummy_rantai(modul)` mengembalikan daftar fungsi pengisi hulu ke hilir, `dummy_isi(modul, ...)` satu loop tanpa `elsif`.\n\n**INP.md** (26 Agt 2026). Yang diukur waktu sampai piksel berubah, bukan lamanya handler. Pisahkan chrome (pil aktif, chevron, panah sort, `aria-expanded`, urgent) dari isi (deferred). Obat menurut tempat state tinggal: tanpa chrome, callback di transition; kontrol dengan `children`, `useDeferredValue`; state di parent (tab, paginasi, cari), echo lokal urgent plus parent deferred; `usePathname()`, echo jalur plus `router.push` deferred. Kelas kelima: cat tidak pernah datang, serahkan kerja deferred sesudah satu frame tercat (dua `requestAnimationFrame`) di rumah perkakas transisi. Repo baru: satu rumah perkakas (`components/ui/transisi.ts`) sebelum halaman kedua, gerbang sejak awal walau daftarnya kosong, sapuan `inp-sweep` saat halaman lewat sepuluh.\n\n**TEST.md** (23 Agt 2026). Lapisan menurut letak logika: fungsi murni diuji unit biasa; trigger, constraint, RLS, RPC diuji SQL langsung dalam transaksi ber-ROLLBACK; route handler diuji dengan memanggil handler-nya; alur lintas-tabel (uang, stok) satu uji end-to-end. Saat menyalin: runner yang membungkus transaksi, berhenti di error pertama (`ON_ERROR_STOP`), registri `tests/e2e/cakupan.json` (`diuji`, `dikecualikan` berikut alasan, `antre` yang hanya boleh menyusut), jangan jalan tiap push. Asersi berupa invarian, bukan potret data. Rincian di bab \"Uji integrasi\".\n\n**FITUR.md dan AGEN.md.** `FITUR.md` adalah katalog bentuk sistem: yang lahir belakangan mahal, jadi sepuluh rumah tunggal dibuat sebelum halaman kedua (bab \"Memulai proyek baru\"). `AGEN.md` (28 Sep 2026): model sub-agent ditentukan berurutan oleh parameter `model` di panggilan, frontmatter `model:` di `.claude/agents/<nama>.md`, env `CLAUDE_CODE_SUBAGENT_MODEL`, lalu ikut sesi induk. Sebab: Gemah Ripah sempat menjalankan empat agent Opus sekaligus karena tugas latar jatuh ke `general-purpose`.\n\n### Mesin baru\n\nSatu pintu: `bekal/mesin-baru.sh`.\n\n```\n# manusia dulu: Homebrew (brew.sh), git, login GitHub lewat HTTPS\nbrew install gh && gh auth login            # pilih HTTPS, bukan SSH\ngit clone https://github.com/mbgbangkabelitung/pangantara.git ~/Documents/GitHub/pangantara\ncd ~/Documents/GitHub/pangantara\n\nbash bekal/mesin-baru.sh cek                # lapor yang kurang, nol perubahan\nbash bekal/mesin-baru.sh pasang kerja       # kerja | 24jam | panen\nbash bekal/mesin-baru.sh cek                # wajib nol baris [KURANG]\n```\n\nGit di sini tidak memakai kunci SSH: `gh auth login` HTTPS menyimpan kredensial dan `git push` memakainya. (`bekal/BACA-DULU.md` masih mencontohkan clone SSH; yang benar HTTPS.)\n\nPeran menentukan cakupan: `kerja` (laptop pemilik) memasang prasyarat, lapisan global, env, MCP; `24jam` (mesin tidak tidur) menambah launchd penjaga, caffeinate, remote control; `panen` (Mac mini) menambah pemanen Radar MBG, OCR, wa-gateway.\n\nUrutan `pasang`: (1) `claude` CLI dan `cavemem` lewat `npm i -g`, lalu `gh`, `supabase`, `rtk`, `libpq`, `tmux` lewat `brew install`; (2) `npm ci` dan `.env.local` dari `.env.example` (nilainya diisi manusia); (3) `bekal/pasang.sh` untuk lapisan global; (4) peran 24jam dan panen menambah `scripts/mesin/pasang-mesin-24jam.sh` dan `scripts/radar-mbg/pasang.sh` (sidecar `ocr-server/`, `wa-gateway/` punya README sendiri); (5) `npm run kg:build`; (6) `cek` otomatis. Sebab: 11 Sep 2026, lapisan terpasang setengah terlihat bekerja dan diam-diam berhenti belajar.\n\n`bekal/pasang.sh` mem-backup `~/.claude` lama ke `~/.claude-backup-<stempel>`, menyalin aturan, hooks, agents, skills, scheduled-tasks, dan `~/.agents`, lalu mengisi `settings.json` dari `settings.json.template` dengan path mesin ini (placeholder `__HOME__`, `__REPO__`). `mesin-baru.sh` menjawab \"y\" otomatis, jadi file bentrok ditimpa. Skill tertaut disimpan sebagai daftar nama `skills-tertaut.txt`, bukan symlink, dan nol path `/Users/<akun>` boleh ada di `bekal/global/`. Sebab: 12 Sep 2026 path repo yang dieja tangan mati dua kali dan gagal senyap.\n\n#### RTK, hook global, settings\n\n- **RTK** (`~/.claude/RTK.md`, biner `rtk`): proxy CLI hemat token; hook `rtk hook claude` menulis ulang perintah bash (`git status` jadi `rtk git status`). Cek `rtk --version` dan `rtk gain` (kalau gagal, mungkin paket lain bernama sama yang terpasang). Hanya perintah tunggal yang dicegat: satu perintah per panggilan Bash.\n- **Hook di `~/.claude/settings.json`** (nama dan fungsi):\n\n| Event | Hook | Fungsi |\n| --- | --- | --- |\n| PreToolUse Bash | `rtk hook claude`, `block-heavy-tests.sh` | tulis ulang perintah; tolak full suite dari sesi Claude |\n| PreToolUse Edit, Write, Bash, apply_migration | `mbg-gerbang-luar-repo.mjs` | gerbang penyuntingan di luar repo |\n| SessionStart | `caveman-activate.js`, `ponytail-activate.js`, `armada-agent-proyek.mjs`, cavemem | dua mode kerja; ingatkan repo tanpa armada agent |\n| UserPromptSubmit, SubagentStart | `*-mode-tracker.js`, `ponytail-subagent.js` | catat mode; tangga kemalasan ke subagent |\n| Stop | `auto-commit-push.sh` milik repo | commit dan push akhir giliran lewat gerbang |\n\n- **Settings**: `env.CLAUDE_CODE_SUBAGENT_MODEL=sonnet` (alias, selalu Sonnet terbaru), `permissions.defaultMode=bypassPermissions` (pilihan pemilik, tanpa dialog izin; turunkan dulu kalau mesin dipakai orang lain), `mcpServers.cavemem`.\n- **Zona waktu mesin wajib `Asia/Jakarta`** (cron jam WIB): `sudo systemsetup -settimezone Asia/Jakarta`.\n\n#### Cara memastikan berhasil\n\n`cek` mencetak tiap butir sebagai ada, `[KURANG]`, atau `[MANUSIA]`, lalu \"LENGKAP\" atau \"KURANG N hal\" (kode keluar 0 hanya kalau nol kurang). Yang diperiksa: prasyarat CLI, zona waktu, lapisan repo, git (`gh auth`, `origin` HTTPS), lapisan global (aturan, hook, symlink skill tidak menggantung), launchd dan radar (peran terkait), butir terikat akun. `[MANUSIA]` bukan kegagalan skrip, itu tugasmu karena tidak ada berkas yang bisa membawanya: login Claude Code (`claude`); konektor Supabase dan Vercel di claude.ai (tanpa CLI `vercel`; MCP-nya yang dipakai); MCP scope user (`claude mcp add --scope user --transport http browseros-neo http://127.0.0.1:9010/mcp`); secret GitHub Actions (`APP_BASE_URL`, `CRON_SECRET`, `SYNC_PAT`, kredensial Supabase); Environment Variables Vercel; Claude.app dan BrowserOS neo.app diunduh manual. Rincian di bab \"Koneksi GitHub, Supabase, dan Vercel\". Tiga jebakan: **satu pemicu per repo**, menghidupkan routine atau launchd di mesin baru berarti mematikan yang sama di mesin lama (sebab: 27 Agt 2026, dua mesin menjadwalkan malam yang sama); **bundel tertinggal dari mesin pemilik**, dicek 7 Okt 2026 `bekal/global/` belum membawa `AGEN.md` dan hook `armada-agent-proyek.mjs`, jadi di mesin baru salin dari mesin lama atau perbarui bundel dulu, kalau tidak pengingat armada tidak menyala; **path lama**, `grep -n mbg-kdmp ~/.claude/settings.json` sesudah pasang hanya boleh menyisakan dua entri `mbg-kdmp-babel`.\n\n### Proyek baru, hari pertama\n\nSemua ini dikerjakan sebelum halaman kedua lahir: ongkos sebuah fondasi ditentukan oleh jumlah halaman yang sudah lahir tanpa dia. Isi sepuluh rumah tunggal dan ember fitur hari pertama ada di bab \"Memulai proyek baru\"; di sini hanya urutan operasinya.\n\n#### 1. Buat repo: satu repo per usaha, branch cuma `main`\n\n```\ncd ~/Documents/GitHub\ngh repo create pangantara/<nama-usaha> --private --clone\ncd <nama-usaha> && git branch -M main\n```\n\nSatu repo, satu proyek Supabase, satu proyek Vercel per usaha. Pilih nama tanpa spasi. Push ke `main` membangun produksi tanpa branch protection, jadi yang menilai cuma gerbang push.\n\n#### 2. Cangkok dari sumber terdekat, bukan fondasi ulang\n\nKeputusan pemilik (Worth It, 3 Okt 2026): cangkok, bukan fondasi ulang.\n\n| Usaha | Cangkok dari |\n| --- | --- |\n| perdagangan, stok, invoice | `gemah-ripah` (titik mulai yang disarankan, tanpa knowledge graph) |\n| F&B | `Betutu Sambe`, plus cetak biru `pangantara/bekal/global/FNB.md` |\n| produk konsumen berlogin | `worth-it` |\n| rantai besar yang butuh knowledge graph | `pangantara` |\n\n```\nrsync -a --exclude node_modules --exclude .next --exclude .git \\\n  --exclude '.env*' --exclude tsconfig.tsbuildinfo \\\n  ~/Documents/GitHub/gemah-ripah/ ./\nln -s ../../../pangantara/.claude/skills/selera-pinka .claude/skills/selera-pinka\n```\n\nDibawa: kerangka Next.js, UI kit, `lib/`, auth, gerbang uji, husky, CI, armada agent. Tidak: modul domain sumber (GR: konsep SPPG, KDMP, dapur, jenjang, BGN dari `pangantara` tidak ikut). Ganti identitas: `lib/usaha.ts` (env `NEXT_PUBLIC_USAHA_*`), palet di `app/globals.css`, peran di `lib/types.ts` dan `lib/rbac.ts`, lalu hapus halaman dan tabel domain sumber. Symlink `selera-pinka` butuh `pangantara` ter-clone bersebelahan. Lalu buat Supabase dan Vercel baru, region fungsi sama dengan DB, Node sama di `.nvmrc`, `engines`, CI, dan Vercel (bab \"Koneksi GitHub, Supabase, dan Vercel\").\n\n#### 3. Tulis `CLAUDE.md` proyek\n\nKerangkanya di subbab terakhir. Tiga bagian tidak boleh kosong sejak hari pertama: \"Sudah diputus pemilik\", \"Belum diputus pemilik\" (tulis \"kosong\", jangan dibuang), dan \"Armada agent dan model\".\n\n#### 4. `BACA-DULU.md` dan penunjuk untuk perkakas lain\n\nPola `pangantara`: `BACA-DULU.md` memuat urutan baca, aturan tak bisa ditawar, peta berkas mana menjawab apa, pemasangan mesin, dan bagian \"kalau AI-nya bukan Claude Code\" (tugas pengganti hook). Berkas lain cuma menunjuk, tidak menyalin isi, supaya tidak ada salinan kedua yang diam-diam basi: `AGENTS.md` (Codex, Cursor, Amp, Jules), `GEMINI.md`, `.cursorrules`, `.github/copilot-instructions.md`. Per 7 Okt 2026 turunan (GR, BS, Worth It) belum punya `BACA-DULU.md` dan tiga penunjuk terakhir; `AGENTS.md` mereka memuat DNA agent. Kalau akan disentuh perkakas lain, salin pola `pangantara`.\n\n#### 5. Husky dan gerbang\n\nSalin `.husky/`, blok `lint-staged` di `package.json`, `.github/workflows/ci.yml` dan `e2e-db.yml`, dan gerbang di `tests/unit/` (bab \"Penegakan: hook dan gerbang mekanis\"), lalu `npm ci && npm run prepare`.\n\n- `pre-commit`: `npx --no-install lint-staged` saja.\n- `pre-push`: `npm run typecheck`, `npm run lint`, `npm test` berurutan; gagal berarti push dibatalkan, commit aman; bypass darurat `git push --no-verify`. Sebab: di `pangantara` 17 dari 18 run CI merah gagal di langkah Test; Vercel tidak menjalankan test.\n- Gerbang dasar disalin sejak awal walau daftarnya kosong: `gerbang-deploy`, `gerbang-model-agent`, `gerbang-ilmu-agent`, `gerbang-inp-transisi`, `gerbang-dummy`, `gerbang-dummy-layar`, `gerbang-test-integrasi`.\n\n#### 6. Armada agent\n\n```\nnpm run agents:build       # roster.json menjadi .claude/agents/*.md, kerangka ilmu, KATALOG.md\nnpm run agents:check       # katalog segar?\nnode scripts/agents/ilmu.mjs pemilik <berkas>    # siapa pengerja pemilik berkas ini\n```\n\nUrutannya dari `AGEN.md`: (1) env `CLAUDE_CODE_SUBAGENT_MODEL` di `.claude/settings.json` repo; (2) salin mesin armada `scripts/agents/build.mjs`, `ilmu.mjs`, `roster.json` dan skrip `agents:build`, `agents:check`; (3) roster awal: pengerja per modul (Sonnet, tiap berkas tepat satu pemilik lewat glob `milik`), platform (`tukang-layar`, `db-migrator`, `penulis-e2e`, `penulis-gerbang`, `pelunas`, `mekanik-mesin`), pemeriksa pola (Haiku) dan nalar (Sonnet); (4) ilmu tiap agent di `.claude/ilmu-agent/<nama>.md`, minimal 2.000 karakter dari kode nyata, ditulis agent Sonnet paralel; (5) `AGENTS.md` ramping. Hook `armada-agent-proyek.mjs` mengingatkan di SessionStart kalau ada yang belum. Detail di bab \"Armada agent dan pemilihan model\".\n\n#### 7. Buku Pegangan proyek dan routine pembarunya\n\nTiap proyek punya artifact Buku Pegangan sendiri (BS: bukan milik GR). Di repo `docs/BUKU-PEGANGAN/` berisi `buku-pegangan-<kode>.html`, `ARTIFACT.json` (`url`, `terakhir_disegarkan` berisi commit dan tanggal, `sumber_dalam_git`, `sumber_luar_git`), dan `ROUTINE.md`. Terbitkan halaman awal lewat tool Artifact dan catat `url`-nya. Salin `ROUTINE.md` dari sumber (baca stempel, cari perubahan, pilah vonis selera dan keputusan pemilik, tambah satu butir bertanggal di puncak `ol.riwayat`, hari sepi berhenti tanpa menulis): terbitkan ulang ke url yang sama (tanpa `url` lahir halaman kedua dan pemegang tautan lama tak terbarui). Daftarkan routine `pembaru-buku-pegangan-<kode>` dengan jam digeser sekitar 20 menit dari proyek lain (MBG: 21:07 WIB; GR: 21:27 WIB), prompt tipis yang menunjuk `ROUTINE.md` (sebab: 31 Agt 2026, prosedur yang hidup hanya di prompt tidak ikut `git clone`).\n\n#### 8. Tombol dummy\n\nSejak modul pertama (master data): dua ikon di bingkai halaman yang sama, Super Admin saja; `dummy_rantai` dan `dummy_isi` di DB dengan satu fungsi pengisi; jejak dummy lewat trigger; `gerbang-dummy` dan `gerbang-dummy-layar`. Buka `DUMMY.md` sebelum menulis fungsi pengisi pertama.\n\n#### 9. Definisi siap hari pertama\n\nProyek siap menerima halaman kedua kalau semuanya benar:\n\n- \\[ \\] Satu repo satu usaha, hanya `main`, `origin` HTTPS, push pertama lolos pre-push dan CI hijau.\n- \\[ \\] Identitas sudah diganti, modul domain sumber dibuang, ref proyek sumber tidak ada di env; region dan Node seragam.\n- \\[ \\] `CLAUDE.md` terisi, termasuk \"Belum diputus pemilik\" untuk semua yang masih harus ditanyakan.\n- \\[ \\] Sepuluh rumah tunggal ada (bab \"Memulai proyek baru\") dan gerbang dasar hijau, termasuk `gerbang-deploy`.\n- \\[ \\] `npm run agents:check` hijau; `npm run test:e2e:db` dan `tests/e2e/cakupan.json` ada.\n- \\[ \\] Tombol dummy tampil untuk Super Admin dan mengisi halaman yang dibuka.\n- \\[ \\] Buku Pegangan terbit, `ARTIFACT.json` berisi url-nya, routine pembaru terdaftar di satu mesin saja.\n\n### Proyek lama yang baru disentuh\n\n- Baca `CLAUDE.md` dan `BACA-DULU.md` (kalau ada). Bagian \"Sudah diputus pemilik\" tidak dinegosiasi ulang.\n- **Pemetaan.** Panggil agent `pemeta-sistem` (global, `~/.claude/agents/pemeta-sistem.md`): ia mempelajari repo lalu memetakannya ke katalog `FITUR.md`: apa yang sudah ada, hilang, menyimpang, dan pola yang layak dibawa. Bukan untuk review diff (`code-review`) atau audit over-engineering (`ponytail-audit`); audit empat fase berbukti: skill `audit-teknis`.\n- **Knowledge graph** (hanya `pangantara`; di Gemah Ripah orientasinya `docs/ARSITEKTUR.md` dan `node scripts/agents/ilmu.mjs pemilik <berkas>`):\n\n```\nnpm run kg:check                      # graph segar? basi berarti npm run kg:build\nnpm run kg -- \"<kata kunci tugas>\"    # subgraph relevan: berkas, tabel, tetangga\nnpm run kg -- --impact <berkas>       # radius ledak sebelum menyentuh berkas\nnpm run kg -- --domain <domain>       # tugas lintas satu domain penuh\nnpm run kg -- --diff HEAD             # sesudah kerja: radius yang benar-benar terjadi\n```\n\nJangan `Read`, `Grep`, `Edit`, atau `Write` sebelum `npm run kg`; baru `Read` berkas yang muncul di hasil. `kg/graph.json`, `kg/PETA.md`, `kg/peta.html` hasil generate, jangan disunting tangan (kecuali `scripts/kg/flows.json`). Graph dan kode berselisih: kode menang.\n\n- **Kontrak anti-drift.** Sebelum edit pertama, tulis empat baris ini; kalau tak bisa mengisinya, kamu belum paham tugasnya, query lagi:\n\n```\ncakupan    : <node KG yang boleh disentuh, id persis>\ndi luar    : <yang sengaja tidak disentuh walau menggoda>\nradius     : <hasil --impact: berapa modul dan permukaan runtime ikut jebol>\nbukti siap : <perintah yang akan membuktikan ini jalan>\n```\n\nNode di luar cakupan tidak diedit; bug lain di jalan dicatat, bukan dibelokkan. Radius lebih dari 20 modul berarti berhenti dan konfirmasi ke manusia (`lib/rbac.ts` menjebol 607 modul, 12 Sep 2026). Perluasan cakupan harus eksplisit. Selesai kerja: `npm run kg:build`.\n\n- **Ranjau orang baru**: PostgREST memotong respons di 1000 baris tanpa error (pakai `ambilSemua()` dengan `.order('id')`); `lib/database.types.ts` basi membuat gerbang berbohong (`npm run types:supabase` sesudah migrasi diterapkan ke remote); penjagaan hidup di database, bukan hanya di halaman; migrasi ke Supabase Babel tidak pernah auto-apply, sedangkan DB MBG Bangka boleh setelah cek drift (`npm run drift:db`) dan SQL aman-idempoten (izin pemilik 12 Agt 2026).\n- **Kalau ada yang merah**, cocokkan gejalanya di `700-ranjau-deploy.md` bagian 3 dan baca bab \"Jalur produksi otomatis: pelunas dan deploy\". Tiap kegagalan ditutup tiga lapis: perbaiki, catat, pasang gerbang.\n\n### Kerangka CLAUDE.md proyek\n\nBentuk tiga turunan (Gemah Ripah, Betutu Sambe, Worth It); `pangantara` menambah gerbang konteks KG dan kebijakan test karena skalanya. Ganti isi dalam kurung siku; tulis nama variabel env saja, jangan nilainya.\n\n```\n# CLAUDE.md: <Nama Proyek>\n\n<Satu paragraf: sistem apa, milik siapa, untuk siapa. Satu repo per usaha.\nPeta modul ke tabel ke halaman ke jadwal: `docs/ARSITEKTUR.md`.>\n\nFondasinya disalin dari <repo sumber> (<tanggal>). Konsep <domain sumber>\ntidak ikut dan jangan dibawa masuk.\n\n## Kanon selera: baca sebelum menyentuh tampilan\n\n`.claude/skills/selera-pinka/references/100-kanon.md` bagian 1 dan 4.0\n(symlink ke repo `pangantara`, bukan salinan). Yang tidak berlaku di sini:\n<palet, kop, istilah domain sumber>.\n\n## Infrastruktur\n\n| Hal      | Nilai |\n| -------- | ----- |\n| Supabase | proyek \"<nama>\", ref `<ref>`, `<region>`. Bukan <ref proyek sumber> |\n| Vercel   | tim `pangantara`, proyek `<nama>`, region fungsi `hnd1` (sama dengan DB) |\n| GitHub   | `pangantara/<nama>`, `main` = produksi (auto-deploy tiap push) |\n| Zona     | WIB; cron di `vercel.json` ditulis UTC (WIB dikurangi 7) |\n| Node     | <versi> (`.nvmrc`, `engines`, CI, Vercel wajib sama) |\n| Env      | <NAMA_VARIABEL saja> |\n\n## Stack & perintah\n\nNext.js 15 App Router + TypeScript + Supabase + Tailwind 3, npm.\n`npm run dev · build · typecheck · lint`; test tertarget per berkas\n(full suite diblokir hook); `npm run test:e2e:db`; `npm run types:supabase`\nsesudah migrasi diterapkan ke remote; `npm run agents:build`.\n\n## Peran\n\n<Daftar peran; satu peta `lib/rbac.ts` untuk nav dan guard.>\n\n## Invarian\n\n- Tiga lapis penjagaan: `middleware.ts` mengarahkan; `requireStaff()` di tiap route; RLS dan trigger di DB.\n- Tabel besar lewat `ambilSemua()`; `lib/database.types.ts` generate.\n- Uji integrasi wajib (`TEST.md`); aturan tanpa gerbang belum jadi.\n- <invarian domain: satu rumus uang, dst>\n\n## Sudah dibangun\n\n<Jujur, bertanggal audit.>\n\n## Sudah diputus pemilik\n\n1. <Merek.> 2. <Peran.> 3. <Aturan hitung: HPP, margin, pajak.>\n\n## Belum diputus pemilik\n\n<Pertanyaan terbuka untuk pemilik, atau \"(kosong)\". Jangan dibuang.>\n\n## Git & gaya\n\nSemua kerja ke `main`. Commit lowercase deskriptif bahasa Indonesia, per batch.\nBalasan padat.\n\n## Armada agent & model\n\nDNA agent: `AGENTS.md`. Armada <N> agent dari `scripts/agents/roster.json`\n(`npm run agents:build`); sebelum kerja di sebuah berkas:\n`node scripts/agents/ilmu.mjs pemilik <berkas>`. Sub-agent default Sonnet lewat\n`env.CLAUDE_CODE_SUBAGENT_MODEL`; pengerja `sonnet`, pemeriksa pola `haiku`;\n`opus` per panggilan hanya untuk alur uang, trigger atau RLS, migrasi berisiko.\nGerbang: `gerbang-model-agent` + `gerbang-ilmu-agent`. Buku Pegangan:\n`docs/BUKU-PEGANGAN/`.\n```\n\nAgent yang menemukan celah menaruhnya di \"Belum diputus\", bukan memutuskannya sendiri. (MBG: author commit dan `\"regions\": [\"hnd1\"]` dikunci `gerbang-deploy`.) (GR: penggabungan Warung Gianyar ke SPPG Gianyar, 4 Okt 2026, tercatat berikut nama migrasinya.)\n\nBab 02\n\n## Cara pakai pedoman dan urutan otoritas\n\n### Apa pedoman ini dan untuk siapa\n\n- Pedoman ini satu buku utuh untuk membangun app bisnis internal milik pemilik, dilebur dari empat buku proyek dan disusun per topik, bukan per proyek: MBG Bangka (pangantara, kokpit koperasi dan dapur gizi nasional, buku terbesar), GR Gemah Ripah (toko supplier telur, ayam, susu), BS Betutu Sambe (ayam betutu Bali, dapur pusat dan outlet), WI Worth It (penilai harga barang bekas dan properti, produk konsumen publik).\n- Isinya bukan selera abstrak. Ia kesimpulan dari tiap kali sesuatu meledak lalu jadi aturan (MBG: 1.276 commit dan 198 migrasi sampai 26 Sep 2026). Bila sebuah usulan bertabrakan dengan pedoman ini, usulannya yang dianggap salah sampai pemilik berkata lain.\n- Untuk onboarding: AI atau orang baru cukup membaca pedoman ini lalu langsung bisa membangun. Tiap butir adalah aturan yang berlaku di proyek apa pun; nilai dan komponen konkret (`RpCell`, `BarisGrupTabel`) hanyalah contoh. Hal yang cuma berlaku di satu proyek ditandai dalam kurung berawalan kode proyek: \"(MBG: ...)\", \"(GR: ...)\", \"(BS GR: ...)\".\n- Kalimat \"Sebab:\" di sebuah butir adalah insiden yang melahirkannya, lengkap dengan tanggal dan angka. Ia bukan hiasan: aturan yang sebabnya hilang akan dilonggarkan oleh orang berikutnya yang tidak tahu harganya.\n- Bila dua buku berbeda, yang menang ditulis berikut vonisnya, dan versi yang gugur diringkas satu kalimat supaya tidak dihidupkan lagi tanpa sengaja.\n\n### Siapa menang bila bertabrakan\n\n- Urutan otoritas dari atas: (1) kata pemilik, langsung di chat atau tercatat bertanggal di bagian Keputusan pemilik tiap buku proyek; (2) kanon proyek, yaitu berkas selera lengkap di repo (MBG, GR, BS memakai satu kanon bersama di `.claude/skills/selera-pinka/`, WI memakainya lewat symlink); (3) buku pegangan proyek, halaman ringkasan yang diperbarui otomatis; (4) pedoman ini sebagai default proyek baru dan jembatan antarproyek.\n- Pemilik di atas semuanya. Keputusan berstatus Diputus tidak dibuka lagi tanpa pemilik; yang berstatus Belum diputus tidak ditebak, ditanyakan. Dua vonis pemilik berbeda tanggal: yang terbaru menang, dan sejarahnya tetap ditulis (MBG: vonis 8 Sep 2026 \"kepala kartu wilayah gelap, tulisan putih\" membalik vonis 6 Sep 2026 yang meminta latar subtle; keduanya tercatat).\n- Ringkasan kalah dari sumbernya. Bila pedoman ini atau buku proyek berbeda dengan kanon di repo, kanon yang menang dan ringkasannya diperbaiki. Bila graph kode berbeda dengan kode, kode menang dan graph dibangun ulang, tidak pernah sebaliknya, dan hasil generate tidak disunting tangan.\n- Proyek yang sudah berjalan tunduk pada kanon dan buku proyeknya sendiri sejauh vonis bertanggal. Proyek baru memakai pedoman ini, lalu mencatat vonis pemiliknya sendiri di buku proyek barunya.\n- Bentrok selera antarproyek diputus satu kali lalu berlaku di semua proyek. Bila tak ada vonis yang lebih baru, selera GR 26 Sep 2026 (\"ikut GR\") menjadi penentu. Layar yang punya padanan di proyek saudara dipasangkan dan kekurangannya dibereskan sebelum pemilik menemukannya sendiri (BS: spec paritas, 3 Okt 2026).\n- Nomor peraturan hanya sah bila kanon yang memberinya. Nomor yang sudah terpakai tidak didaur ulang. Sebab: MBG sempat menomori sendiri lima vonis 8 Sep 2026 dengan 116 sampai 120, bentrok dengan 116 sampai 119 milik kanon yang isinya lain; sebelum menyebut nomor, adu dulu ke kanon. Pedoman ini sengaja menyebut aturan lewat isinya, bukan nomornya.\n- Daftar aturan boleh bertambah dan memang bertambah (MBG: 10 saat ditulis, 16 pada sore yang sama, 79 beberapa hari kemudian, lebih dari 140 per 26 Sep 2026). Judul daftar tidak menyebut angka, sebab daftar bernama \"sepuluh aturan\" berbohong pada aturan kesebelas, dan yang paling sering dilanggar justru yang terbaru.\n\n### Ikut GR: sepuluh benturan diputus ke sisi GR\n\nVonis pemilik 26 Sep 2026, \"Ikut GR\". Sepuluh benturan antara kanon MBG dan vonis GR diputus ke GR dan komponen bersamanya dibalik hari itu juga. Rinciannya ada di bab masing-masing; ringkasnya:\n\n- Tabel lebar digulir ke samping dengan kolom pertama menempel, bukan dikecilkan dan dipotong (bab Tabel).\n- Nol baris kedua kecuali sel teks bebas lewat `sel-bungkus` (bab Tabel dan Tulisan dan angka).\n- KPI putih satu warna, nada hanya di angkanya (bab Layout halaman).\n- Subtotal grup duduk di bawah kolomnya sendiri, nama grup tanpa elipsis dan tanpa lencana cacah (bab Tabel).\n- Legenda satu baris (bab Ikon, chip, legenda, tombol).\n- Tutup buku bulanan yang dikunci DB oleh owner, beralasan dan berjejak audit, boleh lagi (bab Uang, akuntansi, dan stok).\n- Persen lewat `PersenSel` satu desimal, rata kanan, menggantikan persen dipusatkan 25 Agt 2026.\n- Tanggal sel lewat `TanggalSel` tanpa koma.\n- Nol elipsis di sel tabel maupun grafik.\n- Tiap halaman daftar punya satu `RingkasanCard` default tertutup dengan ekspor di `CariExportBar`, tidak di dalam kartunya.\n- Mekanismenya ratchet, bukan pemblokir. Sebab: ratusan layar lama MBG masih berbentuk lama; menolak semuanya sekaligus berarti ratusan layar berubah tanpa satu mata melihat hasilnya. Tiap berkas punya jatah di `utang-ikut-gr.json` yang cuma boleh turun, layar baru lahir bersih (gerbang `gerbang-ikut-gr.test.ts`).\n\n### Tiga lapis: L1, L2, L3\n\n- L1 DNA visual: bahasa visual dan keputusan produk proyek itu (MBG: `200-rincian-selera.md`, 200 butir). Otoritas tertinggi di lingkup proyeknya.\n- L2 Struktur: anti-slop, hierarki, aksesibilitas, larangan pola generik AI (MBG: `300-anti-slop-frontend.md`). Berlaku di mana L1 diam.\n- L3 Gerak: gate frekuensi, easing, durasi, gesture (MBG: `400-craft-gerak.md`). Tidak pernah mengubah bahasa visual.\n- L1 di atas L2 dan L3 untuk apa pun yang terlihat. Untuk cara bergerak, L3 di atas L2.\n- Pemutus konflik antara skill selera generik dan aturan proyek: skill selera kalah setiap kali larangannya menyasar elemen yang di proyek punya fungsi operasional, dan menang bila elemennya dekorasi. Ujinya satu pertanyaan: kalau elemen ini dihapus, adakah orang yang kehilangan informasi untuk memutuskan sesuatu? Kamus vonis konflik lengkap ada di bab Pemutus konflik.\n\n### Mode A, B, C dan dial V, M, D\n\nTentukan mode sebelum menulis kode. Salah membaca mode adalah sumber terbesar redesign jelek; bila ambigu, tanya sekali.\n\n| Mode | Cakupan | Dial V / M / D | Memimpin |\n| --- | --- | --- | --- |\n| A | App internal di balik login. Staf memakainya ratusan kali sehari. | 3 / 3 / 8 | L1 |\n| B | Link tanpa login: supplier, aslap, guru, driver, pelanggan. Dibuka di HP lapangan dengan sinyal jelek. | 3 / 2 / 6 | L1 |\n| C | Proyek frontend baru di luar proyek yang sudah punya kanon. | per brief (8 / 6 / 4) | L2 |\n\n- Dial: Variance 1 simetri sempurna sampai 10 kacau artistik. Motion 1 diam sampai 10 sinematik. Density 1 galeri seni sampai 10 kokpit data.\n- Mode A dan B tidak memakai dial bawaan landing page. Dial untuk A dan B sudah final dan tidak dinegosiasi ulang tiap halaman.\n- Gerbang frekuensi gerak menang atas dial: dial berkata boleh, gerbang berkata layak. Bila semua kandidat gagal gerbang, kirim halaman statis yang bersih dan turunkan dial.\n\n### Design Read, satu baris sebelum kode\n\n- Tulis satu baris ini di jawaban atau di komentar kepala berkas, sebelum kode pertama: `Baca ini sebagai: <mode> untuk <penggunanya>, dial <V/M/D>, lapis yang memimpin <L1|L2>.`\n- Contoh: `Baca ini sebagai: Mode A untuk staf akuntansi koperasi, dial 3/3/8, lapis yang memimpin L1.`\n- Baris itu masuk daftar periksa preflight. Mode yang dinyatakan di awal tidak direka-reka belakangan.\n\n### Tiga jalur pakai\n\n| Situasi | Baca berurutan |\n| --- | --- |\n| Memperbaiki atau menambah di app yang sudah ada | Prinsip kerja, bab selera yang disentuh, bab Pemutus konflik, katalog ranjau, tutup dengan preflight. |\n| Membangun website atau proyek baru | Prinsip kerja, bab Memulai proyek baru, Mode C dan anti-slop, katalog fitur. |\n| Mereview kerja orang lain atau agent | Peraturan tampilan lintas bab sebagai daftar periksa, bab Pemutus konflik bila ada benturan, preflight. |\n\n### Kalau cuma sempat baca satu bagian\n\n- Baca bab Prinsip kerja sampai habis, termasuk subbab Peraturan tampilan lintas bab, lalu bab Tabel. Itu yang paling sering dilanggar orang baru, dan semuanya sudah punya gerbang mekanis yang akan menahan push bila dilanggar.\n- Bila tugasnya menyentuh baris tertentu (klik yang membeku, tombol dummy, trigger atau RLS baru, proyek baru), buka bab yang menaunginya sebelum menulis kode. Itu lebih murah daripada memuat semuanya tiap sesi.\n\n### Berkas sumber, dan kapan dibuka\n\nPedoman ini ringkasan yang bisa dibaca sekali duduk. Sumber lengkapnya ada di repo, dan bila ringkasan berbeda dengan sumbernya, sumbernya menang. Contoh susunan MBG:\n\n| Kapan dibuka | Berkas |\n| --- | --- |\n| Mesin, akun, atau AI baru | `BACA-DULU.md`, pintu masuk tunggal: urutan baca, satu perintah pemasangan |\n| Selalu, di depan | `100-kanon.md`: arah, mode, gerbang, keputusan terkunci, ranjau |\n| Selalu, di depan | `CLAUDE.md`: perintah repo, git, deploy |\n| Butuh nilai persis: hex, ukuran font, anatomi tabel, struktur pesan WA | `200-rincian-selera.md` |\n| Proyek di luar yang sudah ada, atau ragu soal struktur dan hierarki | `300-anti-slop-frontend.md` |\n| Menyentuh animasi, gesture, transisi | `400-craft-gerak.md` |\n| Dua aturan bertabrakan dan tak jelas siapa menang | `500-vonis-konflik.md` |\n| Sebelum bilang selesai | `600-preflight.md` |\n| Push ditolak, CI merah, Vercel gagal | `700-ranjau-deploy.md` |\n| Kerja lintas agent, subagent, cron | `AGENTS.md` |\n\n- Kenapa cuma dua berkas yang wajib di depan. Sebab: sebelum 28 Jul 2026 MBG punya sembilan berkas berlabel wajib, total 1.642 baris; tidak ada yang membaca semuanya, lalu aturan dilanggar dengan niat baik. Sisanya berstatus kamus, dibuka saat ada pertanyaan spesifik.\n- Buku proyek diperbarui routine malam, bukan tangan (GR: pukul 21.27 WIB; BS: pukul 21.43 WIB, di Mac mini). Routine memeriksa apakah sumber selera berubah sejak stempel di kop: memori selera pemilik, `CLAUDE.md`, `docs/STANDAR-TABEL.md`, `lib/nav-menu.ts`, dan gerbang. Bila ada, ia menambah entri Riwayat, menyesuaikan bagian aturannya, lalu menerbitkan ulang ke alamat yang sama; hari tanpa perubahan dilewati tanpa menulis apa pun. Vonis baru masuk Riwayat bertanggal dulu, baru ke bagian aturannya.\n\nBab 03\n\n## Prinsip kerja\n\n### Sepuluh prinsip\n\nDiambil dari pola keputusan nyata, bukan dari niat yang diucapkan. Tiap butir diikuti buktinya.\n\n- **Ukuran akhirnya: orang luar bisa mengerjakan bagiannya sendiri lewat link WA, seamless, tanpa menunggu tim.** Bukti (MBG): 13 halaman tanpa login, 8 kanal eksternal, slug terbaca, satu link standing per supplier. Tiap fitur eksternal lahir bersama hub pengelolanya, tidak ada fitur yatim. (BS: `/pesan`, `/lacak/<token>`, `/kurir/<token>` menggantikan Google Form pre-order.)\n- **Otomasi menyiapkan dan mengingatkan; manusia yang memutuskan kirim.** Bukti: usulan auto-link saat PO berstatus sent ditolak; tidak ada blast diam-diam; agent otonom berhenti di PR dan tidak pernah men-deploy produksi sendiri. Fondasi dibangun dulu walau aktivasi ditunda: \"nanti pas mau jalan\" berarti siapkan, jangan nyalakan.\n- **Satu bahasa desain. Template yang sudah disetujui disalin, bukan didesain ulang.** Bukti (MBG): sekali `ExternalStatusBar` disetujui, 6 halaman disamakan dalam dua hari. Kreativitas per halaman bukan nilai di sini; konsistensi iya.\n- **Ini kokpit data, bukan halaman marketing.** Bukti (MBG): density 8, nol hero, tabel 12,5px, layar 13 inci harus memuat satu minggu penuh data. Hero navy pernah dibuat di 6 halaman dan semuanya dibongkar. Pengecualian: produk konsumen publik boleh berhero (WI: landing).\n- **Ekspor adalah replika kertas kerja, bukan dump kolom.** Bukti (MBG): warna Excel disebut sampai hex-nya; surat jalan dan LPD2M dari template docx asli; yang dicetak harus bisa ditumpuk dengan kertas yang sudah dipakai tanpa terlihat beda. (GR: xlsx milik pemilik jadi keluaran, bukan sumber.)\n- **Batasnya struktur versus penilaian, bukan \"AI belakangan\".** Bukti (MBG): 8 parser deterministik dan 26 fitur AI hidup berdampingan. Uraiannya di subbab berikut.\n- **Aturan tanpa gerbang mekanis dianggap belum jadi.** Bukti: test memindai sumber, hook menahan push, graph menahan tebakan, preflight menahan \"hampir selesai\". Menambah aturan berarti menambah gerbangnya sekalian. Keempat buku mengulang kalimat ini; WI melahirkan sembilan gerbang baru di Fase 0 sebelum menulis fitur pertama.\n- **Yang lama tetap hidup saat yang baru datang.** Bukti (MBG): token lama valid saat slug lahir; rute lama jadi redirect, bukan 404; link yang sudah beredar ke supplier hidup selamanya; migrasi tidak pernah membalikkan keputusan manusia secara massal.\n- **Kecepatan menang atas kerapian proses, tapi utang teknis ditulis eksplisit.** Bukti: commit \"gas\" boleh; utang yang tidak tercatat tidak boleh. Komentar kode panjang berbahasa Indonesia yang menjelaskan alasan dan sejarah adalah bagian dari deliverable. Utang tertulis berbentuk ratchet: angkanya cuma boleh turun.\n- **Gagal? Sebut akar masalahnya dan solusinya, jangan memutar.** Bukti: tidak ada \"hampir selesai\"; tidak ada laporan sukses untuk kerja yang belum diverifikasi; ada bagian yang dilewati, sebutkan bagian mana dan kenapa.\n\n### Prinsip 6, yang paling sering disalahbaca\n\n- Prinsip 6 sering dibaca \"AI itu jalan terakhir\". Angkanya membantah: pada 27 sampai 28 Jul 2026 (MBG) impor RAB, lembar Berat (kg), dan grid menu mingguan ditarik keluar dari LLM, tetapi di dua hari yang sama ada 2 commit mencabut AI dan 8 commit menambah AI. Yang dicabut spesifik pembacaan dokumen berstruktur; yang ditambah justru fondasi AI: korpus belajar, cache, apply-rate, narasi, pagar kuota.\n- Input berposisi tetap dibaca deterministik. Butuh penilaian, pakai AI.\n- Deterministik (MBG): grid menu mingguan, RAB, lembar Berat (kg), xlsx batch dapur, kamus kata kategori.\n- AI (MBG): narasi Summary AI, triase komplain, saran tukar menu, vision QC foto, normalisasi nama, cek silang dokumen.\n- Syarat mati tiap fitur AI, tanpa kecuali: label fitur, `llm_log`, apply-rate, cache hash-prompt, dan korpus koreksi yang menumbuhkan few-shot. Fitur AI tanpa kelimanya belum selesai, bukan sudah jalan. Aturan AI selengkapnya ada di bab AI dan otomasi.\n\n### Gerbang konteks: knowledge graph\n\n- Menebak lewat grep menghasilkan drift. Repo yang punya knowledge graph (KG) wajib menanyainya sebelum menyentuh apa pun. Aturan tunggal yang tidak bisa ditawar: jangan Read, Grep, Glob, Edit, atau Write apa pun sebelum menjalankan perintah KG-nya. Perintah (MBG): `npm run kg:check` (graph masih segar? basi berarti jalankan `kg:build`), `npm run kg -- \"<kata kunci tugas>\"` (subgraph relevan: berkas, tabel, tetangga), `npm run kg -- --impact <berkas>` (radius ledak sebelum mengedit), `npm run kg -- --domain <domain>` (satu domain penuh), `npm run kg:build` (wajib sesudah struktur kode berubah).\n- Kontrak anti-drift, empat baris yang diisi sebelum edit pertama:\n- `CAKUPAN`: node KG yang boleh disentuh, id persis.\n- `DI LUAR`: yang sengaja tidak disentuh walau kelihatan menggoda.\n- `RADIUS`: hasil `--impact`, berapa modul dan permukaan runtime yang ikut jebol.\n- `BUKTI SIAP`: perintah yang akan membuktikan perubahan ini jalan.\n- Bila empat baris itu tidak bisa diisi, tugasnya belum dipahami: query lagi, jangan mulai.\n- Node di luar cakupan tidak boleh diedit. Menemukan bug lain di jalan: catat dan laporkan, jangan belok.\n- Radius lebih dari 20 modul: berhenti dan konfirmasi ke manusia dulu (MBG: menyentuh `lib/rbac.ts` menjebol 144 modul dan 53 permukaan runtime saat diukur 2026; itu bukan edit kecil).\n- Perluasan cakupan harus eksplisit: tulis ulang `CAKUPAN` berikut alasannya. Melebar diam-diam adalah drift, dan refactor yang tidak diminta adalah drift.\n- Berkas KG (MBG): `.claude/kg/graph.json` (sumber kebenaran mesin), `.claude/kg/PETA.md` (ringkasan untuk agent dan manusia: domain, hub, lib tanpa test, API tanpa guard), `.claude/kg/peta.html` (peta arsitektur interaktif untuk manusia), `scripts/kg/flows.json` (alur bisnis kurasi, satu-satunya berkas KG yang boleh disunting tangan).\n- Bila KG dan kode berselisih, kode menang dan graph diperbarui. Jangan pernah sebaliknya, dan jangan menyunting hasil generate dengan tangan.\n\n### Rumah sebuah aturan, dan angka hasil mesin\n\n- Yang menentukan rumah sebuah aturan adalah pertanyaan yang dijawabnya, bukan panjangnya dan bukan berkas mana yang kebetulan sedang dibuka. `CLAUDE.md` menjawab \"apa yang benar tentang repo ini\" dan dimuat otomatis tiap sesi; `AGENTS.md` menjawab \"bagaimana agent harus bekerja\" dan tidak dimuat otomatis karena tidak di-import oleh `CLAUDE.md`. Aturan yang dipindah ke `AGENTS.md` berhenti terbaca dengan sendirinya, kegagalan paling sunyi dari semuanya.\n- Aturan tidak dipindah antarberkas demi kerapian. Arah yang benar sebaliknya: yang ada di `CLAUDE.md` dipendekkan jadi penunjuk, narasi dan insidennya turun ke berkas ranjau atau kanon.\n- Angka hasil hitungan mesin tidak pernah disalin ke berkas aturan. Sebab: 21 Agt 2026 `CLAUDE.md` dan `AGENTS.md` (MBG) sama-sama menulis ukuran KG sebagai \"913 node\", padahal graph-nya sudah hampir tiga kali lipat, di kalimat yang justru menyuruh orang memercayai graph. Angkanya benar saat diketik, lalu `kg:build` menaikkannya tanpa punya alasan menyentuh dokumen; salahnya tak pernah terlihat karena memang tak ada yang bisa melihatnya.\n- Angka semacam itu ditolak mekanis di kedua berkas, dan pembaca diarahkan ke berkas generate yang selalu segar (MBG: `.claude/kg/PETA.md`). Menyinkronkan angkanya bukan jawaban; itu menjadwalkan kegagalan yang sama untuk build berikutnya.\n- Angka yang layak ditulis karena ia janji ke pembaca, seperti jumlah agent di armada, diikat ke kenyataannya oleh gerbang, bukan dilarang. Angka ratchet di gerbang juga boleh tertulis karena memang tugasnya menjadi batas yang diturunkan.\n\n### Pintu masuk BACA-DULU.md\n\n- Sejak 12 Sep 2026 (MBG) repo punya satu pintu masuk untuk AI apa pun, akun apa pun, mesin apa pun: `BACA-DULU.md` di akar. Isinya urutan baca berikut ongkos tiap berkas, delapan aturan yang tidak bisa ditawar, peta berkas mana menjawab pertanyaan apa, dan satu perintah pemasangan mesin baru. Pedoman ini pintu masuk manusia; berkas itu pintu masuk mesin.\n- Sebab: hanya Claude Code yang memuat `CLAUDE.md` sendiri. Codex, Cursor, Copilot, Gemini, dan agent buatan sendiri membaca konvensinya masing-masing, dan yang tak menemukan pintu akan menebak. Karena itu `AGENTS.md`, `GEMINI.md`, `.cursorrules`, `.cursor/rules/pangantara.mdc`, dan `.github/copilot-instructions.md` semuanya menunjuk ke berkas itu dan tak satu pun menyalin isinya.\n- Gerbang `gerbang-mesin-baru` menolak tiga hal: penunjuk yang hilang, penunjuk yang menggemuk jadi salinan kedua (berlabel tipis wajib di bawah 2.000 huruf), dan perintah `npm run` mati yang disebut di pintu masuknya. Pintu yang menunjuk barang mati lebih buruk daripada tidak ada pintu.\n- Mesin atau akun baru dipasang dengan satu perintah: `bash bekal/mesin-baru.sh cek` melapor apa yang kurang tanpa mengubah apa pun, `bash bekal/mesin-baru.sh pasang [kerja|24jam|panen]` memasangnya. Skrip itu tidak menyalin isi pemasang mana pun, hanya memanggil yang sudah ada. Sebab: lapisan yang terpasang setengah terlihat bekerja dan diam-diam berhenti belajar.\n\n### Peraturan tampilan lintas bab\n\nPeraturan yang tidak punya rumah di satu bab tertentu karena ia mengatur cara menegakkan, bukan satu elemen layar. Peraturan per elemen sudah diletakkan di bab warna, tulisan, ikon, tabel, layout, form, dan seterusnya.\n\n- Tiga hal berlaku untuk semua peraturan tampilan. (1) Bukan selera yang bisa ditawar: bila sebuah desain melanggarnya, yang salah desainnya, bukan peraturannya. (2) Perbaikan di komponen bersama, bukan tambalan per halaman: satu pelanggaran biasanya lahir dari satu komponen yang dipakai ratusan kali, dan menambalnya di satu halaman berarti sisanya tetap salah. (3) Yang bisa diperiksa mesin wajib punya gerbang (MBG: `tests/unit/gerbang-selera.test.ts`); yang tidak bisa jadi kotak wajib di preflight. Gerbang yang salah tuduh lebih merusak daripada tidak ada gerbang.\n- Kelas pelanggaran yang ditambal per komponen akan lahir lagi lewat komponen sebelahnya. Obatnya membuang kemampuannya, bukan mengganti nilainya. Sebab: MBG 11 Agt 2026, vonis \"kenapa ini surat jalannya ada white space ya\" jatuh di sub-tab Surat Jalan, kejadian kedua dari kelas yang sama setelah gerbang sebelumnya dipasang untuk satu komponen. Penambalannya menghapus prop `fullWidth` dari `PageTabs`: strip selalu `flex w-full` dengan tiap tab `flex-1`, sehingga bentuk yang dilarang tidak bisa ditulis sama sekali. Kedalaman dinyatakan lewat urutan, indentasi, dan rel kiri, bukan lebar yang disunat: sub-tab yang menyusut terbaca \"belum jadi\", bukan \"lebih dalam\".\n- Bila sebuah peraturan punya dua komponen yang bisa menjalankannya, memperbaiki satu berarti belum memperbaiki apa pun. Cari saudaranya dulu, baru bilang selesai. Sebab: MBG 3 Agt 2026 aturan Rupiah diputus dan `Rupiah.tsx` dibuat, tetapi 141 sel di 24 berkas memanggil saudaranya `RpCell`, yang saat itu baru diubah ke bentuk sebaliknya; kanon berkata satu hal dan hampir semua tabel uang menunjukkan hal lain selama tiga hari, sampai pemilik mengulang vonisnya.\n- Kelas perataan atau gaya yang lahir sebagai konstanta bersama punya akibat paling luas dan paling sunyi: satu konstanta menyetel ratusan kolom di puluhan layar, dan tak satu pun layar itu kelihatan menyimpan aturannya. Sebab: MBG 30 Agt 2026, vonis \"judul header atas dibuat tengah\" kambuh meski aturan dan gerbangnya sudah ada sejak 26 Agt, karena dua konstanta `THL = '!text-left'` dan `THR = '!text-right'` di `components/summary-ai/tone.ts` dipakai 96 kali di seluruh Summary AI dan `!important` menang telak atas CSS `thead th`. Pemindai lama punya tiga celah sekaligus: konstanta hidup di berkas lain, dipakai di dalam template literal, dan `<SortTh>` tak ikut dipindai walau className-nya mendarat di `<th>` yang sama. Perbaikannya membuang `THL`, menyempitkan `THR` jadi sel `<td>` saja, dan membuat gerbang membangun peta const seluruh `app`, `components`, `lib`, membaca `${...}` dalam template literal, serta memindai `th`, `SortTh`, `SortButton`.\n- Kembaran wajib ikut berubah: ubah satu layar kembar, ubah semuanya. Naikkan bagian yang sama jadi komponen bersama, jangan menyalin, sebab salinan kedua berpisah lagi dalam hitungan minggu. Sebelum menutup pekerjaan di salah satu layar, buka satunya dan bandingkan; ini kotak wajib di preflight. Contoh kembaran (MBG): Resep Dapur dan Referensi Resep (satu barang dengan dua cakupan: tata letak, tombol, filter, kolom, urutan, aksi massal sama); Daftar Invoice, Invoice Terbit, Verifikasi Invoice, Lunas (empat tab satu halaman: bentuk tabel, grup berkategori lipat, subtotal per kategori, grand total, susunan toolbar sama; isi boleh beda, bentuk tidak).\n- \"Tiru layar X\" berarti tiru modelnya, bukan satu detail yang paling gampang. Sebelum menyentuh kode, tulis dulu daftar perbedaan lengkap antara dua layar (kartu di atas tabel, susunan dan nama kolom, urutan blok, isi kaki tabel, tempat form isian, legenda), lalu kerjakan semuanya sekaligus. Sebab: MBG 18 Agt 2026, perintah \"meniru verifikasi pembayaran\" untuk popup Bukti Transfer `/invoice` dijalankan sebagai satu perubahan kecil (vonis turun ke kaki popup) sementara bentuk panelnya tetap yang lama; pemilik mengulang perintah yang sama hari itu juga. Pengulangan perintah adalah ongkos yang ditanggung pemilik.\n- Dua sisi paralel adalah cermin blok per blok, lewat komponen bersama. Tiap halaman yang punya strip dua sisi (MBG: Bahan Baku dan Barang Ops di Procurement, Order, PO Supplier, Invoice, Pembayaran, dan yang lahir besok) menampilkan kedua sisinya dengan konsep, bentuk, ukuran, ikon, urutan blok, dan jumlah kotak yang sama; yang boleh beda cuma isi dan kata bendanya. Satu blok sama dengan satu komponen bersama yang dipakai dua sisi (ringkasan, kartu Cakupan, bar periode, strip sub-tab berlencana, `CariExportBar`, tabel, kartu katalog, `EmptyState`, sakelar sisi berikon, ember bayar), bukan dua gambar yang mirip. Sisi yang lebih bagus jadi template untuk keduanya, bukan otomatis sisi pertama (19 Sep 2026: bar periode dan strip berikon diambil dari sisi Ops, sisanya dari sisi Bahan). Membangun satu sisi tanpa membuka sisi sebelahnya adalah pelanggaran walau tiap bloknya lolos selera. Yang dijaga adalah sumbernya, bukan pixel; pengecualian didaftar eksplisit dengan plafon yang cuma boleh turun. Vonis pemilik 19 Sep 2026: \"mirroring harusnya sama semua konsepnya bentuknya ukurannya iconnya, tinggal lu sesuaikan sesuai konteks, jangan diulang lagi\"; ditegaskan 26 Sep 2026 sesudah selisih ditemukan satu per satu di Order, PO, Invoice. Gerbang: `gerbang-cermin-ops`, `gerbang-cermin-procurement-ops`, `gerbang-cermin-bayar-ops`.\n- Bila pemilik menunjuk puluhan layar sekaligus sebagai jelek, yang gagal bukan aturannya, melainkan tidak adanya kerangka yang memaksa aturan itu berlaku saat layar disusun. Sebab: MBG 19 Sep 2026 menunjuk sekitar 30 layar (\"lu nilai ya, ini semua jelek ga ketolongan\", \"lu ga belajar\"); semuanya jatuh ke kelas yang sudah ada di daftar aturan. Obatnya kerangka halaman bersama (bab Layout halaman dan navigasi) plus pemindai sembilan kelas jelek (`node scripts/selera/audit-kelas.mjs`, gerbang `gerbang-kelas-jelek.test.ts`) yang membekukan jumlah tiap kelas di angka pindaian pertama (809 berkas, 1.215 temuan) dan cuma boleh turun; menaikkannya butuh alasan tertulis di commit yang menaikkannya. Gerbangnya sengaja tidak menuntut batas dirapatkan otomatis: saat disusun, beberapa sesi lain commit ke main paralel pada kelas yang sama, satu kelas sempat naik dari 653 ke 779 dalam hitungan menit, dan uji kesamaan persis gagal karena lomba baca-tulis, bukan karena batasnya salah.\n- Ratchet adalah utang yang dicicil, bukan kuota. Berkas, tabel, atau layar yang kamu buka, kamu sentuh, atau ditunjuk pemilik dikonversi di giliran itu juga lalu batasnya diturunkan; \"ini termasuk sisa yang belum\" bukan jawaban. Sebab: MBG 18 Agt 2026 pemilik menunjuk tab Reimbursement di `/link-eksternal` yang headernya masih array teks polos tiga hari sesudah aturan sort diputus (\"kalo bisa tabel pake sort ya sort. Catat\").\n- Gerbang yang menyapu satu direktori bukan gerbang, cuma pagar di satu pintu. Sebab: MBG 25 Agt 2026 overlay INP menyala lagi di tombol ikon sehari sesudah aturan klik beku berdiri, karena `gerbang-inp-transisi.test.ts` cuma memindai `components/ui/`, jadi handler di `app/` **dan `components/<selain ui>/`**, termasuk chevron pembuka baris rincian tabel, lolos tanpa diperiksa. Dua konsekuensi: gerbang diperlebar rekursif ke seluruh `app/` dan `components/`, tiap berkas berhandler cakupan terdaftar diuji atau dikecualikan berikut alasan teknis per berkas; dan daftar antre di gerbang adalah utang tertulis yang cuma boleh menyusut, bukan tempat parkir.\n- Website punya agent reviewer INP sendiri (MBG: `.claude/agents/inp-reviewer.md`, terdaftar di router `AGENTS.md`), dipanggil sebelum merge untuk setiap perubahan `.tsx` yang menyentuh handler klik atau pilih. Tugasnya satu: mencari handler pengganti cakupan render yang belum lewat `startTransition` atau `transisi()`, kotak cari terkontrol yang belum lewat `useCariLunak`, dan tombol ikon kecil (`h-4 w-4`) yang tampak sepele padahal men-toggle subtree besar. Ia read-only: melapor berkas:baris, handler apa, subtree apa, dan fix konkretnya; manusia yang memutuskan. Vonis pemilik 25 Agt 2026: \"harus ada di website agent untuk review INP Issue gini\". Gerbang: `gerbang-inp-transisi.test.ts` (pola transisi) dan `gerbang-agent-inp.test.ts` (agent wajib ada, ber-checklist, terdaftar).\n- Membungkus setState dalam transition atau `useDeferredValue` memisahkan nilai, bukan ongkos render (INP kelas e). React hanya bisa menyela di antara komponen, tidak di dalam satu badan fungsi komponen; bila state chrome dan JSX berat hidup di komponen yang sama, pass urgent tetap menjalankan seluruh badan itu, `.map()` jalan lagi, props baru lahir, dan tak satu fiber pun bisa bail out. Obatnya memotong subtree berat jadi komponen anak ber-`React.memo` (atau `useMemo` atas pohon elemennya) yang hanya bergantung pada nilai deferred, dan menggerbangi mount, bukan visibilitas: `hidden` menyembunyikan piksel tapi tetap membayar render. Kontrol ber-`useEchoLunak` aman karena mengurung pass urgent di dalam komponen kontrolnya sendiri; `useDeferredValue` di tempat tidak. Sebab: MBG 29 Agt 2026 overlay INP menyala di label sort (235,5 ms) dan pill tab `/resep` (594,4 ms) pada kontrol yang sudah memakai semua perkakas, karena 1.318 baris JSX `/resep` dibangun ulang termasuk saat tab lain yang tampil. Dua celah gerbang terbongkar: penanda menghitung `transisi(` sebagai lulus sehingga bentuk yang justru dilarang diskor sebagai perbaikan di 18 tempat, dan penanda bekerja per berkas sehingga satu `useDeferredValue` di kepala berkas meloloskan 7.815 baris di bawahnya. Angka pembuka tiap sapuan INP: hitung dulu berapa kali `React.memo` dipakai (nol di seluruh repo per 29 Agt 2026). Gerbang yang hanya mengenali satu bentuk penulisan obat berhenti mengukur maksudnya: versi pertama menolak `useMemo` atas pohon elemen, bentuk termurah di berkas ber-closure banyak, sehingga dua agent menulis versi lebih mahal dan satu menahan diri memakai memo sama sekali.\n- Kata \"Catat\" dari pemilik berarti berkas berubah (aturan, gerbang, memori yang dibaca sesi berikutnya), bukan sesi ini mengingat. Pelajari juga arahnya: \"gw gak pernah mau ada yang keulang lagi\" berarti aturan plus gerbang, bukan perbaikan satu layar. Peraturan yang baru diucapkan dan belum punya tempat di kanon ditulis dulu sebagai baris tak bernomor.\n\nBab 04\n\n## Pemutus konflik\n\n- Kerangka lapis: L1 selera internal proyek, L2 anti-slop, L3 gerak. Kolom keputusan dibagi per jenis proyek (A/B app internal dan halaman eksternal operasional; C proyek frontend baru).\n- Urutan memutus: (1) fungsional? bila dihapus ada yang kehilangan informasi untuk memutuskan sesuatu, selera internal menang; (2) bahasa visual atau struktur? bahasa visual: selera internal menang mutlak di A/B; struktur: anti-slop menang bila selera internal diam; (3) soal cara bergerak: lapis gerak menang atas semuanya; (4) bila skill selera sendiri menyatakan di luar cakupannya (dashboard, tabel, form wizard, UI produk padat), jangan tarik aturannya ke sana; (5) masih ragu: tulis vonis sebagai baris baru di berkas kamus konflik (MBG: 500-vonis-konflik.md, kamus hidup) sebelum lanjut ngoding.\n- Vonis baku (MBG, A/B menang selera internal, C menang anti-slop kecuali dinyatakan): emoji di teks/nav (batas: menandai jenis data atau aksi, bukan hiasan); font yang sudah dipilih dan dipasang lewat next/font adalah brand lock, bukan default malas; library ikon kecil stabil, ambil disiplin stroke/ukuran/viewBox dari anti-slop; panel adalah unit informasi satu urusan; eyebrow dilarang di atas judul panel, satu label per panel; strip waktu dan lokasi boleh bila datanya dipakai di layar yang sama (jam terima barang); titik tengah hanya di legenda simbol; deret kartu KPI sejajar boleh karena empat angka berbeda setara derajat; hero nol di kokpit; tabel padat dan form multi-langkah selalu selera internal; padding overlap yang menyambung kartu identitas dengan header boleh bila berfungsi.\n- Sah tanpa konflik: en dash untuk rentang angka (notasi, bukan retorika); abu murni di dalam area cetak (kwitansi dan invoice meniru kertas, keluarga ink navy-ish salah di kertas putih), di luar area cetak larangan mutlak; listener scroll pasif untuk reposisi popover.\n- Salin SVG berulang dilarang: pakai satu komponen ikon (MBG: WaIcon; aturan lama ditulis saat salinan baru 2, pada salinan ke-11 satu koreksi path berarti 14 edit). min-h-screen sama salahnya dengan h-screen, wajib min-h-\\[100dvh\\].\n- Legenda warna kategori tidak dibuat bila semua chip berwarna sudah membawa ikon dan teks label sendiri: warna penguat, bukan satu-satunya pembawa makna. Legenda baru hanya bila ada permukaan yang mewarnai tanpa teks, dan itu diperbaiki lebih dulu.\n- Titik sepakat semua lapis naik jadi gerbang keras: ban em dash, dark mode, reduced motion bukan mati total, feedback tekan, dot status semantik, siklus state lengkap, angka palsu berlabel, hanya transform dan opacity, instruksi maksimal 1 kalimat, kontras AA.\n- Vonis pemilik tidak dibuka lagi tanpa pemilik; yang belum diputus jangan ditebak (WI GR BS: bagian Keputusan pemilik dengan status Diputus dan Belum diputus). Bentrok selera antar proyek: mana yang menang ditulis dengan tanggal. Perubahan selera dari teguran pemilik masuk Riwayat bertanggal lalu ke bagian aturannya, dan aturan tanpa gerbang mekanis dianggap belum jadi (GR, BS, WI).\n- Selera tampilan tetap yang berulang ditegur dijadikan checklist sebelum menyerahkan tampilan (GR/BS): ikon formal tanpa gestur tangan, pesta, makhluk imut; satu ikon satu arti; tiap ikon di tabel masuk legenda satu baris yang tak mengulang chip saringan dan tak memuat cara pakai; solid bukan gradien (GR: hijau hutan; WI menerima gradient navy hanya sebagai token merek, tapi nol kartu angka berlatar blok pekat); nol tab \"Semua\"; link langsung dibuka tanpa tombol salin; nol lencana hitungan di kepala kartu; tile tanpa data dihapus bukan \"-\"; tanda minus di slot tetap, nol tidak pernah \"-0\", nol di sel uang redup, persen satu desimal; grafik pastel terang; latar netral terang tanpa krem di atas krem; label di atas input tanpa \"(opsional)\"; nol gulir samping di popup, lebarkan popup (max-w-5xl).\n- Standar tabel dua belas butir (GR, disalin ke BS dengan dua tambahan: tabel kosong tetap tergambar dengan kepala kolom plus satu baris \"Belum ada ...\"; daftar item tanpa titik jadi sel ringkas plus popup): No di kiri, semua kolom sortable, Rp kiri angka kanan, persen satu desimal, tanggal slot tetap, desimal seragam per kolom, status ikon plus satu legenda, baris grup dengan subtotal tanpa hitungan, baris total, rapat 12 px satu baris per sel tanpa \"...\", muat satu tampilan di 1280 px maksimal 12 kolom, kode dalam pil dan nama tidak tebal. Satu tabel per tampilan, kelompok jadi baris grup lipat, data berbaris adalah tabel bukan grid kartu, grup tanggal per minggu dengan label \"14-20 Sep 2026\" tanpa \"Minggu 38\".\n- Susunan menu: urut alur usaha, 5 baris atas (sisi jual) dan 5 bawah (beli dan uang), maksimal sekitar 8 tab per menu, tautan lama tetap mengarah ke tempat baru, menu admin tidak boleh disembunyikan agar pemilik tak terkunci (BS: NAV_WAJIB), ikon nav sama dengan ikon tab dan legendanya, menu dan resep di depan pesanan karena hulu semua pesanan.\n\nMenyiapkan mesin dan proyek\n\nBab 05\n\n## Memulai proyek baru\n\n### Ember hari pertama, boleh menyusul, mahal kalau ditunda\n\n- Ongkos sebuah fitur ditentukan oleh jumlah halaman yang sudah lahir tanpa dia, bukan oleh ukurannya. Salah menaruh sesuatu di ember ketiga dibayar berbulan-bulan.\n- Ember hari pertama (dipasang sebelum halaman kedua): rumah tema dan warna, rumah format angka/tanggal/uang, rumah periode plus sinkron URL, rumah transisi INP, peta RBAC yang dibaca nav dan guard, RLS di tiap tabel, guard API satu pintu, migrasi berurut dan idempoten, gerbang mekanis walau daftarnya masih kosong, tombol data dummy plus tabel jejaknya. Kalau ditunda, tiap halaman menulis polanya sendiri dan tidak ada satu tempat pun yang bisa membenahinya sekaligus.\n- Ember boleh menyusul: halaman baru, kolom baru, laporan baru, dataset ekspor baru. Ongkosnya kecil, memang begitu jalannya.\n- Ember menyusul tapi mahal: audit trail, cakupan data per unit, link token pihak luar, jejak dummy lewat trigger, penomoran dokumen, satu rumus uang. Semuanya harus menyentuh tiap tabel dan halaman yang sudah ada, dan yang terlewat gagal diam. Rancang slot-nya sejak awal walau isinya belum ada.\n- Daftar periksa berurut. Sebelum halaman kedua: semua butir ember hari pertama. Sebelum halaman kesepuluh: kontrol tabel bersama, kontrol periode bersama, bar cari plus ekspor, ActivityLog, katalog cron, error klien dilaporkan ke DB, sapuan INP menyeluruh. Saat modulnya lahir: alur status plus lognya, link token pihak luar, nomor dokumen, kop surat dan registri lembar cetak, registri dataset ekspor, parser impor plus pratinjau. Kapan saja: halaman, kolom, laporan, dataset ekspor baru.\n\n### Sepuluh rumah tunggal\n\n- Tiap rumah wajib satu berkas, satu ekspor, dipakai bersama, dan dibuat sebelum pemakai keduanya lahir. Sebab: rumah yang dibuat sesudah pemakai kelima berarti empat penulisan ulang yang harus dicabut satu per satu, dan yang kelima biasanya tidak ketemu.\n- Format: angka Indonesia, tanggal, nama hari berkoma, telepon, terbilang. Tanpa rumah ini angka yang sama tampil dalam dua bentuk di dua halaman.\n- Uang: daftar status yang diakui per jenis transaksi, satu fungsi per pertanyaan. Tanpa rumah ini empat layar melapor empat angka, semuanya benar menurut kodenya sendiri.\n- Periode: mode hari/minggu/bulan/rentang, batas, label relatif, sinkron ke URL. Periode yang hidup di useState tidak bisa dibaca perkakas di luar halaman.\n- Tema dan warna: token warna, palet seri grafik, kelas pil status. Tanpa itu warna kira-kira sama yang tidak pernah sama.\n- Transisi (INP): pemisah chrome urgent dan isi deferred, echo lokal, overlay terpusat. Tanpa itu klik membekukan layar dan obatnya tidak bisa dipasang serentak.\n- RBAC: satu peta peran ke halaman, dibaca nav dan guard halaman. Tanpa itu nav menyembunyikan tab yang URL-nya masih bisa dibuka.\n- Guard API: satu gerbang untuk tiap route, menerima daftar peran atau ANY_STAFF. Tanpa itu sesi authenticated yang sah tapi bukan staf tetap lolos.\n- Cakupan: unit yang sedang dilihat, dipakai query dan ekspor. Tanpa itu ekspor membawa data unit lain tanpa ada yang sadar.\n- Nomor dokumen: satu bentuk, satu fungsi (contoh JENIS-YYMM-NNNN dari satu lajur nomor_urut di Gemah Ripah). Sebab: di MBG empat berkas memelihara array bulan romawi masing-masing.\n- Tabel: sort, grup lipat, paginasi, cari, bar ekspor, legenda kaki. Tanpa itu tiap tabel jadi tabel baru dan peraturan tabel harus ditegakkan puluhan kali (MBG: 40).\n\n### Identitas, peran, cakupan\n\n- Tiga lapis, semuanya wajib, karena satu lapis saja selalu bocor dan bocornya diam: RLS di database (lapis terakhir yang tak bisa dilewati klien, dengan helper can_read\\_\\* sebagai satu rumah supaya policy tidak menulis ulang logika peran), guard di route API (middleware mengarahkan, requireStaff() di tiap route), guard di UI (peta peran yang sama dengan nav, jadi keduanya tidak mungkin drift).\n- authenticated bukan staf. Kalau pendaftaran terbuka atau ada portal OTP, siapa pun bisa memperoleh sesi sah tanpa pernah jadi karyawan. Fungsi SECURITY DEFINER yang dibuka untuk authenticated terbuka untuk siapa pun yang login, lewat /rest/v1/rpc/nama langsung tanpa melewati route handler. Sebab: 4 Sep 2026 (MBG) ada empat fungsi penulis (pelahir order, dua pelahir PO, pelahir surat jalan) yang menulis untuk dapur mana pun yang disebut argumennya, dengan nol pemanggil di seluruh app. Keempatnya dicabut, bukan digerbang: pintu yang tidak dipakai ditutup.\n- Peran tak berhak tidak melihat kontrolnya sama sekali (bukan melihatnya abu). Cakupan yang naik tampil sebagai kartu cakupan. Service role punya auditornya sendiri. Apa pun yang bisa dipanggil dua kali oleh orang yang sama punya rate limit plus kunci idempoten.\n- Peta halaman baru wajib didaftarkan di peta peran, bawaannya ditolak (Betutu Sambe: PAGE_ACCESS). Halaman admin tidak boleh bisa disembunyikan dari pemilik (NAV_WAJIB), supaya pemilik tidak terkunci di luar.\n- Peran standar usaha kecil: owner, admin, gudang atau dapur, finance. Super admin adalah owner berjabatan super_admin, bukan enum baru. Daftar orang Super Admin ditulis per proyek (Gemah Ripah dan Betutu Sambe berbeda orangnya).\n- Kursi baru menumpang peran induk dan dibedakan jabatan, bukan enum user_role baru. Sebab: enum baru berarti ratusan policy RLS ditambal satu per satu (MBG: 1.186) dan yang terlewat gagal diam. Cakupannya ditegakkan di satu fungsi (MBG: get_my_sppg_ids()), dan kursi tanpa wilayah melihat nol data.\n- Kursi pantau (yayasan, auditor luar) boleh melihat, tidak boleh mengubah. Halaman lewat daftar putih yang hanya menyempitkan akses dan tidak pernah melebarkannya; yang tertutup disebut satu per satu. Tiap route tulis lewat gerbang grup luas wajib berbendera tulis (requireStaff(grup, { tulis: true })) atau terdaftar sebagai pengecualian dengan sebab minimal 20 huruf. Database ikut dicabut: migrasi mencabut kursi itu dari policy tulis dan tiap create policy didahului drop policy if exists. Sebab: vonis 13 Sep 2026 (MBG), sensus menghitung 873 policy RLS, delapan memuat yayasan di jalur tulis, dan sekitar 63 route tulis bergerbang grup luas; 23 halaman lolos lewat grup luas termasuk jurnal, neraca, gaji, dan bagi hasil.\n- Wilayah header kursi dapur diturunkan dari dapur miliknya, bukan dari daftar umum. Saringan aktif dilarang di sana karena bendera uang bukan keberadaan dapur. Sebab: 23 Sep 2026 (MBG) pembacaan tanpa saringan milik mengembalikan 200 dapur acak se-Indonesia dan header Ka SPPG jatuh ke provinsi pertama, Aceh.\n\n### Cangkok fondasi dan keputusan pemilik\n\n- Satu repo per usaha, branch cuma main. Worktree dan branch agent dihapus sesudah push. Fondasi disalin dari proyek terdekat, domain proyek asal tidak ikut.\n- Cangkok, bukan fondasi ulang: yang dibawa hanya yang generik (peran, tabel, ikon, legenda, gerbang, dummy, kerangka halaman). Modul back-office khusus domain asal tidak ikut (Worth It dari Gemah Ripah dan Betutu Sambe; Betutu Sambe dari Gemah Ripah, tanpa toko supplier dan tanpa konsep MBG).\n- Selera visual lahir dari satu kanon bersama (skill selera-pinka, dipakai pangantara, Gemah Ripah, Betutu Sambe) dan tiap usaha hanya mengganti merek. Kalau selera dua proyek bentrok, pemilik memutus satu arah dan berlaku di kedua (26 Sep 2026: sepuluh bentrok diputus \"Ikut GR\", berlaku juga di pangantara).\n- Merek per usaha diputus pemilik dan tidak dipinjam: navy dan emas (pangantara, Worth It), hijau hutan dan emas (Gemah Ripah), marun tua (Betutu Sambe). Warna logo yang menyala hanya di logo dan situs publik, kokpit memakai versi tua supaya tidak menyala.\n- Paritas layar: bila proyek baru meniru proyek lama, tiap layar dipasangkan dengan layar padanannya dan kekurangannya dibereskan sebelum pemilik menemukannya sendiri (Betutu Sambe 3 Okt 2026, spec §20). Dashboard dan laporan acuan pemilik (xlsx) dipetakan bagian per bagian, yang belum ada wajib dibangun.\n- Sumber data lama pemilik (xlsx) menjadi keluaran, bukan sumber, sesudah tanggal potong. Transaksi sesudah tanggal potong hanya lahir di sistem (Gemah Ripah 26 Sep 2026). Status impor yang meragukan dicatat sebagai belum diputus, jangan ditebak.\n- Yang sudah diputus pemilik tidak dibuka lagi tanpa pemilik. Yang belum diputus jangan ditebak: catat di daftar belum diputus beserta rekomendasi dan siapa yang memutus.\n- Keputusan data pemilik dicatat sebagai migrasi berkomentar alasan, bukan update diam. Buku pegangan proyek memuat riwayat bertanggal, keputusan, selera, dan gerbang, disegarkan routine malam yang hanya menulis kalau sumbernya berubah.\n- Urutan fase proyek yang membawa utang keamanan: tampilan dan gerbang dulu, lalu celah keamanan ditutup, baru data bernilai masuk DB. Sebab: Worth It 3 Okt 2026, audit menemukan README mengklaim lima tahap selesai padahal baru fondasi, plus tiga celah (saldo kredit bisa diubah sendiri, fungsi terbuka, SSRF) yang belum bocor hanya karena repo belum tersambung ke Supabase atau Vercel. Data panen tidak masuk DB sebelum celah tertutup.\n- DB yang belum tayang tidak ditambal: migrasi digulung ulang jadi baseline bersih dengan perbaikan keamanan di dalamnya (Worth It: 16 migrasi jadi satu baseline).\n- Angka dari rumus, bukan dari model AI. Model hanya mengekstrak atribut, satu rumus per besaran, kredit dipotong hanya saat vonis berhasil, server crawler hanya menyentuh sumber publik, harga datang dari tabel server bukan dari klien.\n- Infrastruktur dicatat sebagai keputusan: zona waktu dibaca dari usahanya tapi bisa dipatok (Betutu Sambe WIB, bukan WITA walau di Bali), paket Supabase dan Vercel, penyedia AI dan WA yang dipakai atau tidak (Betutu Sambe: Groq dan Gemini, WA lewat tautan wa.me manual). Paket yang menentukan fitur (cron tiap 30 menit butuh Vercel Pro) ditulis sebagai belum diputus sampai pemilik memutus.\n- Armada agent dipasang sejak hari pertama: roster, agent bermodel (pengerja dan platform Sonnet, pemeriksa pola Haiku, pemeriksa nalar Sonnet, perencana Opus), ilmu per agent, AGENTS.md, satu agent satu wilayah (Worth It: 28 agent). Sub-agent tanpa model tertulis diam-diam ikut Opus.\n- Website usaha F&B lahir dari cetak biru, bukan dari nol: peta apa yang disalin, diadaptasi, dibangun baru, plus formulir brief. Nilainya sebesar ketepatan petanya, jadi gerbang menuntut tiap jalur berkas yang disebut cetak biru masih ada dan skrip pemasang benar menyalinnya. Berkas yang memang belum ada ditulis berawalan kit: supaya tidak dituduh. Sebab: modul yang dipecah tanpa menyapu cetak biru menyuruh agent berikutnya menyalin berkas yang tidak ada, ketahuan jauh di repo usaha orang (MBG 19 Sep 2026).\n- Tombol data dummy sejak awal: dua ikon, Super Admin saja, isinya ditentukan halaman yang sedang dibuka. Data dummy terpisah (is_dummy atau tabel jejak berisi tabel, id, modul, nilai lama yang diisi trigger), tidak pernah bercampur dengan stok, HPP, dan nomor asli.\n\n### Ranjau yang berulang di proyek baru\n\n- Dua sumber kebenaran: salinan kedua selalu basi duluan dan basinya diam. Kalau harus ada salinan, sinkronkan lewat skrip dan gerbangi kesamaannya.\n- Bacaan wajib yang lebih besar dari jendela konteks. Sebab: MBG punya sembilan berkas berlabel wajib, 1.642 baris, nol pembaca. Yang bekerja: kanon sekali, suntikan hook per jenis berkas, sisanya gerbang mekanis.\n- Halaman tanpa login diperlakukan seperti halaman dalam. Ia dibuka orang luar dari HP kelas menengah-bawah di jaringan seluler dan penggunanya tidak mengeluh, mereka berhenti mengisi. Halaman publik dijaga ringan dan terdaftar (Betutu Sambe: /lacak, /absen).\n- Master data tanpa aktif/nonaktif. Begitu ada, semua layar harus menghormatinya, termasuk layar uang yang tidak boleh menagih entitas nonaktif.\n- Tanggal turunan yang jatuh di luar periode: barisnya ada, metriknya nol.\n- Konstanta yang seharusnya master data: tarif, pagu, potongan, hari libur, jam operasional jadi master data bertanggal berlaku, karena semuanya berubah mendadak.\n- Gerbang yang mendaftar per berkas, bukan per handler: satu pengecualian meloloskan semua handler lain di berkas yang sama dan berkasnya terlihat sudah terdaftar. Kegagalan paling sunyi.\n- Ratchet yang mengukur hantu tidak menekan siapa pun. Sebab: MBG, angka utang \"74 view tanpa security_invoker\" ternyata 90 persen artefak alat ukur (pemindai tak membaca alter view ... set yang dipasang belakangan, 45 kali, dan hanya mengenali = on bukan = true); ditakar ulang sisanya tujuh dan aman satu per satu. Angka besar yang salah lebih berbahaya daripada angka kecil yang benar karena membuat orang menyerah. Sebelum menaikkan batas, periksa alat ukurnya.\n- Satu pintu pemasangan mesin baru: BACA-DULU.md di akar adalah pintu tunggal untuk AI, akun, dan mesin apa pun; berkas konvensi tool lain menunjuk ke sana dan yang berlabel tipis wajib di bawah 2.000 huruf. Skrip mesin-baru memanggil semua pemasang tanpa menyalin langkahnya (menyalin melahirkan mesin terpasang setengah tanpa satu pesan galat), punya mode cek yang tidak mengubah apa pun, terdaftar sebagai skrip npm, dan tiap npm run serta berkas yang disebut harus benar-benar ada. Pintu yang menunjuk barang mati lebih buruk daripada tidak ada pintu.\n- Prop yang boleh dilupakan akan dilupakan: modul yang memikul keadaan memuat memikulnya sendiri, bukan menawarkannya sebagai pilihan.\n\nBab 06\n\n## Armada agent dan pemilihan model\n\nBab ini untuk siapa pun (orang atau AI) yang baru masuk sebuah repo dan harus memasang armada agent di dalamnya. Sesudah membacanya, kamu tahu kenapa armada wajib ada sejak hari pertama, model mana untuk kerja apa, berkas apa yang disalin, urutan perintahnya, dan gerbang apa yang menahan semuanya tetap benar. Sumber aslinya `~/.claude/AGEN.md`, hook `~/.claude/hooks/armada-agent-proyek.mjs`, dan empat repo yang sudah jalan (Worth It, Pangantara, Gemah Ripah, Betutu Sambe).\n\n### Kenapa ini wajib: sub-agent tanpa model diam-diam ikut Opus\n\nVonis pemilik 28 September 2026: \"ke depannya jika ada GitHub baru atau project baru, ini yang harus disetting awal.\" Pemicunya nyata. Di Gemah Ripah semua tugas latar jatuh ke agent bawaan `general-purpose` dan jalan di Opus, sampai panel Background tasks menampilkan empat agent Opus sekaligus. Padahal Pangantara sudah lama jalan di Sonnet dan Haiku karena tiap agentnya menulis `model:` sendiri.\n\nKegagalannya tidak pernah bersuara: hasilnya benar, ongkosnya berlipat, nol error. Dua catatan ukur memperkuatnya:\n\n- Vonis 12 September 2026: \"jangan semuanya make Opus atau semuanya make Fable\". Agent yang frontmatter-nya tidak menyebut `model:` mewarisi model sesi induk.\n- Ukuran 14 September 2026 atas 1.346 transkrip Pangantara: dari 330 dispatch Agent sepanjang riwayat, `general-purpose` 186 (56,4 persen) dan `Explore` 37 (11,2 persen). Jadi 67,6 persen kerja sub-agent lewat pintu yang kebijakan modelnya tidak menjangkau, dan 166 dari 186 dispatch `general-purpose` bahkan tidak menyebut parameter `model`. Kebijakan benar, berkas benar, dan tetap sekitar 88 persen armada berjalan di Opus.\n\nUrutan penentu model sebuah sub-agent, dari yang paling kuat:\n\n- parameter `model` pada panggilan Agent;\n- baris `model:` di frontmatter `.claude/agents/<nama>.md`;\n- env `CLAUDE_CODE_SUBAGENT_MODEL`;\n- kalau ketiganya kosong: ikut model sesi induk.\n\nAgent bawaan (`general-purpose`, `Explore`, `Plan`) tidak punya berkas, jadi hanya bisa diturunkan lewat nomor 1 atau 3. Itu sebabnya ada dua pagar yang berjalan bersamaan: agent bernama menulis `model:` sendiri, agent bawaan diturunkan oleh env (atau hook, lihat bawah).\n\n### Tingkat kerja lawan model\n\nYang menentukan tingkatnya adalah bentuk kerjanya, bukan seberapa penting modulnya. Modul uang yang kerjanya hanya mencocokkan pola tetap tingkat murah; modul sepele yang menuntut menimbang trade-off tetap tingkat nalar.\n\n| Bentuk kerja | Model | Contoh peran nyata |\n| --- | --- | --- |\n| Cocokkan pola, hitung, lapor. Aturannya sudah tertulis rapi, keluarannya daftar temuan | `haiku` | `guard-api` (tiap route punya gerbang peran), `rls-auditor` (policy tidak terlalu longgar atau terkunci total), `migrasi-idempoten`, `higiene-repo` (artefak build, duplikat, sisa debug), `selera-tabel`, `selera-angka` |\n| Baca beberapa berkas, simpulkan, usulkan atau kerjakan perbaikan | `sonnet` | semua pengerja modul (`mesin-harga`, `uang-kredit`, `akun-auth`), agent platform (`tukang-layar`, `db-migrator`, `penulis-e2e`, `penulis-gerbang`, `pelunas`, `mekanik-mesin`), pemeriksa nalar (`security-reviewer`, `uang-auditor`, `perf-reviewer`, `inp-reviewer`, `selera-guard`, `llm-auditor`) |\n| Rancang arah, putuskan trade-off, pegang kontrak | `opus` | sesi induk sendiri (orkestrator). Bukan agent berkas |\n\nAturan turunannya, semuanya dari bagian kebijakan model di `AGENTS.md` repo:\n\n- Opus merencanakan, model murah mengerjakan.\n- Naik tingkat butuh alasan, turun tingkat tidak. Isi `model: \"opus\"` pada panggilan tertentu hanya untuk alur uang (kredit, pembayaran), trigger atau RLS, dan migrasi berisiko.\n- Parameter `model` yang ditulis tangan pada sebuah panggilan selalu menang atas turunan otomatis. Itu alasan yang sah.\n- Prompt agent menyebut berkas atau glob-nya, bukan domainnya. Tingkat murah menurunkan tarif, bukan jumlah yang harus dibaca.\n- Langkah yang tidak saling bergantung dikirim paralel dalam satu pesan.\n- Agent baru tidak pernah boleh push, deploy, atau melonggarkan gerbang. Subagent tidak commit; sesi induk yang melakukannya.\n- Penulis kode bukan pengulasnya. Verifier adalah sub-agent baru tanpa riwayat pekerjanya, dan ia memeriksa sinyal nyata (test hijau, query yang membuktikan), bukan klaim \"sudah beres\".\n- Fan-out yang menulis memakai berkas disjoint atau `isolation: \"worktree\"`; fan-out yang hanya membaca aman di tree yang sama.\n\nSatu catatan versi: env memakai alias `sonnet`, yang selalu me
