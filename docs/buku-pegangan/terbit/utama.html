om kanan tabel invoice terpotong, lebar beda antar invoice | Lebar kolom piksel mutlak; kolom tambahan menyempitkan lainnya (19 Agt 2026: 8 lawan 7 kolom) | Lebar persen satu rumah berjumlah tepat 100%, table-fixed plus colgroup; th tanpa lebar piksel |\n| Nama panjang tercetak menimpa angka di Safari/iOS padahal Chrome rapi | truncate di td; WebKit mengabaikan overflow pada table-cell (19 Agt 2026) | Bungkus teks dalam anak span block truncate |\n\nRujukan\n\nBab 34\n\n## Resep: langkah demi langkah\n\nBab ini untuk AI yang baru masuk dan tidak boleh menebak. Tiap resep punya empat bagian tetap: kapan dipakai, langkah bernomor, bukti selesai, ranjau. Contoh khusus proyek ditandai \"(MBG: ...)\", \"(GR: ...)\", \"(BS: ...)\", \"(WI: ...)\"; path tanpa tanda berlaku di semua proyek berfondasi bersama (di proyek baru dibuat dengan nama sama). Alasan sebuah aturan ada di bab aturannya; di sini hanya urutan kerja.\n\n### Langkah nol untuk semua resep\n\n- Tentukan mode: A (app internal), B (halaman tanpa login), C (proyek web baru). Bila ambigu, tanya sekali.\n- Cari yang sudah ada: `npm run kg -- \"<kata kunci>\"`, lalu `npm run kg -- --impact <berkas>` untuk tiap berkas yang akan disentuh. Proyek tanpa knowledge graph memakai dokumen arsitektur dan `git grep`.\n- `git status --porcelain`. Berkas kotor yang bukan milikmu milik sesi lain: jangan disentuh dan jangan di-stage.\n- Sebelum migrasi, cek migrasi terakhir di remote (`list_migrations` lewat MCP Supabase) dan di `supabase/migrations/`.\n- Stage hanya berkas yang kamu sunting (tidak pernah `git add -A`), commit kecil berbahasa Indonesia huruf kecil, dorong ke `main` (satu-satunya branch).\n- Dari sesi agent: jangan `tsc --noEmit` manual dan jangan suite penuh di tengah giliran (hook menolak; Stop hook menjalankannya). Pakai `npx vitest run tests/unit/<nama>.test.ts`.\n\n\\---\n\n### 1. Menambah halaman daftar baru\n\n**Kapan dipakai:** ada data berbaris baru (supplier, retur, klaim) yang harus tampil sebagai halaman atau tab bertabel standar.\n\n#### Langkah\n\n- Buka kembaran terdekat dan bandingkan sepanjang kerja. (MBG: `components/monitoring/TabelAnggaranMingguan.tsx`.)\n- Daftarkan akses dulu: satu baris di `PAGE_ACCESS` (`lib/rbac.ts`) memakai konstanta grup peran; bawaan halaman tak terdaftar adalah ditolak. Bila masuk menu, tambah di `lib/nav-menu.ts` (ikon dari registri, sama dengan ikon tab dan legenda; maksimal sekitar 8 tab per menu); layar yang pindah meninggalkan alias di `lib/tab-lama.ts`.\n- `page.tsx` server tipis (props hanya `params`, `searchParams`), `loading.tsx` di batas grup rute, isi klien di `<Nama>View.tsx`.\n- Susun dengan `KerangkaHalaman` (`components/ui/KerangkaHalaman.tsx`), urutan slot tetap: kepala, area, ringkasan, cakupan, bar cari, periode, sub-tab, isi, log. Slot tak relevan dihilangkan.\n- Ringkasan: satu `RingkasanCard`, bawaan tertutup, putih satu warna. Periode: `WeekPeriodBar`, `MonthPeriodBar`, `HariPeriodeBar`, atau `RentangPeriodeBar`; periode yang tak di URL didaftarkan lewat `usePeriodeLayar` (`lib/periode-layar.ts`).\n- Satu `CariExportBar` dengan `onExport` dan `onCetak` berpasangan (ikon telanjang); tombol \"Tambah\" di slot `aksiAkhir`; kotak cari memakai `useCariLunak`.\n- Tabel di `TabelKartu`, kelas `table-app`, dua belas butir `docs/STANDAR-TABEL.md`: kolom No (`sel-nomor`) di kiri; `SortTh` dan `useTableSort`; uang `RpTd` atau `RpCell`; persen `PersenSel`; tanggal `TanggalSel`; status ikon polos; kaki `BarisTotalTabel`; grup `BarisGrupTabel` bawaan tertutup; kolom Aksi ikon telanjang (`AksiBarisTabel`). Tabel kosong tetap tergambar: kepala kolom plus satu `BarisKosong` \"Belum ada ...\".\n- Satu `LegendaTabel` di kaki kartu untuk semua sel berikon atau berwarna vonis, dibangun dari peta status yang sama dengan sel.\n- Data besar: `ambilSemua()` dengan `.order('id')`, tampil lewat `Paginasi`. Kerjakan tombol dummy (resep 9) dan ekspor (resep 8) di gelombang yang sama.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-selera.test.ts tests/unit/gerbang-standar-tabel.test.ts tests/unit/gerbang-kerangka-halaman.test.ts tests/unit/gerbang-pintu-fitur.test.ts` hijau; tabel baru nol utang di `tests/unit/utang-standar-tabel.json`.\n\n#### Ranjau\n\n- Halaman yang lupa masuk `PAGE_ACCESS` terlihat benar bagi Super Admin dan menolak orang lain; uji dengan satu peran biasa.\n- `min-h-screen` salah di HP, pakai `min-h-[100dvh]`; `overflow-x-auto` tulisan tangan ditolak hook, pakai `.tabel-gulir` atau `.tabel-muat`.\n\n\\---\n\n### 2. Menambah kolom atau tabel database\n\n**Kapan dipakai:** data baru perlu disimpan, atau aturan data harus ditegakkan di database, bukan di tampilan.\n\n#### Langkah\n\n- Semua objek DB lahir di `supabase/migrations/<stempel>_<nama_snake>.sql`; stempel lebih besar dari migrasi terakhir di repo dan remote, belum dipakai berkas lain (hook `blok-stempel-migrasi-ganda`). Tabel yang disentuh sudah lahir di stempel yang sama atau lebih tua.\n- Idempoten: `create table if not exists`, `add column if not exists`, `drop constraint if exists` lalu `add constraint`, `create index if not exists`, `drop policy if exists` sebelum tiap `create policy`. Contoh: `supabase/migrations/20261007840100_yon_tp_fase1.sql`.\n- Bentuk kolom: status ber-`check` (literal status di badan plpgsql wajib ada di constraint), uang `numeric`, waktu `timestamptz`, tanpa kolom generated, foreign key lengkap, master data diberi `aktif`.\n- Tabel baru wajib tiga lapis: `enable row level security`; policy berhelper (`is_staff()`, `get_my_sppg_ids()` atau padanannya, guard dibungkus `(select ...)`); `revoke ... from anon, public`. View baru `security_invoker = true`. Kursi tanpa wilayah melihat nol data.\n- Penjagaan rantai di trigger, bukan di tombol (status maju lewat fungsi, uang tak minus, harga dibekukan di baris); trigger tidak menelan error di rantai uang. Ganti signature fungsi: `drop function if exists` yang lama (jika tidak, lahir overload dan pemanggil dijawab PGRST203). Fungsi bersama ditulis ulang dari `pg_get_functiondef` DB live.\n- Terapkan lewat MCP `apply_migration`, lalu `npm run types:supabase` (hanya sesudah penerapan) dan `npm run types:cek`. Error TS sesudah regenerate adalah temuan; jangan kembalikan `lib/database.types.ts`.\n- Uji integrasi `tests/e2e/<nomor>-<nama>.sql` (aturan: `tests/e2e/README.md`): invarian bukan potret data, uji juga bahwa yang salah ditolak, tanpa `commit` (runner membungkus transaksi dan rollback).\n- Vonis di `tests/e2e/cakupan.json`: objek masuk `diuji` (nilai `\"<berkas>.sql A, B, C\"`) atau `dikecualikan` dengan alasan; `antre` tidak boleh tumbuh. Trigger di tabel alur uang wajib bervonis sebelum dibuat (hook `blok-trigger-alur-uang`, juga untuk `apply_migration`). Tabel dibaca layar bertombol dummy: vonis di `tests/e2e/cakupan-dummy.json` atau isi lewat dummy (resep 9).\n\n#### Bukti selesai\n\n- `DATABASE_URL=<cermin lokal> npm run test:e2e:db` hijau (hanya Postgres lokal atau cermin; skrip menolak host Supabase). Policy berat diukur sebagai pengguna sungguhan, sebab sebagai `postgres` RLS tidak berjalan.\n- `npx vitest run tests/unit/gerbang-test-integrasi.test.ts tests/unit/gerbang-dummy-layar.test.ts` hijau; `npm run drift:db` dan `npm run drift:hak-harapan` tanpa drift baru.\n\n#### Ranjau\n\n- View tidak kena RLS; `grant execute ... to authenticated` tidak menutup anon (objek baru mewarisi hak publik). Fungsi definer wajib `set search_path` dan memeriksa peran; fungsi invoker tidak diberi `set search_path`.\n- `create index if not exists` menguji nama, bukan isi; `lpad(seq, 3, '0')` memotong nomor ke-1000, pakai `greatest(3, length(...))`; PostgREST menolak seluruh `select` yang menyebut kolom belum ada.\n\n\\---\n\n### 3. Menambah route API\n\n**Kapan dipakai:** klien butuh operasi server yang tak cukup lewat PostgREST berpolicy (tulis lintas tabel, service role, AI, ekspor, halaman bertoken).\n\n#### Langkah\n\n- Tentukan kelas pemanggil: staf (`requireStaff`), pihak luar bertoken (`guardLinkAccess`, `guardLinkSubmit`), cron (`CRON_SECRET`), atau akun luar sah (pemasok, mitra) berpenjaga sendiri. \"Punya sesi\" bukan berarti staf: pendaftaran terbuka dan portal OTP memberi sesi sah ke siapa pun.\n- `app/api/<domain>/<nama>/route.ts` dengan `export const runtime = 'nodejs'` dan `maxDuration`. Bungkus handler dengan `amanJson` (`lib/api-aman.ts`) supaya galat selalu dibalas json.\n- Baris pertama handler adalah gerbang, sebelum membaca body atau menyentuh DB:\n\n```\n   const gate = await requireStaff(BUY)   // konstanta grup lib/rbac.ts, atau ANY_STAFF\n   if (!gate.ok) return gate.response\n```\n\nRoute yang mengubah data memakai `requireStaff(BUY, { tulis: true })` (kursi pantau ditolak); post yang sebenarnya membaca (ekspor, cetak, Summary AI) tidak.\n\n- Validasi masukan sendiri (tak ada pustaka skema): nilai sah lewat `includes()` pada daftar. Identitas pelaku dari `gate`, bukan body; id pihak lain dijawab 404; harga dari tabel server.\n- Data: `gate.supabase` (RLS ikut jalan) secara bawaan. `createAdminClient()` melewati RLS, jadi gerbang perannya satu-satunya pembatas; route admin ber-service-role menolak kursi bukan pusat. Tabel besar lewat `ambilSemua()`, `.in()` lewat `idsUntukIn()`. Aksi yang bisa terpanggil dua kali: kunci idempoten plus `rateLimitOk(<kunci>, N, detik)` dan `tooManyRequests()`.\n- Rute bertoken: resep 7. Cron: resep 16. AI: resep 6. Env baru: tambah nama ke `.env.example` dulu (hook `blok-env-tak-terdaftar`), isi di Vercel dan `.env.local`; `NEXT_PUBLIC_*` ter-inline saat build sehingga mengubahnya menuntut redeploy.\n\n#### Bukti selesai\n\n- `npx vitest run tests/integrasi/guard-route-api.test.ts` hijau (memanggil handler tanpa sesi, menuntut 401 atau 403; route baru otomatis tercakup), dan `npx vitest run tests/unit/gerbang-api-aman.test.ts tests/unit/gerbang-kursi-pantau.test.ts` hijau (ratchet tidak naik).\n\n#### Ranjau\n\n- Gerbang yang cuma `auth.getUser()` pernah membocorkan bucket bukti dan slip gaji; fungsi definer terbuka untuk `authenticated` bisa dipanggil lewat `/rest/v1/rpc/<nama>` tanpa melewati route.\n\n\\---\n\n### 4. Menambah aturan selera baru dari teguran pemilik\n\n**Kapan dipakai:** pemilik menegur tampilan atau kebiasaan (\"gw ga mau ada ... lagi\") dan teguran itu harus jadi aturan yang tak perlu diulang.\n\n#### Langkah\n\n- Tangkap kalimat pemilik dan tanggalnya (hook `tangkap-vonis.sh` menulis `.claude/vonis-terucap.md`, ditulis mesin). Bila bentrok dengan aturan lama, tulis vonis konflik bertanggal di `.claude/skills/selera-pinka/references/500-vonis-konflik.md` sebelum menulis kode. Yang belum diputus tidak ditebak.\n- Pilih satu rumah menurut pertanyaan yang dijawab: keputusan terkunci `100-kanon.md` §4, nilai persis `200-rincian-selera.md`, modul wajib `250-modul-baku.md` (baris Butuh, Pakai, Jangan), bentuk tabel `docs/STANDAR-TABEL.md`, sebab kegagalan deploy `700-ranjau-deploy.md`. Keputusan di tabel `selera_keputusan` ditarik lewat `npm run selera:tarik`.\n- Perbaiki seluruh kembarannya (`git grep`), bukan satu layar; yang meragukan jadi utang berplafon.\n- Pasang gerbang mekanis (resep 5). Bila tak bisa dimesinkan, tulis alasannya di berkas ranjau; diam tidak sah.\n- Tambahkan ke bab buku pegangan di `docs/BRIEF-TIM-WEBSITE-PINKA/` dari sumbernya, lalu `npm run brief:sync` (cek `npm run brief:check`). Halaman terbit ulang ke URL yang sama di `ARTIFACT.json`; jangan membuat artifact kedua.\n\n#### Bukti selesai\n\n- Gerbang baru pernah dilihat merah; `npm run selera:check`, `npm run brief:check`, dan gerbang selera hijau; tiga tempat terisi: sumber, gerbang, buku pegangan.\n\n#### Ranjau\n\n- Menaikkan plafon bukan perbaikan; hanya koreksi hitung yang sah dan komentarnya menyebut kata koreksi.\n\n\\---\n\n### 5. Menambah gerbang mekanis\n\n**Kapan dipakai:** satu kelas kesalahan harus tertolak otomatis (pelanggaran sumber, ukuran, impor, hak DB, selera).\n\n#### Langkah\n\n- Pilih titik paling hulu yang berpengganti pasti: hook PreToolUse (`.claude/hooks/blok-.mjs`*), Stop hook, pre-commit, pre-push, test `tests/unit/gerbang-`*`.test.ts`, dan untuk data yang bisa rusak dari jalur tulis mana pun trigger DB plus `tests/e2e/*.sql`.\n- Tulis `tests/unit/gerbang-<nama>.test.ts`:\n\n```\n   const PLAFON_UTANG = 12   // utang lama; hanya boleh turun\n   function pelanggar(): string[] { /* git ls-files, hapus komentar, periksa tiap pemanggilan */ }\n   it('<invarian>', () => {\n     const p = pelanggar()\n     expect(p.length, `daftar: ${p.join(', ')}. Perbaiki, jangan naikkan plafon`).toBeLessThanOrEqual(PLAFON_UTANG)\n   })\n   it('penjaga buta: pemindai masih menemukan sasaran', () => {\n     expect(semuaSasaran().length).toBeGreaterThan(40)\n   })\n```\n\n- Pemindai: baca `git ls-files` (bukan filesystem), kosongkan komentar tanpa menggeser nomor baris, saring nama tangkapan (`/^[\\w$]+$/`) sebelum `new RegExp`, periksa tiap pemanggilan. Untuk objek SQL: baca badan migrasi berstempel terakhir yang memasangnya, bukan nama berkasnya. Pemotong teks yang tak menemukan penandanya melempar galat.\n- Utang lama jadi ratchet (konstanta atau json seperti `utang-standar-tabel.json`), hanya turun; rapatkan begitu lunas, sampai nol: `npm run plafon:rapat` (cek `npm run plafon:cek`).\n- Falsifikasi sebelum menutup: buang satu langkah perbaikan, pastikan satu vonis memerah.\n- Hook: daftarkan di `.claude/settings.json` dan `.claude/hooks/KATALOG.md` (hook tak terdaftar dan baris hantu sama-sama ditolak).\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-<nama>.test.ts` hijau pada sumber sekarang dan merah pada contoh pelanggaran (hasil falsifikasi dicatat di komentar kepala berkas); Stop hook menjalankan suite penuh.\n\n#### Ranjau\n\n- Gerbang yang membaca berkas basi hijau selamanya; pemindai satu berkas buta begitu berkas dipecah (baca berkas plus impor satu tingkat); pengecualian per berkas mengebalkan semua komponen lain di dalamnya.\n- `grep -c` mencetak 0 dan keluar 1: `n=$(grep -c ...); case \"$n\" in '' | [!0-9]) n=0 ;; esac`. Json rusak mematikan gerbang pembacanya; parse tiap json ter-stage di pre-commit.\n\n\\---\n\n### 6. Menambah fitur AI\n\n**Kapan dipakai:** fitur memanggil model (ringkasan, ekstraksi dokumen, saran, judge), termasuk Summary AI di halaman baru.\n\n#### Langkah\n\n- Server menghitung semua angka (satu rumus per besaran); model hanya menulis narasi atau mengekstrak atribut. Bila model mati, server memulangkan heuristik berangka sama dengan badge sumber berubah. Angka kartu dari teks model ditolak.\n- Route `app/api/llm/<fitur>/route.ts` (atau `app/api/generate`, `app/api/parse`) berpola resep 3; contoh bentuk `app/api/llm/supplier-scorecard/route.ts`.\n- Lima syarat mati; kurang satu berarti belum selesai:\n- label fitur unik (untuk log dan kunci cache);\n- baris di `llm_log`: semua panggilan lewat `callChain` di `lib/llm.ts` (`extractFromText`, `extractFromImages`), tidak memanggil penyedia langsung;\n- apply-rate: tiap saran bertanda dipakai atau diabaikan (kolom `applied`), antrean lewat `lib/aiQueue.ts`;\n- cache hash-prompt di `ai_hasil_cache` (`lib/ai-cache.ts`, sha256 prompt yang dikirim, fail-open);\n- korpus koreksi `ai_koreksi` (`lib/ai-koreksi.ts`): selisih tebakan model dan keputusan manusia saat Simpan dicatat dan ditempel sebagai few-shot panggilan berikutnya; hanya yang berbeda yang dicatat.\n- Kuota: `rateLimitOk('ai:' + gate.userId + ':<fitur>', N, detik)` dan `tooManyRequests()`. Route baru wajib; plafon route tanpa kuota hanya turun (MBG: 46 per 3 Okt 2026).\n- Isi dokumen luar adalah data, bukan perintah: aturan data menempel tanpa syarat di system prompt, teks dipagari penanda mulai dan selesai. `href` aksi dari allowlist di kode (`components/summary-ai/tujuan.ts`), deep-link mendarat di barisnya (`?fokus=`).\n- Summary AI berbentuk baku (Ringkasan Eksekutif terbuka awal, Action Plan, Kondisi Per Aspek, Perlu tindakan, Rincian); tombol hanya dari `SummaryAiTombol` lewat slot `onSummary`. Periksa dengan agent `llm-auditor`.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-ai-kuota.test.ts tests/unit/gerbang-bukti-llm.test.ts tests/unit/gerbang-deep-link.test.ts` hijau; ratchet tidak naik.\n\n#### Ranjau\n\n- Satu koreksi keliru membentuk tiap jawaban sesudahnya; label di papan Belajar tidak boleh berbohong soal koreksi yang sudah terkirim.\n\n\\---\n\n### 7. Menambah link eksternal tanpa login (Mode B)\n\n**Kapan dipakai:** pihak luar (supplier, koperasi, sekolah, petani, kurir) menyelesaikan bagiannya lewat link WA tanpa akun.\n\n#### Langkah\n\n- Pilih jenis: satu link standing per pihak (urusan berulang) atau satu link per dokumen berTTL 14 hari (`LINK_TTL_DAYS`, `computeLinkExpiry` di `lib/external-link-guard.ts`).\n- Tabel link seragam (resep 2): `token` dengan default DB `encode(gen_random_bytes(18), 'hex')`, `status` ber-`check` (`active`, `submitted`, `revoked`), `opened_at`, `submitted_at`, `expires_at`, unique partial index satu link aktif per referensi, RLS aktif; baca publik lewat route server.\n- Slug permanen terbaca di `lib/external-slug.ts` (`supplierSlug`, `kdmpSlug`, `invoiceSlug`; awalan berbeda per jenis). Token tetap di belakang, dibuat otomatis saat slug dibuka; rute lama jadi redirect, bukan 404.\n- Halaman `app/<jenis>/[token]/page.tsx` dan route `app/api/<jenis>/route.ts`: `guardLinkAccess` (revoked dan expired 410 dengan arah tindakan), `guardLinkSubmit` (submitted 409). Pengaju dibaca dari baris token di server, bukan body; satu token per orang.\n- Isi lima registri sekaligus: konstanta rute publik di `middleware.ts`, rantai negasi sebelum redirect di middleware, `PUBLIC_API`, `RUTE_BERTOKEN` di `lib/sensor-jalur.ts` (penyensor Web Analytics, diadu dua arah dengan folder `app`), dan registri pengecualian `requireStaff` beralasan di gerbang route. Prefix dibandingkan per segmen, bukan `startsWith` mentah.\n- Halaman Mode B: `max-w-2xl`, `min-h-[100dvh]`; bar status, kartu identitas, panel putih, aksi sticky bawah, bottom-sheet konfirmasi (`items-end` di HP, tengah di desktop); skeleton, kosong, dan galat berarah; isian lewat `InputTelepon`, `InputRupiah`, `InputBerkas`; ringkasan review sebelum submit; foto dikompres di bawah 5 MB; setelah submit link terkunci.\n- Fitur lahir bersama tombol WA (`WaIcon`; pesan: sapaan, konteks bernomor dokumen, link baris sendiri, satu instruksi, \"Terima kasih\") dan hub pengelolanya di halaman internal. Link langsung dibuka, tanpa tombol salin. Tambah `noindex`, LCP di bawah 2,5 detik, dan masukkan ke sapuan INP (resep 10).\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-rute-publik.test.ts tests/unit/gerbang-analytics-token.test.ts tests/unit/gerbang-halaman-bertoken-noindex.test.ts tests/unit/external-link-guard.test.ts` hijau.\n- `curl -i <url>/<jenis>/<slug>` tanpa cookie membalas halaman, bukan 307 ke `/login`; token salah 404, dicabut 410, kirim kedua 409 (`npm run asap:publik` mengetuk rute terpasang).\n\n#### Ranjau\n\n- Rute tak terdaftar mati diam: orang luar berhenti mengisi dan tabel pendaftaran kosong terbaca \"fiturnya belum dibuat\".\n- Satu link untuk semua orang membuka klaim orang lain; token di jalur URL ikut ke Web Analytics bila penyensor lupa; route publik tanpa `amanJson` menghasilkan \"Unexpected end of JSON input\" di HP pihak luar.\n\n\\---\n\n### 8. Menambah ekspor Excel, PDF, Word, dan dokumen cetak\n\n**Kapan dipakai:** daftar atau dokumen harus bisa diunduh atau dicetak dan bisa ditumpuk dengan kertas kerja lama.\n\n#### Langkah\n\n- Pilih format menurut nasib berkas: Excel bila dihitung ulang, PDF bila dibaca dan diarsipkan, Word bila disunting orang lain. Bar baku hanya dua ikon (Excel dan PDF), berpasangan; ikon ketiga menunggu vonis pemilik.\n- Satu pintu per bar: slot `onExport` dan `onCetak` pada `CariExportBar`; tanpa kotak cari dan dataset: `EksporCetak`; dataset terdaftar: `ExportButton` (digerakkan `datasetKeys`).\n- Dataset di `lib/export/datasets*.ts` (tambah di berkas pecahan seperti `datasets-barang-ops.ts`, sisipkan lewat spread). Kunci unik (`getDataset()` memakai `.find`), uang `format: 'rp'`, kolom sensitif disembunyikan per peran lewat `roleHiddenColumns`.\n- Lembar dibentuk lewat `lib/export/tipe-lembar.ts`, dirender `client-export.ts` (PDF, cetak) dan `xlsx-render.ts` (Excel). Tiap slot penyaji hidup di kedua perender, hitungan di satu modul; warna dari fungsi tema (`lib/tema-dokumen.ts`, `xlsx-theme.ts`), bukan konstanta ARGB.\n- A4 selalu: Excel lewat `terapkanCetakA4` sebelum `writeBuffer()`; cetak browser lewat CSS global dengan pembungkus `.print-area` dan `@page { margin: 0 }`; nomor halaman digambar mesin cetak; `thead` maksimal tiga baris supaya berulang tiap halaman.\n- Dokumen bersurat memakai `KopSurat` dan didaftarkan di `DOKUMEN_CETAK` (`tests/unit/gerbang-kop-surat.test.ts`; lembar `.print-area` tak terdaftar ditolak hook `blok-lembar-cetak-tak-terdaftar`). Dokumen resmi ber-template dinas dari docx asli lewat `docxtemplater` (`lib/docx-fill.ts`). Tampilan: Rp kiri angka kanan (`NilaiDok`), jam berpemisah titik dua, nol kapital penuh, nol em dash; unduhan banyak berkas dibungkus ZIP.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-cetak-a4.test.ts tests/unit/gerbang-ekspor-ganda.test.ts tests/unit/gerbang-kop-surat.test.ts tests/unit/client-export.test.ts` hijau.\n\n#### Ranjau\n\n- Chromium hanya mengulang `thead` yang lebih pendek dari 25 persen halaman, tanpa peringatan; `window.print()` tanpa `@page` mengikuti kertas printer; sheet ExcelJS tanpa `paperSize` bukan A4.\n- Payload Excel lewat json dengan validator yang menyalin sebagian field menghilangkan gabung sel dan logo di Excel sementara PDF benar.\n\n\\---\n\n### 9. Menambah tombol isi data dummy untuk halaman baru\n\n**Kapan dipakai:** halaman atau modul baru lahir dan fiturnya harus bisa dinilai pemilik pada hari jadinya.\n\n#### Langkah\n\n- Baca `~/.claude/DUMMY.md`. Intinya: dua ikon (isi dan hapus), Super Admin saja, isi ditentukan halaman yang sedang dibuka. (MBG: tombol dicabut dari nav sejak 22 Sep 2026; mesin dan gerbang tetap hidup, kerja dummy tetap wajib, dan `gerbang-dummy` menahan tombolnya dirender lagi.)\n- Sisi aplikasi `lib/dummy-modul.ts`: tambah ke `DUMMY_MODUL`, `LABEL_MODUL`, `PETA_HALAMAN`. Halaman yang berbagi tabel memakai modul yang sama (Invoice dan Pembayaran memakai modul order).\n- Sisi DB (migrasi, resep 2; contoh `supabase/migrations/20261007840200_dummy_yon_tp.sql`): fungsi `dummy_modul_<nama>(p_sppg_id integer, p_tgl date[])` bergerbang peran; trigger `dummy_catat_trg` di tiap tabel yang ditulis; nama fungsi masuk `dummy_rantai` hulu ke hilir (tulis ulang utuh dari definisi live).\n- Isi dari rantai sungguhan, bukan konstanta; periode yang terpampang, per hari; tiap ember status terisi minimal satu; sisi yang dibandingkan layar tak pernah sama rata (satu kurang, satu lebih); tanggal turunan dijepit ke periode; induk dipilih yang aktif; kolom generated tak ditulis. Ember berpenjaga dicapai lewat pintunya, tidak dengan mematikan gerbang.\n- Buku langkah `dummy_langkah(fungsi, cakupan_id, periode_kunci)`: catat sebelum jalan; langkah yang melapor nol baris dicabut; tombol hapus mengosongkan buku. Yang diubah disimpan nilai lamanya.\n- Vonis tiap tabel yang dibaca layar di `tests/e2e/cakupan-dummy.json`: `induk` (haram dilahirkan), `jejak` (log dari trigger), `luar` (lahir saat manusia menekan tombol link), `antre` (utang, hanya menyusut). Periode yang hidup di state didaftarkan lewat `usePeriodeLayar`; layar muat ulang penuh sesudah isi dan hapus.\n- Tambah asersi ke `tests/e2e/05-dummy-jejak.sql`: isi, hapus, hitung (tiap tabel kembali ke jumlah semula, sesudah menyapu dummy lama lebih dulu); satu kurang dan satu lebih di tiap sumbu selisih; pasangan kelas C (langkah hilir tanpa hulu melapor nol dan tak tercatat; sesudah rantai penuh melahirkan dan tercatat). Panggil fungsi yang menyuapi tiap tab dan kartu, pastikan tiap kolom bukan nol.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-dummy.test.ts tests/unit/gerbang-dummy-layar.test.ts` hijau; `DATABASE_URL=<cermin lokal> npm run test:e2e:db` hijau pada `05-dummy-jejak.sql`.\n- Di cermin selisih jumlah baris sesudah hapus nol (negatif berarti data asli ikut terhapus, lebih buruk dari positif); semua tab halaman berangka.\n\n#### Ranjau\n\n- Tombol melapor sukses tetapi layar kosong: tabel ditulis satu modul padahal dibaca banyak halaman (kelas A), dua sisi disamakan seperti harga jual diisi harga beli (kelas B), atau buku mencatat fungsi yang melahirkan nol baris (kelas C).\n\n\\---\n\n### 10. Memperbaiki klik yang membekukan layar (INP)\n\n**Kapan dipakai:** klik, tab, paginasi, sort, atau kotak cari terasa beku, overlay INP muncul, atau kontrol berchrome baru dibuat.\n\n#### Langkah\n\n- Baca `~/.claude/INP.md`. Prinsip: chrome kontrol (pil aktif, chevron, panah sort) urgent dan murah, subtree berat (tabel, peta, grid) deferred. Membungkus seluruh `setState` dalam transition bukan obatnya.\n- Tentukan kelas menurut di mana state tinggal; perkakas di `components/ui/transisi.ts`:\n- state tak menggambar chrome (tombol yang memindahkan tabel di tempat lain): bungkus callback dengan `transisi()`;\n- kontrol dengan `children` (akordeon, kategori lipat): `useDeferredValue` untuk isi;\n- parent memegang state dan isi berat (tab, paginasi, segmen, kotak cari): echo urgent plus parent deferred lewat `useEchoLunak`, `useEchoHimpunan`, `useCariLunak`, `useCariEcho`;\n- `usePathname()` (pill nav, mini-tab ber-`href`): `useNavLunak`. Kelas kelima tak kelihatan dari kode: cat tak datang karena render deferred terjadwal sebelum frame tercat. Obatnya satu tempat, `setelahCat` di rumah perkakas itu; jangan menulis ulang di pemanggil.\n- Ketikan kotak cari, input teks, dan centang tunggal tidak ditunda.\n- Kontrol bersama (`PageTabs`, `Paginasi`, `SortTh`, bar periode, `KategoriLipat`, `CariExportBar`) sudah memikul pola; halaman tak menulis kontrol sendiri. Sapuan menyeluruh: skill `inp-sweep`, satu agent `inp-reviewer` per wilayah; halaman tanpa login wilayah sendiri.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-inp-transisi.test.ts` hijau (gerbang membaca badan hook lewat AST; mencabut `setelahCat` memerahkannya).\n- Diukur di browser dengan CPU 4x lebih lambat: interaksi sampai cat berikutnya di bawah 200 ms; dua klik cepat \"bulan berikutnya\" tak menghasilkan data campuran.\n\n#### Ranjau\n\n- Handler plus render urgent 1 sampai 8 ms tetapi long task 130 sampai 260 ms sesudahnya: kelas kelima, bukan masalah handler.\n\n\\---\n\n### 11. Menambah agent ke armada\n\n**Kapan dipakai:** ada wilayah atau fungsi yang berulang dikerjakan atau diperiksa tetapi tak punya pemilik, atau proyek baru perlu armada sejak hari pertama.\n\n#### Langkah\n\n- Tentukan kelas: pengerja domain (Sonnet, ber-`milik` glob), platform (Sonnet), pemeriksa pola (Haiku), pemeriksa nalar (Sonnet), perencana (Opus). Satu agent satu fungsi; jangan menambah agent yang bersaing dengan kanon.\n- Tambah entri di `scripts/agents/roster.json` (`nama`, `ringkas`, `kapan`, `model`, `fokus[]`, `larangan`, `kelas`, `bisa`, `tidak`, `milik` untuk pengerja). Model wajib tertulis; tanpa itu agent diam-diam ikut Opus. Tiap berkas punya tepat satu pemilik (`node scripts/agents/ilmu.mjs pemilik <berkas>`).\n- `npm run agents:build` menghasilkan `.claude/agents/<nama>.md`, kerangka `.claude/ilmu-agent/<nama>.md`, dan `KATALOG.md`; jangan menyunting hasilnya, sunting roster.\n- Isi ilmu dari kode nyata (peta berkas dan tabel, aturan, ranjau, gerbang, kasus), minimal 2000 karakter, dikerjakan agent Sonnet paralel; prompt menyebut berkas atau glob, bukan domain.\n- Perbarui router di `AGENTS.md` (angka yang dipamerkan harus benar), lalu `npm run agents:check`. Agent bawaan (`general-purpose`, `Explore`, `Plan`) tak punya berkas dan mewarisi model induk; hook `arah-model-subagent.mjs` mengisi `model: sonnet` bila tak disebut.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-model-agent.test.ts tests/unit/gerbang-ilmu-agent.test.ts` hijau; `node scripts/agents/ilmu.mjs cek <nama> <berkas>` menjawab baru, lalu lewati sesudah `catat`.\n\n#### Ranjau\n\n- Terukur 166 dari 186 dispatch general-purpose tanpa parameter model: 88 persen armada jalan di Opus.\n- Dua agent pada berkas sama menghasilkan balapan; prompt yang menyebut domain, bukan berkas, menghabiskan ratusan ribu token untuk hasil satu layar.\n\n\\---\n\n### 12. Menambah routine terjadwal\n\n**Kapan dipakai:** kerja agen harus berjalan sendiri pada jadwal (penjaga produksi, pembaru dokumen, sapuan malam), di luar cron aplikasi.\n\n#### Langkah\n\n- Tulis kontraknya di repo (contoh `.claude/night-shift.md`): tugas, batas, cara berhenti. Prompt routine hidup di luar git (`~/.claude/scheduled-tasks/<nama>/SKILL.md`), jadi wajib tipis dan hanya menunjuk kontrak itu.\n- Daftarkan di `.claude/routines.json` (`nama`, `kontrak`, `jadwal` WIB). Gerbang `tests/unit/gerbang-routine-terdaftar.test.ts` menuntut tiap routine enabled di tepat satu akun atau organisasi dan `cwd`-nya ada.\n- Rancang perilaku: hanya menyentuh yang disebut kontrak; berhenti tanpa menulis bila tak ada yang berubah; push dengan refspec eksplisit `git push origin HEAD:main`; stage berkas yang disunting saja.\n- Kerja berat di luar jam kerja, jadwal WIB (MBG: pembaru buku pegangan 21:00, penjaga produksi 05:00), di mesin 24 jam (`npm run mesin:pasang`); task yang sama di laptop dihapus.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/gerbang-routine-terdaftar.test.ts` hijau; satu run manual menulis hanya yang seharusnya dan hari tanpa perubahan berhenti tanpa commit; halaman Routines di aplikasi menampilkannya.\n\n#### Ranjau\n\n- Prompt di luar git bisa basi atau hilang tanpa jejak; pegangan satu-satunya registri dan kontrak di repo.\n\n\\---\n\n### 13. Push ditolak gerbang, CI merah, atau Vercel gagal\n\n**Kapan dipakai:** dialog Commit atau Push gagal, tab Actions merah, deploy Vercel error atau blocked, atau \"kok belum live\".\n\n#### Langkah\n\n- Diagnosa 60 detik: `gh run list --limit 5`, `gh run view <id> --log-failed`, `git log --oneline -3`; Vercel: daftar deployment untuk state, log build `errorsOnly`, log runtime bila ready tetapi app salah. Baca state dulu (blocked, canceled, error berbeda) dan error pertama, bukan terakhir.\n- Cocokkan kombinasi: Vercel ready dan CI merah berarti test merah (app sehat); keduanya error berarti TS atau eslint; Vercel error dan CI hijau berarti beda lingkungan (Node, env, casing berkas); semua hijau tetapi salah berarti runtime; blocked berarti author bukan member team (`git commit --amend --reset-author`).\n- Cocokkan gejala di katalog `.claude/skills/selera-pinka/references/700-ranjau-deploy.md` §3 (per jalur); jangan membaca berkas itu utuh (1,7 MB). Protokol lengkap: skill `beresin-gagal-deploy`.\n- Vonis yang menyebut berkas yang tak kamu sentuh hampir selalu tabrakan sesi (`git status --porcelain`); satu vonis push berlaku untuk seluruh mesin. Vonis transien tak ditutup dengan \"hijau di disk\": jalankan ulang gerbang yang dituduh.\n- Lapis 1: perbaiki kodenya sampai perkakas yang merah hijau dan commit benar-benar ter-push. `--no-verify` bukan jalan keluar (`ignoreBuildErrors` dan `ignoreDuringBuilds` tetap false); jangan melonggarkan gerbang.\n- Lapis 2: tambah satu baris di tabel §3 yang sesuai di `700-ranjau-deploy.md` (empat kolom, bertanggal). Lapis 3: pasang penjaga di titik paling hulu yang pernah dibuat merah sekali (resep 5).\n- Tutup vonis: `npm run vonis:status` (nol terbuka berarti bersih), lalu `npm run vonis:tutup -- <sha8> --gerbang=tests/unit/gerbang-x.test.ts --catatan=\"700 §3.x\"` atau `--alasan=\"kenapa belum bisa dimesinkan; lubangnya di 700 §6\"`. Gerbang yang disebut harus ada di disk.\n\n#### Bukti selesai\n\n- Perkakas yang merah hijau, `git push` berhasil, `gh run list --limit 1` hijau, deployment terbaru ready, `npm run vonis:status` nol terbuka, satu baris di 700 §3 beserta gerbang atau alasan tertulis.\n\n#### Ranjau\n\n- Berhenti di lapis 1 sama dengan setengah pekerjaan; kelas yang cuma ditambal sekali meledak lagi dan lebih mahal. Lima pemeriksa berbeda cakupan (pre-commit, pre-push, Stop hook, CI, build Vercel): hijau di satu tempat bukan jaminan.\n- Build Vercel gagal tanpa log hanya tiga sebab di luar kode: `vercel.json` tak sah, Ignored Build Step menolak, atau commit dari bukan member team.\n\n\\---\n\n### 14. Menyerahkan pekerjaan: preflight dan definisi selesai\n\n**Kapan dipakai:** sebelum menyatakan \"selesai\" untuk perubahan apa pun.\n\n#### Langkah\n\n- Mode dan Design Read dinyatakan di awal kerja, bukan direka belakangan.\n- Blok universal `600-preflight.md`: nol em dash di seluruh keluaran; dark mode di tiap elemen baru dan dibuka di dua mode; kontras AA 4,5 banding 1; `focus-visible`; satu intent CTA satu label tanpa wrap; siklus state lengkap; nol keterangan kecil (`grep -n 'hint='` kosong); nol ruang menganga; nol baris kedua di sel, chip, badge, tombol; `min-h-[100dvh]`; runtuh mobile eksplisit; `package.json` dicek sebelum mengimpor apa pun. Lalu blok mode: Mode A (`table-app`, legenda, popup `ModalOverlay`) atau Mode B (resep 7); bandingkan dengan kembaran layar.\n- Definisi selesai: migrasi ter-apply dan teruji; typecheck nol error, lint lolos, test hijau sesuai kebijakan, build lolos; `npm run kg:build` bila struktur berubah; data awal dan dummy halaman ada bila fiturnya butuh (resep 9), angka dummy berlabel.\n- Commit bersih: huruf kecil, deskriptif, Indonesia, tanpa em dash, author identitas pemilik (MBG: `mbgbangkabelitung`; author lain membuat deploy blocked). Dorong ke `main`; pekerjaan di branch lain belum selesai.\n- Balasan akhir: link siap klik dan catatan eksplisit apa yang belum live. Bila ada yang gagal, sebut akar masalah dan solusinya; jangan melapor selesai dan jangan berputar. Dua sumber bertabrakan: sumber lengkap menang; dua-duanya lengkap: kanon, tanggal terbaru, vonis konflik. Keputusan pemilik tak dibuka lagi tanpa pemilik.\n\n#### Bukti selesai\n\n- Semua kotak preflight sesuai mode terpenuhi (satu kotak gagal berarti belum selesai); `git log -1` berautor benar; `git status --porcelain` bersih dari berkasmu; `npm run vonis:status` nol terbuka; deployment terakhir ready.\n\n#### Ranjau\n\n- Hijau lokal bukan hijau CI (jalur GUI tak pernah menyentuh Stop hook); yang belum ter-push belum live.\n\n\\---\n\n### 15. Memulai modul besar baru\n\n**Kapan dipakai:** fitur multi-langkah, menyentuh lebih dari tiga berkas, butuh keputusan yang harus disepakati, atau proyek baru.\n\n#### Langkah\n\n- Permintaan \"bikinin\" mengizinkan merencanakan dulu, bukan menulis kode. Perubahan 1 sampai 2 berkas tak perlu prosedur ini. Untuk repo asing atau menilai \"apa yang belum ada\", panggil agent `pemeta-sistem` (memetakan ke katalog `~/.claude/FITUR.md`: ada, hilang, menyimpang, pola yang layak dibawa).\n- Tulis `docs/usulan/<nama-kebab>/`: `proposal.md` (Kenapa, Apa yang Berubah, Kemampuan, Dampak dari `kg --impact`, Non-tujuan), `spec.md` (skenario KETIKA dan MAKA), `desain.md` bila ada pilihan teknis nyata, `tugas.md` (tiap tugas membawa cara verifikasinya).\n- Berhenti di artefak: \"Usulan siap direview. Kalau setuju, bilang kerjakan.\" Pilihan yang belum diputus ditulis sebagai rekomendasi, tidak ditebak.\n- Sesudah setuju, sortir ke tiga ember. Hari pertama (sebelum halaman kedua): rumah tema, format angka dan tanggal dan uang, periode plus sinkron URL, transisi INP, peta RBAC untuk nav dan guard, RLS tiap tabel, guard API satu pintu, migrasi berurut idempoten, gerbang mekanis walau daftarnya kosong, tombol dummy plus tabel jejak. Boleh menyusul: halaman, kolom, laporan, dataset ekspor. Menyusul tetapi mahal (rancang slotnya sejak awal): audit trail, cakupan data per unit, link token pihak luar, jejak dummy lewat trigger, penomoran dokumen, satu rumus uang. Sebelum halaman kesepuluh: kontrol tabel dan periode bersama, bar cari plus ekspor, `ActivityLog`, katalog cron, galat klien ke DB, sapuan INP menyeluruh.\n- Proyek baru: satu repo per usaha, hanya `main`; cangkok fondasi dari repo terdekat (yang generik dibawa, modul domain asal tidak); merek diputus pemilik; armada agent (resep 11); `BACA-DULU.md` di akar sebagai pintu tunggal; tombol dummy (resep 9); gerbang fase awal: husky, CI, gerbang deploy, penangkap galat, `vercel.json` ber-cron, header keamanan.\n- Urutan fase: tampilan dan gerbang, lalu celah keamanan ditutup (saldo yang bisa diubah sendiri, fungsi terbuka, SSRF, harga dari klien, AI tanpa kuota), baru data bernilai masuk DB.\n\n#### Bukti selesai\n\n- Artefak usulan ada dan pemilik setuju sebelum kode app disentuh; ember hari pertama terisi sebelum halaman kedua; `npm run kg:check` segar; preflight (resep 14) lolos.\n\n#### Ranjau\n\n- Salah menaruh sesuatu di ember ketiga dibayar berbulan-bulan; ongkos fitur ditentukan jumlah halaman yang lahir tanpa dia.\n\n\\---\n\n### 16. Menambah cron aplikasi\n\n**Kapan dipakai:** ada kerja berkala di server aplikasi (pengingat, sapuan, pelaporan) yang ringan dan muat batas fungsi.\n\n#### Langkah\n\n- Cek dulu apakah bisa dititipkan ke cron rumah (MBG: `ops-automation`, `finance-automation`). Kerja berat atau berkunci berbayar jalan di mesin 24 jam, bukan cron Vercel.\n- `app/api/cron/<nama>/route.ts`: `runtime = 'nodejs'`, `maxDuration`, proteksi `CRON_SECRET` (Bearer), `isCronEnabled('<nama>')` (`lib/cron-switch.ts`) agar bisa dimatikan, jejak `automation_runs` lewat `lib/cron-jejak.ts` (status hanya `running`, `ok`, `warn`, `failed`; galat lewat `serialisasiErrorCron`, bukan `String(error)`).\n- Daftarkan di `vercel.json` (`path`, `schedule` UTC; WIB = UTC+7) dan `lib/cronCatalog.ts` (`name` sama dengan kunci sakelar dan basename path, jadwal WIB, ekspresi mentah, kanal, `togglable`). Tulis massal di luar jam kerja; Hobby paling sering sekali sehari.\n\n#### Bukti selesai\n\n- `npx vitest run tests/unit/cron-switch.test.ts tests/unit/cron-jejak-serialisasi-error.test.ts tests/unit/gerbang-deploy.test.ts` hijau; panggilan manual dengan `Authorization: Bearer <CRON_SECRET>` menghasilkan satu baris `automation_runs` berstatus `ok`, tanpa header dijawab 401.\n\n#### Ranjau\n\n- Tanpa baris `automation_runs`, \"tidak ada barisnya\" dan \"tidak pernah dipanggil\" terlihat sama; cron N+1 per dapur mati di tengah pada ribuan dapur, gagal diam; `CRON_SECRET` lupa diisi di Vercel membuat semua cron 401 diam-diam.\n\n\\---\n\n### 17. Menambah fungsi SQL atau RPC\n\n**Kapan dipakai:** logika harus tinggal di database (rantai uang, penomoran, pengisi dummy) atau klien butuh hasil satu transaksi.\n\n#### Langkah\n\n- Tentukan peran fungsi: invoker (kamus murni, dipakai trigger atau view) atau `security definer`. Pintu yang tak dipakai kode aplikasi tidak dibuka.\n- Di migrasi (resep 2): definer wajib `set search_path = public, pg_temp` dan memeriksa peran di badannya. Gerbang peran menyaring sesi login tanpa profil, bukan semua yang bukan staf: `(select public.is_staff() or auth.role() is distinct from 'authenticated')`, karena cron, route admin client, dan pg_cron berperan null. RPC definer per wilayah menyaring cakupan sendiri (`s.id in (select get_my_sppg_ids())`). `get_my_role()` mengembalikan enum: bandingkan `::text`.\n- Hak: `revoke all on function ... from anon, public`; `grant execute ... to authenticated` hanya bila dipanggil browser; fungsi trigger dan fungsi yang hanya dipanggil fungsi lain atau service role tak di-grant.\n- Hasil set-returning terpotong 1000 baris tanpa error: bungkus jadi satu baris `jsonb` bila besar. Fungsi bersama beberapa sesi punya pemilik tunggal: aturan baru adalah fungsi aturan plus satu baris panggilan di pemilik, bukan penyapu baru.\n- Terapkan lewat `apply_migration`, `npm run types:supabase`, baru `.rpc('nama')` di aplikasi (hook `blok-rpc-tanpa-types` menolak sebelumnya). Uji di `tests/e2e/*.sql`, termasuk asersi peran di `06-rpc-authenticated.sql` bila dipanggil browser (anon ditolak, tanpa peran ditolak, peran sah lolos); vonis di `cakupan.json`; `npm run drift:hak-harapan` bila hak berubah.\n\n#### Bukti selesai\n\n- `DATABASE_URL=<cermin lokal> npm run test:e2e:db` hijau; `npx vitest run tests/unit/gerbang-test-integrasi.test.ts tests/unit/gerbang-drift-hak-harapan.test.ts` hijau; plafon pintu definer telanjang tetap nol.\n\n#### Ranjau\n\n- `authenticated` bukan ambang cukup: 242 fungsi pernah bisa dipanggil siapa pun bersesi lewat `/rest/v1/rpc`.\n- `set search_path` pada fungsi invoker kecil mematikan inlining dan peta tembus `statement_timeout`.\n\nBab 35\n\n## Kamus: semua yang pernah dibuat\n\nKamus ini memuat semua hal bernama yang pernah dibuat di proyek pemilik, dengan arti, letak, dan langkah pakainya. Bentuk tiap entri: nama tebal, letak berkas atau perintah dalam tanda kutip balik, proyek (MBG, GR, BS, WI, atau semua), arti satu kalimat, lalu langkah pakai. Entri diurut abjad di dalam kelompoknya. Istilah murni merujuk ke bab yang membahasnya; bab lain memakai nama yang sama persis dengan yang tertulis di sini. Gerbang pada kelompok 5 ditulis sebagai tabel karena jumlahnya ratusan; arti lengkap tiap gerbang ada di kepala berkas tes-nya.\n\n### 1. Istilah dan konsep\n\n- **Armada agent** `~/.claude/AGEN.md, scripts/agents/roster.json` (proyek: semua): kumpulan agent bernama per repo (pengerja Sonnet, pemeriksa pola Haiku) lengkap dengan ilmu dan jejak masing-masing. Langkah: 1) Salin roster dari repo terdekat 2) jalankan npm run agents:build 3) pastikan tiap agent bermodel tertulis. Lihat bab Armada agent dan pemilihan model.\n- **Audit trail** `lib/riwayat-perubahan.ts, view audit_trail` (proyek: MBG, GR, BS): jejak siapa mengubah apa, direkam trigger ke audit_log dan dibaca lewat ActivityLog. Langkah: 1) Pasang trigger audit di tabel baru 2) tampilkan lewat komponen RiwayatPerubahan.\n- **Bekal** `bekal/, bekal/mesin-baru.sh` (proyek: MBG): bundel lapisan global (aturan, hook, agent, skill, routine) yang bisa dipasang ulang di mesin baru. Langkah: 1) bash bekal/mesin-baru.sh cek 2) bash bekal/mesin-baru.sh pasang kerja 3) cek lagi sampai nol baris kurang.\n- **BGN** `lib/dokumen-bgn.ts` (proyek: MBG): Badan Gizi Nasional, pemilik program; kop dokumen, kode, dan juknis (401.1/2025) dalam sistem mengikuti BGN. Langkah: Lihat bab Ekspor dan dokumen cetak.\n- **BOM** `tabel recipe_items, lib/recipe-items.ts` (proyek: MBG): bill of material: bahan per resep per porsi yang menurunkan kebutuhan order dan biaya. Langkah: 1) Isi bahan lewat item_id dan satuan master 2) disimpan kg atau ltr, diketik g atau ml.\n- **Buku temuan** `scripts/temuan.mjs, .claude/audit/` (proyek: MBG): catatan temuan review Dalang; temuan yang berulang dipromosikan jadi aturan. Langkah: 1) npm run temuan untuk mencatat 2) npm run temuan:status untuk melihat 3) npm run temuan:promosi untuk menaikkan yang berulang jadi gerbang.\n- **Buku vonis** `.claude/pelunas/vonis/*.json, scripts/pelunas/buku-vonis.mjs` (proyek: MBG): satu berkas per push yang ditahan gerbang; hanya boleh ditutup dengan gerbang baru atau alasan tertulis. Langkah: 1) npm run vonis:status melihat yang terbuka 2) npm run vonis:tutup -- sha8 --gerbang=path --catatan=... 3) kelas berulang wajib --pelajaran. Lihat bab Jalur produksi otomatis.\n- **Cakupan** `lib/cakupan-sah.ts, components/SppgScope.tsx` (proyek: MBG): unit (dapur, wilayah, lokasi) yang sedang dilihat kursi, dipakai query dan ekspor sekaligus. Langkah: 1) Baca cakupan lewat useSppgScope 2) saring pilihan dengan cakupanSah() 3) pastikan ekspor memakai cakupan yang sama.\n- **Cangkok** `bab Memulai proyek baru, docs/superpowers/specs/` (proyek: WI, BS, GR): menyalin fondasi generik (peran, UI kit, gerbang, armada) dari repo terdekat, bukan membangun fondasi ulang; domain asal tidak ikut. Langkah: 1) Pilih repo sumber paling mirip 2) salin yang generik saja 3) buang konsep domain lama. Lihat bab Memulai proyek baru.\n- **Cermin produksi** `scripts/e2e-db.mjs, tests/e2e/` (proyek: MBG): salinan skema produksi tempat uji integrasi SQL berjalan, supaya produks on to Next Paint: klik tidak boleh membekukan layar; chrome kontrol urgent, isi berat deferred. Langkah: 1) Pisahkan chrome dari isi 2) bungkus isi di transition atau useDeferredValue 3) jalankan inp-reviewer atau skill inp-sweep. Lihat bab Gerak dan performa.\n- **Isi Piringku** `lib/komponen.ts` (proyek: MBG): enam slot menu (karbo, lauk hewani, lauk nabati, sayur, buah, susu) yang menjadi satu sumber komponen menu dan resep. Langkah: 1) Baca slot dari lib/komponen.ts 2) warna ikut PALET_KELOMPOK_PANGAN.\n- **Jenjang** `lib/jenjang.ts` (proyek: MBG): tingkat sekolah penerima (TK/PAUD, SD, smp, dan seterusnya) yang menentukan porsi besar atau kecil dan warna chip. Langkah: 1) Pakai label dari lib/jenjang.ts 2) jangan tulis ulang ejaan jenjang di halaman.\n- **Kanon** `.claude/skills/selera-pinka/references/100-kanon.md` (proyek: MBG, GR, BS, WI): satu berkas arah produk: sepuluh prinsip, urutan otoritas, peraturan kunci, dan keputusan yang tidak dinegosiasi ulang. Langkah: 1) Baca bagian 1 dan 4.0 sebelum menyentuh tampilan 2) cek tabel ranjau bila ada yang merah.\n- **KDMP** `lib/kdmp*.ts, tabel kdmp_*` (proyek: MBG): Koperasi Desa Merah Putih: lapis koperasi desa dengan tabel dan alurnya sendiri, berdiri terpisah dari rel dapur. Langkah: 1) Tambah fitur di lib/kdmp-\\*.ts 2) jangan tambah kolom di rel MBG 3) uji lewat tests/e2e/*kdmp*.sql. Lihat bab Katalog fitur dan modul standar.\n- **Knowledge graph (KG)** `kg/graph.json, kg/PETA.md, kg/peta.html, scripts/kg/` (proyek: MBG): graf deterministik berkas, tabel, rute, rpc, dan tetangganya; sumber konteks agent sebelum membaca kode. Langkah: 1) npm run kg:build setelah struktur berubah 2) npm run kg -- kata kunci 3) npm run kg:check untuk memastikan segar.\n- **Kontrak anti-drift** `AGENTS.md bagian 0.2` (proyek: MBG): empat baris yang diucapkan sebelum edit pertama: cakupan, di luar, radius, dan bukti siap. Langkah: 1) Isi keempatnya dari hasil kg 2) node di luar cakupan tidak disentuh 3) sesudah kerja adu radius  pil keyakinan data, strip KPI, tabel rekomendasi berkode, kesimpulan 8 kartu + pita ARAHAN |\n| BNPB harian, penanganan, paparan wilayah | generator repo `data/laporan-bnpb/generator/` | pil CUT OFF DATA, peta 3D miring, slot foto untuk sisa ruang |\n| Pertamina NRE x Danantara | `format/pnre/scripts/pnre.js` | Poppins + Arial, teal, sidebar, dua gaya (Rapat Direksi, materi eksternal) |\n| METI | `format/meti/scripts/meti.js` v3 | Poppins, Midnight Energy, slide Tentang METI wajib, peta METI Wilayah |\n| Lainnya | `mesin/bangun.js` | Roboto, arketipe K01 sampai K96 |\n\n### Alur kerja satu deck\n\n1. Brief sekali jalan: cari dulu bahan di dokumen, memori, lampiran; tanya hanya yang belum ada (TOR, audiens dan yang hadir, logo penyelenggara, foto, angka dari pemilik).\n2. Petakan ruangan: catat apa yang menjadi milik tiap pihak yang hadir dan jangan menjelaskan ulang kebijakan kepada pembuatnya.\n3. Berpikir dulu: definisi masalah, issue tree MECE, hipotesis, lalu ghost deck berisi judul saja yang dibaca berurutan harus menjadi ringkasan.\n4. Riset dan bukti: tiap angka punya sumber, tanggal, dan label keyakinan (Resmi, Terverifikasi, Estimasi model, Asumsi kebijakan, Penilaian pakar); angka kunci dua sumber.\n5. Untuk BNPB, ambil bahan dari basis data repo: `cari_data.py angka|hukum|pustaka|tabel|riset`. Angka masuk spek sebagai token `{{angka:kunci}}`, tidak diketik.\n6. Pilih rujukan tata letak dan grafik dari pustaka (`pustaka/cari.py`, `references/panduan-grafik.md`).\n7. Bangun, lalu gerbang sampai 0 GAGAL, render, baca tiap halaman.\n8. Pemeriksa berkonteks bersih menghitung ulang setiap angka dari data mentah dan menyerang tiap slide; perbaiki, bangun ulang.\n9. Serahkan PPTX dan PDF; laporkan yang masih placeholder atau menunggu konfirmasi.\n\n### Isi dan judul\n\n- Judul slide isi adalah satu kalimat temuan berangka, paling banyak dua baris; bila tidak muat, huruf judul dikecilkan sampai 19 pt, tidak turun ke baris ketiga. Judul berlabel umum seperti \"Pesan Kunci: ..., empat keputusan ...\" dilarang karena terbaca buatan mesin; slide pesan kunci tetap ada, judulnya kalimat temuan.\n- Angka di judul dibuktikan di slide yang sama dan harus sama di seluruh deck.\n- Jawaban dulu: pesan kunci di depan, isi dari masalah ke tindakan, kesimpulan 8 kartu, rekomendasi bernomor dengan pelaku, waktu, dan dasar data.\n- Satu klaim per judul; tafsir yang punya beberapa kemungkinan disajikan sebagai beberapa kemungkinan.\n\n### Bahasa\n\n- Bahasa Indonesia baku, lugas, faktual; angka di depan.\n- Sumber data bukan pelaku: \"Berdasarkan data DIBI, terdapat 3.833 jembatan rusak\", bukan \"DIBI mencatat ...\".\n- Dilarang: em dash, titik tengah sebagai pemisah, elipsis, emoji, kontras \"X, bukan Y\", tiga-serangkai, personifikasi, slogan, pembuka klise (\"Di era\", \"Dalam lanskap\"), kata khas AI (krusial, esensial, menavigasi, mendalami, komprehensif sebagai hiasan), huruf kapital penuh untuk penekanan, tanda seru.\n- Istilah: \"titik panas\" untuk data satelit, \"hitungan satelit\", \"cluster\"; rentang memakai en dash (otomatis di mesin).\n- Nomenklatur lembaga terbaru: KLHK sudah dipecah menjadi Kementerian Lingkungan Hidup dan Kementerian Kehutanan (SiPongi milik Kementerian Kehutanan); Badan Komunikasi Pemerintah RI ditulis lengkap.\n- Nada lembaga negara: tenang, berbasis bukti, netral, empatik untuk korban; angka korban hanya dari sumber resmi bertanggal.\n\n### Tata letak dan ruang\n\n- Vonis pemilik 26 Okt 2026 atas empat deck Grand Design: \"ukuran hurufnya ga masalah kecil tapi white spacenya ga banyak ... banyakin aja datanya\". Huruf kecil boleh (gaya kajian BNPB sampai 6 pt untuk teks yang dibaca); ruang kosong tidak.\n- Panel setinggi isinya; sisa ruang diisi data (baris, kolom, kartu angka, pita bawah, grafik kedua) atau slot foto, tidak dengan meregangkan panel atau memperbesar huruf.\n- Gerbang ruang mati (`rupa.py` di skill, D-39 di mesin BNPB dan pembangun repo): blok 1% yang kosong dan sekelilingnya kosong, batas 25% per slide isi. Lima deck Grand Design Oktober 2026 dibangun ulang 26 Okt di atas registri repo: 16 slide yang tadinya 25 sampai 43% kosong kini 1 sampai 22%, diisi pita bawah, kartu, dan baris dari registri.\n- Kotak keterangan mengambang di atas grafik dilarang (\"out of place\"); keterangan masuk panel samping, baris data sejajar kategori di bawah sumbu, atau pita.\n- Ubin sorotan memakai tint warna angkanya sendiri; catatan dan sumber paling banyak dua baris di pita kaki.\n\n### Grafik, tabel, ikon, gambar\n\n- Pilih grafik dari kata kerja judul: tren ke kolom atau garis, peringkat ke batang horizontal terurut (terbesar di atas), komposisi ke kolom 100%, dekomposisi ke waterfall, deviasi ke batang berpasangan, sebaran ke rentang, lokasi ke peta. Pie hanya untuk dua sampai tiga irisan.\n- Satu warna sorot per grafik; naik oranye, turun biru; sorot dengan bingkai, bukan warna baru.\n- Semua yang bisa disunting dibuat native: teks, tabel, grafik, pil, penanda dan label peta. Gambar hanya untuk foto, logo, peta dasar, ikon.\n- Ikon garis dalam lingkaran, wajib di kepala tabel, kartu angka, dan chip; lembaga ditulis sebagai chip berikon, bukan logo.\n- Logo tidak boleh berubah proporsi; elemen grafis merek memakai gambar asli lambang, bukan gambar ulang.\n- Foto relevan berlisensi bebas dengan atribusi; tanpa ilustrasi AI, foto stok, atau placeholder.\n\n### Basis data BNPB\n\nSatu sumber: repo poskokarhutla. `bnpb/scripts/sinkron_repo.py` menarik ke skill:\n- registri 2.285 angka bertoken (DIBI, Renas, Renstra, IRBI, air Jawa, skenario, lembaga, program terbukti);\n- CSV DIBI per kabupaten, provinsi, dan nasional;\n- `pustaka.json`.\n\n`bnpb/scripts/cari_data.py` mencari di semua sumber itu, ditambah teks penuh JDIH BNPB (233 dokumen, 9.294 segmen pasal) dan catatan riset kajian. Peraturan dikutip dengan jenis, nomor, tahun, pasal, dan URL JDIH.\n\n### Gerbang\n\n- Mesin BNPB: QA D-1 sampai D-39, anti-slop S-1 sampai S-43, uji diri 44 fixture plus fixture ruang mati; laporan QA harus LOLOS dan jumlah halaman PDF sama dengan slide.\n- Gerbang umum `scripts/periksa.py`:\n  - huruf, sumber, sisa kerja;\n  - tata letak (keluar halaman, bertumpuk, meluap, kontras WCAG, perataan);\n  - bahasa, nada, dan data sensitif;\n  - judul (berlabel umum, titik koma, terpotong, kembar);\n  - gambar terdistorsi;\n  - angka judul terbukti di slide.\n- Aturan tanpa gerbang mekanis dianggap belum jadi; pemeriksa berkonteks bersih tetap wajib karena gerbang tidak menangkap cacat substansi (sensor satelit bercampur, definisi angka berbeda, tafsir tunggal).\n\n### Perkara terbuka\n\n- Latar gelap: format BNPB, METI, dan PNRE memakai penutup atau pembatas gelap, sedangkan vonis umum pemilik melarang latar gelap. Menunggu keputusan pemilik; sementara terang.\n- Aset gambar PNRE (sidebar, header, footer, logo, foto sampul) belum ada di skill.\n- Logo BNPB masih raster 250 px; berkas vektor resmi perlu dari Humas BNPB.\n";
