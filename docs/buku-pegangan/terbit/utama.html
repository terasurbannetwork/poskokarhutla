an (`faktorAntarSatuan()` di TS, `satuan_faktor()` di SQL), dan pasangan tak sebanding dikosongkan berikut tanda peringatan, bukan dihitung apa adanya, termasuk pemenang harga master: harga yang disalin ke master dibagi `satuan_faktor` lebih dulu, bukan disalin mentah. Kemasan bukan satuan: \"5kg\" dan \"12 liter\" ditolak trigger `satuan_supplier_gerbang()` saat nilainya baru atau berubah. Sebab: MBG 19 Agt 2026, dua baris Cengkeh (satu toko menjual per ons, satu per kg): layar mencetak satuan master untuk keduanya sehingga 180.000 per kg terbaca per ons, Profit memvonis supplier -85,6%, dan tanda termurah dipasang di baris yang justru lebih mahal, nol error sepanjang jalan (\"agar dia tidak ngelink aja satuannya\"). Gerbang `gerbang-satuan-toko.test.ts`, `satuan-jual-per-supplier.test.ts`, `gerbang-pemilik-bahan.test.ts`.\n- Layar tidak pernah mengunci periodenya dan tidak mengosongkan daftar kerjanya sendiri hanya karena sudah ada dokumen berjalan; yang menjaga satu kewajiban tak diajukan dua kali adalah saringan yang ditulis plus trigger DB, bukan daftar yang dikosongkan. Bila dua daftar sama-sama sah berdiri di satu periode, keduanya berdiri dan dipisah `SegmentedToggle` block dua segmen (yang sudah masuk kertas lawan yang belum), masing-masing berlencana jumlah baris. Satu periode boleh punya lebih dari satu lembar (susulan /R2, /R3), lembar lama tidak boleh lenyap begitu lembar baru lahir, dan angka ringkasan per periode menjumlah seluruh lembarnya, bukan membaca yang terakhir. Tujuan lembar dipilih orangnya lewat popup saat tombol diklik, tidak dipatok diam-diam ke draft yang sedang hidup; header baru hanya lahir bila yang dipilih \"Dokumen Baru\", selain itu id lembar tujuan dipakai ulang (indeks unik parsial hanya mengizinkan satu lembar belum dijawab per periode). Sejalan prinsip 2: otomasi menyiapkan, manusia memutuskan ke mana barisnya mendarat. Sebab: MBG 19 Agt 2026, empat nota bahan baku Rp40.588.500 yang sudah terverifikasi tidak muncul di layar mana pun karena draft susulan sudah berdiri dan `muat()` menjawabnya dengan `setCalon([])`: nol error, nol keterangan, tagihannya cuma tidak ada. Gerbang `gerbang-selera.test.ts` (larangan `setCalon([])`) dan `pengajuan-bayar.test.ts`. Catatan ikut GR 26 Sep 2026: tutup buku bulanan yang dikunci DB oleh owner (beralasan, berjejak audit, bisa dibuka lagi) tidak lagi dilarang; yang tetap dilarang layar yang mengosongkan daftar kerjanya sendiri. (MBG: vonis 19 Agt 2026 \"gw ga mau ada kunci periode, atau dibuat aja 2 mini tab ada yang sudah disetujui ada yang akan diajukan\", \"nanti ketika dia diklik muncul pop up untuk pilih ke mana\".)\n- Tiap ember alur uang punya satu aksi yang memundurkannya satu tahap: ikon putar balik di kolom Aksi barisnya, di tiap ember yang punya tahap sebelumnya (MBG: Invoice Terbit, Verifikasi Invoice, Lunas di `/invoice`; Belum Bayar, Verifikasi Pembayaran, Lunas di kelima aliran uang `/pembayaran`). Ember paling awal tidak mendapatnya, tahap sebelumnya berdiri di halaman lain. Empat aturan turunan: (a) bukti ditandai, tidak pernah dihapus: lembar yang masih menunggu jadi ditolak berikut catatan dan fotonya tetap terbuka; yang sudah divonis kembali menunggu dan jejak validasinya dicabut. (b) Mundur yang melewati otomasi wajib punya penahan di DB: Invoice Terbit ke Daftar Invoice ditahan `invoices.mundur_at` plus trigger `trg_invoice_tahan_mundur`, karena `finalize_invoice_from_grn` menaikkannya lagi tiap GRN disentuh; Belum Bayar ke Daftar Bayar ditahan `supplier_bills.dicabut_at` plus trigger `trg_supplier_bill_tahan_dicabut` yang memaksa bukan menolak, karena auto-verifikasi tiga arah sudah berdiri lebih dulu di tabel itu. (c) Tiap penahan punya pelepasnya (ikon putar ulang) di ember tujuannya; penerbitan invoice dan nota supplier tak punya tombol maju manual, jadi penahan tanpa pelepas berarti baris tertahan selamanya. (d) Ikon, warna amber, dan kalimatnya satu rumah di `lib/mundur-alur.ts`, tombol berdiri paling kanan di kolom Aksi karena ia satu-satunya yang memundurkan; ia bukan vonis centang dan silang yang dilarang di kolom Aksi, dan tak tercetak sama sekali untuk yang tak berhak berikut legendanya. Gerbang `gerbang-mundurkan-alur.test.ts`. (MBG: vonis 21 Agt 2026 \"di setiap Invoice Terbit, Verifikasi Invoice dan Lunas agar ada satu aksi yang bisa batalkan untuk mundurkan 1 proses ya\".)\n- Entitas yang cuma menerbitkan dokumen bukan pemasok. (MBG: koperasi bukan supplier; baris supplier bercakupan koperasi dibuang dari semua pemilih supplier, bahan maupun Barang Ops, lewat satu predikat `bukanKoperasiOps`, karena koperasi hanya yang memberi invoice. Invoice selalu berkop koperasi, logonya juga, dan cap id koperasi yang null jatuh ke tautan koperasi aktif entitas dapurnya. Vonis 26 Sep 2026 \"KDMP tuh bukan sebagai pemasok supplier, KDMP cuma sebagai yang ngasih invoicenya\" dan \"gw mau semuanya sekarang invoicenya pakai invoice KDMP ya, logonya juga\"; gerbang `gerbang-kdmp-bukan-supplier.test.ts`, `gerbang-kop-invoice-kdmp.test.ts`.)\n\nJalur produksi\n\nBab 27\n\n## Jalur produksi otomatis: pelunas dan deploy\n\nBab ini menjelaskan jalan kode dari tangan sampai live, dan mesin-mesin yang bekerja tanpa manusia di sepanjang jalan itu. Rujukan paling matang: repo pangantara. Sumber lanjutan: `.claude/night-shift.md` dan `.claude/skills/selera-pinka/references/700-ranjau-deploy.md` (2,2 MB, cari bagian dengan `grep -n '^#'`, jangan dibaca utuh).\n\nPrinsip penaungnya: aturan tanpa gerbang mekanis dianggap belum jadi. Tiap kegagalan ditutup tiga lapis: perbaiki kodenya, catat di katalog ranjau, pasang gerbang di titik paling hulu yang bisa memeriksanya.\n\n### Gambaran alur\n\n```\nkerja (agent atau manusia, langsung di main, tanpa branch)\n  -> git commit            .husky/pre-commit: eslint --fix + prettier atas berkas ter-stage\n  -> akhir giliran Claude  Stop hook auto-commit-push.sh: tsc + lint:ratchet + test, cap .git/gerbang-lolos, push\n  -> git push origin HEAD:main\n       .husky/pre-push: tsc + lint:ratchet + test atas isi commit (worktree terpisah)\n         hijau -> mendarat di GitHub\n         merah -> .git/gerbang-vonis-<sha> + entri buku vonis (status terbuka)\n  -> GitHub Actions ci.yml: typecheck, lint ratchet, test + coverage, build\n  -> Vercel: next build, deploy produksi\n```\n\nMesin di luar sesi: pelunas push (launchd tiap 3 menit, mendorong commit tertinggal lewat gerbang penuh); penjaga CI (launchd tiap 10 menit, run Actions merah di `main` dibukukan sebagai vonis `ci:<workflow>`, dieskalasi ke WA, dibereskan `claude -p`); penjaga produksi (launchd tiap jam, membaca sistem yang jalan, bukan kodenya); dan routine terjadwal (scheduled task Claude, hanya berangkat kalau aplikasi Claude terbuka). Jam di Mac mini 24 jam, zona Asia/Jakarta (sumber `bekal/routine/daftar.json`):\n\n| Jam | Routine | Kerjanya |\n| --- | --- | --- |\n| 21:07 | `pembaru-buku-pegangan` | segarkan buku pegangan proyek kalau aturan berubah, hari sepi berhenti tanpa menulis |\n| 21:20 / 21:40 | `pembaru-buku-pegangan-gr` / `-bs` | sama, untuk Gemah Ripah dan Betutu Sambe |\n| 21:30 | `penjaga-panen-radar` | (MBG: pastikan panen menu Radar hari ini lengkap) |\n| 22:30 | `pembaru-buku-pegangan-utama` | himpun ulang buku pegangan utama dari empat buku proyek |\n| 23:30 | `pelunas-backlog` | ambil satu tugas dari `.claude/audit/backlog.json`, dorong ke `main` |\n| 00:15 Minggu | `pecah-berkas-mingguan` | pecah satu rung dari berkas raksasa berikutnya |\n| 00:43 | `tingkatkan-diri` | sapu perkakas baru |\n| 02:00 | `night-shift-mbg` | ambil satu tugas dari Antrian night shift |\n| 05:04 | `penjaga-produksi-pagi` | baca produksi sebelum jam sibuk zona WIT, hijau berhenti tanpa menulis |\n| 05:37 | `dalang-review-malam` | review kerja yang belum mendarat sampai bersih, atau berhenti macet |\n\nJam disusun supaya tidak ada dua routine yang menulis `main` bersamaan, dan tiap routine tetap memeriksa `git status --porcelain` sebelum menyentuh apa pun. Jam di tabel adalah paling cepat, bukan janji: yang jatuh tempo saat aplikasi tertutup berangkat pada peluncuran berikutnya. Deploy tidak dijadwalkan: push yang lolos gerbang memicu Vercel.\n\n### Pelunas dan buku vonis\n\n#### Pelunas\n\nSebelum ada pelunas, push yang ditahan gerbang menunggu tangan manusia, dan dialog merah GitHub Desktop berisi utang orang lain (5 Sep 2026: 22 dialog gagal dalam dua minggu, tak satu pun kesalahan penekannya). Dua kakinya: launchd `com.pinka.mbg-pelunas-push` (180 detik, `scripts/pelunas-push.sh`) dan loop cadangan yang dilahirkan Stop hook dari dalam sesi. Pasang `npm run pelunas:pasang`, lepas `npm run pelunas:lepas`, cek `npm run pelunas:status`. Peluncuran lewat `node` (`scripts/mesin/lewat-node.mjs`), sebab macOS menolak `/bin/bash` di bawah launchd membaca `~/Documents` (exit 126 diam-diam, 6 Sep 2026); alternatifnya Full Disk Access atau repo di luar `~/Documents`.\n\nUrutan sekali jalan: tidak ada utang berarti keluar tanpa jejak; sakelar `pelunas` mati atau `liburan` nyala berarti keluar; ada gerbang atau push lain yang hidup berarti keluar; `HEAD` lebih muda dari 600 detik milik sesinya (kecuali utang sudah 5 commit, `pelunas_utang_segera`); vonis hijau atau belum ada berarti `git push` biasa dengan penanda `MBG_PELUNAS`; vonis merah berarti notifikasi macOS lalu `claude -p` sekali per sha (batas 25 menit), di worktree terlepas `~/.mbg-mesin/worktree-pelunas` kalau tree utama kotor. Pelunas tidak pernah melewati gerbang, rebase paksa, reset, atau menyentuh working tree. Sakelar di `.claude/mode-agent.json` (ikut ter-commit, sebab routine cloud clone segar): `pelunas`, `pelunas_claude`, `pelunas_utang_segera`, `liburan`, `mesin_24jam`.\n\n#### Buku vonis\n\nTiap vonis merah pre-push membuka satu berkas JSON di `.claude/pelunas/vonis/<tanggal>-<jam>-<sha8>.json` lewat `node scripts/pelunas/buku-vonis.mjs buka <sha> <berkas-vonis>`. Satu berkas per vonis, bukan satu JSONL: dua mesin yang menambah baris ke berkas yang sama bentrok di git. Isinya `sha`, `waktu`, `mesin`, `kelas`, `gerbang_penahan`, `ulang` (kelas itu sudah terjadi berapa kali), `ringkas` (baris gejala), `status`: `terbuka`, `ditutup`, atau `transien` (mesin dibunuh, ruang kerja lenyap, kuota Actions habis; tidak melahirkan pelajaran).\n\nRatchet-nya: `tests/unit/gerbang-pelunas-belajar.test.ts` menolak push berikutnya selama ada entri `terbuka`. Tiap push yang pernah ditahan wajib meninggalkan penjaga baru atau alasan tertulis, bukan cuma commit perbaikan. Perintah menutup, persis:\n\n```\nnpm run vonis:tutup -- <sha8> --gerbang=<path gerbang yang ada di disk> --catatan=\"<apa yang diubah>\" --pelajaran=\"gerbang pertama lolos karena ...\"\nnpm run vonis:tutup -- <sha8> --alasan=\"<kenapa kelas ini belum bisa dimesinkan>\"\n```\n\nAturan yang ditegakkan skrip (exit 2 kalau dilanggar): wajib `--gerbang` atau `--alasan`; `--gerbang` harus path yang ada di disk (penjaga yang tidak ada bukan penjaga); kelas yang sudah pernah terjadi wajib membawa `--pelajaran`; satu sha dengan beberapa entri ditutup sekaligus. Perintah lain: `npm run vonis:status` (exit 0 tidak ada yang terbuka, exit 10 ada), `npm run vonis:rapikan` (kembar lintas mesin), `node scripts/pelunas/buku-vonis.mjs kelas` (hitungan per kelas, bahan Dalang). Kelas diturunkan dari isi vonis oleh `kelasDari()`: kode TS (`TS2322`), nama berkas gerbang, `eslint`, atau `ci:<workflow>`. Kelas yang muncul dua kali atau lebih wajib naik jadi gerbang hulu (hook PreToolUse yang mencegat sebelum kode ditulis).\n\n(MBG: per 7 Okt 2026 ada 1.302 berkas, 151 kelas, nol terbuka; terbanyak `eslint` 122, `TS2322` 100, `TS2345` 98.)\n\n### Night shift dan pelunas backlog\n\nKontraknya satu berkas, `.claude/night-shift.md`; prompt routine hanya menunjuknya dan kalau keduanya beda, berkas itu yang menang. Dua routine memakainya: `night-shift-mbg` (Antrian tugas) dan `pelunas-backlog` (`.claude/audit/backlog.json`). Rutin tiap malam:\n\n- `bash scripts/mesin/giliran-mesin.sh || exit 0`. Task malam hanya jalan di mesin 24 jam (`mesin_24jam`, dicocokkan dari `LocalHostName`, `ComputerName`, `hostname`). Mesin lain keluar 20, berhenti dengan satu kalimat.\n- `git fetch`, catat potret awal `git status --porcelain`.\n- Utang push dulu: ada commit tertinggal atau vonis terbuka, betulkan dan dorong, baru ambil tugas.\n- Ambil satu tugas saja. Antrian atau backlog kosong berarti berhenti tanpa menulis apa pun.\n- Kerjakan sempit, jalankan `npm run typecheck`, `npm run build`, test relevan, panggil reviewer yang cocok.\n- Commit lalu `git push origin HEAD:main`. Gerbang push yang menilai.\n- Catat di Catatan run (tanggal, routine, yang diambil, yang dilewati dan kenapa, tugas berikutnya).\n- Mentok pada pertanyaan untuk pemilik: `node scripts/eskalasi.mjs --kunci=<kelas> --sebab=\"...\" --rincian=\"...\"` (antrean WA, dedupe per hari per kunci). Routine yang berhenti diam terbaca sama dengan yang tidak pernah jalan.\n\nCara `pelunas-backlog` memilih satu tugas: urut agent dari yang paling aman `test-gap`, `selera-angka`, `selera-tipografi`, `selera-tabel`, `guard-api`, `pecah-berkas`; dalam satu agent severity tinggi dulu lalu nomor terkecil. `rls-auditor` dan `migrasi-idempoten` dilarang (skema DB bukan tugas malam). Urutan agent menang atas \"severity tertinggi se-backlog\", sebab yang tertinggi bisa milik agent terlarang. Temuan detektor diverifikasi dulu di `berkas:baris`-nya; yang tidak terbukti ditandai gugur, kerjaannya tidak dikarang. Tugas yang menyentuh uang atau berradius lebih dari 20 modul dilewati dengan alasan tertulis. (MBG: jaring test untuk `lib/*.ts` murni; `invoice-summary.ts` dilewati karena menghitung tagihan.)\n\nAturan worktree dan checkout:\n\n- Tidak ada branch, PR, atau worktree malam. Semua routine berbagi satu working tree proyek, dan jangan checkout apa pun, sebab sesi lain memakai tree yang sama. (MBG: worktree `mbg-night` dicabut 4 Sep 2026.)\n- Tree kotor bukan alasan menunda, tapi catat potret awal, jangan pernah `git add -A`, stage berkas spesifik, jangan sentuh path yang sudah kotor sebelum mulai.\n- Worktree sah selain tree utama hanya dua: milik gerbang push (`$TMPDIR/gerbang-push-<pid>`) dan milik `claude -p` pelunas (`~/.mbg-mesin/worktree-pelunas`, terlepas, di luar `~/Documents`).\n- Push selalu eksplisit `git push origin HEAD:main`; dari `HEAD` terlepas, `git push` polos mati dengan `fatal: You are not currently on a branch`. Ditolak non-fast-forward: `git fetch origin && git rebase origin/main`, push sekali lagi, masih ditolak berarti laporkan, jangan paksa.\n- Dilarang: `git push --no-verify`, melonggarkan gerbang, push ke ref selain `main`, migrasi atau RLS, logika uang, override author, `git add -A`. Yang dilarang push-nya, bukan commit-nya: `git commit --no-verify` di langkah 6 disengaja, penilainya pre-push.\n- Author commit wajib identitas member tim Vercel (MBG: `mbgbangkabelitung`), kalau tidak deploy berstatus blocked, bukan error. Pesan commit huruf kecil, Bahasa Indonesia.\n\nDalang (`.claude/skills/dalang/SKILL.md`, 05:37) menutup malam: `node scripts/dalang.mjs perintah` memberi cakupan kerja yang belum mendarat; cakupan kosong, atau judul commit teratas `origin/main` berawalan `dalang:`, berarti berhenti (peredam rantai jalan beranak). Ia menjalankan gerbang plus reviewer sempit, mencatat temuan ke buku temuan, memperbaiki, mengulang sampai dua putaran berturut tanpa temuan baru, atau berhenti macet dan memanggil manusia; langkah 2b mentranskrip vonis pemilik dari `.claude/vonis-terucap.md`. Penjaga produksi (`.claude/agents/penjaga-produksi.md`, 05:04) membaca `~/.mbg-mesin/penjaga-produksi.log`, `automation_runs`, system-health, `ops_events` per zona waktu; merah ditulis sebagai temuan, semua hijau berarti berhenti tanpa menulis.\n\n### Empat gerbang deploy dan konfigurasi Vercel\n\nHijau di satu gerbang bukan jaminan di gerbang lain; cakupannya beda.\n\n| Gerbang | Kapan jalan | Memeriksa | Gagal terlihat di |\n| --- | --- | --- | --- |\n| `.husky/pre-commit` | tombol Commit | eslint `--fix` + prettier atas berkas ter-stage; sengaja ringan | dialog Commit failed |\n| `.husky/pre-push` | tombol Push (GUI atau CLI) | `tsc --noEmit` + `npm run lint:ratchet` + `npm test` atas isi commit yang didorong | dialog Push failed |\n| `.claude/hooks/auto-commit-push.sh` (Stop hook) | akhir tiap giliran Claude | pemeriksaan sama, lalu cap `.git/gerbang-lolos` supaya pre-push tidak kerja dua kali | stderr pesan push ditahan |\n| `.github/workflows/ci.yml` | tiap push ke `main` | typecheck, `lint:ratchet`, test + coverage, build | tab Actions merah |\n\nBuild Vercel (`next build`, TS dan eslint ikut menggagalkan, tanpa test) adalah penguji kelima. Bacaan kombinasi: Vercel hijau + Actions merah berarti testnya yang merah; Vercel error + Actions merah berarti TS atau eslint; Vercel error + Actions hijau berarti beda lingkungan (Node, env, huruf besar-kecil nama berkas, lockfile); Vercel blocked berarti author bukan member tim.\n\nIsi pre-push yang perlu ditiru, urut:\n\n- Baca sha dari stdin; ref selain `refs/heads/main` ditolak (bypass sadar `MBG_IZIN_BRANCH=1`).\n- Sha sudah ada di GitHub (`git ls-remote`, sama atau leluhur ujung remote): keluar 0, tidak ada yang dikirim. Jangan membatalkan push yang sudah mendarat, itu melahirkan dialog merah palsu.\n- Sha sama dengan isi `.git/gerbang-lolos`: lewati. Diff hanya dokumen (`*.md`, `plans/`, `.claude/`, `memory/`, `docs/`, `bekal/`): lewati. Daftar dokumen ini sama di tiga tempat (pre-push, Stop hook, `paths-ignore` di ci.yml); ubah satu, ubah ketiganya.\n- Satu gerbang push sekaligus (kunci `gerbang-push.lock`; sha sama menunggu dan memakai vonis pemegangnya, sha beda ditolak cepat) dan antrian berat global `scripts/antre-berat.sh` (6 `tsc` barengan pernah melumpuhkan mesin 6 core 8 GB).\n- Yang diperiksa isi commit, bukan isi disk: kalau sha bukan `HEAD` atau tree kotor, `git worktree add --detach \"$TMPDIR/gerbang-push-$$\" \"$SHA\"`, `node_modules` di-symlink, `.env.local` disalin, bersih-bersih di trap `EXIT`. Worktree gagal dibuat: fail-open ke isi disk, vonis merahnya tidak dibukukan.\n- `export NODE_OPTIONS=\"... --max-old-space-size=4096\"`, lalu `tsc --noEmit`, `npm run lint:ratchet`, `npm test`. Exit 137 atau 143 dengan daftar error kosong berarti dibunuh mesin, bukan vonis.\n- Merah: tulis `.git/gerbang-vonis-<sha>` lalu `node scripts/pelunas/buku-vonis.mjs buka \"$SHA\" \"$VONIS\" || true` (fail-open). Hijau: tulis penanda hijau ke berkas itu.\n\nFail-open hanya kalau perkakasnya tidak bisa jalan (exit 127). Awali hook dengan `set +e`: husky v9 menjalankan hook lewat `sh -e`, dan `grep` yang tidak menemukan apa pun mematikan hook diam-diam.\n\nKonfigurasi (MBG, plan Hobby): `vercel.json` memuat `\"regions\": [\"hnd1\"]` (database di Tokyo, jangan dihapus), `functions` memori 2048 untuk rute cetak PDF (plafon Hobby), dan `crons` (17 jadwal, UTC). `next.config.ts` menjaga `ignoreBuildErrors: false` dan `ignoreDuringBuilds: false`, jangan pernah dibalik. Node dipin di berkas (`.nvmrc` 24 dan `engines.node`) dan workflow memakai `node-version-file: .nvmrc`, jadi Actions dan Vercel selalu sama. Aturan terkunci: author wajib member tim; gerbang tidak dilemahkan untuk mengejar deploy (gerbang salah tuduh diperbaiki pengecualiannya dengan alasan tertulis); semua kerja mendarat di `main`. `NEXT_PUBLIC_*` di-inline saat build, mengubahnya di Vercel wajib redeploy.\n\nWorkflow di `.github/workflows/` (MBG): `ci.yml` (job `quality`: `npm ci`, Typecheck, Lint + ratchet peringatan, Test + coverage, Build; `paths-ignore` untuk dokumen, `kg/`, `bekal/`, `.claude/`; `concurrency` dengan `cancel-in-progress`), `e2e-db.yml` (uji SQL atas database Supabase lokal: skema, RLS, trigger), `integrasi.yml`, `cermin-e2e.yml`, `cadangan-db.yml`, `asap-rute-publik.yml`. Actions membulatkan tiap job ke atas ke menit penuh: sebelum menambah `cron:`, hitung run per bulan dikali satu menit (plan Free 2.000 menit).\n\n### Memasang di proyek baru, berurutan\n\nPasang bertahap, cek tiap tahap hijau sebelum lanjut. Jangan menyalin pre-push pangantara (1.045 baris) mentah-mentah: mulai dari versi 65 baris Gemah Ripah (`gemah-ripah/.husky/pre-push`), lalu tambah blok worktree dan buku vonis; tiap blok di pangantara lahir dari satu insiden (lihat tabel ranjau).\n\n- Dasar. `npm i -D husky lint-staged`, `\"prepare\": \"husky\"`, `\"typecheck\": \"NODE_OPTIONS=\\\"--max-old-space-size=4096 $NODE_OPTIONS\\\" tsc --noEmit\"`, `\"test\": \"vitest run\"`. Pin Node (`.nvmrc` dan `engines.node`). `vercel.json` dengan `regions` sama dengan region database; `next.config.ts` dengan dua flag ignore false.\n- Hook husky. Salin dari Gemah Ripah `.husky/pre-commit` (satu baris `npx --no-install lint-staged`) dan `.husky/pre-push`; tambahkan `set +e`, tolak ref selain `main`, dan blok worktree isi commit (pangantara `.husky/pre-push` baris 650-716). Cek: commit dengan error tipe sengaja ditolak `git push`, dan `ls .husky/_/pre-push` ada.\n- Ratchet lint. Salin `scripts/ratchet-lint.mjs`, script `\"lint:ratchet\": \"node scripts/ratchet-lint.mjs\"`, dan ganti `npm run lint` dengan `npm run lint:ratchet` di pre-push, Stop hook, dan workflow (kalau beda, lahir kelas hijau di sini merah di sana). Plafon hanya boleh turun.\n- Buku vonis. Salin `scripts/pelunas/buku-vonis.mjs`, `scripts/pelunas/tabrakan-sesi.mjs`, `scripts/lib/waktu.mjs` (satu-satunya impor lokal buku vonis), buat `.claude/pelunas/vonis/.gitkeep`, tambah script `vonis:tutup`, `vonis:status`, `vonis:rapikan` (semuanya `node scripts/pelunas/buku-vonis.mjs <perintah>`). Salin `tests/unit/gerbang-pelunas-belajar.test.ts`, sambungkan `buka` di ujung fungsi vonis merah pre-push. Cek: satu vonis merah sengaja membuat `npm run vonis:status` exit 10 dan push berikutnya ditolak; `npm run vonis:tutup -- <sha8> --alasan=\"uji pasang\"` mengembalikannya ke exit 0.\n- Pelunas push. Salin `scripts/pelunas-push.sh`, `pelunas-pasang.sh`, `pelunas-push.plist`, `sapu-rebase-mandek.sh`, `antre-berat.sh`, `scripts/mesin/lewat-node.mjs`, dan `.claude/mode-agent.json`. Ganti jalur repo bawaan dan label launchd `com.<pemilik>.<proyek>-pelunas-push`, tambah script `pelunas:pasang`, `pelunas:lepas`, `pelunas:status`, jalankan `npm run pelunas:pasang`. Cek: `pelunas:status` menyebut terdaftar dan tidak diblokir.\n- Stop hook. `.claude/hooks/auto-commit-push.sh` dan `kunci-git.sh` didaftarkan di `.claude/settings.json` (Stop, plus SessionStart untuk pengingat utang). Cek: akhir giliran sesi menulis `.git/gerbang-lolos`.\n- Mesin 24 jam (satu mesin saja). `scripts/mesin/pasang-mesin-24jam.sh`, `giliran-mesin.sh`, `penjaga-ci.mjs`, `penjaga-produksi.mjs` beserta plist, lalu `npm run mesin:pasang`. Tetap tangan pemilik: `gh auth login`, `.env.local`, auto-login macOS, izin akses disk atau pindah repo keluar `~/Documents`, mendaftarkan scheduled task lewat sesi Claude. Cek: `bash scripts/mesin/giliran-mesin.sh; echo $?` keluar 0 di mesin 24 jam dan 20 di mesin lain.\n- Kontrak di repo. Salin `.claude/night-shift.md` (kosongkan Catatan run, tulis Antrian awal), `.claude/agents/pelunas.md`, `.claude/agents/penjaga-produksi.md`, `.claude/skills/dalang/SKILL.md`, `.claude/skills/beresin-gagal-deploy/SKILL.md`, dan kerangka ranjau deploy (bagian 0, 1, 4, 5; katalog dikosongkan). Ganti nama proyek dan jalur.\n- Routine. Prompt hidup di `~/.claude/scheduled-tasks/<nama>/SKILL.md`, di luar git, jadi wajib tipis dan menunjuk kontrak di dalam repo. Simpan bundelnya di `bekal/global/scheduled-tasks/<nama>/SKILL.md` dengan `__REPO__` sebagai jalur (diisi `bash bekal/pasang.sh`). Kerangka:\n\n```\n   ---\n   name: pelunas-backlog\n   description: 23:30 WIB, ambil satu tugas dari backlog audit, dorong ke main lewat gerbang push\n   ---\n   Kamu routine `pelunas-backlog` untuk repo <Proyek>.\n   Repo: `__REPO__`. `cd` ke sana sebelum perintah apa pun.\n   Langkah 0: `bash scripts/mesin/giliran-mesin.sh` (keluar 20 = berhenti, satu kalimat).\n   Langkah 1: kontrakmu satu berkas, `.claude/night-shift.md`. Baca utuh;
