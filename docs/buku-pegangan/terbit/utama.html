abel rapat, tanpa kartu hias | satu tugas per layar, target sentuh 44px | lega, satu pesan per bagian |\n| Warna merek | warna kokpit yang sudah dituakan | sama dengan kokpit | warna logo asli (BS: merah logo `#d41217`) |\n\nAturan turunannya:\n\n- **Kokpit** memakai kanon penuh: `table-app` di `TabelKartu`, legenda, ringkasan lipat.\n- **Link tanpa login** diperlakukan sebagai produk sendiri yang kebetulan berbahasa sama dengan kokpit: bahasa visual sama, kepadatan lebih longgar, jempol-first. Halaman publik wajib dijaga ringan dan tidak terindeks (gerbang `noindex`; di BS halaman `/lacak` dan `/absen` masuk daftar yang dijaga). Sebab: `min-h-screen` dan `h-screen` sama-sama 100vh dan tingginya melompat saat bar URL hp bergerak, padahal Mode B paling sering dibuka di hp lapangan; vonis 28 Juli 2026, wajib `min-h-[100dvh]`.\n- **Produk konsumen** memberi L2 kemudi. Yang tetap berlaku universal: em dash penghubung dilarang, WA `#25D366`, bahasa Indonesia, angka `id-ID`, dark mode, siklus state lengkap (loading, kosong, error). Yang tidak dibawa: emoji nav, kepadatan 8, larangan hero. Sebab: pada 3 Oktober 2026 landing boleh punya hero karena produk konsumen publik, bukan kokpit internal (WI). Gaya agency (video hero, Three.js, marquee) hanya kalau brief memintanya; rincian di bab \"Produk publik dan anti-slop\".\n- **Satu repo bisa memuat ketiganya.** BS: kokpit di `app/(app)` Mode A, `/pesan` dan `/kurir` link luar Mode B, situs publik Mode C. Tentukan mode per halaman dalam Design Read, bukan per repo.\n\nUsaha F&B (restoran, kafe, katering, kasir): baca `~/.claude/FNB.md` dulu. Vonis 19 September 2026: website usaha lahir dari yang sudah tercatat, tinggal tweak kecil.\n\n### Paritas dan menyalin template yang sudah disetujui\n\nPrinsipnya satu bahasa desain untuk semua sistem pemilik. Pemilik tidak mau mempelajari dialek baru tiap proyek, dan tiap dialek baru adalah utang.\n\n**Yang disalin dan yang tidak.** Fondasi disalin: komponen bersama `components/ui`, struktur `app/globals.css` (token terang dan gelap, token gerak), gerbang, dan kanon. Yang tidak ikut: palet dan logo proyek lain, konsep domain proyek lain, dan gerbang yang isinya daftar warna. BS menyalin fondasi dari GR tanpa domain toko supplier dan konsep MBG; WI mencangkok dari GR dan BS hanya yang generik, tanpa modul back-office. Dari GR ke Pangantara, hijau-emas tidak dibawa, begitu pula sebaliknya.\n\n**Satu kanon, bukan salinan.** Di BS dan WI folder `selera-pinka` adalah symlink ke repo Pangantara, jadi butuh Pangantara ter-clone bersebelahan di `~/Documents/GitHub/`. Mengubah kanon di satu tempat otomatis berlaku di semua. Menyalin isi kanon ke berkas lain membuka jalan bagi dua sumber kebenaran.\n\n**Paritas layar.** Tiap layar proyek baru dipasangkan dengan layar yang sudah disetujui di proyek lain, dan kekurangannya wajib dibereskan sebelum pemilik menemukannya sendiri. Contoh nyata: pada 3 Oktober 2026 (sore) BS menetapkan spec §20, tiap layar BS dipasangkan dengan layar GR; grup Bulan lalu Minggu, kelompok kategori, baris yang diklik membuka rincian, dan kolom Jumlah dipisah dari Satuan dipasang di Pesanan, Mutasi, Pembayaran, Invoice, Kas kecil, dan PO. Dashboard BS ditargetkan sepadat GR: KPI bisa diklik, pembanding periode, kartu lipat, tab sebaris (BS).\n\n**Vonis \"ikut GR\" (26 September 2026).** Sepuluh bentrok antara bunyi GR dan bunyi Pangantara diputus sekaligus: \"Ikut GR\". Yang berlaku di Pangantara sejak hari itu: tabel lebih lebar dari kartunya digulir dengan kolom pertama menempel (bukan dikecilkan), nol baris kedua di sel, nol teks terpotong \"…\", legenda tabel satu baris, subtotal di bawah kolomnya di baris grup, Ringkasan satu warna putih, perataan persen (satu desimal tetap, minus di slot tetap) dan sel tanggal berslot tetap, serta pola tutup buku. Kanon, komponen, dan gerbang dibalik hari itu juga; utang layar lama dicicil ratchet `gerbang-ikut-gr.test.ts` yang jatahnya hanya boleh turun.\n\nPelajaran proses dari vonis itu, berlaku untuk bentrok baru:\n\n- Satu hal satu bunyi: pemilik memilih sekali, lalu kanon, komponen, gerbang, dan Buku Pegangan ditulis ulang, bunyi lama jadi sejarah.\n- Yang menang bukan proyek yang lebih tua, tapi yang disetujui pemilik setelah dilihat nyata.\n- Palet dan merek tetap milik proyeknya (`950-pelajaran-gemah-ripah.md` bagian 5): \"ikut GR\" tidak berarti memakai hijau GR.\n- Keputusan yang pernah dibalik jadikan satu rumah komponen. Sebab: warna papan angka berbalik dua kali dalam dua hari (27 dan 28 Agustus 2026) sampai putih satu warna dikunci di `KpiTile` dan `RingkasanCard`.\n\n**Prosedur menyalin untuk proyek baru.**\n\n- Salin fondasi dari proyek terdekat (kokpit: GR atau BS; konsumen: WI).\n- Ganti hanya nilai token di `app/globals.css`, `tailwind.config.ts`, dan logo (`components/Logo...`). Jangan mengubah komponen untuk mengganti warna.\n- Buang gerbang yang isinya daftar warna proyek lama, tulis versi proyek baru.\n- Jalankan gerbang selera, buka tiga layar acuan (tabel, form, dasbor) di terang dan gelap.\n- Cek tidak ada sisa nama, domain, atau hex proyek lama.\n\n### Dokumen cetak: memilih tema dokumen\n\nDokumen cetak ada dua jenis dengan pemilih berbeda.\n\n**Dokumen yang dihasilkan sistem** (invoice, kwitansi, surat jalan, sticker, ekspor Excel) memakai identitas proyek, bukan tema bebas. Tampilannya meniru kertas: di dalam `.print-area` abu murni sah (vonis 24 di `500-vonis-konflik.md`, butir 163), karena kwitansi meniru kertas putih. Tetap berlaku: Rp kiri dan angka kanan, kepala tabel rata tengah, kolom Jumlah dan Satuan terpisah (GR); nol teks kapital penuh di kertas, kop tidak dikecualikan (BS). Ekspor Excel punya dua kategori: template kertas dapur mempertahankan warna aslinya, laporan buatan sistem memakai identitas app (navy `#0b2545` dan garis emas 2px di MBG).\n\n**Dokumen di luar sistem** (deck, slide, PPTX, materi Canva, video tutorial) dan Mode C yang cocok moodnya memilih dari `310-tema-dokumen.md`. Prosedurnya:\n\n- **Cocokkan isi dokumen dengan kolom \"best for\"**, bukan selera sesaat. Ada sepuluh tema siap pakai. Contoh: laporan keuangan Ocean Depths, materi serbaguna Modern Minimalist, kuliner Botanical Garden.\n- **Tunjukkan pilihan dulu, tunggu pemilik memilih, baru terapkan.** Tema hasil generate juga dipratinjau dulu. Tidak ada tema yang diterapkan diam-diam.\n- **Tema baru** mengikuti anatomi yang sama: tepat 4 warna bernama (jangkar gelap, aksen utama, aksen sekunder terang, netral terang) dengan hex dan peran, dua slot font (judul Bold dan isi), dan konteks \"best for\".\n- **Cek kontras.** Sebab: pada 28 Agustus 2026 ketahuan Arctic Frost gagal kontras di showcase aslinya, judul ice blue `#d4e4f7` di atas putih `#fafafa` nyaris tak terbaca; ice blue hanya untuk blok latar, teks pakai steel blue `#4a6fa5`. Tiga tema (Sunset Boulevard, Golden Hour, Desert Rose) memang halaman gelap.\n- Tema ini bukan untuk kokpit: identitas MBG terkunci navy dan emas.\n\n### Daftar periksa desain sebelum menyerahkan halaman\n\nDaftar singkat; versi lengkap per mode ada di bab Preflight. Satu kotak gagal berarti belum selesai.\n\n- \\[ \\] Design Read satu baris sudah ditulis, mode dan dial sesuai tabel.\n- \\[ \\] Komponen atau layar kembaran sudah dicari (graf, `250-modul-baku.md`); nol komponen buatan sendiri.\n- \\[ \\] Warna hanya lewat token (`brand`, `brand-2`, `accent`, `paper`, `ink`, `ink2`, `surface`); nol hex baru di komponen; satu warna kokpit solid.\n- \\[ \\] Terang dan gelap diuji; `ink2` lolos 4,5 banding 1.\n- \\[ \\] Latar netral, bukan krem di atas krem; warna logo yang menyala tidak di kokpit.\n- \\[ \\] Font hanya Inter dan Plus Jakarta Sans lewat `next/font`.\n- \\[ \\] Permukaan benar: kokpit tanpa hero, publik ringan dengan `min-h-[100dvh]`, konsumen anti-slop.\n- \\[ \\] Tabel memakai `TabelKartu` dan `table-app`; legenda ada kalau ada ikon atau warna vonis.\n- \\[ \\] Siklus state lengkap (loading, kosong, error); angka palsu berlabel.\n- \\[ \\] Nol em dash penghubung dan nol teks kapital penuh, termasuk kertas.\n- \\[ \\] Gerak lolos gate frekuensi.\n- \\[ \\] Tombol isi data dummy: isinya ditentukan halaman, hanya Super Admin.\n- \\[ \\] Keputusan visual baru dicatat (komentar `globals.css`, `desain.md`, Buku Pegangan), dan bentrok dengan bunyi lama ditulis sebagai vonis, bukan diselesaikan diam-diam.\n\nBab 10\n\n## Warna dan merek\n\n- Tiap proyek punya satu warna identitas solid yang dipakai konsisten untuk kepala tabel, tombol utama, tab aktif, kepala modal, dan chrome back-office. Warna identitas satu proyek tidak dibawa ke proyek lain (BS: marun #8A1C1F untuk kokpit, navy MBG dan hijau-emas GR tidak berlaku).\n- Warna solid, nol gradien, sebagai bawaan proyek baru. Vonis GR 28 Sep 2026: kepala dan kaki tabel, tombol utama, tab aktif, kepala modal satu warna. Versi gugur: gradien navy MBG (#1d4e89 ke #0b2545, 135°) sebagai aturan umum; ia tinggal sebagai kekhasan MBG dan WI, dan bila ada gradien, hanya satu pasang dengan satu arah di seluruh app.\n- Aksen emas hanya tipis: ring tab aktif, penanda kecil. Blok atau tombol emas sama dengan norak. Garis emas 2px di bawah kepala tabel dicabut 26 Sep 2026. Sebab: pemilik MBG, \"gw ga mau list gold gini ada lagi ya\", berlaku di layar, Excel, dan PDF.\n- Latar halaman netral terang dengan kartu putih di atasnya (MBG: paper #f5f7fb, surface #edf2f8 untuk inset dan input). Input putih ber-ring. Nol krem di atas krem.\n- Merah logo yang menyala tidak dipakai sebagai chrome back-office; ia hanya untuk logo dan situs publik. Chrome memakai versi lebih tua supaya tidak menyala (BS: merah logo #D41217 hanya logo dan situs publik, kokpit marun).\n- Status memakai empat warna baku: merah untuk belum atau gagal, sky untuk terkirim atau aktif, emerald untuk selesai, amber untuk menunggu, telat, atau selisih. Pasangan soft-nya: bg-{c}-50/100, text-{c}-600/700, ring-{c}-100/200, mode gelap bg-{c}-900/30 dan text-{c}-300.\n- Warna vonis khusus domain tetap dalam empat warna itu (WI: sangat murah dan murah emerald, wajar sky, mahal amber, sangat mahal merah, curiga penipuan merah plus ikon peringatan). Tabel berwarna vonis ditutup legenda.\n- Satu kelompok data, satu peta warna, di satu berkas sumber. Mau ganti, ubah di sana. Sebab: dua peta pernah hidup berdampingan di MBG (CATEGORY_CHIP dan KOMPONEN_META), dan Tempe tampil violet di popup Bahan Baku tapi lime di kalender, padahal staf membaca warna sebelum tulisan (MBG: PALET_KELOMPOK_PANGAN di lib/komponen.ts).\n- Warna di luar palet dilarang (ungu, violet, fuchsia, lime, indigo, cyan). Jaga pemakaiannya tetap nol (MBG: nol per 28 Jul 2026).\n- Abu murni gray-\\* dilarang; warna muted selalu dari keluarga ink supaya satu keluarga dengan warna identitas. Pengecualian cuma di area cetak (kwitansi, invoice) yang meniru kertas putih.\n- Merah solid #FF0000 hanya di ekspor Excel untuk blok hari non-operasional yang meniru template pemilik.\n- Mode gelap ikut di setiap elemen baru sejak dibuat, bukan tambalan belakangan; terang dan gelap sama-sama dijaga. Teks di atas blok berwarna identitas: putih, dengan lapisan white/15 dan ring-white/20..25 untuk kotak dan chip di dalamnya.\n- Grafik memakai palet pastel terang (biru, pink, toska, oranye), bukan warna identitas redup. Sebab: GR 24 Sep 2026, hijau-emas redup terbaca \"tua banget\". Kontrol seri sebaris di kanan.\n- Kolom sticky persis sewarna kepala tabelnya.\n- Kartu angka tidak berlatar blok warna pekat (WI). Ringkasan KPI memakai kartu putih satu warna, bukan pastel per jenis angka. Vonis: GR/BS menang (26 Sep 2026); versi gugur: pastel menurut jenis angka MBG (11 Agt 2026, Rp emas, total navy, status, entitas sky).\n- Hero hanya untuk halaman konsumen publik (WI: landing boleh hero). Di kokpit internal nol hero. Sebab: MBG pernah membuat hero navy full-width di 6 halaman dan semuanya dibongkar.\n- Permukaan berwarna selalu tingkat pastel 50/100 dengan teks 600/700, dan latar teks panjang selalu putih. Warna pekat hanya untuk tiga hal: pita warna identitas (kepala tabel, baris total, header kartu), pil status kecil, dan aksen emas setipis 2px. Blok warna kuat di belakang paragraf membuat tulisannya tak terbaca dan layar padat terlihat seperti papan iklan; abu tua sebagai latar teks juga dilarang. Sebab: vonis pemilik MBG 25 sampai 27 Jul 2026, \"warnanya terlalu menonjol\", \"dikasih warna biru muda satu warna aja, gausah gini banget warnanya\", \"untuk yang ada tulisan panjangnya belakangnya agar warna putih, jangan abu tua gitu\".\n- Kepala kartu wilayah (gelembung peta, papan gambaran) gelap bernada slate dengan tulisan putih dan garis emas tipis di kakinya, bukan navy dan bukan hijau: navy penanda jenis dapur dan hijau milik koperasi, sehingga kepala wilayah yang memakainya terbaca sebagai jenis titik. Satu jenis satu warna penanda di peta; nilai tingkat (skor kesiapan) jadi lencana berwarna di kepala popup dengan satu ambang bersama (`warnaSkor()`), bukan warna pin yang berbeda, sebab warna kedua di benda yang sudah membawa arti jenis terbaca sebagai jenis lain, bukan sebagai tingkat. (MBG: vonis 8 Sep 2026, \"kalo ga ada logonya dibuat bagus juga ya\" dan \"itu KDMP gausah ada yang beda warna gitu ya samakan semua warnanya\"; membalik vonis 6 Sep 2026 yang meminta latar subtle, sejarahnya tetap tertulis.)\n\nLampiran tema: palet tiap proyek.\n\n| Proyek | Identitas | Aksen dan latar | Catatan |\n| --- | --- | --- | --- |\n| MBG | Navy #0b2545, gradien #1d4e89 ke #0b2545 | Emas #c9a227 aksen tipis, paper #f5f7fb, surface #edf2f8 | WhatsApp hijau resmi #25D366 untuk semua tombol WA |\n| GR | Hijau hutan #34471f, hijau daun #587436 | Emas logo #c9a04a, baris grup #e4ecd8, gelap #1f251b | Solid, nol gradien; logo Agrapana |\n| BS | Marun kokpit #8A1C1F, marun tua #6E1518 untuk fokus dan hover | Krem #F7EBDC, latar #F5F5F4, gelap #181515 | Merah logo #D41217 hanya logo dan situs publik |\n| WI | Navy #0b2545, gradien #1d4e89 | Emas #c9a227 aksen tipis, paper #f5f7fb | Terang dan gelap sejak awal; hero hanya di landing |\n\nBab 11\n\n## Tulisan dan angka\n\n- Dua font terkunci per proyek: satu untuk body, satu untuk display (heading dan angka besar). Itu brand lock, bukan bawaan malas (MBG: Inter dan Plus Jakarta Sans).\n- Hierarki dari bobot ekstrem: normal jarang, bold untuk isi, black untuk judul dan nilai. Bukan judul raksasa.\n- Label seksi dan kolom text-\\[10px\\] font-black, huruf kecil. Teks kecil rapat: tabel 12 sampai 12,5px, th 10,5px, chip 11px, meta 11,5px, letter-spacing kepala tabel 0,09em.\n- Nol teks kapital penuh di layar maupun kertas, kecuali logo dan singkatan resmi. Kop dokumen cetak tidak dikecualikan, dan nama dari xlsx atau PDF dirapikan jadi Title Case di datanya, bukan lewat CSS uppercase. Sebab: GR empat kali memvonis ini; MBG mencabut kapital label 8 Sep 2026 (peraturan 118) karena yang membedakan label dari nilai adalah ukuran, bobot, dan warna. BS menjaganya lewat gerbang caps-layar (3 Okt 2026).\n- Em dash sebagai penghubung di teks yang tampil dilarang; ganti titik dua atau koma. En dash untuk rentang (\"15–20 dtk\", \"20–24 Jul\") sah karena notasi. Em dash tunggal sebagai penanda sel kosong sah karena glyph pengganti nilai. Komentar kode dan prompt LLM dikecualikan; pesan error, judul dokumen, dan template pesan keluar tetap dijaga. Sebab: pelanggaran nomor satu menurut dua penilai MBG; 1.293 pemakaian di komentar tidak berdampak ke pengguna.\n- Kalimat panjang di UI dilarang. Instruksi maksimal satu kalimat, contoh nyata di placeholder (cth: 081234567890).\n- Nol keterangan kecil: teks abu di bawah input, subtitle penjelasan di bawah judul modal atau halaman, dan baris tips di panel dilarang tanpa pengecualian. Penggantinya cuma tiga: contoh di placeholder, label yang jelas sendiri, atau tidak ada apa-apa. Subtitle Modal dan PageHeader hanya untuk data (\"INV/2026/07/014\"). Pesan error setelah aksi gagal, penanda wajib \\*, dan satuan di sebelah angka tetap sah. Sebab: MBG 30 Jul 2026 membersihkan 13 hint, 27 subtitle di 20 berkas, 5 fallback subtitle modal, 3 paragraf panel; prop hint dihapus dari komponen sehingga gagal di typecheck.\n- Semua angka yang dilihat manusia berformat id-ID: titik ribuan, koma desimal (1.063; 12.500; 3,5; 99,75%; Rp 1.250.000,50), di UI, tabel, chip, tooltip, KPI, pesan WA, ekspor, PDF, notifikasi. Lewat satu sumber (fmtNum, fmtRp, fmtQty di lib/format.ts), tanpa helper baru per halaman; input balik ke angka lewat parseNum, bukan Number() polos. Sebab: yang hari ini tiga digit besok empat digit, dan 1063 terbaca seratus-sekian.\n- Pecahan hitungan pun lewat fmtNum (\"24/1.174\", \"1.150 belum\"). Sebab: MBG 23 Sep 2026, pemilik menegur sel kalender \"24/1174\"; sapuan membetulkan 23 tempat, batasnya nol.\n- Angka tabular-nums, rata kanan. Rupiah id-ID tanpa desimal. Sel yang menampilkan \"Rp\" memakai komponen Rupiah dengan Rp rata kiri dan angka rata kanan, di tabel maupun dokumen cetak (NilaiDok).\n- Tanda minus di slot tetap sesudah \"Rp\" atau di tepi kiri sel supaya lurus ke bawah, digit tetap rata kanan. Nol tidak pernah tercetak \"-0\". Nilai nol di sel uang tampil redup.\n- Persen satu desimal dengan tanda di slot tetap. Kolom persen yang harus berjumlah 100 dibulatkan dengan metode sisa terbesar (Hare) lewat satu pustaka. Sebab: MBG 9 Sep 2026, sepuluh pembulatan benar tidak wajib berjumlah 100, dan lembar sebaran menjumlah 100,1 di satu kolom dan 99,9 di kolom lain pada halaman sama.\n- Jam selalu 24 jam berakhiran WIB (06:00 WIB). Zona mengikuti usaha, bukan lokasinya (BS: WIB walau usaha di Bali); usaha lintas zona memakai zona per cabang atau koperasi, bukan WIB terkunci. Sebab: MBG 6 Okt 2026, koperasi WITA/WIT salah hari pukul 00:00 sampai 02:00 bila dikunci WIB.\n- Tanggal panjang \"Selasa, 14 Juli 2026\", pendek \"13 Jul\", rentang \"20–24 Jul\". Di sel tabel padat tahun dua digit (\"17 Agt 26\"); penuh di kepala grup, judul, dokumen cetak, dan nama berkas. Rentang dua tanggal lewat satu helper (labelRentang: \"14 - 26 Sep\"), bukan label periode mentah dari database.\n- Satuan ringkas dipisah spasi dari angkanya: 158,1 rb, 2,6 jt, 1,2 M, Rp 4,7 T. Bentuk ringkas (\"Rp 427,5 jt\") hanya di prosa yang mengalir; angka di kartu dan sel tetap penuh sampai satuan karena dibandingkan dan dijumlah. Sebab: MBG 8 Sep dan 14 Agt 2026, satuan yang menempel terbaca bagian angka.\n- Hitungan ditaruh sebagai lencana di tab, bukan teks nempel di label dan bukan di kepala kartu (\"11 barang\" di kepala kartu dilarang, GR 27 Sep 2026). Salin anatomi lencana dari komponen tab, jangan bikin pil manual. Vonis: GR/BS menang atas MBG yang menaruh lencana di mana-mana.\n- Kosakata baku satu kata per konsep dan dijaga gerbang: \"Ekspor\" bukan Export (hanya copy di layar yang dinilai); satu karakter tunggal \"…\" untuk Memuat… dan Cari…, tetapi nol \"…\" sebagai pemotong teks di sel tabel; \"Batal\" hanya untuk tombol mundur, sedangkan \"Batalkan PO\" tetap sah sebagai aksi atas record (gerbang dipatok sempit supaya tidak memerahi 45 baris benar lalu dilonggarkan). Contoh GR: \"invoice\" saja, \"faktur\" dihapus dari semua teks terlihat kecuali \"Faktur Pajak\" (29 Sep 2026).\n- Kepala kolom padat disingkat dengan kamus tetap (Jlh Pesan, Jlh Terima, Stn, Hrg, Qty, Jth Tempo); kolom yang sedikit tetap nama penuh. Nama dapur, cabang, atau entitas tidak mengulang kata yang sudah ada di kepala kolom (MBG: \"SPPG Toboali\" cukup \"Toboali\" lewat namaDapurRingkas di lapisan tampilan, nama di database tetap utuh karena dokumen resmi memakai bentuk panjang).\n- Kepala kolom tidak mematok satuan yang berubah per baris; satuan milik baris dan tinggal di kolom Satuan. Satuan yang seragam naik ke kepala (\"Gram Besar (g)\") dan tidak diulang per sel, satuan campur jadi kolom Satuan sendiri, Rp dan % boleh menempel di angkanya, dan kolom yang satuannya sudah di kepala (\"Beli (Rp)\") tidak memakai \"Rp\" di selnya sama sekali. Kolom selisih mencetak angkanya, bukan hanya vonisnya. Sebab: kepala \"Gram\" di tabel bersatuan campur berbohong untuk sebagian besar baris.\n- Pesan sukses tanpa emoji (MBG 21 Sep 2026: \"✓ Tersimpan\" melanggar). Diterapkan sebagai ratchet karena 384 pemanggil terlanjur ada; angka hanya boleh turun, yang dicabut emojinya, bukan plafonnya.\n- Alamat yang cuma nama wilayah dianggap kosong, tampil strip redup. Nama menu atau masakan satu nama; label, bahan, dan lauk tidak menempel di nama.\n- Komponen bersama wajib memakai `fmtNum` untuk tiap angka yang dicetaknya, dan gerbangnya dipasang di komponen bersama, bukan di halaman yang kebetulan ketahuan duluan. Dikecualikan: nomor halaman, tahun, nomor dokumen, semua identitas yang bukan kuantitas. Sebab: MBG 19 Agt 2026, selektor Cakupan Resep mencetak \"1031 resep\" di satu pil sementara badge tab di layar yang sama mencetak \"1.035\", karena pil dirender komponen bersama (`SppgCyclePicker`, `BarisGrupTabel`, `BarisSubGrupTabel`, `RekapPeriode`, `Qty`) dan satu `{n}` tanpa `fmtNum` menyebar ke belasan halaman. Gerbang `gerbang-angka-lencana.test.ts`. Angka KPI dan lencana tab diformat di rumah komponennya (MBG: `KotakAngka`, `KpiTile`, `PageTabs`, `SegmentedToggle` lewat `angkaLencana`), bukan tiap pemanggil: 35 dari 195 pemanggil KPI dan sekitar 100 pemanggil badge mengirim number telanjang, jadi tercetak \"Total SPPG 1174\" dan \"Tunggakan Lama 8475\" (MBG 7 Okt 2026: *\"Ini agar pemisah ribuan pakai titik ya\"*). Gerbang `gerbang-angka-kpi`.\n- Kuantitas tidak pernah telanjang: tiap angka qty membawa satuannya, di tabel sebagai kolom sendiri di kanan kolom angkanya, di kartu, chip, dan pesan WA lewat `<Qty>`. Sebab: angka tanpa satuan memaksa pembaca menebak, dan tebakan itu pernah bernilai 155 kali lipat: 90 g dihitung dengan harga per kg menjadi Rp13,95 juta (MBG, 2 Agt 2026).\n- Teks yang dibaca staf ditulis sebagai kerangka berlabel, bukan paragraf: \"Temuan:\", \"Rekomendasi:\", \"Aksi:\", satu baris satu gagasan, enter di antara langkah. Kalimat yang disambung jadi satu blok tak dibaca sampai habis, dan yang hilang justru bagian aksi yang selalu di ujung. Paragraf yang memang harus utuh (narasi Summary AI) dirata `text-justify`. Sebab: vonis MBG 21 sampai 25 Jul 2026, \"rapikan, jangan terlalu bertele-tele terlalu banyak informasi\", \"layouting kata-katanya jangan semua dibuat paragraf gitu\".\n- Judul header kartu adalah nama bloknya, bukan kalimatnya. Dua bentuk dilarang, dua-duanya ekor penjelas yang menyamar jadi judul: titik dua lalu keterangan (semua di kanannya dibuang, bukan dipendekkan) dan judul lebih dari 32 karakter, yang hampir selalu tanda kurung berisi hal yang sudah diterangkan isi kartunya. Contoh (MBG, 29 Agt 2026): \"Kepatuhan Pencatatan: 12 Vonis per SPPG\" jadi \"Kepatuhan Pencatatan\", \"Sanitasi & HACCP Hari Ini: 11 Rekaman Wajib per SPPG\" jadi \"Sanitasi & HACCP\". Penjelasnya turun ke kalimat pengantar di dalam kartu atau subtitle Modal, atau dibuang. Batasnya bukan selera: judul duduk di bar selebar kartunya, dan yang lewat melipat jadi bar dua baris di atas tabel yang justru dipadatkan. Atribut title pada tombol, chip, dan EmptyState tidak dipindai karena di sana ia tooltip. Gerbang: blok judul pendek di `gerbang-selera.test.ts`.\n- Nol baris kedua dan nol teks terpotong adalah saudara kembar di dua sumbu. Satu nilai satu baris; dua data berarti satu baris dipisah titik tengah (·), dan bila tetap tak muat wadahnya yang dilebarkan. `<br>` sebagai pemaksa baris kedua dilarang di popup, tooltip, sel tabel, dan label penanda peta. Alamat dan teks bebas (Keterangan, Catatan) satu-satunya yang boleh melipat, di tabel lewat `sel-bungkus`. Teks tidak pernah dipotong \"...\" di sel tabel maupun grafik, termasuk nama orang, nama wilayah, dan alamat (diperketat 26 Sep 2026, ikut GR): di tabel, tabelnya digulir; di grafik, label yang tak muat tidak ditulis dan tooltip menyimpan nilainya. Label, satuan, kepala kolom, dan legenda tidak pernah boleh terpotong karena semuanya kata yang kita pilih sendiri: yang salah pilihan katanya. Urutan penyelesaian: singkat katanya (kecamatan jadi kec.), baru lebarkan wadah, dan melebarkan wadah yang melayang di atas peta adalah pilihan terakhir. Sebab: MBG 6 Sep 2026, \"kecamatannya kepotong, gw ga pengen ya ada yang gini lagi, ya dibuat jadi kec. aja\" atas sel \"18 kecamata…\" di kartu gelembung peta, dan \"gw ga mau ada yang dua baris ya kecuali alamat\" atas popup dan tooltip peta; utang elipsis lama dicicil ratchet `gerbang-ikut-gr.test.ts`.\n- Kapital penuh punya tiga sumber dan tiap sumber butuh gerbang sendiri; menutup satu tidak menutup yang lain. (a) Gaya: kelas `uppercase` dan tracking lebar, plus aturan CSS global yang mengapitalkan tanpa disebut komponen mana pun. (b) Data impor yang memang datang kapital. (c) Label yang diketik sendiri: peta literal dan teks JSX berkapital penuh (konstanta label tipe akun yang nilainya diketik kapital penuh), dan jalur kertas (`.toUpperCase()` di pembuat PDF). Cakupan pemindai kertas seluruh `lib/export/` **dan `lib/pdf/`**; singkatan resmi dan kode berangka lolos. Tracking lebar dicabut bersama kapitalnya: ia ada untuk melonggarkan huruf kapital, di huruf kecil ia cuma merenggangkan. Sebab: MBG 8 Sep 2026, vonis berulang untuk hal yang sama (19 Agt, 7 Sep, 8 Sep pagi) karena tiap kali ditutup di satu tempat; sapuan hari itu mencabut `uppercase` dari 601 baris di 200 berkas dan 545 tracking lebar, termasuk satu aturan CSS (`.table-app.table-anak thead th`) yang mengapitalkan kepala tabel anak seluruh app tanpa satu komponen pun menyebutnya, sehingga sapuan per komponen sebelumnya tak pernah menemukannya. Kambuh 25 Sep 2026: konstanta label di tab aturan akun dan judul total di PDF Order Bahan yang berkapital penuh karena `.toUpperCase()` di `lib/pdf/kit.ts`. Gerbang: `gerbang-caps-layar` (gaya), `gerbang-caps-lock` (data), `gerbang-caps-label` (label diketik).\n- Istilah jabatan yang divonis pendek diganti di seluruh app (panel, tabel, legenda, judul modal, kolom ekspor), bukan jadi singkatan yang cuma dipakai di kartu sempit; pendeknya menjadi nama resminya. Peran di database tidak ikut berganti: yang diganti nama yang dibaca orang, bukan kunci yang dibaca mesin. Rumahnya satu daftar kolom kontak (MBG: `KOLOM_KONTAK` di `components/kdmp/peta-kontak-wilayah.tsx`). (MBG: Kepala KPPG jadi Ka. KPPG, Kadis Koperasi jadi Kadis Kop, Pendamping kareg jadi Wa. Kareg, vonis 6 Sep 2026; \"PIC Dinas\" dicabut 8 Sep 2026 karena terbaca petugas yang ditunjuk, satu tingkat di bawah kursi yang dimaksud: kursinya sama, kini Kadis Kop Prov dan Kadis Kop Kab dengan glif gedung berbeda, urutan Kadis Kop, Ka. KPPG, Kareg, Wa. Kareg, Korwil.)\n- Satu konsep satu istilah di seluruh teks yang dibaca manusia: judul, kepala kolom, `data-label`, placeholder, pesan error, teks WA dan PDF, dan system prompt tiap Summary AI. Yang tidak diganti: nama variabel, tabel dan kolom DB, id DOM, nilai union type. Kata sambung melebur (\"dapur SPPG\" jadi \"SPPG\", bukan \"SPPG SPPG\") dan klitik memakai tanda hubung bila istilahnya akronim (\"SPPG-nya\"). Gerbang membaca AST, bukan baris: regex per baris tak bisa memisahkan `const dapur = ...` dari \"Semua dapur\" dan langsung melahirkan 336 temuan palsu. Sebab: skema DB MBG sudah pindah ke `sppg_id` tetapi lapisan tampilan tidak ikut; saat divonis masih ada 698 string tampil berkata \"dapur\" di 186 berkas, dan yang paling menular system prompt Summary AI (40-an prompt dibuka \"Kamu ahli gizi dapur SPPG\", sehingga tiap panggilan AI menulis ulang kata itu ke layar). (MBG: kata \"Dapur\" tidak pernah tampil, namanya SPPG.)\n- Satu keluarga huruf di satu tabel. Nilai data (kode, nomor, nama) tanpa `tracking-wide*`; `font-mono` diganti font baku plus `tabular-nums`, kecuali token template dan kredensial; tiap `<table>` data wajib `.table-app`. Sebab: MBG 26 Sep 2026, satu tabel mencampur keluarga dan ukuran: kode \"INV/MBG-...\" berjarak huruf lebar, pil tanggal berfont lain. Tiga ratchet di `gerbang-tipografi.test.ts`.\n- Nama kategori yang muncul berulang di kolom dan pil selalu bentuk pendek, dan sumbernya satu: label di modul kategori, bukan diketik di halaman. Dua ejaan untuk satu kategori membuat penyaring, pengelompokan, dan legenda berhenti cocok tanpa satu pun error. Nama panjang tetap sah di kolom Kategori daftar bahan, judul kartu, prosa, dan tooltip. Obatnya di komponen `CategoryBadge`, bukan per tabel; pil rakitan dengan `CATEGORY_CHIP` wajib mencetak `.short`. (MBG: Karbo, P. Hewani, P. Nabati, Buah, Sayur, Susu, Bumbu; vonis 25 Sep 2026 \"Karbohidrat ya Karbo, Protein Hewani ya P. Hewani\" menggantikan bentuk \"L. Hewani, L. Nabati\" dari vonis 23 Jul 2026. Gerbang `gerbang-pil-kategori`.)\n- Tombol prev dan next periode selalu berkata \"Minggu lalu\", \"Bulan depan\", \"Kemarin\", dibaca relatif ke periode yang sedang dilihat, bukan ke hari ini. Kejujurannya dijaga lencana tanggal yang selalu tercetak di sebelah katanya; lencana itu jangan dihapus. (MBG)\n\nBab 12\n\n## Ikon, chip, legenda, tombol\n\n- Satu registri konsep ke ikon (BS: lib/ikon-status.ts); satu ikon tidak pernah dua arti. Ikon nav sebuah modul sama dengan ikon tab dan legendanya. Registri menyimpan ikon, bukan kata jenisnya, supaya legenda tidak berbohong saat ikon diganti. Sebab: GR 3 Okt 2026, ikon promo dan ikon hadiah loyalitas dipisah.\n- Ikon formal: simbol netral atau benda harfiah. Nol ikon pesta, minuman, makhluk imut, gestur tangan, robot, cuaca. Ikon peran dan pekerjaan tetap boleh. Status pelanggan berupa kotak warna, bukan kiasan cuaca atau alam. Sebab: GR 29 Sep 2026, \"masa gelas wine gitu\". Lingkupnya tampilan app; isi teks pesan WA ke pelanggan (wa.me) boleh ramah berikon, dan pengecualian itu dicatat di gerbang ikon-formal (BS, 8 Okt 2026).\n- Emoji fungsional wajib di nav, tab, dan tombol sebagai kunci pemindaian layar padat; judul kartu bukan tempat emoji. Contoh baku: 📆 tanggal, 🕐 jam, 📷 kamera, 🧾 nota, 🔎 cari, 💾 simpan, 📨 kirim, 📍 lokasi, 📝 catatan, ⚠️ masalah, 💰 gaji, 💵 tempo tunai. Emoji dilarang menggantikan logo brand (WhatsApp memakai komponen WaIcon, jangan salin SVG ke-12).\n- Ikon aksi gaya lucide digambar inline: stroke 2 sampai 2,4, round cap dan join, viewBox 24, ukuran 16 sampai 18px, tampil polos tanpa kotak, cincin, atau latar di keadaan diam (versi gugur: dibungkus kotak h-8 w-8 rounded-lg border; dicabut 25 Sep 2026, lihat butir ikon polos). Library ikon baru dilarang. Sebab: bundle, app dibuka di HP dengan sinyal lapangan.\n- Tiap opsi tab, sakelar, dan mini tab berikon. Nol label berbentuk tulisan: tiap chip berikon sendiri (GR 3 Okt 2026: \"Gw gamau ada label yang bentuknya tulisan\"; 41 chip teks dikonversi). Kategori yang berulang per baris lebih baik jadi sub-grup lipat.\n- Status dan nilai berkode (kategori, komponen, tingkat, satuan target) tidak pernah kata polos di sel: jadi chip berwarna atau ikon. Di kolom tabel ia menyusut jadi ikon polos plus legenda. Tempo tunai ikon berlegenda, bukan kata \"Tunai\".\n- Tombol kontak orang selalu WhatsApp dengan SVG resmi, bukan gagang telepon.\n- Chip informasi putih ber-shadow (h-9 rounded-full bg-white px-3.5 text-\\[11px\\] font-bold shadow-card ring-1 ring-ink/5). Chip, badge, pil wajib whitespace-nowrap, dipasang di komponen Badge, bukan ditambal per pemakaian. Sebab: \"Kas Manual BKU\" patah dua baris adalah cacat.\n- Dot status kecil di depan label selalu semantik, tidak dekoratif. Chip status dokumen bundar berisi simbol saja, label di tooltip (✕ belum atau kedaluwarsa, ✉ aktif belum diisi, ✓ sudah diisi). Badge penanda merah kecil: rounded-full bg-red-50 px-2 py-0.5 text-\\[10px\\] font-black text-red-600.\n- Badge notifikasi menampilkan angka penuh, tidak dipotong 9+ atau 99+ (MBG 14 Agt 2026). Sebab: selisih 12 dan 340 tertunggak adalah selisih keputusan.\n- Legenda kaki kartu satu komponen (LegendaTabel) di dalam kartu di bawah tabel, dipisah garis tipis, untuk tiap tabel yang selnya berisi ikon, pil kode, atau warna vonis, termasuk ikon kolom Aksi. Entri dibangun dari peta status yang sama dengan selnya, bukan diketik ulang. Keadaan yang tampil sama tidak dapat dua baris legenda. Pil legenda tidak lebih kecil dari yang dijelaskannya. Bukan tooltip dan bukan kalimat penjelas di atas tabel.\n- Legenda tidak mengulang status yang sudah dinamai chip di strip saringan, tidak mengulang label baris grup, dan tidak memuat cara pakai (\"klik baris\"). Satu baris bila muat (sampai 7 entri rata tengah); bila tak muat turun baris rapi (grid ceil(n/2) kolom, tepat dua baris), tidak pernah terpotong. Vonis: GR \"semua legenda satu baris\" digabung MBG turun baris; versi gugur: legenda yang dipotong. Konstanta legenda tombol aksi tidak dikecualikan dari penyaringan ikut isi: kunci entri dipanen dari baris yang benar-benar dirender, bukan dari registri utuh, dan label legenda dua sampai tiga kata (maksimal 24 huruf, \"WhatsApp supplier\" bukan \"Ingatkan supplier lewat WhatsApp\"), awalan yang mengulang nama kolom dibuang, kalimat penuhnya turun ke title yang jadi tooltip entrinya. Sebab: MBG 15 Agt 2026, legenda aksi gaji dan klaim tercetak utuh di ember Belum Bayar padahal tak satu pun tombolnya muncul di sana; entri yang tak pernah tampil bukan keterangan, itu daftar kemungkinan, dan menenggelamkan delapan entri yang dipakai di bawah 21 entri.\n- Penanda di legenda berupa simbol, ikon, atau swatch warna, sebentuk persis dengan yang tercetak di sel, lalu keterangannya di sebelah; bukan chip berkata yang mengulang keterangannya (chip berkata melipat dua baris dan menimpa tetangga). Selnya pun jadi ikon, katanya di title. Sah: kode pendek paling banyak dua huruf (PM, H+2) dan contoh data berangka sebentuk isi sel (⚠ 3, 12). Kata sel matriks yang sah didaftar tertutup dan cuma boleh menyusut. Legenda belasan entri memakai prop bungkus di komponen legenda, bukan tambalan className. Vonis MBG 7 Okt 2026 (*\"Lu tau kan gw ga mau label pake kata-kata ini. Harusnya legenda atau simbol ya.\"*), sapuan 49 entri di 24 berkas, gerbang `gerbang-legenda-simbol`.\n- Pil legenda menerangkan jenis, tidak pernah data baris. Beri entri kata jenis sendiri, jangan potong kalimat tooltip. Sebab: MBG 14 Sep 2026, legenda mencetak pil \"Sawi Putih\" dari potongan tooltip satu baris invoice.\n- Tombol utama memakai warna identitas solid (di MBG gradien 135°), rounded-xl, font-bold putih, hover naik 1px plus shadow, active:scale-.98 sampai .99 sebagai feedback sentuh. Di HP: full-width py-3.5 text-\\[15px\\] sticky bawah dengan bg-white/95 backdrop-blur plus safe-area-inset. Sekunder putih border-ink/10 shadow-card. Pil kecil di header kartu rounded-full bg-brand/10 px-3 py-1.5 text-\\[11px\\] font-bold.\n- Disabled tetap terlihat (opacity 40 sampai 60). Loading di tombolnya sendiri (\"Menyimpan…\", \"Mengirim…\"). Teks dialog konfirmasi rata kiri, subjek tebal, poin akibat. Kaki setiap popup (modal, dialog konfirmasi, popup tulisan tangan) menggambar semua tombolnya sebaris, sama lebar, ujung ke ujung, tanpa ruang kosong, lewat satu komponen kaki (MBG: `KakiModal`; `Modal` memasangnya bawaan untuk prop footer, isinya tombol langsung tanpa pembungkus flex). Batal, Tutup, Kembali adalah tombol sekunder berbingkai, bukan teks polos; Hapus varian bahaya; aksi utama primer di paling kanan; satu tombol pun memenuhi lebar kaki. Label Tiap Kata Kapital (\"Batal\", bukan \"Batalkan\"); info yang dulu duduk di kiri kaki (total, cacah, sisa plafon) pindah ke subjudul modal. Vonis MBG 7 Okt 2026 (*\"pastikan SEMUA pop up dibuat bawahnya kaya gini jangan ada white space ya\"*), gerbang `gerbang-kaki-modal`. Versi gugur: tombol sekunder lebar 1 plus primer lebar 2.\n- Angka nominal masuk ke label tombol (\"📨 Kirim Tagihan Rp 1.234.500\"). Satu intent CTA satu label di seluruh app; CTA tidak wrap dua baris di desktop; tombol text-link polos untuk aksi penting dilarang.\n- Toolbar tab bertabel: kotak cari plus ikon (folder, Excel, PDF, tambah) sebaris, nol tombol berteks; Excel selalu berpasangan PDF; nol bar cari tanpa ikon. Aksi massal di bar cari memakai TombolIkon (ikon telanjang, arti di title), bukan tombol berkalimat. Tombol bulk berpasangan: netral \"Siapkan\" plus primer \"Kirim ke Semua\".\n- Link langsung dibuka, nol tombol salin; pengecualian satu-satunya kredensial akun baru di Admin. Vonis: GR 29 Sep 2026 (\"Kalo dia link ya langsung buka\") menang; versi gugur: ikon rantai sebagai aksi salin link di set aksi baku MBG.\n- Filter yang cuma menyaring tabel yang sama ditolak; cukup kotak cari plus ikon kolom berlegenda. Dropdown filter di grid empat kolom dengan placeholder \"Semua \\<label>\". Nol tab \"Semua\": urutan tab sama dengan urutan proses, bawaan tab paling awal yang berisi.\n- Tombol berteks dengan emoji di prop yang terpisah dari katanya lolos gerbang per baris; pemindai tombol harus menjaring isi berkas, bukan per baris (MBG peraturan 83, 30 Agt 2026). Tombol Summary AI lahir hanya dari satu komponen (peraturan 73).\n- Ikon diwarnai menurut latarnya, bukan menurut jenis datanya. Pertanyaan yang dijalankan tiap kali ikon dipasang: apa warna latar tempat ia mendarat? Warna jenis (MBG: `WARNA_SPPG` navy, `WARNA_KDMP` hijau tua) hanya sah di atas latar terang. Di kepala bergradien, bilah judul popup, gelembung berwarna, atau pil berlatar gelap, ikon jenis mendarat sebagai warna di atas warna sendiri dan nyaris hilang, dan gagalnya diam: ikon tetap tergambar, cuma tak terbaca. Yang benar `currentColor` atau `text-white` eksplisit; warna jenis tetap dipikul penanda peta dan kotak legenda, dua tempat berlatar terang. Sebab: MBG 7 Sep 2026, kepala tabel papan peringkat, \"jangan warna biru dan hijau, buat warna putih biar keliatan, kalo mau icon ya perhatikan warna latarnya juga\". Gerbang `gerbang-peta-kdmp.test.ts`.\n- Ikon tampil polos di mana pun: ikon tanpa huruf atau angka di sebelahnya tidak diberi pil, kotak, lingkaran, cincin, bingkai, atau bayangan di keadaan diam; yang tersisa warna ikon dan latar lembut saat hover. Akarnya kelas bersama, bukan halaman (`KELAS_AKSI`, `Badge` yang membungkus emoji tunggal, `LegendaTabel`, sekitar 290 salinan ad hoc), jadi obatnya helper bersama (MBG: `cumaIkon` dan `buangLatarIkon` di `lib/ikon-polos.ts`); tombol Summary AI dan Cek AI di samping Excel dan PDF jadi ikon saja. Dikecualikan: pil bertulisan, sakelar atau centang berstatus, tombol melayang di atas foto atau peta, sel tabel. (MBG: vonis 25 Sep 2026, ketiga kalinya hari itu, \"gw ga mau ada yang rounded rectangle di belakang gitu\"; gerbang `gerbang-ikon-polos`.)\n- Status Aktif, Nonaktif, dan Arsip ditampilkan sebagai ikon centang, bukan pil bertulisan; teksnya tidak boleh jadi isi elemen tampilan, tetapi tetap wajib di title dan aria-label. (MBG: vonis 25 Sep 2026 \"pakai icon aja lah ceklist kek gausah dalam tulisan gitu labelnya\", menimpa komentar lama yang sengaja membela pil bertulisan; gerbang `gerbang-pil-aktif`.)\n- Daftar hitam ikon formal: kiasan makanan, cuaca atau langit, tanaman, aktivitas orang, dan dekorasi atau perayaan untuk konsep non-harfiah, plus semua gestur tangan dan orang bergestur. Yang sah: simbol netral (dokumen, daftar, centang, larangan, pin) atau benda harfiah domainnya (telur untuk Telur, truk, bank). Ikon peran (staf gudang, Super Admin) bukan gestur dan tetap boleh. Gerbangnya daftar hitam di uji registri ikon (GR; berlaku di MBG). (MBG: vonis 29 Sep 2026 atas legenda tahap berikon gelas dan botol perayaan, \"masa gelas wine gitu, coba dibuat formal deh semua icon-nya\", lalu \"geleuh\" untuk ikon anak ayam, dan \"sangat tidak professional\" untuk gestur tangan; contoh haram: kue untuk Omzet, bola kristal untuk Prakiraan, pohon untuk Pertumbuhan, pelari untuk Diantar.)\n- Sakelar dua sisi usaha (MBG: Bahan Baku dan Barang Ops di Dashboard, Monitoring, Rekonsiliasi) selalu berikon di objek opsinya sendiri; opsi literal berlabel sisi tanpa ikon ditolak, opsi `<select>` tidak dihitung. (MBG: vonis 28 Sep 2026 \"setiap Bahan Baku dan Barang Ops gini tolong dibuatkan iconnya\"; gerbang `gerbang-ikon-sisi.test.ts`.)\n- Di kolom Aksi tabel, aksi tidak pernah ditulis sebagai kata: ikon telanjang, artinya di title dan aria-label yang menyebut nama barisnya, plus legenda kaki kartu. Warna baku dan tidak dipilih ulang per halaman: centang hijau untuk setuju, silang merah untuk tolak, tambah hijau, tong sampah rose untuk hapus, pensil amber untuk revisi, WA hijau. Alasannya lebar: label teks membuat kolom Aksi selebar tiga kolom data dan mendorong tabel digeser, sedangkan panjang kata berbeda tiap baris sehingga tombol tak berhenti di garis yang sama. Tombol berlabel teks tetap benar di luar tabel. Perkakas: `AksiIcon`, `AksiBarisTabel`, `WaIcon`. Dijaga dua lapis: hook menolak tombol berteks baru di dalam `<td data-label=\"Aksi\">` sebelum berkas tersimpan, dan gerbang memagari sisa warisan lewat tabel utang yang hanya boleh mengecil (38 tombol di 20 berkas saat dibekukan); yang dibaca cuma anak tombolnya, jadi title, aria-label, dan atribut SVG tak pernah ikut tertuduh. (MBG: vonis 25 sampai 27 Jul 2026 \"untuk approve pakai ceklist hijau dan cross merah\", \"cukup yang aksinya pake icon tong sampah aja gausah ada kata hapus\"; ditegaskan 18 Agt 2026 atas kolom Aksi Petty Cash, \"aksi agar pakai icon ya. Lu ngerti ga sih? Catat\".)\n- Vonis yang memutuskan sebuah lembar (bukti transfer, bukti pembayaran, nota reimbursement, gaji) hidup di kaki popup yang memuat lembarnya, tidak pernah di kolom Aksi tabel. Kolom Aksi cuma memikul pintu: ikon mata pembuka panel atau ikon nota. Alasannya: tombol vonis di baris tabel bisa diklik tanpa satu dokumen pernah terbuka; orang menekan centang karena barisnya kelihatan wajar, bukan karena fotonya sudah dilihat. Bentuk kaki baku: tombol selebar bagian panel, silang merah di kiri dan centang hijau di kanan persis di bawah foto. Yang ikut hilang: entri terima dan tolak dari registri ikon layar itu (tak ada tombol mati menunggu dipasang), legendanya dari kaki kartu, dan prop vonis dari tabel anak. Nota yang dulu dibuka sebagai tab baru turun jadi isi popup yang sama, sebab lembar di luar app meninggalkan centangnya sendirian di tabel. Revisi: yang dilarang bukan \"vonis di dalam sel tabel\" melainkan vonis yang bisa diklik tanpa dokumennya pernah terbuka. Popup yang isinya tabel boleh memikul centang dan silang di kolom Aksi tiap barisnya asal pembuka lembar (foto atau nota) sebaris dengannya, hanya bila satu popup memutuskan beberapa lembar yang tak bisa disorot satu per satu; popup Bukti Transfer `/invoice` dicabut dari kelonggaran itu karena lembarnya bisa disorot (kolom Aksi cuma pintu: foto, batal, hapus; baris yang diklik jadi lembar yang dipegang kaki). Vonis tengah \"diterima tapi belum lunas\" dicabut dari popup: status `belum_lunas` di DB tidak dicabut karena rekonsiliasi dan buku besar masih membacanya, yang dibuang cuma pintu melahirkan yang baru. Gerbang membaca predikat `<tbody>`; ikon vonis ditolak kecuali berkasnya terdaftar di `PANEL_VONIS_PER_BARIS`. (MBG: vonis 17 Agt 2026 \"di verifikasi setujui dan tolaknya di pop up bukan di aksi, jadi harus cek dokumennya dulu\"; revisi 18 Agt 2026 malam atas dua popup menumpuk, \"kenapa oke atau nggaknya di Verifikasi ya? Harusnya di awal aja\"; revisi kedua beberapa jam kemudian, \"ga gini dong, terima sama tolaknya mirip yang pembayaran lah yang di bawah pop up\".)\n- Nol panah di label aksi: tidak ada panah di teks tombol, tautan, atau pil aksi. Chevron prev dan next tetap sah, begitu pula panah sebagai glif relasi data (lama ke baru). (MBG)\n- Tombol tambah di bilah cari berbentuk ikon plus (`TombolTambahIkon`, nama di title dan aria-label), bukan tombol berteks seperti \"Pinjaman baru\". Bilah cari berurutan: kotak cari yang melebar, Excel, PDF, tombol tambah ikon. Sakelar pil tampilan (`SegmentedToggle` block atau `PageTabs`) berdiri di baris sendiri di bawah `CariExportBar`. Akarnya dua slot yang menerima apa pun (`aksiAkhir` dan `aksi`); tombol simpan atau submit form tidak termasuk. (MBG: vonis 25 Sep 2026 \"gw ga pernah mau ada yang kaya Pinjaman baru ini, buat dalam bentuk icon saja\"; gerbang `gerbang-bilah-alat`.)\n- Bar di atas tabel selalu `CariExportBar`, urutannya kotak cari yang melar penuh, Summary AI, titipan aksi, Ekspor (Excel berpasangan PDF), Cetak, lalu `aksiAkhir` untuk tombol yang melahirkan data. Summary AI dan Ekspor punya slot sendiri (`onSummary`, `onExport`); menempelkan Summary AI lewat aksi dilarang karena urutannya jadi milik pemakai dan halaman berikutnya memilih urutan lain. Bar buatan tangan dilarang total: sampai 17 Agt 2026 bar utama `/pembayaran`, yang justru ditunjuk pemilik sebagai contoh benar, adalah `<div>` plus `<input>` plus dua `<button>` bergaya sendiri sehingga tinggi, radius, dan bobot hurufnya beda dari semua bar komponen. Blok yang punya daftar tapi belum punya Summary AI atau Ekspor bukan dikecualikan, ia belum selesai; yang tidak dipasang cuma yang akan berbohong (Summary AI berlensa mingguan tidak berdiri di tab Bulanan, ia menjanjikan sebulan lalu memulangkan seminggu tanpa satu tanda). Tiap tabel data punya kotak carinya sendiri: satu bar per tabel di atas kartunya, menyaring baris tabel itu saja termasuk nomor dokumen (invoice, PO) karena orang datang membawa nomor dari WA, bukan nama; kartu Cakupan bukan pengganti kotak cari (ia menjawab dapur mana, bukan baris mana), dan kaki tabel mengikuti daftar tersaring. Aksi pindah data (Muat dari Kalender, Kirim ke Kalender, Ekspor, Cetak, Impor, Unduh) duduk di bar ini atau di prop aksi milik `TabelKartu`, tidak di baki aksi header berwarna; yang tetap di baki: Simpan, Reset, Kembalikan, Muat ulang, buka-tutup panel. Gerbang `gerbang-selera.test.ts`, ratchet: 276 dari 357 tabel belum punya bar ini saat diputus, angkanya cuma boleh turun. (MBG: vonis 17 Agt 2026 \"gw mau yang gini jadi template\"; 18 Agt 2026 \"setiap tabel agar ada menu searchnya ya\".)\n\nBab 13\n\n## Tabel\n\nStandar tunggal untuk tiap tabel data internal (kelas dasar table-app), peleburan 12 baris GR/BS, vonis BS 13 dan 14, dan aturan MBG. Acuannya satu tabel contoh yang disetujui pemilik (GR: Top Produk di Dashboard, 27 Sep 2026, \"banyak tabel ga standar\"). Tabel baru lahir standar, tabel lama dicicil saat disentuh; standar ditulis di docs/STANDAR-TABEL.md dan dijaga gerbang ber-ratchet per berkas yang hanya boleh turun.\n\n- 1\\. Kolom No paling kiri, sesempit isinya (w-10/w-12), rata tengah di header dan isi, kelas sel-nomor. Tabel cetak di luar table-app memakai text-center langsung. Pengecualian ditulis di tag tabelnya (data-tanpa-no=\"alasan\"). Sebab: MBG 19 Sep 2026, \"kalo nomor sih harusnya semua rata tengah\".\n- 2\\. Semua kolom bisa disortir lewat SortTh dan useTableSort, kecuali No, Aksi, centang, dan kepala grup berkolspan.\n- 3\\. Uang lewat RpTd/RpCell: \"Rp\" kiri, angka kanan, minus di slot tetap, nol redup. Tabel beruang wajib punya baris total di kaki (data-tanpa-total=\"alasan\" untuk pengecualian).\n- 4\\. Persen satu desimal, tanda di slot tetap (PersenSel).\n- 5\\. Tanggal di slot tetap, lurus vertikal, tanpa koma (TanggalSel); tahun dua digit di sel padat.\n- 6\\. Desimal seragam per kolom (fmtAngkaTetap, Qty). Jumlah barang dipecah dua kolom: Jumlah dan Satuan, bukan satu sel \"3 box\" (MBG 7 Okt 2026: *\"Qty harus dibedakan sama satuannya ya. jangan disatukan\"*, gerbang `gerbang-qty-satuan-terpisah`; pathspec `dir/**/*.tsx` sempat melewatkan berkas tingkat atas, jadi pindai juga akar foldernya).\n- 7\\. Status berupa ikon polos plus satu legenda kaki kartu; pil memakai ikon, bukan kata jenis yang berulang per baris.\n- 8\\. Baris grup: latar muda, seluruh baris bisa diklik, subtotal per kolom, nol lencana hitungan (BarisGrupTabel). Grup tanggal per minggu berlabel \"14–20 Sep 2026\", tanpa \"Minggu 38\". Tabel berkategori punya subtotal per kategori dan grand total di kaki, bisa dilipat per kategori dan bawaannya tertutup; simpan state yang dibuka, bukan yang ditutup, supaya kategori baru otomatis tertutup. Sebab: yang dicari pembuka halaman berkategori adalah subtotal dan grand total.\n- 9\\. Baris total di kaki lewat BarisTotalTabel, warna identitas dengan teks putih. Tr mentah di tfoot atau baris-total tulisan tangan di luar komponen ui ditolak. Subtotal biru muda lewat class baris-subtotal, bukan bg-sky-100 langsung di tr, karena zebra nth-child(even) menang atas utility dan subtotal di baris genap kehilangan warnanya tanpa pola yang bisa dijelaskan.\n- 10\\. Rapat 12px, satu baris per sel, nol \"…\" pemotong. Teks panjang memakai sel-bungkus; cell-clip dan truncate adalah utang, bukan alat. Sel, chip, badge, dan label tombol tidak membungkus dua baris: dua informasi digabung diberi kolom sendiri; sel cell-clip dengan beberapa anak dibungkus satu span (cell-clip > * memaksa block per anak); pola identitas dua baris (nama tebal plus meta di bawah) hanya sah di kartu mobile; nomor dokumen di tabel dapat kolom sendiri, break-all hanya untuk kartu detail dan halaman eksternal.\n- 11\\. Muat satu tampilan di layar 1280px, maksimal 12 kolom tampak; kolom sekunder ke baris rincian atau ekspor. Kepala tabel rata tengah, tidak pernah text-left atau text-right.\n- Vonis lebar: hitung dulu lebar tiap kolom dari isi terpanjangnya, kecilkan lewat tangga ukuran (table-compact 11px, table-mikro 10px dipakai bersama compact, table-nano 9px menggantikan mikro dan ikut mengecilkan kontrol; tangga yang tidak dipakai tidak dihapus, nama kelas jujur), baru bila tetap lebih lebar tabel digulir ke samping di pembungkus tunggal (.tabel-gulir atau .tabel-muat) dengan kolom pertama menempel. Pembungkus overflow-x-auto tulisan tangan ditolak (hook pemblokir), kecuali berawalan breakpoint yang menjadi kartu di mobile. Persentase lebar th berjumlah tepat 100. Vonis: MBG 26 Sep 2026 membalik ke \"ikut GR\"; versi gugur: tabel wajib muat tanpa gulir, kecilkan semuanya jangan geser (31 Jul sampai 26 Sep 2026), yang dicabut karena kolom Saldo, Status, dan Aksi justru sering di ujung kanan.\n- 12\\. Kode dalam pil (KodePil), nama tidak tebal; sel dapur atau cabang berbentuk kode lalu nama. Nol gradien, kolom sticky sewarna kepala, kepala dan kaki warna identitas solid satu keluarga, tanpa garis emas.\n- 13 (BS). Tabel kosong tetap tergambar: kepala kolom tetap plus satu baris polos \"Belum ada …\" (BarisKosong dengan props hanya kolom dan judul). Dilarang: kotak EmptyState berikon di dalam tabel, dan prop kosongJudul/kosongIkon/kosongKeterangan di komponen tabel. Plafon pelanggaran boleh turun saja. Vonis: BS 3 Okt 2026 dan MBG 5 Okt 2026 sepakat; versi gugur: EmptyState ramah beremoji di tabel (emoji dicabut MBG 14 Agt 2026).\n- 14 (BS). Daftar item tanpa titik jadi satu sel ringkas dengan popup rincian (SelDaftarPopup). Baris daftar yang diklik membuka rincian di semua tabel daftar (barisKlik).\n- Data berbaris adalah tabel, bukan grid kartu; satu tabel per tampilan, kelompok jadi baris grup lipat. Tabel yang dibuka di HP berubah jadi kartu lewat data-label (table-cards). Tabel berisi input memakai table-compact.\n- Kepala kolom membeku saat digulir, bukan kotak cari. Dua varian dan salah pilih gagal diam: tabel yang menggulir bersama halaman memakai table-kepala-lengket (top: tinggi navbar), tabel yang menggulir di dalam panel memakai table-kepala-lengket-panel (top: 0). Pembungkus kartu overflow-clip, bukan overflow-hidden, karena hidden menjadikan kartu scroll container dan sticky menempel ke kartu yang tak menggulir. Sebab: MBG 9 Sep 2026, \"Yang freeze harusnya ini No Nama\".\n- Tabel di dalam baris rincian tabel lain memakai table-anak: kepala pita abu, kaki subtotal biru muda, tanpa kartu pembungkus, satu rel kiri setinggi blok. Kepala dan kaki warna identitas hanya untuk tabel tingkat atas, satu per halaman.\n- Sel kosong dengan jawaban lain mengikuti tiga tingkat: nama orang bila kursinya terisi, jawaban cadangan bila kosong tetapi ada jawaban lain, strip hanya bila dua-duanya kosong. Sebab: MBG 14 Sep 2026, delapan provinsi (Banten, DKI, enam Papua) terbaca tanpa kepala kantor padahal datanya ada; gagalnya diam dan menyamar benar.\n- Tabel per entitas di dashboard memakai satu anatomi: menempel ke kartu tabel tanpa bingkai padding, grup per wilayah lewat BarisGrupTabel, baris subtotal dan rerata di kaki tiap grup, kaki Total dan Rata-rata terpisah (rata-rata tidak menumpang di sel Total). Tabel datar tanpa grup dilarang. Kolom tren mini pindah ke popup lewat ikon di kolom Aksi (GR 28 Sep 2026).\n- Dokumen cetak: Rp kiri angka kanan lewat NilaiDok (tabel, baris total, BlokTotal, DaftarInfo), kepala tabel rata tengah, tabel bersudut bulat, qty dua kolom Jumlah dan Satuan, alamat berikon 📍, telepon berlogo WA tanpa kata \"Telp/WA\", nomor dokumen tidak patah baris, nomor halaman kanan bawah. Tabel di modal dan kartu bersudut bawah membulat.\n- Hasil pencarian ditulis sebaris: nama dulu, keterangan sebagai pil di sebelahnya, bukan baris abu di bawah. Bila titik pemotong muncul di banyak baris, yang diturunkan ukuran hurufnya, bukan lebar kolomnya.\n- Kepadatan baris milik `.table-app`: padding vertikal sel baku 0,25rem dengan `line-height: 1,25`, dipatok sekali di blok tak berlapis `globals.css`, bukan `py-*` per halaman. Butuh lebih longgar atau lebih rapat: kelas `table-lega` dan `table-rapat`. (MBG)\n- Sel dua baris (nama di atas, data kedua di bawah, tiap baris dikunci satu baris ber-elipsis, kelas `cell-dua-baris`) sempat jadi jalan keluar saat dua data yang panjangnya tak terduga bertabrakan dengan larangan menggeser tabel (MBG, 2 Agt 2026). Izin itu gugur sejak tabel lebar boleh digulir (vonis 26 Sep 2026, ikut GR): dua data berarti dua kolom, dan yang mengalah lebarnya. Utangnya dicicil ratchet.\n- Baris grup tabel (`BarisGrupTabel`): subtotal duduk di sel kolomnya sendiri lewat prop `sel` dan rentang, lurus dengan angka anak dan baris total; nama grup berlebar minimum (`min-w-48`) tanpa elipsis, tanpa lencana cacah, dan seluruh baris adalah tombol lipatnya. Versi gugur (6 Agt sampai 26 Sep 2026): nama dipagari lebar mati `w-48` plus elipsis supaya lencana jumlah mulai di garis X yang sama; prinsip yang tetap hidup: label dan angka lurus dari atas ke bawah. Bilah grup yang tak bisa memakai `BarisGrupTabel` (bilah minggu Analisis Biaya dan Analisis Gizi yang memikul pil plus tombol AI) menjaga slot pil yang muncul-hilang jadi selalu ada dan menyebut keadaan yang pas (\"Pas\" bertanda centang), bukan mengosongkan slotnya. Sebab: MBG 6 Agt 2026, \"label angka lagi pada kota kabupaten itu tidak seragam lurus ke bawah, camkan itu\": bentuk kepala grup sudah disalin tangan lima kali, nama kabupaten 6 sampai 19 huruf sehingga lencana berhenti di lima tempat berbeda; 29 Agt 2026 \"ini labelnya agar lurus dari atas ke bawah ya, catet kemauan gw ini\".\n- Tabel di dalam baris rincian bukan tabel baru: `table-anak` (kepala pita abu tulisan ink2 tanpa warna identitas dan tanpa garis emas, kaki pita subtotal biru muda, tanpa kartu pembungkus, kepemilikan dinyatakan satu rel kiri setinggi blok). Kecuali di dalam popup tanpa tabel induk di layar yang sama: pita abu terbaca baris data pertama dan tabel seperti tak berkepala, sehingga dipakai `table-anak table-anak-navy` (kepala warna identitas dan baris total tetap milik model baku; kaki bervonis lunas atau kurang tidak ikut navy). Satu rumah: `KELAS_TABEL_VERIFIKASI` di `DokumenVerifikasiModal.tsx`. (MBG: popup Bukti Transfer `/invoice`, vonis 19 Agt 2026 \"modelnya biasa lah kan, harusnya background biru tua dan tulisan putih\".)\n- Rincian membuka ke bawah: klik baris tabel membuka baris rincian ber-`colSpan` di bawahnya, tidak pernah melebarkan sel sampai meluber ke kolom sebelah. (MBG)\n- Sort seragam dan sudah jadi di hook `useTableSort`: klik pertama naik, kedua turun, ketiga kembali ke urutan asli; nilai kosong selalu jatuh ke bawah; baris seri tetap di posisi relatifnya. Urutan yang ditulis programmer cuma urutan bawaan, karena pertanyaan yang dibawa orang ke tabel hampir selalu superlatif (transfer terbesar yang lolos, yang paling lama menggantung). Tabel berkepala grup disort pada daftar rata lalu hasilnya baru dikelompokkan, supaya urutan grup tak teracak dan subtotal tetap benar (header dua tingkat di dashboard: sort global lalu regroup). Tabel berbanyak tab menaruh satu `useSortState` di atas semua tab dan mereset urutan saat tab berganti, sebab kunci yang menggantung dari tab lama menghasilkan header yang diklik tapi diam. Kolom status disort lewat peringkat angka (belum dulu, sudah belakangan), bukan abjad nama status. Jangan menulis perbandingan sort sendiri per halaman: dua tabel bertetangga akan punya dua perilaku. Dikecualikan, ditandai per tabel bukan per berkas: kelas `print-area` dan `urutan-dokumen` (tabel layar yang barisnya bagian dari dokumen: baris Laba Rugi, langkah rencana HACCP, kolom formulir kelayakan), serta kolom aksi, centang, dan kepala grup berkolspan. Sebab: pengecualian per berkas lama membuat satu kata `print-area` di mana pun membebaskan seluruh berkas dan 19 tabel biasa, termasuk empat daftar Invoice, bersembunyi di dalamnya. Gerbang ratchet: 245 dari 348 tabel belum bisa disort saat diputus (231 sejak 18 Agt 2026; 51 di tabel dashboard 25 Sep 2026), angkanya utang yang dicicil, bukan kuota. (MBG: vonis 15 Agt 2026 \"sebisa mungkin tabel bisa sort\"; 18 Agt 2026 \"tabelnya kenapa ga bisa sort ya? kan gw udah masukin aturan. Catat\"; 25 Sep 2026 di `BarangOpsKategoriBlok.tsx`, \"coba cari deh mana table yang kaya gini lagi pastikan semua ada sortnya\"; gerbang `gerbang-sort-tabel-dashboard`.)\n- Dua tabel yang membaca data yang sama adalah satu tabel bergrup, bukan dua tab. Ujinya bukan \"apakah dua layar ini terasa berbeda\" melainkan \"apakah keduanya membaca baris yang sama dari tabel yang sama\". Bila ya: satu tabel dengan `BarisGrupTabel` di sumbu yang lebih penting dan `BarisSubGrupTabel` di sumbu yang kalah; kepala grup memakai slot aksi untuk kontrol yang bisa diklik, dan menyalin bentuk barisnya dengan tangan melanggar aturan baris grup. Sebab: MBG 19 Agt 2026, sub-tab Surat Jalan > Supplier dibubarkan: tab Penerimaan mengelompokkan bahan per kategori sementara sub-tab itu mengelompokkan hal yang sama per supplier dari `grn_items` yang sama dan tombol `/receive/[token]` yang sama, dua layar satu data (\"surat jalan cukup surat jalan sekolah aja\"). Gerbang `gerbang-selera.test.ts`.\n- Data berperiode tidak pernah jadi tumpukan kartu per tanggal yang masing-masing membawa judulnya sendiri. Satu tabel, judul dicetak sekali di atas, tanggal turun jadi kolom atau kepala grup di dalam tabel itu; yang disalin bukan gayanya tetapi susunannya: satu baris satu record, periode sebagai kolom, status sebagai pil, aksi sebagai ikon. (MBG: patokan Daftar PO; vonis 25 Jul 2026 \"agar judulnya cukup sekali di atas, tanggal-tanggal itu masuk ke dalam tabel itu\".)\n- Tanggal merah punya kosakata sendiri di tiap kolom hari: kolom harian yang jatuh di libur nasional berkepala merah dan sel kosongnya berbunyi \"Libur\" lewat `<SelLibur>`, tidak pernah titik abu, \"-\", atau pil \"Belum\". Bentuknya pil (`<PilLibur>`), bukan kata telanjang, di kepala kolom, di sel, di petak strip hari, dan di sumbu X grafik tren. Baris berlatar warna identitas memakai `<SelLibur navy>` supaya latar rose-50 tak menumpuk jadi pita kelabu. Sel yang berisi angka tidak disentuh (barang datang H-1, kiriman dan tagihan di tanggal merah tetap sah); ember minggu atau bulan yang cuma memuat tanggal merah tidak ikut ditandai. (MBG: gerbang `gerbang-libur-kolom-matriks.test.ts`.)\n- Kepala kolom hari seragam: nama hari tebal dengan sub tanggal d/M redup, lewat satu pembangun ember (MBG: `bangunEmber` di `lib/dashboard/ringkasan-tabel.ts`). Format satu string seperti `'EEE, d MMM'` dilarang di komponen dashboard. (MBG: vonis 21 Sep 2026 \"agar dibuat sama dong 21/9 gitu 22/9 gitu\"; gerbang `gerbang-header-hari-seragam`.)\n- Semua tabel duduk di kartu berlengkung. Tabel di dalam `TabelKartu` tanpa judul adalah isi full-bleed: wrapper ber-padding memutus kepala dari lengkungan kartu (cukup `className=\"tabel-muat\"`). Tiap `<table className=\"table-app\">` wajib punya leluhur `<TabelKartu>`, atau elemen ber-rounded yang memotong isinya, atau `.print-area`; `table-anak` dikecualikan. Tabel tanpa kartu sama sekali (`overflow-x-auto` atau `tabel-muat` polos tanpa rounded) membuat kepala berwarna dan badannya runcing. Ratchet, hanya boleh turun, dipindai lewat AST. (MBG: vonis 25 Sep 2026 \"ada yang kotak runcing gitu, gw mau sama semua tipenya ya\"; 1 Okt 2026 atas riwayat penugasan KDMP, \"gw maunya tabelnya ujung-ujungnya rounded rectangle\"; gerbang `gerbang-tabelkartu-sudut`.)\n- Kartu bertabel tetap menggambar tabelnya walau datanya kosong: `thead` lengkap tetap tergambar dan `<tbody>` memuat satu `<tr><td colSpan>` berisi \"Belum ada ...\" polos. `EmptyState` tetap sah untuk layar non-tabel, keadaan terkunci atau tanpa akses, dan galat muat. Butir ini mempersempit butir tabel kosong untuk kartu yang memang bertabel: jangan menukar seluruh tabel (kepala dan kolom sort) dengan `EmptyState` begitu barisnya nol. (MBG: vonis 28 Sep 2026, diulang empat kali, \"dimunculin aja bentuk tabelnya dulu walaupun ga ada, coba dibuat semua gitu ya, cek semuanya\"; rujukan bentuk `PengeluaranMatrix.tsx`; gerbang ratchet `gerbang-tabel-kosong-tampil`.) Vonis ini diulang final MBG 7 Okt 2026 (*\"Catat ya. lu harus gini\"*): kartu bertabel yang kosong tidak pernah diganti kartu EmptyState, tfoot Total dan Rata-rata disembunyikan, dan gerbang `gerbang-tabel-kosong-tampil` diperluas ke pola \"EmptyState menggantikan tabel\".\n- Tabel per entitas yang dibagi per kab/kota dibagi juga per kecamatan: tiga tingkat, kab/kota (`kelompokPerKabupaten` plus `BarisGrupTabel`, warna identitas), kecamatan (`subKelompokKecamatan` plus `BarisSubGrupTabel`, biru muda, bawaan tertutup), lalu baris entitas. Berkas yang mengelompokkan per kab/kota tetapi barisnya bukan entitas (kategori bahan di dalam satu dapur) dikecualikan dengan alasan tertulis. (MBG: vonis 28 Sep 2026 \"ini bagus nih dibagi per kecamatannya, yang lain dibuat gini juga aja ya\"; gerbang `gerbang-subgrup-kecamatan.test.ts`.)\n- Grup wilayah lahir tertutup: yang terlihat pertama cuma daftar kab/kota berikut ringkasannya; kecamatan dan entitas muncul sesudah diklik, dan kecamatan pun lahir tertutup. Pencarian aktif boleh membuka grup yang cocok; kursi satu entitas tidak melihat grup wilayah. Hook grup dipanggil dengan bawaan tertutup untuk grup wilayah (MBG: `useGrupTertutup({ bakuTutup: true })`; grup non-wilayah tetap lahir terbuka). Kartu ringkasan yang berdampingan berbagi satu daftar bergrup (MBG: `DaftarDapurBergrup`), bukan kepala grup tulisan sendiri per kartu, supaya pembagi kecamatan tidak ada di satu kartu dan hilang di sebelahnya. Vonis MBG 7 Okt 2026 (*\"Secara default yang keliatan kab/kota dulu. Cek semua ya.\"*), gerbang `gerbang-grup-wilayah-tertutup` dan `gerbang-angka-kpi` blok B dan C.\n- Baris rincian bukan baris grup. Selektor dari kelas baris grup ke sel wajib combinator anak (`tr.recipe-group > td`); baris grup cuma memuat label, rincian yang dibuka duduk di baris rinciannya sendiri. Sebab: MBG 7 Okt 2026, di /resep rincian yang dibuka berlatar biru muda di semua sel, Grand Total putih, dan langkah \"Cara Membuat\" tebal karena selektor keturunan mewariskan gaya baris grup ke seluruh isi. Gerbang `gerbang-baris-rincian`.\n- Kolom pertama yang lengket di kepala dua baris berangkat dari `thead tr:first-child`, bukan `tr:last-child`; yang terakhir mengecat sub-kolom tengah (\"Beli\", \"Status\") pekat sendirian (MBG 7 Okt 2026, asersi baru di `gerbang-tabel-geser`).\n- Matriks angka menaruh label wilayah dan angkanya di baris yang sama. Kolom pertama \"Wilayah\", dan tiap baris (kota, kecamatan, entitas, Subtotal, Rata-rata, Total) membawa angkanya sendiri; bilah kota dan kecamatan lewat prop `sel` di `BarisGrupTabel` dan `BarisSubGrupTabel`. Ditolak: (A) baris Subtotal, Rata-rata, atau Total berupa satu sel ber-colSpan, (B) `BarisSubGrupTabel` tanpa `sel` atau `kanan` di tabel angka. Sebab: matriks yang menggambar label wilayah sebagai baris `<td colSpan>` sendiri dan angkanya di baris bawah membuat kecamatan yang terlipat tak punya angka. Ratchet, gerbang kedua di `gerbang-subgrup-kecamatan`. (MBG: vonis 1 Okt 2026 atas tabel Barang Ops per kategori, \"ini dari kemarin kan gw bilang dibagi per kecamatan yang collapsible, lu dengerin ga sih?\")\n- Sel entitas berupa lencana kode plus nama pendek: satu bentuk baku, lencana warna identitas berisi kode dan nama berbobot biasa (MBG: `SelKodeNamaDapur`, nama lewat `namaDapurPendek()`); teks polos tebal seperti \"BB-BA-005 · Bangka Sungailiat Parit Padang\" ditolak. Dropdown, pesan WA, dan ekspor dikecualikan. Nama di layar bentuk pendek (\"Rangkui Pintu Air 2\"), bukan bentuk ringkas yang membawa kab/kota dan kecamatan; bentuk panjang tetap sah untuk kertas dan WA. Di bawah sub-grup kecamatan baris memakai `{ tanpaKecamatan: true }` supaya tak mengulang kecamatannya. (MBG: vonis 26 Sep 2026 \"kode dan namanya masih gini ya, lu ga niru ini ya?\" dan \"nama SPPG nya kenapa ga sesuai standar\"; gerbang `gerbang-sel-kode-dapur`, `gerbang-nama-dapur-layar`, `gerbang-nama-dalam-kecamatan`.)\n- Ikon aksi di baris entitas membawa entitas barisnya, dan yang wajib benar penerimanya. Tautan sudah membawa `?sppg=<id>`; yang pernah rusak penerimanya: komponen cakupan memenangkan entitas dari URL tetapi tidak mematikan toggle \"Semua\" (bawaan true), sehingga halaman tujuan tetap merender ringkasan lintas entitas. Diperbaiki di satu rumah itu (`components/SppgScope.tsx`), bukan per halaman. Di berkas yang menggambar sel entitas, href literal ke halaman ber-cakupan tanpa param entitas ditolak (gerbang `gerbang-aksi-dapur-spesifik.test.ts`). (MBG: vonis 28 Sep 2026 \"ini gw klik aksinya cuma perginya kenapa ke kalender dan order yang semua dapur Lampung? Harusnya kan dapur spesifik ya\".)\n- Sel Satuan ditulis polos dan huruf kecil: `<td data-label=\"Satuan\">` tidak dibungkus span berpil atau rounded, karena pil membuat \"kg\" terbaca seperti status. Pasangannya di DB: trigger yang memaksa huruf kecil (\"kg\", bukan \"Kg\"). (MBG: vonis 25 Sep 2026 di tabel Forecast, \"ini satuan kenapa dibuat label ya\"; gerbang `gerbang-satuan-polos` dan `tests/e2e/112-satuan-huruf-kecil.sql`.)\n- Layar tidak mencetak baris untuk keadaan yang tidak ada. Baris, chip, dan seksi yang isinya kabar baik (\"sudah sesuai\", \"tidak ada selisih\", \"sudah ada di sistem\") tidak dicetak per record: yang menuntut tindakan berhak memakai tinggi layar, sisanya diringkas jadi satu kalimat di kaki atau tidak ada sama sekali. Bila seluruh daftar kosong, yang terbit satu `EmptyState` yang menyebut nama embernya. Blok yang isinya kosong tidak dicetak, dan yang dicek seluruh isi blok itu, bukan cuma tampilan yang sedang dibuka: seksi bersakelar arah yang disembunyikan karena satu arah kosong ikut menyembunyikan sakelarnya sehingga arah sebelah yang berisi tak tergapai (MBG: seksi \"Kecamatan tanpa pasangan\" berkepala \"0 kec.\", vonis 8 Sep 2026 \"kalo emang ga ada isinya yaudah ga usah muncul bagian ini\"). Layar kerja yang dibuka untuk mengerjakan sesuatu hanya memuat yang butuh tindakan orang: tabel rujukan yang sudah punya gerbangnya bukan isi layar (MBG: tab Kamus Satuan dengan 40-an ejaan berpil hijau \"selaras\" dicabut, sebab drift sudah diadu gerbang tiap `npm test`; layar itu lapisan yang lebih longgar menempati ruang lapisan yang lebih rapat dan memberi rasa terjaga yang palsu), dan baris yang kolom isiannya mati menenggelamkan baris yang butuh orang (400-an bahan bersatuan kg yang gramnya sudah dijawab kamus menutupi 40-an bahan bersatuan utuh: krat, botol, papan, pcs, ikat, yang menahan gizi puluhan resep selama kosong). Ujinya satu kalimat: bila baris itu tak punya apa pun yang bisa diubah orang dan tidak sedang salah, ia bukan isi layar kerja; ia isi gerbang, atau ekspor, atau tidak ada di mana pun. Ranjau yang membedakan penyaringan dari pembutaan: baris bertemuan wajib tetap lolos saringan, sebab baris bersih dan baris salah terlihat sama di layar yang mengosongkan diri, dan yang kedua membuang penjaga uang (gr seharga 55.000 itu Rp55 juta per kilogram); saringannya memuat semua kelas temuan (dimensi lain, beda ejaan, harga janggal, satuan tak dikenal). Akar yang sama dengan legenda: daftar yang memuat semua kemungkinan menenggelamkan delapan baris yang perlu dikerjakan di bawah dua puluh yang tidak. (MBG: vonis 25 sampai 27 Jul 2026 \"misalnya udah oke yaudah gausah muncul dong\"; 29 Agt 2026 \"kamus satuan itu tolong dimasukkan ke sistem aja ga perlu lu tampilkan\" dan \"kalo satuannya kg harusnya gausah ada konversi satuan\"; gerbang blok 4 `gerbang-satuan-toko.test.ts`.)\n- Daftar yang bisa melewati satu layar penuh (sekitar 50 baris) memakai `Paginasi` dan `PER_HALAMAN_BAKU` dari components/ui, tidak dibuat sendiri. Yang dipaginasi barisnya saja: total baris tetap panjang penuh sesudah saringan, sort tetap berlaku lintas halaman, halaman kembali ke 1 tiap tingkat, wilayah, atau urutan berganti. Daftar yang mustahil panjang tidak dipaginasi. (MBG: vonis 6 Sep 2026 sambil menggulir Ringkasan Kab/kota, \"ini panjang banget ke bawah, ada paginasinya dong. Catet ya\"; gerbang `gerbang-paginasi-layar.test.ts`.)\n\nBab 14\n\n## Layout halaman dan navigasi menu\n\n- Kerangka: internal max-w-6xl, halaman eksternal max-w-2xl. Tinggi min-h-\\[100dvh\\], bukan h-screen atau min-h-screen (100vh salah di HP saat bar URL bergerak; halaman eksternal paling sering dibuka di HP lapangan). CSS Grid, bukan matematika persen flex; container query untuk panel yang bergantung pada lebar kolomnya sendiri.\n- Satu skala radius per halaman: panel rounded-2xl, tombol dan input rounded-xl, kotak ikon rounded-lg, chip dan pil rounded-full, bottom-sheet rounded-t-2xl. Panel: rounded-2xl bg-white p-4 shadow-card ring-1 ring-ink/5, jarak space-y-3.5.\n- Urutan blok halaman baku, ditulis sekali sebagai konstanta kerangka dan dijaga dari sumber oleh gerbang: judul halaman, Ringkasan, cakupan, periode, bar cari, sub-tab, isi, log. Periode tidak terjepit di bawah atau di antara blok Ringkasan; kerangka luar tidak menitipkan periode tanpa ringkasan, dan kerangka yang punya ringkasan dan bar cari wajib punya periode kecuali layarnya tak berperiode. Vonis: GR 1 Okt 2026 \"Ringkasan di atas period picker\" menang; versi gugur: urutan MBG cakupan, bar cari, periode.\n- Tiap halaman daftar punya satu Ringkasan lipat, bawaan tertutup, putih satu warna, dengan tombol Excel/PDF/Cetak tidak pernah di dalamnya. Pil angka di header Ringkasan dicabut; angka hidup di satu tempat. Sebab: MBG 26 Sep 2026 mencabut larangan Ringkasan di Operasional; kini berlaku di seluruh app. Tile KPI sebaris mengisi penuh lebar, tile tanpa data dihapus (bukan strip), kepala tile ikon dan label sebaris, angka rata tengah, persen naik/turun sebaris angka, tile berpembanding dua kolom berlabel (periode kini dan lalu).\n- KPI satu lapis: label kecil huruf kecil di atas, angka text-2xl font-black tabular-nums di bawah, dalam satu kotak. Bentuk dua lapis (pita label di atas, kotak angka di bawah) dicabut: setinggi dua blok dan satu deret memakan sepertiga layar. Rona tile diputuskan di satu rumah komponen, tidak disetel per pemanggil (123 pemanggil di 31 halaman tidak akan selesai). KPI dashboard bisa diklik ke rincian dengan pembanding periode dan kartu lipat.\n- Filter bar baku: cakupan (kartu putih berlabel berisi picker), lalu periode (kartu putih berlabel berisi picker plus tiga tombol lompat, varian per satuan hari, minggu, bulan, rentang; halaman baru memilih salah satu), baru kotak cari. Dilarang: nama cakupan sebagai teks abu pengganti pemilih, dan input tanggal telanjang di slot aksi sebagai pemilih periode halaman (input tanggal di dalam form tetap sah).\n- Blok yang isinya langsung tabel tidak punya judul di atasnya: pakai TabelKartu, bukan SectionCard, karena dua bar warna bertumpuk jelek (\"ga perlu ada header judul atasnya gitu\"). Kartu yang dibuka form, deret KPI, atau ringkasan tetap berjudul. Judul kartu hanya nama bloknya (\"Pembelian per Kelompok Pangan\"), periodenya sudah di bar periode.\n- Aksi tabel di luar kartu, sebagai baris sendiri di atasnya, dipimpin kotak cari (flex-1) bila daftar bisa panjang. Bar yang isinya cuma tombol rata kanan tidak usah ada. Tombol setingkat satu deret. Judul seksi memakai kartu lipat (lihat butir kartu lipat di bawah), bukan label telanjang dan bukan h2 polos; ZoneHeading dihapus 18 Agt 2026 (versi gugur).\n- Nol ruang menganga. Urutan perbaikan: rapatkan jadi satu rombongan (buang ml-auto dan justify-between, gap-2); lebarkan yang kiri (flex-1, input w-full); titipkan tombol tunggal ke bar yang ada; sisa lebar dihabiskan dengan melebarkan tombol (\\[&>\\*\\]:grow di wadah bar, bukan per tombol). Tombol yang melar itu fitur: target sentuh membesar. Sebab: pemilik MBG, \"ini kan ada white space ya di sebelah kanan... ukuran buttonnya widthnya ditambahin\". Ranjau: className lebar pemakai kalah dari w-full di inputClass; lebar mati kontrol berbasis inputClass wajib !w-\\[…\\].\n- Grid kartu sejajar tidak menganga: gap sama, kolom dibagi rata, sisa ruang dihabiskan kartu. Blok bertumpuk berbagi satu tepi kiri dan kanan; tabel di bawah memakai lebar kolom yang sama dengan tabel di atasnya. Kendali (pemilih, tile KPI, sakelar) tidak melayang di latar tanpa kartu putih (dijaga gerbang AST, utang boleh turun).\n- Popup muncul utuh di tengah layar, panelnya dipagari setinggi layar dan menggulir di dalam, lewat satu komponen ModalOverlay. Nol gulir samping di popup; lebarkan popupnya mengikuti tabel terlebarnya: 5 sampai 6 kolom max-w-3xl, 7 sampai 8 max-w-5xl, 9 ke atas max-w-6xl; kolom yang tetap tak muat pindah ke baris rincian. Nol slider di deret tile popup. Sebab: MBG 1 Sep 2026, popup 896px dipilih saat tabel berlima kolom lalu empat kolom menyusul dan tak ada yang menanyakan lebarnya; gagalnya diam. Popup profil: ikon status sebaris nama, isi jadi kartu lipat.\n- Urutan halaman eksternal: bar status, kartu identitas, panel putih, aksi sticky, bottom-sheet konfirmasi. Bottom-sheet di mobile (items-end) jadi dialog tengah di desktop (sm:items-center). Siklus state lengkap: loading berbentuk hasil akhir (skeleton, bukan spinner bundar), kosong ramah berarah, error berarah. Elemen terpotong atau overflow adalah bug serius.\n- Kontrol milik orang lapangan tidak dikurung di mode revisi; tempatnya di kartu detail yang relevan, bukan di dalam kondisi editMode dan bukan tab baru. Sebab: MBG 28 Agt 2026, panel kalibrasi diisi orang yang memasak, bukan yang merevisi resep.\n- Strip tab tidak memotong label jadi titik tiga: mode satu baris memakai flex-auto dan pil tidak menyusut di bawah lebar isinya; truncate hanya sah di mode grid. Grid pil nav dihitung dari jumlah tab per peran supaya baris terakhir tidak bolong. Sebab: MBG 15 Sep 2026, flex-1 berangkat dari lebar nol sehingga \"Stok\" dan \"Kalender Operasional\" dapat jatah sama; menyusutkan huruf cuma membeli 17 persen.\n- Klik pindah halaman terasa cepat: staleTimes.dynamic minimal 30 detik (bawaan 0 menembak server tiap klik), dan loading.tsx di batas grup rute sebagai batas prefetch. Sebab: MBG 19 Sep 2026, 46 dari 50 folder rute tanpa loading.tsx; layar membeku diam tanpa error. Kontrol berchrome urgent, subtree berat deferred (WI).\n- Prinsip susunan menu: urut alur usaha, sisi jual di atas, sisi beli dan uang di bawah; hulu di depan (BS: Menu & Resep di depan Pesanan karena menu dan harga hulu semua pesanan). Sepuluh menu dipecah 5 + 5 dalam dua baris; vonis GR 29 Sep 2026 mengembalikan ke 5 + 5 karena \"ga simetris\" saat menu sembilan. Maksimal sekitar 8 tab per menu; tautan lama tetap mengarah ke tempat baru.\n- Menu Admin wajib ada dan tidak bisa disembunyikan (NAV_WAJIB), supaya pemilik tidak terkunci di luar. Ikon nav dibaca dari registri konsep. Satu peta peran (PAGE_ACCESS) dibaca nav dan guard; halaman baru wajib didaftarkan, bawaannya ditolak.\n- Contoh susunan GR (5 + 5): Dashboard, Pelanggan, Order, Invoice, PO Supplier | Pemasok, Pembayaran, Akuntansi, Stok, Admin. Pembayaran dikelompokkan per tujuan bayar (supplier, driver/gaji, biaya lain); piutang di Invoice; mutasi bank, cocokkan, dan rekonsiliasi di Akuntansi; pengantaran bukan menu (driver dan peta live jadi mini tab di Order); retur tinggal di rumah jenisnya (PO, Order, Stok › Barang Rusak); arsip hanya di Admin › Arsip; tab Admin: Pengguna, Tampilan, Dokumen, Pengaturan, Link Eksternal, Sistem, Arsip. Nol filter Aktif/Arsip di halaman lain.\n- Contoh susunan BS (5 + 5): Dashboard, Menu & Resep, Pesanan, Dapur, Pengantaran | Pelanggan, Stok & Pembelian, Uang, Laporan, Admin. Admin: Pengguna, Tampilan, Pengaturan, System Health, Audit Log, Cadangan, impor. Situs publik dan halaman pesan berada di luar menu; link bertoken tanpa login terpisah.\n- Menu berkelompok tidak menghilangkan layar: tiap pasangan (tab, sub) punya tepat satu daun (layar tanpa daun adalah yatim), tidak ada strip lebih dari 10 pil sebaris untuk peran mana pun, paling banyak 12 kelompok, layar kosong tidak dicetak untuk peran yang tak berhak, semua peran mendarat di satu layar awal, dan tiap alias URL lama bermuara ke layar yang punya daun (MBG KDMP, 5 Okt 2026).\n- Paritas antarproyek: layar yang punya padanan di proyek saudara dipasangkan, kekurangannya dibereskan sebelum pemilik menemukannya (BS spec §20, 3 Okt 2026), dan bentrok selera antar proyek diputus satu kali lalu berlaku di semua (\"ikut GR\", 26 Sep 2026).\n- Repo hanya punya branch main; worktree dan branch agent dihapus sesudah push (GR 27 Sep 2026).\n- Isi halaman tidak pernah lebih lebar dari strip nav. Strip nav hidup di satu bingkai `mx-auto` berlebar maksimum, dan tiap halaman di bawah grup rute app wajib merender isinya di dalam bingkai `mx-auto max-w-*` yang tak lebih lebar dari itu; `main` di layout tidak memberi container, jadi halaman yang lupa membungkus dirinya menempel ke tepi viewport dan tampak keluar dari nav di monitor lebar. Bingkai lebih sempit sah (laporan 4xl, absensi 3xl); yang dilarang cuma yang lebih lebar. Panel frameless pola tab-tertanam tetap frameless; rute berdiri sendirinya yang wajib membawa bingkai. Angka bingkai ikut proyeknya (MBG: nav `max-w-7xl`, kokpit padat). Sebab: MBG 22 Agt 2026, `/dashboard/kendali` yang KPI-nya membentang melewati nav; audit hari itu menemukan lubang identik di `/haccp` dan `/sanitasi`. Gerbang `gerbang-bingkai-nav.test.ts`.\n- Teks tidak pernah tumpang tindih dan tak ada isi terpotong keluar tepi kanan, di semua keluaran visual: halaman app, HTML dokumen di `docs/`, dan artifact yang diterbitkan. Kalimat wrap di dalam kolomnya sendiri; yang tak muat di-wrap, dikecilkan, atau kolomnya ditumpuk ke bawah, tidak pernah disembunyikan atau dibiarkan meluber. Tiga mekanisme pelanggaran di halaman dokumen, semuanya dilarang: grid beberapa kolom teks dengan lebih dari satu `1fr` telanjang (tulis `minmax(0, 1fr)` atau `repeat(auto-fit, minmax(...))`, sebab `min-width: auto` bawaan grid membiarkan konten panjang menyeruduk kolom sebelah), teks `position: absolute` (dua blok absolut tak tahu tinggi satu sama lain), dan `overflow-x: hidden` (menyembunyikan luber, bukan membetulkannya; halaman tidak menggulir horizontal karena isinya muat). Padanan flex: anak kolom teks wajib `min-width: 0`. Sebab: MBG 24 Agt 2026, halaman rujukan routine yang tiga blok alur, implikasi, dan batas matinya saling menimpa dan poin terakhirnya terpotong keluar layar (\"gw ga mau ada yang tumpang tindih gini kalimatnya dan gw ga mau ada yang ga keliatan gini sampai overflow ke kanan\"). Gerbang `gerbang-tumpang-tindih.test.ts`.\n- Log aktivitas selalu paling bawah: `ActivityLog` memuat jejak seluruh halaman, bukan jejak record yang sedang dibuka, jadi rumahnya blok terakhir halaman, di bawah kartu isi terakhir, tertutup secara bawaan. Jalan naiknya selalu sama: log ikut tinggal di fragmen rincian, lalu fragmen itu dipindah. Sebab: MBG, di `/resep` Log Resep ikut di dalam `detailResep`, dan waktu rincian dipindah ke dalam baris tabelnya, log satu halaman muncul di t
