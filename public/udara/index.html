<main>
  <section class="page on" id="p-peta" aria-label="Peta kualitas udara">
    <div id="peta"></div>
    <div class="muat" id="muat"><div><div class="spin"></div>Memuat perkiraan kualitas udara seluruh Indonesia…</div></div>
    <div class="panel" id="panel">
      <nav class="crumb" id="crumb" aria-label="Tingkat wilayah"></nav>
      <div class="card list">
        <button class="handle" id="handle" aria-label="Perbesar atau perkecil panel"></button>
        <div class="top">
          <div style="margin-bottom:8px"><span class="kt" style="--c:#6b7280;--f:#fff;text-transform:none;letter-spacing:0">perkiraan model CAMS, belum dikoreksi</span></div>
          <div class="cari">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="cari" type="search" placeholder="Cari provinsi" autocomplete="off" aria-label="Cari provinsi">
          </div>
        </div>
        <div class="rows" id="rows" role="list"></div>
      </div>
    </div>
    <div class="tools" id="tools">
      <div class="card garis-waktu on" id="garisWaktu" aria-label="Hari prakiraan"><span class="lbl" style="white-space:nowrap">Prakiraan udara (hari)</span><div id="hariSeg" style="flex:1"></div></div>
      <div class="card garis-waktu on" id="jamKota" aria-label="Jam prakiraan kota" hidden></div>
      <button class="iconbtn" id="lapisBtn" style="background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:grid" aria-label="Overlay peta" title="Lapisan peta">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <div class="box lapis" id="lapis">
        <div class="lapis-hd"><span>Overlay</span><button type="button" id="lapisLipat" aria-label="Tutup semua grup" title="Tutup semua grup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 5-5 5 5M7 18l5-5 5 5"/></svg></button></div>
        <details open><summary>Kualitas udara</summary>
          <label><input type="checkbox" data-l="kota" checked> Status kota 72 jam</label>
          <label><input type="checkbox" data-l="lintasan" checked> Lintasan asap dari api</label>
          <label><input type="checkbox" data-l="pm25" checked> PM2,5 perkiraan</label>
          <label><input type="checkbox" data-l="metar" checked> Jarak pandang bandara</label>
          <label><input type="checkbox" data-l="satelit" checked> Citra satelit</label>
        </details>
      </div>
    </div>
    <div class="dok" id="dok">
      <div class="box" id="legenda"></div>
    </div>
    <aside class="card laci" id="laci" aria-label="Rincian provinsi"></aside>
  </section>

  <section class="page scroll" id="p-kejadian" aria-label="Kejadian udara"><div class="wrap" id="kejadian"></div></section>
  <section class="page scroll" id="p-insight" aria-label="Insight kualitas udara"><div class="wrap" id="insight"></div></section>
  <section class="page scroll" id="p-berita" aria-label="Berita kualitas udara"><div class="wrap" id="berita"></div></section>

  <section class="page scroll" id="p-simulasi" aria-label="Simulasi asap"><div id="simUdara"></div></section>
  <section class="page scroll" id="p-foto" aria-label="Foto warga"><div id="foto"></div></section>
  <section class="page" id="p-tentang" aria-label="Tentang Pantau Bencana"><iframe id="tentangBingkai" title="Tentang Pantau Bencana" style="width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .5s cubic-bezier(.16,1,.3,1)" onload="this.style.opacity=1" loading="lazy"></iframe></section>
