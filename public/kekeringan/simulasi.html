<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<base href="/kekeringan/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulasi kekeringan · Centurisk97</title>
<link rel="icon" href="../img/logo.svg?v=2" type="image/svg+xml">
<script src="../i18n.js"></script>
<meta name="description" content="Simulasi neraca air tanah 180 hari: tiga skenario hujan, fase tanam padi, dan perlakuan pompa, tanam lebih awal, atau hujan buatan.">
<link rel="canonical" href="https://centurisk97.id/kekeringan/simulasi">
<meta name="theme-color" content="#0b2545">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="stylesheet" href="../inti/kepala.css">
<link rel="stylesheet" href="../inti/tema.css">
<link rel="stylesheet" href="../inti/gaya.css">
<link rel="stylesheet" href="../inti/kartu.css">
<link rel="stylesheet" href="simulasi.css">
<script>if (/[?&]tertanam=1/.test(location.search)) document.documentElement.classList.add("tertanam");</script>
<style>.tertanam header.top{display:none}.tertanam main{height:100dvh;top:0}</style>
</head>
<body>
<header class="top">
  <div class="mark">
    <a class="logo" href="../" title="Centurisk97"><img src="../img/logo.svg?v=2" alt="Centurisk97" width="30" height="30"></a><details class="bencana" data-bencana="kekeringan"><summary><svg class="bc-ik" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="#d9a441"/><path fill="none" stroke="#d9a441" stroke-width="1.8" stroke-linecap="round" d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>Kekeringan</summary><div class="menu"><a href="../"><svg class="bc-ik" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f08a3c" d="M12 2.5c1.8 4 6.5 6.4 6.5 11.5a6.5 6.5 0 0 1-13 0c0-2.5 1.2-4.3 2.8-5.8.3 2.1 1.4 3.3 2.7 3.8C10.6 9 11.1 5.8 12 2.5Z"/></svg>Karhutla</a><a href="../banjir/"><svg class="bc-ik" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4f9be0" d="M12 2.5s-6 6.7-6 11a6 6 0 0 0 12 0c0-4.3-6-11-6-11Z"/></svg>Banjir, Longsor & Rob</a></div></details><a class="sm-kembali" id="kembali" href="/kekeringan/" aria-label="Kembali ke peta"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Kembali ke peta</span></a>
  </div>
  <div class="stat">
    <span class="sm-sim">Simulasi</span>
    <button class="iconbtn" id="tema" aria-label="Ganti tema terang/gelap" title="Ganti tema"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  </div>
</header>

<main id="sim">
  <div class="sm-peta"><div id="peta"></div><div class="sm-muat" id="muat"><div><div class="spin"></div>Memuat data simulasi…</div></div></div>

  <aside class="sm-kiri" id="kiri" aria-label="Pengaturan simulasi">
    <div class="sm-kartu">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Mulai dari kejadian nyata</span></div>
      <p class="sm-cat" id="awalTeks"></p>
    </div>
    <div class="sm-kartu" id="kartuMulai">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Mulai simulasi</span></div>
      <div class="seg penuh" id="segMulai" role="group" aria-label="Mulai simulasi"></div>
    </div>
    <div class="sm-kartu">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z"/></svg>Skenario hujan</span><button class="sm-info" id="info" aria-label="Metode dan batas model" title="Metode dan batas model"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button></div>
      <div class="seg penuh" id="segSk" role="group" aria-label="Skenario hujan"></div>
    </div>
    <div class="sm-kartu">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M12 9c0-3 2-5 5-5 0 3-2 5-5 5ZM12 13c0-2.5-1.8-4-4.5-4 0 2.5 1.8 4 4.5 4Z"/></svg>Tanam padi</span><b id="vTanam"></b></div>
      <input type="range" id="rTanam" min="0" max="90" step="1" value="10" aria-label="Hari tanam">
      <div class="sm-fase" id="fase"></div>
    </div>
    <div class="sm-kartu">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>Perlakuan</span></div>
      <div class="seg penuh" id="segPl" role="group" aria-label="Perlakuan"></div>
      <div class="sm-slid" id="slPl"></div>
    </div>
    <div class="sm-kartu">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Asumsi</span></div>
      <div class="sm-slid" id="slAs"></div>
    </div>
    <div class="sm-kartu">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Porsi luas stres berat</span><b id="hHari"></b></div>
      <div class="sm-hasil" id="hasil"></div>
    </div>
    <div class="sm-kartu">
      <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg><span id="dampakJudul">Dampak</span></span></div>
      <div class="sm-hasil" id="dampak"></div>
    </div>
  </aside>

  <section class="sm-bagan" id="bagan" aria-label="Neraca air sel terpilih">
    <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="selNama">Sel</span></span><span class="sm-nilai" id="selNilai"></span></div>
    <div id="grafik"></div>
    <div class="sm-leg" id="legGr"></div>
    <div class="sm-hd"><span class="sm-pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Peringkat perlakuan</span></div>
    <div class="seg penuh" id="segUrut" role="group" aria-label="Urutkan peringkat"></div>
    <div id="peringkat"></div>
  </section>

  <footer class="sm-bawah" id="bawah">
    <button class="sm-play" id="play" aria-label="Putar" title="Putar atau jeda"></button>
    <div class="sm-lintas">
      <svg id="spark" preserveAspectRatio="none" aria-hidden="true"></svg>
      <input type="range" id="rHari" min="0" max="179" step="1" value="0" aria-label="Hari simulasi">
    </div>
    <b class="sm-tgl" id="tgl"></b>
    <div class="sm-opsi">
      <div class="seg" id="segKec" role="group" aria-label="Kecepatan"></div>
      <div class="seg" id="segMode" role="group" aria-label="Warna peta"></div>
      <button class="sm-p3" id="b3d" aria-pressed="false">3D</button>
    </div>
    <div class="sm-leg" id="legPeta"></div>
  </footer>
</main>

<dialog class="sm-dlg" id="dlg"></dialog>
<script src="../inti/format.js"></script>
<script src="sim_tanggap.js"></script>
<script src="simulasi.js"></script>
<script type="module" src="../inti/kepala.js"></script>
</body>
</html>
