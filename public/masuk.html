<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk, Centurisk97</title>
<meta name="description" content="Masuk ke Centurisk97 dengan username dan sandi.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="/admin/admin.css?v=15" rel="stylesheet">
</head>
<!-- satu pintu masuk, hanya username dan sandi (pemilik 26 Nov 2026, KEPUTUSAN-MASUK K25: "Sandi saja, WA hapus"); tata letak = halaman masuk lama sebelum PS-08 -->
<body class="ad-masuk">
<div class="ad-sisi-masuk">
<div class="ad-pola" aria-hidden="true"></div>
<main class="ad-kartu-masuk">
  <div class="ad-kepala-masuk">
    <img src="/img/logo.svg?v=2" alt="Centurisk97" width="44" height="44">
    <h1>Pemantauan kondisi bencana di Indonesia secara <em>real time</em></h1>
    <p>Staf BNPB, BPBD, instansi, dan mitra masuk di sini</p>
  </div>
  <div class="ad-isi-masuk">
    <form id="fAkun" method="post" action="/masuk">
      <div class="ad-isian">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <input id="iAkun" name="email" type="text" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required autofocus>
        <label for="iAkun">Username atau email</label>
      </div>
      <div class="ad-isian">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="iSandiAkun" name="sandi" type="password" placeholder=" " autocomplete="current-password" autocapitalize="none" spellcheck="false" maxlength="200" required>
        <label for="iSandiAkun">Kata sandi</label>
        <button class="ad-mata" id="bMata" type="button" aria-label="Tampilkan sandi" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8Z"/><circle cx="12" cy="12" r="3"/><path class="coret" d="m2 2 20 20"/></svg></button>
      </div>
      <p id="pGalat" class="ad-galat" role="alert" hidden></p>
      <button class="ad-tombol-masuk" id="bAkun" type="submit">Masuk</button>
    </form>
    <p class="ad-catatan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6Z"/></svg>Sesi 12 jam, percobaan masuk dibatasi</p>
  </div>
</main>
</div>
<aside class="ad-galeri" aria-label="Jenis bencana yang dipantau">
  <figure class="ad-pita"><img src="/img/masuk/karhutla.webp?v=1" alt="Karhutla, Palangka Raya, Kalimantan Tengah"><figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s-6 6-6 11a6 6 0 0 0 12 0c0-5-6-11-6-11Z"/></svg><b>Karhutla</b><span>Palangka Raya, Kalimantan Tengah</span></figcaption><a class="ad-kredit" href="https://commons.wikimedia.org/wiki/File:Talawang_Monumen_Palangka_Raya_Haze.jpg" target="_blank" rel="noopener" title="Foto: ParadoxP P, CC BY 4.0" aria-label="Foto: ParadoxP P, CC BY 4.0">i</a></figure>
  <figure class="ad-pita"><img src="/img/masuk/banjir-longsor.webp?v=1" alt="Banjir dan longsor, Agam, Sumatera Barat, 2025"><figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20c2.5 0 2.5-2 4.5-2s2 2 4.5 2 2.5-2 4.5-2 2 2 4.5 2"/><path d="m4 15 6-9 4 5 2-2 4 6"/></svg><b>Banjir dan longsor</b><span>Agam, Sumatera Barat, 2025</span></figcaption><a class="ad-kredit" href="https://commons.wikimedia.org/wiki/File:Landslides_in_Agam_Regency,_West_Sumatra.jpg" target="_blank" rel="noopener" title="Foto: BNPB, Public domain" aria-label="Foto: BNPB, Public domain">i</a></figure>
  <figure class="ad-pita"><img src="/img/masuk/rob.webp?v=1" alt="Gelombang pasang dan abrasi, Demak, Jawa Tengah"><figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8c3 0 3 2 5 2s2-2 5-2 3 2 5 2 2-2 5-2M2 15c3 0 3 2 5 2s2-2 5-2 3 2 5 2 2-2 5-2"/></svg><b>Gelombang pasang dan abrasi</b><span>Demak, Jawa Tengah</span></figcaption><a class="ad-kredit" href="https://commons.wikimedia.org/wiki/File:Rumah_Mak_Jah_di_Desa_Bedono_yang_Tenggelam_karena_abrasi.jpg" target="_blank" rel="noopener" title="Foto: Tim LindungiHutan, CC BY 4.0" aria-label="Foto: Tim LindungiHutan, CC BY 4.0">i</a></figure>
  <figure class="ad-pita"><img src="/img/masuk/gempa.webp?v=1" alt="Gempa dan tsunami, Palu, Sulawesi Tengah, 2018"><figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2-6 4 13 3-9 2 2h5"/></svg><b>Gempa dan tsunami</b><span>Palu, Sulawesi Tengah, 2018</span></figcaption><a class="ad-kredit" href="https://commons.wikimedia.org/wiki/File:Bencana_Tsunami_Palu.jpg" target="_blank" rel="noopener" title="Foto: Ungkeito, CC BY-SA 4.0" aria-label="Foto: Ungkeito, CC BY-SA 4.0">i</a></figure>
  <figure class="ad-pita"><img src="/img/masuk/cuaca.webp?v=1" alt="Cuaca ekstrem, Nusa Tenggara Timur, 2021"><figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17a4 4 0 1 1 1-7.9A6 6 0 0 1 19.5 11 3.5 3.5 0 0 1 18 17Z"/><path d="m12 13-2 4h3l-1 4"/></svg><b>Cuaca ekstrem</b><span>Nusa Tenggara Timur, 2021</span></figcaption><a class="ad-kredit" href="https://commons.wikimedia.org/wiki/File:Seroja_2021-04-05_0545Z.jpg" target="_blank" rel="noopener" title="Foto: NASA, LANCE / MODIS on Aqua, Public domain" aria-label="Foto: NASA, LANCE / MODIS on Aqua, Public domain">i</a></figure>
  <figure class="ad-pita"><img src="/img/masuk/gunungapi.webp?v=1" alt="Letusan gunung api, Banyuwangi, Jawa Timur, 2015"><figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 21 7-12h6l7 12Z"/><path d="M12 9V3M9 5l3-2 3 2"/></svg><b>Letusan gunung api</b><span>Banyuwangi, Jawa Timur, 2015</span></figcaption><a class="ad-kredit" href="https://commons.wikimedia.org/wiki/File:Eruption_of_Raung_Volcano_(2015)_from_Bali_strait_at_dawn.jpg" target="_blank" rel="noopener" title="Foto: consigliere ivan, CC BY 2.0" aria-label="Foto: consigliere ivan, CC BY 2.0">i</a></figure>
</aside>
<script src="/masuk.js?v=6"></script>
</body>
</html>
