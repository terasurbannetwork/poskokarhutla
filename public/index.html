<style>
:root{
  --paper:oklch(97.6% .006 255); --card:oklch(100% 0 0); --surface:oklch(95.5% .012 255);
  --ink:oklch(25.5% .075 256); --ink2:oklch(50% .045 258); --line:oklch(90% .015 255);
  --brand:oklch(25.5% .075 256); --brand2:oklch(42% .11 255); --accent:oklch(68% .09 252);
  --ok:oklch(62% .16 150); --warn:oklch(76% .16 75); --bad:oklch(57% .21 27); --info:oklch(66% .13 235);
  --f0:oklch(72% .15 150); --f1:oklch(86% .16 98); --f2:oklch(73% .17 58); --f3:oklch(57% .21 27);
  --shadow:0 2px 14px oklch(25% .07 256 / .08); --shadow-lg:0 8px 28px oklch(25% .07 256 / .16);
  --r:16px; --r-sm:10px; --top:58px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Plus Jakarta Sans",var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:oklch(18% .035 256); --card:oklch(22.5% .045 256); --surface:oklch(26% .05 256);
  --ink:oklch(94% .012 255); --ink2:oklch(76% .035 255); --line:oklch(33% .05 256);
  --brand:oklch(64% .12 252); --brand2:oklch(70% .11 250); --accent:oklch(72% .1 252);
  --shadow:0 2px 14px oklch(0% 0 0 / .35); --shadow-lg:0 8px 28px oklch(0% 0 0 / .5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:oklch(18% .035 256); --card:oklch(22.5% .045 256); --surface:oklch(26% .05 256);
  --ink:oklch(94% .012 255); --ink2:oklch(76% .035 255); --line:oklch(33% .05 256);
  --brand:oklch(64% .12 252); --brand2:oklch(70% .11 250); --accent:oklch(72% .1 252);
  --shadow:0 2px 14px oklch(0% 0 0 / .35); --shadow-lg:0 8px 28px oklch(0% 0 0 / .5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.018em;margin:0}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
header.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:30;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(135deg,oklch(42% .11 255),oklch(25.5% .075 256));color:#fff}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.mark svg{flex:none}
.mark b{font-family:var(--display);font-weight:800;font-size:15.5px;white-space:nowrap}
.mark small{display:block;font-size:11px;opacity:.75;white-space:nowrap}
/* tab mengisi ruang antara logo dan status: jarak antar-tab rata, tidak menyisakan kekosongan kiri-kanan */
nav.tabs{display:flex;justify-content:space-evenly;gap:4px;margin:0 clamp(8px,3vw,48px);overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;max-width:980px}
@media (min-width:1500px){nav.tabs{margin:0 auto}}
.stat,.mark{flex:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button svg,nav.tabs a.tab-ln svg{width:16px;height:16px;flex:none;opacity:.9}
@media (max-width:1280px){nav.tabs button svg{display:none}nav.tabs button,nav.tabs a.tab-ln{padding:8px 11px;font-size:13.5px!important}}
nav.tabs button,nav.tabs a.tab-ln{text-decoration:none;display:inline-flex;align-items:center;gap:7px;font-size:14.5px!important;border:0;background:transparent;color:#fff;opacity:.78;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{opacity:1;background:oklch(100% 0 0 / .08)}
nav.tabs button[aria-current="page"]{opacity:1;background:oklch(100% 0 0 / .16)}
.lainnya{flex:none}
.lainnya summary{list-style:none;display:flex;align-items:center;gap:6px;color:#fff;opacity:.78;padding:8px 13px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
.lainnya summary::-webkit-details-marker{display:none}
.lainnya summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.lainnya summary:hover,.lainnya[open] summary{opacity:1;background:oklch(100% 0 0 / .08)}
.lainnya:has(button[aria-current="page"]) summary{opacity:1;background:oklch(100% 0 0 / .16)}
.lainnya .menu{position:fixed;z-index:60;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;display:grid;gap:2px}
nav.tabs .lainnya .menu button{color:var(--ink);opacity:1;text-align:left;border-radius:10px;padding:8px 12px}
nav.tabs .lainnya .menu button:hover,nav.tabs .lainnya .menu button[aria-current="page"]{background:var(--surface)}
.stat{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.stat .jam{font-family:var(--display);font-weight:700;font-size:14px}
.iconbtn{border:0;background:oklch(100% 0 0 / .12);color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:oklch(100% 0 0 / .22)}
@media (max-width:900px){.stat .upd,.mark small{display:none}}
@media (max-width:1500px){.mark small,.stat .upd{display:none}}
@media (max-width:1100px){.mark > div{display:none}}
@media (max-width:640px){header.top{gap:6px;padding:0 8px}.stat .jam{display:none}nav.tabs{margin:0;flex:1}nav.tabs button{padding:8px 10px;font-size:13px}}
/* mobile: pilihan bencana & tema disembunyikan, tab pindah ke menu garis tiga (pemilik, 15 Okt 2026) */
#burger{display:none}
@media (max-width:640px){#burger{display:grid}.bencana,#tema{display:none!important}.stat{margin-left:auto}
  nav.tabs{display:none;position:fixed;top:var(--top);left:8px;right:auto;z-index:60;flex-direction:column;align-items:stretch;gap:2px;margin:6px 0 0;padding:6px;min-width:220px;max-height:calc(100dvh - var(--top) - 20px);overflow-y:auto;
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg)}
  header.top.buka nav.tabs{display:flex}
  nav.tabs button{color:var(--ink);opacity:1;justify-content:flex-start;border-radius:10px;padding:11px 14px!important;font-size:15px!important}
  nav.tabs button svg{display:block!important}
  nav.tabs button:hover{background:var(--surface)}
  nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--accent,var(--ink))}}

/* ---------- pages ---------- */
main{position:fixed;inset:var(--top) 0 0 0}
.page{position:absolute;inset:0;display:none}
.page.on{display:block}
.scroll{overflow-y:auto;padding:22px 18px 60px}
.wrap{max-width:1240px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media (min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.head>*{min-width:0;max-width:100%}
.head p{margin:4px 0 0;color:var(--ink2);max-width:70ch}

/* ---------- map page ---------- */
#peta,#simPeta{position:absolute;inset:0}
canvas.angin{position:absolute;inset:0;pointer-events:none;z-index:1;display:none}
.dok{position:absolute;z-index:4;left:calc(var(--lp, 400px) + 24px);right:calc(var(--tw, 250px) + 24px);bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.dok > *{pointer-events:auto}
.garis-waktu{width:min(620px,100%);padding:8px 10px;display:none;align-items:center;gap:10px}
#legenda{width:100%;max-width:100%;padding:6px 14px 8px;position:relative}
#legenda summary{display:flex;justify-content:center;gap:6px;text-align:center}
.lg-isi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 22px;align-items:start;max-height:var(--tl, 150px);overflow:auto;margin-top:6px}
.lg-g{min-width:0}
.tarik-v{position:absolute;top:-6px;left:50%;width:56px;height:12px;margin-left:-28px;cursor:row-resize;touch-action:none}
.tarik-v::after{content:"";position:absolute;left:12px;right:12px;top:4px;height:4px;border-radius:4px;background:var(--line)}
.tarik-v:hover::after,.tarik-v.aktif::after{background:var(--brand2)}
.lg-g .lbl{margin:0 0 3px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-g .leg{flex-direction:column;flex-wrap:nowrap;gap:3px;margin:0!important}
@media (min-width:901px){#legenda .lg-isi{display:grid!important;gap:12px 28px;align-items:start}#legenda .lg-isi > .leg-cats{grid-column:1/-1}}
/* skala warna dan deret angkanya selalu sama lebar supaya angka tepat di bawah warnanya */
.lg-g .legscale,.lg-g .legnum{width:100%;max-width:280px}
@media (max-width:900px){.dok{left:12px;bottom:auto;top:112px}.lg-isi{max-height:40vh}}
.garis-waktu.on{display:flex}
.garis-waktu .skala{display:flex;height:8px;border-radius:4px;overflow:hidden;width:110px;flex:none}
@media (max-width:900px){.garis-waktu{width:100%;min-width:0}.garis-waktu > .lbl{display:none}}
.panel{position:absolute;z-index:5;top:12px;left:12px;bottom:12px;width:440px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.panel > *{pointer-events:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;text-align:center}
.kpi .lbl{display:block;background:var(--brand);color:#fff;padding:4px 6px;font-size:9.5px}
:root[data-theme="dark"] .kpi .lbl{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi .lbl{color:oklch(18% .035 256)}}
.kpi b{display:block;font-family:var(--display);font-size:22px;font-weight:800;padding:6px 4px 0;font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--ink2);font-size:11px;padding:0 6px 7px}
.list{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.list .top{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow)}
.crumb button:hover{border-color:var(--brand2)}
.crumb button[data-n]:last-child,.crumb button[data-n]:has(+ .cr-rinci){background:var(--brand);border-color:var(--brand);color:#fff}
.pw-buka #tip{opacity:0!important;visibility:hidden}
.pw-pop{z-index:65}
.pw-pop .maplibregl-popup-content{padding:0;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px oklch(25% .05 256 / .22)}
.pw-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(180deg,var(--surface),color-mix(in oklch, var(--surface) 40%, var(--card)));border-bottom:1px solid var(--line);font-family:var(--display);font-size:13.5px}
.pw-h .lambang{width:20px;height:24px}
.pw-a{display:flex;justify-content:center;gap:6px;padding:9px 10px}
.pw-h{justify-content:center}
.pw-a button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 12px var(--font);cursor:pointer;white-space:nowrap}
.pw-a button svg{width:14px;height:14px}
.pw-a button:hover{border-color:var(--brand2)}
.pw-a button.gelap{background:linear-gradient(135deg,oklch(32% .09 256),oklch(22% .07 256));color:#fff;border:0}
.crumb .cr-rinci{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,oklch(32% .09 256),oklch(22% .07 256));border:0;color:#fff}
.crumb .cr-rinci svg{width:14px;height:14px}
:root[data-theme="dark"] .crumb button:last-child{color:oklch(18% .035 256)}
.cari{position:relative}
.cari input{width:100%;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 34px;font-size:13px}
.cari svg{position:absolute;left:12px;top:10px;color:var(--ink2)}
.hasil{position:absolute;left:0;right:0;top:40px;z-index:10;max-height:280px;overflow:auto;padding:4px}
.hasil button{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
.hasil button b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-hd{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:12px;font-weight:800;color:var(--ink)}
.hs-hd svg{position:static;transform:none;width:13px;height:13px;color:var(--ink2);flex:none}
.hs-hd:not(:first-child){border-top:1px solid var(--line);margin-top:4px}
.hs-in{min-width:0;display:flex;align-items:center}.hs-in i{line-height:16px;font-style:normal;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%}
.hs-lv{line-height:16px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in oklch, var(--brand2) 12%, transparent);color:var(--brand2);justify-self:end}
.hs-provinsi{background:var(--surface);color:var(--ink)}
.hs-kompleks{background:color-mix(in oklch, #c9503a 14%, transparent);color:#c9503a}
.hasil button:hover,.hasil button:focus{background:var(--surface)}
/* laci kompleks: disembunyikan sementara atas permintaan pemilik (13 Okt 2026); DOM tetap ada karena lapisan5.js menempel sesudahnya */
#laci details[data-j="Respons terdekat"],#laci details[data-j="Tindakan yang disarankan"],#laci .l5-akses{display:none}
.hasil small{color:var(--ink2)}
.rows{overflow-y:auto;flex:1;padding:4px 6px 8px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer}
.tb{display:grid;grid-template-columns:20px minmax(0,2.6fr) minmax(50px,.8fr) minmax(44px,.7fr) minmax(76px,1.1fr);gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:0;cursor:pointer;font-size:12.5px;line-height:1.25;border-bottom:1px solid var(--line)}
.tb:hover{background:var(--surface)}
.kd{display:inline-flex;align-items:center;flex:none;height:18px;padding:0 6px;border-radius:6px;background:var(--surface);color:var(--brand2);border:1px solid var(--line);font:700 10.5px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tb .kom{display:flex;align-items:center;gap:8px;min-width:0}
.tb .kom>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kgp,.kgk{border-bottom:1px solid var(--line)}
.kgp>summary,.kgk>summary{display:grid;align-items:center;gap:6px;list-style:none;cursor:pointer;padding:7px 8px;font-size:12px;font-weight:800}
.kgp>summary>span,.kgk>summary>span{text-align:center;min-width:0}
.kgp>summary .kg-nm,.kgk>summary .kg-nm{display:flex;align-items:center;gap:6px;text-align:left;min-width:0}
.kg-nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kg-nm .pill{height:17px;padding:0 6px;font-size:10px;flex:none}
.kgp>summary .pill,.kgk>summary .pill{height:18px;padding:0 7px;font-size:10px}
.kgp>summary::-webkit-details-marker,.kgk>summary::-webkit-details-marker{display:none}
.kgp>summary::before,.kgk>summary::before{content:"▸";flex:none;width:10px;color:var(--ink2);transition:transform .15s}
.kgp[open]>summary::before,.kgk[open]>summary::before{transform:rotate(90deg)}
.kgp>summary .lambang{width:20px;height:24px;filter:none}
.kgk{border-bottom:0;border-top:1px solid var(--line)}
.kgk>summary .kg-nm{padding-left:12px}
.kgk>summary{font-weight:700;font-size:12px;padding:6px 8px}
.kgk .tb:last-child{border-bottom:0}
.kgp summary .jml{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:600;font-size:11px;color:var(--ink2);white-space:nowrap}
.kgp summary .jml .pill{height:18px;padding:0 7px;font-size:10px}
.tb.kepala{position:sticky;top:0;z-index:3;background:oklch(25.5% .075 256);cursor:default;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:7px 8px;border-radius:8px 8px 0 0;border-bottom:0;box-shadow:0 -6px 0 var(--card)}
.tb.kepala:hover{background:oklch(25.5% .075 256)}
.tb.kepala span[data-s]{cursor:pointer;user-select:none}
.tb.kepala span[data-s]:hover{color:oklch(85% .08 70)}
.tb.kepala span.urut{color:oklch(85% .08 70)}
.tb.kepala span.urut::after{content:" ▾"}
.tb.kepala span.urut[data-arah="1"]::after{content:" ▴"}
.tb > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb > span:last-child{overflow:visible}
.tb > span{text-align:center!important;justify-self:center}
.tb > span:nth-child(2){text-align:left!important;justify-self:stretch}
.tb .kom{display:flex;align-items:center;gap:6px;min-width:0}
.tb .rk{justify-self:end!important;text-align:right!important}
.tb .pill{justify-self:center}
.tb .n{text-align:right;font-variant-numeric:tabular-nums}

      <span class="rk">${n + 1}</span><span class="kom"><span class="kd">${p.id}</span><span>${esc(p.kec)}${p.teramati ? "" : ' <span style="color:var(--ink2)">· tak teramati</span>'}</span></span>
      <span class="n">${fmt(p.px24)}</span><span class="n">${p.hari}</span><span style="text-align:right"><span class="pill l${p.level}">${LV[p.level]}</span></span></button>`;
  const kelompok = (xs, k) => { const m = new Map(); for (const f of xs) { const v = f.properties[k] || "–"; if (!m.has(v)) m.set(v, []); m.get(v).push(f); } return m; };

  const provs = urut(kelompok(kl, "prov"));
  const html = provs.map(([pv, xs]) => { const kabs = urut(kelompok(xs, "kab"));
    return `<details class="kgp"${provs.length === 1 ? " open" : ""}><summary style="grid-template-columns:${KOL}"><span class="kg-nm">${lambang(pv)}<b>${esc(namaProv(pv))}</b><span class="pill nt">${fmt(xs.length)}</span></span>${ringkas(xs)}</summary>`
      + kabs.map(([kb, ys]) => `<details class="kgk"${kabs.length === 1 ? " open" : ""}><summary style="grid-template-columns:${KOL}"><span class="kg-nm"><b>${esc(kb)}</b><span class="pill nt">${fmt(ys.length)}</span></span>${ringkas(ys)}</summary><div class="kgi">${ys.map((f, n) => baris(f.properties, n)).join("")}</div></details>`).join("")

    + (html || `<div class="kosong">Tidak ada kompleks aktif di wilayah ini.</div>`);
  terapkanUrut();

   titik_live.js menggeser kolom jam saat S.titik berganti. */
function muatTitik(jam = typeof S.rentang === "number" ? S.rentang : 48) {
  if (S.titikPenuh || jam <= (S.jamTitik || 0)) return muatTitik._p || Promise.resolve();
  const penuh = jam > 72;
  if (muatTitik._p && muatTitik._jam >= jam) return muatTitik._p;
  muatTitik._jam = jam;
  return muatTitik._p = muatJSON(penuh ? "data/hotspot.json" : "data/hotspot72.json").then(hs => {
    if (S.titikPenuh || (hs.jam_maks || 168) <= S.jamTitik) return;
    S.titik = hs.baris; S.wilKunci = hs.wilayah.map(k => { const p = k.split("|"); return [p[0], p[0] + "|" + p[1], k]; });
    S.titikPenuh = !hs.jam_maks; S.jamTitik = hs.jam_maks || 168;
    hitung(); peta?.getSource("titik")?.setData(Peta.geoTitik()); Peta.aturWilayah(false); Kini.segarkan?.();
  }).catch(e => { muatTitik._p = null; muatTitik._jam = 0; console.warn("titik", e); });
}

  const d = a - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) { let x, v; do { x = normal(); v = 1 + c * x; } while (v <= 0); v = v * v * v; const u = Math.random();

  d: null, prov: "62", tahun: "harapan", pEN: .12, mpa: .3, sekat: 500, karbon: "tengah", n: 2000,
  bobot: {bersih: 50, ispa: 20, bukti: 30},
  par(k, mode, acak) {

}

/* data-tip teks bebas → kepala + baris rapi: "label: nilai" jadi dua kolom, baris yang diawali angka jadi angka besar */
function rapikanTip(h) {
  if (h.includes("<div")) return h;
  const m = h.match(/^<b>(.*?)<\/b>(.*?)(?:<br>|$)([\s\S]*)$/); if (!m) return h;
  const sub = m[2].replace(/^\s*·\s*/, "").trim(), baris = m[3].split(/<br>/).map(x => x.trim()).filter(Boolean);

  const n1 = baris.length === 1 && baris[0].match(/^([\d.,]+(?:\s?(?:rb|jt))?\s+titik)(?:\s+panas)?$/);
  if (n1) return `<div class="tp2-h tp2-1 tp2-only"><b>${m[1]}</b><span class="tp2-pil">${n1[1]}</span></div>`;
  /* satu pasangan "label: nilai" saja: nilai jadi angka besar, label di bawahnya */
  const k1 = baris.length === 1 && baris[0].match(/^([^:<]{1,40}):\s*(.+)$/);
  const subH = sub ? (/el ni[ñn]o/i.test(sub) ? `<span class="tp2-en">${sub}</span>` : `<small>${sub}</small>`) : "";
  if (k1) return `<div class="tp2-h tp2-hr"><b>${m[1]}</b>${subH}</div><div class="tp2-n tp2-c"><b>${k1[2]}</b><span>${k1[1]}</span></div>`;
  if (!baris.length) return `<div class="tp2-h tp2-hr tp2-only"><b>${m[1]}</b>${subH}</div>`;
  let o = `<div class="tp2-h"><b>${m[1]}</b>${subH}</div>`, kv = "";
  baris.forEach((b, i) => { const k = b.match(/^([^:<]{1,40}):\s*(.+)$/), n = b.match(/^([\d.,−+-]+(?:\s?(?:rb|jt|%|×))?)\s+(.+)$/);
    if (k) kv += `<span>${k[1]}</span><b${/^\s*▲/.test(k[2]) ? ' class="naik"' : /^\s*▼/.test(k[2]) ? ' class="turun"' : ""}>${k[2]}</b>`;
    else { if (kv) { o += `<div class="tp2-kv">${kv}</div>`; kv = ""; }
      o += n && i === 0 ? `<div class="tp2-n"><b>${n[1]}</b><span>${n[2]}</span></div>` : `<div class="tp2-t">${b}</div>`; } });
  if (kv) o += `<div class="tp2-kv">${kv}</div>`;
  return o;

/* pertimbangan tren di kartu provinsi: tahun ini vs riwayat s.d. bulan yang sama, dan sisa musim menurut pola bulanan */
/* ubin laci provinsi: ikon dalam lingkaran lembut, satu angka besar, label abu kecil (gaya pop-up situasi, 15 Okt 2026) */
const PV_IK = {api: '<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-8.5z"/>',
  prio: '<path d="M12 3 4.5 6v6c0 4.5 3.2 8 7.5 9 4.3-1 7.5-4.5 7.5-9V6z"/><path d="M12 8v4.5M12 16h.01"/>',
  daun: '<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/>',
  luas: '<path d="M4 7l5-3 6 3 5-3v13l-5 3-6-3-5 3z"/><path d="M9 4v13M15 7v13"/>',
  mata: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
  kota: '<path d="M4 20V9l5-3v14M9 20V4l7 3v13M16 20v-8l4 2v6M3 20h18"/>',
  naik: '<path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/>', urut: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>',
  kal: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>', jam: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'};
const pvUbin = (v, l, w = "#1d4e89", ket = "", ik = "") => `<div class="pv-u" style="--w:${w}">${ik ? `<i class="pv-i"><svg viewBox="0 0 24 24">${PV_IK[ik]}</svg></i>` : ""}<b>${String(v).replace(/^([\d.,]+)( ?)(rb|jt|km|%|×)$/, (_, n, sp, u) => `${n}<small>${sp}${u}</small>`)}</b><span>${l}</span>${ket ? `<em>${ket}</em>` : ""}</div>`;
function trenKartu(k) {
  const D = S.sejarah; if (!D || !D.prov[k]) return "";
  const P = D.prov[k], th = D.tahun, ini = th[th.length - 1], lalu = th.slice(0, -1), bln = new Date().getMonth();
  const sd = t => (P[t] || []).slice(0, bln + 1).reduce((a, b) => a + b, 0), iniSd = sd(ini), rataSd = lalu.reduce((a, t) => a + sd(t), 0) / lalu.length;
  const iklim = BULAN.map((_, m) => lalu.reduce((a, t) => a + ((P[t] || [])[m] || 0), 0) / lalu.length), tahunan = iklim.reduce((a, b) => a + b, 0) || 1;
  const sisa = iklim.slice(bln + 1).reduce((a, b) => a + b, 0) / tahunan, rank = [...th].map(sd).sort((a, b) => b - a).indexOf(iniSd) + 1;
  const akhir = (() => { for (let m = 11; m > bln; m--) if (iklim[m] / tahunan >= .05) return BULAN[m]; return null; })();
  const r = rataSd ? iniSd / rataSd : 0, mirip = lalu.map(t => [t, Math.abs(sd(t) - iniSd)]).sort((a, b) => a[1] - b[1])[0][0];
  const warna = r >= 2 ? "var(--bad)" : r >= 1.2 ? "var(--warn)" : "var(--ok)";
  /* empat kotak angka bergaya ubin panel (pemilik, 14 Okt 2026) */
  const u = pvUbin;
  return `<div class="pv-us">
    ${u(r ? r.toFixed(1).replace(".", ",") + "×" : "–", `${ini} s.d. ${BULAN[bln]} vs rata-rata`, r >= 2 ? "#c9503a" : r >= 1.2 ? "#e58a45" : "#2b8c86", r >= 2 ? "jauh di atas normal" : r >= 1.2 ? "di atas normal" : "sekitar normal", "naik")}
    ${u(rank + "<small style='font-size:13px;opacity:.6'> / " + th.length + "</small>", "peringkat periode sama", "#5f6fb0", "", "urut")}
    ${u(mirip, "tahun paling mirip", "#1d4e89", "", "kal")}
    ${u(Math.round(sisa * 100) + "%", "sisa beban musim", "#8a6a3f", akhir ? "s.d. " + akhir : "", "jam")}</div>
    <p style="font-size:11.5px;color:var(--ink2);margin:0 0 8px">${r >= 2 ? `Tahun ini jauh di atas normal, mirip ${mirip}. ` : r >= 1.2 ? "Tahun ini di atas normal. " : "Tahun ini di bawah atau sekitar normal. "}${sisa >= .1 ? `Biasanya ${Math.round(sisa * 100)}% titik tahunan masih muncul setelah ${BULAN[bln]}. Posko dan regu jangan ditarik dulu.` : "Musim biasanya hampir selesai. Fokus ke pemantauan bara gambut dan pemulihan."}</p>`;
}

/* beban tiap Daops: kompleks siaga + prioritas yang paling dekat ke Daops itu (dalam 150 km) */
function bebanDaops() {
  if (!S.daops.length) return "";
  const b = new Map(S.daops.map(d => [d.kode, {d, s: 0, p: 0}])); let jauh = 0;
  for (const f of S.kluster.features) { const p = f.properties; if (p.level < 2) continue;
    const d = daopsDekat(p.lat, p.lon, 1)[0]; if (d.jarak > 150) { jauh++; continue; } const x = b.get(d.kode); p.level === 3 ? x.p++ : x.s++; }
  const r = [...b.values()].sort((a, c) => (c.p * 3 + c.s) / (c.d.regu || 1) - (a.p * 3 + a.s) / (a.d.regu || 1));
  return `<div class="head" style="margin-top:26px"><div><h2>Beban regu Manggala Agni</h2><p>Daops dengan rasio tinggi perlu tambahan regu dari tempat lain.</p></div></div>
    <div class="tw"><table><thead><tr><th>Daops</th><th>Provinsi</th><th class="n">Regu</th><th class="n">Prioritas</th><th class="n">Siaga</th><th class="n">Kompleks per regu</th></tr></thead><tbody>
    ${r.map(({d, s, p}) => `<tr><td>${esc(d.nama)}</td><td>${esc(namaProv(d.prov))}</td><td class="n num">${d.regu ?? "–"}</td><td class="n num">${fmt(p)}</td><td class="n num">${fmt(s)}</td><td class="n num"><b>${fmt(Math.round((p + s) / (d.regu || 1) * 10) / 10)}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="2">Total ${fmt(S.daops.length)} Daops</td><td class="n num">${fmt(S.daops.reduce((a, d) => a + (d.regu || 0), 0))}</td><td class="n num">${fmt(r.reduce((a, x) => a + x.p, 0))}</td><td class="n num">${fmt(r.reduce((a, x) => a + x.s, 0))}</td><td></td></tr></tfoot></table></div>
    <p style="font-size:12px;color:var(--ink2)">Sumber: SiPongi. Sebagian lokasi markas perkiraan.</p>`;
}

  B.push({ik: "awan", j: "Bahaya cuaca: Fire Weather Index (FWI)", sub: "Seberapa mudah api menyala dan menjalar, dari cuaca saja",
    singkat: `FWI (Fire Weather Index, indeks cuaca kebakaran) menilai seberapa mudah api menyala dan menjalar hanya dari cuaca: panas, kering, berangin, dan berapa lama tidak hujan. Angka ini tidak melihat apakah ada api; ia menilai bahayanya bila api muncul. Tiap hari angkanya meneruskan angka kemarin, jadi makin lama tidak hujan, makin tinggi. Sistemnya dari Kanada dan juga dipakai BMKG (SPARTAN).`,

    contoh: () => {

        ["in", "Angka kemarin yang diteruskan", `FFMC ${mtA(k.ffmc)} · DMC ${mtA(k.dmc)} · DC ${mtA(k.dc)}`, ""],
        mtCek(x.hujan <= .5, "Tidak ada hujan yang membasahi?", `hujan baru dihitung bila lebih dari 0,5 mm (serasah), 1,5 mm (humus), 2,8 mm (lapisan dalam). Hari ini ${mtA(x.hujan)} mm`, "kering", "ada pembasahan"),

        ["", "DC: kekeringan lapisan dalam / gambut", `${mtA(k.dc)} kemarin + ${mtA(naikC)} hari ini; di atas 350 gambut cukup kering untuk asap pekat. ${brk(x.dc)}`, mtA(C)],
        ["", "ISI: laju menjalar awal", `dari FFMC ${mtA(F)} dan angin ${mtA(x.ws)} km/jam; angin naik 14 km/jam kira-kira menggandakan ISI. ${brk(x.isi)}`, mtA(I)],

        ["hasil", "Bahaya cuaca di sel ini", "", FWI_KELAS[kl][0]]]);

    teknis: `${h("Tujuan")}<p>Menilai seberapa mudah api menyala dan menjalar dari cuaca, dengan sistem FWI Kanada (Van Wagner 1987), kerangka yang dipakai SPARTAN BMKG.</p>
    ${h("Data masukan")}${ul([

    ${h("Rantai perhitungan (fwi.py)")}
    ${rumus(`FFMC  kadar air serasah halus (F0 = kemarin; T suhu, H RH, W angin, r hujan)
  mo = 147,2·(101 − F0)/(59,5 + F0)
  bila r > 0,5:  rf = r − 0,5
     mo += 42,5·rf·e^(−100/(251 − mo))·(1 − e^(−6,93/rf))   [+ 0,0015·(mo − 150)²·√rf bila mo > 150];  mo ≤ 250
  Ed = 0,942·H^0,679 + 11·e^((H − 100)/10) + 0,18·(21,1 − T)·(1 − e^(−0,115·H))

                                m  = Ew − (Ew − mo)·10^(−k1·0,581·e^(0,0365·T))
                 selain itu m = mo
  FFMC = 59,5·(250 − m)/(147,2 + m), dibatasi 0–101

DMC   humus dangkal (P0 = kemarin, Le = 9,0)
  T = max(T, −1,1);  K = 1,894·(T + 1,1)·(100 − H)·Le·10^−4
  bila r > 1,5:  re = 0,92·r − 1,27;  Mo = 20 + 280/e^(0,023·P0)
     b = 100/(0,5 + 0,3·P0) bila P0 ≤ 33;  14 − 1,3·ln P0 bila P0 ≤ 65;  6,2·ln P0 − 17,2 selain itu
     Mr = Mo + 1000·re/(48,77 + b·re);  P0 = 43,43·(5,6348 − ln(Mr − 20))
  DMC = max(P0, 0) + K

DC    kekeringan lapisan dalam / gambut (D0 = kemarin, Lf = 1,39)
  T = max(T, −2,8);  V = max((0,36·(T + 2,8) + Lf)/2, 0)
  bila r > 2,8:  rd = 0,83·r − 1,27;  Qo = 800·e^(−D0/400);  D0 = max(D0 − 400·ln(1 + 3,937·rd/Qo), 0)
  DC = D0 + V

ISI   laju penjalaran awal
  m = 147,2·(101 − FFMC)/(59,5 + FFMC)
  ISI = 0,208·f(W)·f(F),  f(W) = e^(0,05039·W),  f(F) = 91,9·e^(−0,1386·m)·(1 + m^5,31/4,93·10^7)
        (di kode ditulis langsung 19,115·e^(−0,1386·m)·..., karena 0,208 × 91,9 = 19,115)

BUI   bahan bakar tersedia
  bila DMC ≤ 0,4·DC:  BUI = 0,8·DMC·DC/(DMC + 0,4·DC)
  selain itu:         BUI = DMC − (1 − 0,8·DC/(DMC + 0,4·DC))·(0,92 + (0,0114·DMC)^1,7);  BUI ≥ 0

FWI
  f(D) = 0,626·BUI^0,809 + 2 bila BUI ≤ 80;  1000/(25 + 108,64·e^(−0,023·BUI)) selain itu
  B = 0,1·ISI·f(D);   FWI = B bila B ≤ 1,  e^(2,72·(0,434·ln B)^0,647) bila B > 1`)}

  if (!h.startsWith("k/") && !S.jalur?.length) { setTimeout(() => !S.jalur?.length && petaIndonesia(false), 600); }

    h.addEventListener("pointermove", gerak); h.addEventListener("pointerup", lepas); });
