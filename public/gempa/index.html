<main>
  <section class="page on" id="p-peta" aria-label="Peta pemantauan">
    <div id="peta"></div>
    <div class="muat" id="muat"><div><div class="spin"></div>Memuat gempa seluruh Indonesia…</div></div>
    <div class="pita" id="pita" role="status" hidden></div>
    <div class="panel" id="panel">
      <nav class="crumb" id="crumb" aria-label="Tingkat wilayah"></nav>
      <div class="card list">
        <button class="handle" id="handle" aria-label="Perbesar atau perkecil panel"></button>
        <div class="top">
          <div class="cari">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="cari" type="search" placeholder="Cari provinsi atau lokasi gempa" autocomplete="off" aria-label="Cari wilayah">
            <div class="hasil card" id="hasil" hidden></div>
          </div>
        </div>
        <div class="rows" id="rows" role="list"></div>
      </div>
    </div>
    <div class="tools" id="tools">
      <div class="card garis-waktu on" id="garisWaktu" aria-label="Jendela waktu gempa"><span class="lbl" style="white-space:nowrap">Gempa terdeteksi</span><div class="seg penuh" role="group" aria-label="Jendela waktu" id="rentang"></div></div>
      <button class="iconbtn" id="lapisBtn" style="background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:grid" aria-label="Overlay peta" title="Lapisan peta">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <div class="box lapis" id="lapis">
        <div class="lapis-hd"><span>Overlay</span><button type="button" id="lapisLipat" aria-label="Tutup semua grup" title="Tutup semua grup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 5-5 5 5M7 18l5-5 5 5"/></svg></button></div>
        <details open><summary>Gempa</summary>
          <label><input type="checkbox" data-l="wilayah" checked> Warna wilayah</label>
          <label><input type="checkbox" data-l="gempa" checked> Gempa terkini</label>
          <label><input type="checkbox" data-l="riwayat"> Gempa besar sejak 1900 (M 5+)</label>
        </details>
        <details open><summary>Bahaya</summary>
          <label><input type="checkbox" data-l="kekerapan"> Kekerapan gempa (grid)</label>
          <label><input type="checkbox" data-l="bahaya"> Indeks bahaya gempa (InaRISK)</label>
          <label><input type="checkbox" data-l="lempeng" checked> Batas lempeng</label>
          <label><input type="checkbox" data-l="sesar"> Sesar aktif</label>
        </details>
        <details open><summary>Peta dasar</summary>
          <label><input type="checkbox" data-l="satelit" checked> Citra satelit</label>
        </details>
      </div>
    </div>
    <aside class="card laci" id="laci" aria-label="Rincian gempa"></aside>
    <div class="dok" id="dok">
      <div class="box" id="legenda"></div>
    </div>
  </section>

  <section class="page scroll" id="p-insight" aria-label="Insight gempa" hidden><div class="wrap" id="insight"></div></section>
  <section class="page scroll" id="p-tren" aria-label="Tren gempa" hidden><div class="wrap" id="tren"></div></section>
  <section class="page scroll" id="p-berita" aria-label="Berita gempa" hidden><div class="wrap" id="berita"></div></section>
  <section class="page scroll" id="p-dampak" aria-label="Dampak gempa" hidden><div class="wrap" id="dampak"></div></section>
  <section class="page" id="p-sim" aria-label="Simulasi gempa dan tsunami" hidden><div id="sim"></div></section>
  <section class="page scroll" id="p-metode" aria-label="Metode" hidden><div class="wrap" id="metode"></div></section>
  <section class="page scroll" id="p-foto" aria-label="Foto warga" hidden><div id="foto"></div></section>
  <section class="page" id="p-tentang" aria-label="Tentang Pantau Bencana"><iframe id="tentangBingkai" title="Tentang Pantau Bencana" style="width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .5s cubic-bezier(.16,1,.3,1)" onload="this.style.opacity=1" loading="lazy"></iframe></section>
