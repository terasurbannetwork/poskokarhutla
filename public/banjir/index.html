<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banjir, Longsor & Rob Indonesia</title>
<meta name="description" content="Prakiraan banjir dan longsor per kecamatan: hujan, debit sungai, indeks bahaya, dan riwayat kejadian untuk 38 provinsi Indonesia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
:root{
  --paper:oklch(97.6% .006 255); --card:oklch(100% 0 0); --surface:oklch(95.5% .012 255);
  --ink:oklch(25.5% .075 256); --ink2:oklch(50% .045 258); --line:oklch(90% .015 255);
  --brand:oklch(25.5% .075 256); --brand2:oklch(42% .11 255); --accent:oklch(68% .09 252);
  --ok:oklch(62% .16 150); --warn:oklch(76% .16 75); --bad:oklch(57% .21 27); --info:oklch(66% .13 235);
  --f0:oklch(72% .15 150); --f1:oklch(86% .16 98); --f2:oklch(73% .17 58); --f3:oklch(57% .21 27);
  --shadow:0 2px 14px oklch(25% .07 256 / .08); --shadow-lg:0 8px 28px oklch(25% .07 256 / .16);
  --r:16px; --r-sm:10px; --top:58px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Plus Jakarta Sans",var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:oklch(18% .035 256); --card:oklch(22.5% .045 256); --surface:oklch(26% .05 256);
  --ink:oklch(94% .012 255); --ink2:oklch(76% .035 255); --line:oklch(33% .05 256);
  --brand:oklch(64% .12 252); --brand2:oklch(70% .11 250); --accent:oklch(72% .1 252);
  --shadow:0 2px 14px oklch(0% 0 0 / .35); --shadow-lg:0 8px 28px oklch(0% 0 0 / .5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:oklch(18% .035 256); --card:oklch(22.5% .045 256); --surface:oklch(26% .05 256);
  --ink:oklch(94% .012 255); --ink2:oklch(76% .035 255); --line:oklch(33% .05 256);
  --brand:oklch(64% .12 252); --brand2:oklch(70% .11 250); --accent:oklch(72% .1 252);
  --shadow:0 2px 14px oklch(0% 0 0 / .35); --shadow-lg:0 8px 28px oklch(0% 0 0 / .5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.018em;margin:0}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
header.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:30;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(135deg,oklch(42% .11 255),oklch(25.5% .075 256));color:#fff}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.mark svg{flex:none}
.mark b{font-family:var(--display);font-weight:800;font-size:15.5px;white-space:nowrap}
.mark small{display:block;font-size:11px;opacity:.75;white-space:nowrap}
nav.tabs{display:flex;gap:2px;margin:0 auto;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto;mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
.stat,.mark{flex:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;color:#fff;opacity:.78;padding:8px 13px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{opacity:1;background:oklch(100% 0 0 / .08)}
nav.tabs button[aria-current="page"]{opacity:1;background:oklch(100% 0 0 / .16)}
.stat{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.stat .jam{font-family:var(--display);font-weight:700;font-size:14px}
.iconbtn{border:0;background:oklch(100% 0 0 / .12);color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:oklch(100% 0 0 / .22)}
@media (max-width:900px){.stat .upd,.mark small{display:none}}
@media (max-width:1500px){.mark small,.stat .upd{display:none}}
@media (max-width:1100px){.mark > div{display:none}}
@media (max-width:640px){header.top{gap:6px;padding:0 8px}.stat .jam{display:none}nav.tabs{margin:0;flex:1}nav.tabs button{padding:8px 10px;font-size:13px}}

/* ---------- pages ---------- */
main{position:fixed;inset:var(--top) 0 0 0}
.page{position:absolute;inset:0;display:none}
.page.on{display:block}
.scroll{overflow-y:auto;padding:22px 18px 60px}
.wrap{max-width:1240px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media (min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.head>*{min-width:0;max-width:100%}
.head p{margin:4px 0 0;color:var(--ink2);max-width:70ch}

/* ---------- map page ---------- */
#peta,#simPeta{position:absolute;inset:0}
canvas.angin{position:absolute;inset:0;pointer-events:none;z-index:1;display:none}
.garis-waktu{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:18px;width:min(620px,calc(100% - 820px));min-width:340px;padding:8px 10px;display:none;align-items:center;gap:10px}
.garis-waktu.on{display:flex}
.garis-waktu .skala{display:flex;height:8px;border-radius:4px;overflow:hidden;width:110px;flex:none}
@media (max-width:900px){.garis-waktu{bottom:auto;top:112px;width:calc(100% - 24px);min-width:0}.garis-waktu > .lbl,.garis-waktu .skala{display:none}}
.panel{position:absolute;z-index:5;top:12px;left:12px;bottom:12px;width:400px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.panel > *{pointer-events:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;text-align:center}
.kpi .lbl{display:block;background:var(--brand);color:#fff;padding:4px 6px;font-size:9.5px}
:root[data-theme="dark"] .kpi .lbl{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi .lbl{color:oklch(18% .035 256)}}
.kpi b{display:block;font-family:var(--display);font-size:22px;font-weight:800;padding:6px 4px 0;font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--ink2);font-size:11px;padding:0 6px 7px}
.list{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.list .top{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;margin-bottom:8px}
.crumb button{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--brand2);font-weight:600;cursor:pointer}
.crumb button:hover{background:var(--surface)}
.crumb span{color:var(--ink2)}
.cari{position:relative}
.cari input{width:100%;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 34px;font-size:13px}
.cari svg{position:absolute;left:12px;top:10px;color:var(--ink2)}
.hasil{position:absolute;left:0;right:0;top:40px;z-index:10;max-height:280px;overflow:auto;padding:4px}
.hasil button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.hasil button:hover,.hasil button:focus{background:var(--surface)}
.hasil small{color:var(--ink2)}
.rows{overflow-y:auto;flex:1;padding:4px 6px 8px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer}
.tb{display:grid;grid-template-columns:20px minmax(0,1fr) 56px 50px 70px;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;line-height:1.25;border-bottom:1px solid var(--line)}
.tb:hover{background:var(--surface)}
.tb.kepala{position:sticky;top:0;z-index:1;background:var(--card);cursor:default;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:6px 8px}
.tb > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .n{text-align:right;font-variant-numeric:tabular-nums}
.tb .rk{color:var(--ink2);font-size:11px;font-weight:700;text-align:right}
.tb .pill{height:19px;padding:0 7px;font-size:10.5px;justify-self:end}
.kartu{margin:-10px -12px;min-width:270px;overflow:hidden;border-radius:12px}
.kartu .kp{padding:8px 30px 8px 12px;color:#fff;display:flex;align-items:center;gap:10px}
.kartu .kp>div{min-width:0}
.lambang{flex:none;width:30px;height:36px;object-fit:contain;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .35))}
.dlg .dh .lambang{width:40px;height:48px}
.kartu .kp small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.8}
.kartu .kp b{display:block;font-family:var(--display);font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kartu .kg{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;padding:4px 12px 2px}
.kartu .kb{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.3;min-width:0}
.kartu .kb span{color:var(--ink2);white-space:nowrap}
.kartu .kb b{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kartu .kb.penuh{grid-column:1 / -1}
.kartu .kk{padding:6px 12px 10px;font-size:11px;color:var(--ink2);line-height:1.4}
.kartu .kk button{margin-top:6px;width:100%}
.maplibregl-popup-close-button{color:#fff;font-size:18px;right:4px;top:3px}
.row:hover{background:var(--surface)}
.row .rk{font-size:11px;color:var(--ink2);font-weight:700;text-align:right}
.row .nm{display:block;font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;color:var(--ink2);font-size:11px;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{height:4px;border-radius:4px;background:var(--surface);margin-top:5px;overflow:hidden}
.row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--f2),var(--f3));border-radius:4px}
.row .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.row .vl small{display:block;font-weight:500;color:var(--ink2);font-size:10.5px}
.prio{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.l0{background:oklch(62% .16 150 / .14);color:oklch(45% .13 150)}
.l1{background:oklch(66% .13 235 / .14);color:oklch(46% .12 240)}
.l2{background:oklch(76% .16 75 / .2);color:oklch(48% .12 65)}
.l3{background:oklch(57% .21 27 / .14);color:oklch(50% .2 27)}
:root[data-theme="dark"] .l0{color:oklch(80% .14 150)} :root[data-theme="dark"] .l1{color:oklch(80% .1 235)}
:root[data-theme="dark"] .l2{color:oklch(84% .13 75)} :root[data-theme="dark"] .l3{color:oklch(76% .15 27)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .l0{color:oklch(80% .14 150)}:root:not([data-theme="light"]) .l1{color:oklch(80% .1 235)}:root:not([data-theme="light"]) .l2{color:oklch(84% .13 75)}:root:not([data-theme="light"]) .l3{color:oklch(76% .15 27)}}

.tools{position:absolute;z-index:5;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;width:250px}
.seg{display:inline-flex;flex-shrink:0;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg.penuh{display:flex;width:100%}.seg.penuh button{flex:1;text-align:center}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:oklch(18% .035 256)}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;width:100%}
.lapis label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0 3px 4px;cursor:pointer}
.lapis details{border-top:1px solid var(--line);padding:4px 0}
.lapis summary{cursor:pointer;font-size:12px;font-weight:700;padding:3px 0;list-style:none;display:flex;justify-content:space-between}
.lapis summary::-webkit-details-marker{display:none}
.lapis summary::after{content:"▾";color:var(--ink2);transition:transform .15s}
.lapis details:not([open]) summary::after{transform:rotate(-90deg)}
.tools{max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:thin}
.tools #lapis{display:none}
.tools #lapis.buka{display:block}
#lapisBtn{align-self:flex-end}
#legenda summary{cursor:pointer;list-style:none}
.lapis input{accent-color:var(--brand2);width:15px;height:15px}
.leg{display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.leg .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.leg .dot{border-radius:50%}
.legscale{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:4px 0 2px}
.legscale i{flex:1}
.legnum{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2)}

.laci{position:absolute;z-index:8;top:12px;right:12px;bottom:12px;width:390px;display:none;flex-direction:column;overflow:hidden}
.laci.on{display:flex}
.laci .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.laci .hd h2{font-size:17px}
.laci .bd{overflow-y:auto;padding:14px 16px 18px}
.tutup{margin-left:auto;border:0;background:var(--surface);width:30px;height:30px;border-radius:8px;cursor:pointer;flex:none}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--surface);border-radius:10px;padding:8px 6px;text-align:center}
.kv b{display:block;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sop{border-left:3px solid var(--bad);padding:8px 12px;background:var(--surface);border-radius:0 10px 10px 0;margin:10px 0;font-size:13px}
.sop ul{margin:6px 0 0;padding-left:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:13.5px}
.btn.pri{background:linear-gradient(135deg,oklch(42% .11 255),oklch(25.5% .075 256));color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.muat{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:var(--paper);transition:opacity .3s}
.muat.hilang{opacity:0;pointer-events:none}
.muat div{text-align:center;color:var(--ink2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand2);margin:0 auto 10px;animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.handle{display:none}
.maplibregl-popup-content{background:var(--card);color:var(--ink);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px 12px;font:13px/1.45 var(--font)}
.maplibregl-popup-tip{border-top-color:var(--card)!important;border-bottom-color:var(--card)!important}
.maplibregl-ctrl-attrib{font-size:10px}

@media (max-width:900px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46%;gap:0;transition:height .25s}
  .panel.min{height:96px}
  .panel .kpis{display:none}
  .panel .list{border-radius:18px 18px 0 0}
  .handle{display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0;border:0;cursor:pointer}
  .tools{width:auto;right:8px;top:8px}
  .tools .box{display:none}
  .tools .box.buka{display:block;width:230px}
  .laci{inset:auto 0 0 0;width:auto;height:72%;border-radius:18px 18px 0 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- tables ---------- */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbar input{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 14px;min-width:220px}
.tbar .sp{flex:1}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;text-align:left;white-space:nowrap;border-bottom:2px solid var(--accent)}
:root[data-theme="dark"] thead th{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th{color:oklch(18% .035 256)}}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
thead th.n,td.n{text-align:right}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:oklch(50% .05 255 / .025)}
tbody tr:hover{background:oklch(42% .11 255 / .06)}
tfoot td{padding:9px 10px;background:var(--brand);color:#fff;font-weight:800}
:root[data-theme="dark"] tfoot td{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tfoot td{color:oklch(18% .035 256)}}
td a,td button.link{color:var(--brand2);font-weight:600;background:none;border:0;cursor:pointer;padding:0}
.rp{display:flex;justify-content:space-between;gap:10px;min-width:96px}.rp i{font-style:normal;color:var(--ink2)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.kosong{padding:28px;text-align:center;color:var(--ink2)}

/* ---------- sim ---------- */
.simpanel{position:absolute;z-index:5;top:12px;left:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;padding:16px}
.simpanel h2{font-size:17px}
.fld{max-width:100%;display:flex;flex-direction:column;gap:4px;margin:10px 0}
.fld select,.fld input[type=number]{max-width:100%;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.waktu{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:18px;width:min(620px,calc(100% - 24px));padding:12px 16px;display:flex;gap:12px;align-items:center}
.waktu input[type=range]{flex:1;accent-color:var(--bad)}
.waktu b{font-family:var(--display);min-width:64px;text-align:right}
@media (max-width:900px){.simpanel{top:auto;bottom:86px;left:8px;right:8px;width:auto;max-height:42%}}

/* ---------- bars / charts ---------- */
.hbar{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.hbar div{height:12px;border-radius:6px;background:var(--surface);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--f2),var(--f3))}
.chk{display:grid;grid-template-columns:1fr 88px 70px 64px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk input{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px;width:100%;text-align:right}
.fold{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;box-shadow:var(--shadow)}
.fold > button{all:unset;box-sizing:border-box;display:flex;width:100%;padding:12px 16px;cursor:pointer;font-weight:700;gap:10px;align-items:center}
.fold > button .chev{margin-left:auto;transition:transform .2s}
.fold > button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fold > div{padding:0 16px 12px}
.rumus{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface);border-radius:10px;padding:10px 12px;overflow:auto;white-space:pre}
.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;display:none}
.toast.on{display:block}
tr.klik{cursor:pointer}
tr.klik:hover td{background:var(--surface)}
dialog.dlg{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:0;width:min(780px,calc(100vw - 24px));max-height:calc(100dvh - 48px);box-shadow:var(--shadow-lg)}
dialog.dlg::backdrop{background:oklch(15% .03 256 / .55)}
.dlg .dh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg .dh h3{font-size:18px}
.dlg .dh p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.dlg .dh button{margin-left:auto;border:0;background:var(--surface);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none;font-size:18px;line-height:1}
.dlg .db{padding:14px 18px 18px;display:grid;gap:14px}
details.lipat{border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
details.lipat>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);background:var(--surface)}
details.lipat>summary::-webkit-details-marker{display:none}
details.lipat>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s}
details.lipat[open]>summary::after{transform:rotate(-135deg)}
details.lipat>summary span{text-transform:none;letter-spacing:0;font-weight:500}
details.lipat .isi{display:grid;gap:8px;padding:12px 14px 14px}
.laci details.lipat{box-shadow:none}
.laci .kv{margin:0}
table.tb2{width:100%;font-size:12.5px;border-collapse:collapse}
table.tb2 td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.tb2 td.n{text-align:right;padding-left:10px;font-weight:600}
table.tb2 tr:last-child td{border-bottom:0}
table.tb3{width:100%;font-size:12px;border-collapse:collapse}
table.tb3 th{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:left;padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.tb3 td{padding:6px 3px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb3 .n{text-align:right;white-space:nowrap}
table.tb3 td small{display:block;color:var(--ink2);font-size:11px}
table.tb3 tr:last-child td{border-bottom:0}
.dlg .kpi b{font-size:20px}
.fnd{margin:0;font-size:12px;color:var(--ink2)}
.dlg .dlist{display:grid;gap:4px}
.dlg .dlist button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.dlg .dlist button span:not(.pill){color:var(--ink2);margin-left:auto;font-size:11.5px}
.dlg .dlist button:hover{border-color:var(--brand2)}
.dlg table.skor{width:100%;font-size:12.5px;border-collapse:collapse}
.dlg table.skor td{padding:5px 6px;border-bottom:1px solid var(--line)}
.dlg table.skor td:first-child{font-weight:700;white-space:nowrap}
@media (max-width:700px){.dlg .db .grid.g4{grid-template-columns:1fr 1fr}}
.dlg .baris{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.dlg .baris i{display:block;height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.dlg .baris i b{display:block;height:100%;background:linear-gradient(90deg,#e58a45,#c9503a)}
.kal{display:grid;grid-template-columns:150px repeat(36,minmax(14px,1fr)) 160px;min-width:900px;font-size:12px}
.kal>div{padding:0;height:26px;display:flex;align-items:center}
.kal .bl{grid-column:span 3;justify-content:center;font-size:10.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;height:22px}
.kal .nm{padding:0 10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.kal .nm[aria-current="true"]{color:var(--brand)}
.kal .c{margin:1px;border-radius:3px;height:24px}
.kal .c.kini{outline:2px solid var(--ink);outline-offset:-1px}
.kal .sg{padding:0 10px;color:var(--ink2);white-space:nowrap}
/* ---------- insight: exhibit bergaya konsultan ---------- */
.ins-hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:260px;display:flex;align-items:flex-end;margin-bottom:18px;background:var(--brand)}
.ins-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ins-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,oklch(15% .03 256 / .05) 30%,oklch(15% .03 256 / .85))}
.ins-hero div{position:relative;z-index:1;padding:22px 24px;color:#fff;max-width:900px}
.ins-hero h2{font-size:clamp(22px,3vw,32px);line-height:1.15}
.ins-hero p{margin:6px 0 0;opacity:.9;font-size:14px}
.ins-hero small{position:absolute;right:10px;top:8px;text-shadow:0 1px 2px rgb(0 0 0 / .6);z-index:1;color:#fff;opacity:.7;font-size:10.5px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px 16px;margin-bottom:18px}
.ex h3{font-size:clamp(17px,2vw,21px);line-height:1.3;max-width:62ch}
.ex .hl{color:var(--bad)}
.ex .sub{margin:8px 0 0;font-weight:700;font-size:13.5px}
.ex .unit{margin:2px 0 12px;color:var(--ink2);font-size:12.5px}
.ex .fn{margin:10px 0 0;color:var(--ink2);font-size:11.5px;border-top:1px solid var(--line);padding-top:8px}
.ex svg{display:block;width:100%;height:auto;overflow:visible}
.ex svg text{fill:currentColor}
.ex .ctl{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.ex .ctl select{height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:12.5px}
.ex2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:1000px){.ex2{grid-template-columns:1fr 1fr}.ex2 .ex{margin-bottom:0}}
.foto{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 18px}
.foto figure{margin:0;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.foto img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.foto figcaption{padding:8px 10px;font-size:12px;line-height:1.35}
.foto figcaption small{display:block;color:var(--ink2);font-size:10.5px;margin-top:2px}
#tip{position:fixed;z-index:60;pointer-events:none;background:oklch(18% .035 256);color:#fff;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;box-shadow:var(--shadow-lg);max-width:260px;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
.ex [data-tip]{cursor:pointer}
.ex [data-tip]:hover{opacity:.82}
.ex .hov{transition:fill .15s}
.ex g:hover>.hov{fill:var(--surface)}
.ex [data-set]{cursor:pointer}
@keyframes tumbuh{from{transform:scaleY(0)}}
@keyframes tumbuhX{from{transform:scaleX(0)}}
@keyframes muncul{from{opacity:0}}
.ex .gy{transform-box:fill-box;transform-origin:bottom;animation:tumbuh .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 18ms)}
.ex .gx{transform-box:fill-box;transform-origin:left;animation:tumbuhX .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
.ex .gf{animation:muncul .5s both;animation-delay:calc(var(--i,0) * 18ms + .2s)}
@media (prefers-reduced-motion:reduce){.ex .gy,.ex .gx,.ex .gf{animation:none}}
.sens{display:grid;grid-template-columns:220px 1fr 210px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
@media (max-width:700px){.sens{grid-template-columns:1fr;gap:3px;padding:6px 0}}
figure.banner{position:relative;margin:0 0 16px;border-radius:var(--r);overflow:hidden;height:150px;background:var(--surface)}
figure.banner img{width:100%;height:100%;object-fit:cover;display:block}
figure.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,oklch(15% .03 256 / .7),transparent 60%)}
figure.banner figcaption{position:absolute;left:16px;bottom:12px;right:16px;z-index:1;color:#fff;font-size:13px;font-weight:600;max-width:60ch}
figure.banner figcaption a{display:block;color:#fff;opacity:.75;font-size:10.5px;font-weight:400;margin-top:2px}
@media (max-width:700px){figure.banner{height:110px}}
.kv>*{min-width:0}
.ringkas{padding:10px 10px 4px}
.ringkas .kv{margin:6px 0 4px}
.garis-waktu{display:flex}
.bencana{position:relative}
.bencana summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:15.5px;white-space:nowrap;color:#fff}
.bencana summary::-webkit-details-marker{display:none}
.bencana summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.8}
.bencana .menu{position:absolute;top:calc(100% + 10px);left:0;z-index:50;min-width:250px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;display:grid;gap:2px}
.bencana .menu a{display:flex;flex-direction:column;padding:8px 10px;border-radius:10px;text-decoration:none;color:inherit;font-weight:700;font-size:13.5px}
.bencana .menu a small{font-weight:400;color:var(--ink2);font-size:11.5px}
.bencana .menu a:hover,.bencana .menu a[aria-current="page"]{background:var(--surface)}
.tarik{position:absolute;top:0;bottom:0;width:10px;cursor:col-resize;z-index:6;pointer-events:auto;touch-action:none}
.tarik::after{content:"";position:absolute;top:50%;left:3px;width:4px;height:44px;margin-top:-22px;border-radius:4px;background:var(--line);transition:background .15s}
.tarik:hover::after,.tarik.aktif::after{background:var(--brand2)}
.panel .tarik{right:-9px}
.tools .tarik{left:-9px}
@media (max-width:900px){.tarik{display:none}}
ol.rek{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:r}
ol.rek li{counter-increment:r;display:grid;grid-template-columns:22px 1fr;gap:2px 8px;font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:10px;background:var(--surface);border-left:3px solid var(--w)}
ol.rek li::before{content:counter(r);grid-row:span 2;width:20px;height:20px;border-radius:50%;background:var(--w);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
ol.rek li small{grid-column:2;color:var(--ink2);font-size:11px}
/* keputusan banjir: semua kelas lain (.card .kpi .tb3 .tb2 .hbar .sens .seg .fld .pill .rp) sudah ada di halaman */
#keputusan .tb3 td.n small{display:block;color:var(--ink2);font-size:10.5px;font-weight:500}
#keputusan td a{font-weight:600}
#keputusan .tb2 td:first-child,#keputusan .tb3 td:not(.n){white-space:normal}
/* simulasi skenario */
.sm-atur{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.sm-atur>*{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.sm-atur input[type=number]{height:32px;width:150px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.sm-atur .sm-cek{flex-direction:row;align-items:center;gap:6px;font-size:13px;height:32px}
.sm-atur .sm-cek input{accent-color:var(--brand2);width:16px;height:16px}
.sm-peta{overflow:hidden;display:flex;flex-direction:column}
#smPeta{height:420px;flex:none}
.sm-leg{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line)}
.sm-leg span{display:inline-flex;align-items:center;gap:5px}
.sm-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
#simulasi .tb3 td small{display:block}
@media (max-width:700px){#smPeta{height:300px}.sm-atur input[type=number]{width:100%}}
#simulasi .tb2 td:first-child,#simulasi .tb3 td:not(.n){white-space:normal}
/* tab Tren & popup analisa riwayat (banjir_tren.js) */
.dlg svg text,#tren svg text{fill:currentColor}
.dlg ul.aksi{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:12.5px}
.dlg ul.aksi li{display:flex;gap:8px;align-items:baseline}
.dlg ul.aksi .tg{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--surface);color:var(--ink2)}
#tren select.btn{max-width:100%}
.kal .nm{position:sticky;left:0;background:var(--card);z-index:1}
@media (max-width:600px){.kal{grid-template-columns:110px repeat(36,minmax(12px,1fr)) 150px;min-width:640px}}
@media (max-width:899px){.dlg .grid.g4,#tren .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dlg table.skor td:nth-child(2){white-space:normal}
.dlg .tb3 td:first-child{white-space:normal}
/* ---------- posko & sarana banjir (setara karhutla; .kartu, .rp, .chk, .fold sudah ada) ---------- */
.chk.srn{grid-template-columns:minmax(0,1fr) 92px 70px 104px 104px}
.chk.srn .n{text-align:right}
.chk.srn input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand2);vertical-align:middle}
.chk.srn small.m{display:none}
.fold > button .num{margin-left:auto;white-space:nowrap}
.fold > button .num + .chev{margin-left:8px}
#posko .tw td small,#posko .tw td b{font-variant-numeric:tabular-nums}
.cetak-judul{display:none}
.dlg .db>*{min-width:0}
@media (max-width:700px){

  .chk.srn>:first-child{grid-column:1 / -1}
  .chk.srn.lbl{display:none}
  .chk.srn .n,.chk.srn label{text-align:left!important}
  .chk.srn small.m{display:inline;color:var(--ink2);font-size:11px}

  #asumsiB .fld{flex:1 1 140px}
}
@media print{
  body.cetak-sarana header.top,body.cetak-sarana .toast,body.cetak-sarana #tip,body.cetak-sarana #basi,body.cetak-sarana .np,body.cetak-sarana .tarik{display:none!important}
  body.cetak-sarana main{position:static}
  body.cetak-sarana .page{display:none!important}
  body.cetak-sarana #p-sarana{display:block!important;position:static;overflow:visible;padding:0}
  body.cetak-sarana .fold{break-inside:avoid;box-shadow:none}
  body.cetak-sarana .fold > div{display:block!important}
  body.cetak-sarana .fold .chev{display:none}
  body.cetak-sarana .cetak-judul{display:block;font-weight:700;margin:0 0 10px}
  body.cetak-sarana .chk.srn{grid-template-columns:minmax(0,1fr) 92px 70px 104px 104px}
  body.cetak-sarana .chk.srn small.m{display:none}
}
/* metode versi awam */
#metode{--mt-merah:#c9503a;--mt-oranye:#e58a45;--mt-kuning:#e3b94e;--mt-hijau:#5a9e74;--mt-biru:#4f8fc4;--mt-nila:#5f6fb0}
.mt-ikon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mt-lbl{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}

/* gambaran besar */
.mt-peta{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.1fr) 28px minmax(0,1.2fr);gap:8px;margin:0 0 20px}
.mt-kol{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 8px;min-width:0}
.mt-kol h3{display:flex;align-items:center;gap:8px;font-size:14.5px;margin:0 0 4px}
.mt-kol h3 i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--card);font-size:12px;flex:none}
.mt-kol>p{margin:0 0 6px;font-size:12px;color:var(--ink2)}
.mt-li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.35;min-width:0}
.mt-li>span{min-width:0}
.mt-li b{display:block;font-size:13px}
.mt-li small{color:var(--ink2)}
.mt-li .mt-ikon{color:var(--mtc,var(--brand2));margin-top:1px}
button.mt-li{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 6px;margin:0 -6px;border-top:1px solid var(--line);border-radius:8px;font-size:12.5px;line-height:1.35;cursor:pointer;width:calc(100% + 12px)}
button.mt-li:hover{background:var(--surface)}
button.mt-li b{color:var(--brand2)}
.mt-panah{display:grid;place-items:center;color:var(--ink2)}
@media (max-width:900px){.mt-peta{grid-template-columns:minmax(0,1fr)}.mt-panah{height:22px}.mt-panah svg{transform:rotate(90deg)}}

/* kartu bagian */
details.mt-sek{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;min-width:0}
details.mt-sek>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
details.mt-sek>summary::-webkit-details-marker{display:none}
details.mt-sek>summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .2s}
details.mt-sek[open]>summary::after{transform:rotate(-135deg)}
details.mt-sek>summary:hover{background:var(--surface);border-radius:var(--r)}
.mt-nom{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:10px;background:color-mix(in oklab,var(--brand2) 14%,transparent);color:var(--brand2)}
.mt-nom .mt-ikon{width:19px;height:19px}
.mt-jd{min-width:0}
.mt-jd b{display:block;font-family:var(--display);font-size:15.5px;letter-spacing:-.01em}
.mt-jd small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.35;margin-top:1px}
.mt-isi{padding:2px 18px 18px;display:grid;gap:16px;min-width:0}
.mt-isi>*{min-width:0}
@media (max-width:640px){.mt-isi{padding:2px 12px 14px}details.mt-sek>summary{padding:12px}}

/* singkatnya */
.mt-singkat{background:var(--surface);border-left:4px solid var(--brand2);border-radius:0 12px 12px 0;padding:12px 14px;font-size:14.5px;line-height:1.55}
.mt-singkat p{margin:4px 0 0}

/* alur langkah */
ol.mt-alur{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:22px}
ol.mt-alur>li{position:relative;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--mtc);border-radius:12px;padding:10px 12px 11px;min-width:0}
ol.mt-alur>li+li::before{content:"";position:absolute;left:-16px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:translateY(-50%) rotate(-45deg);opacity:.7}
.mt-ak{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.mt-ak i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:color-mix(in oklab,var(--mtc) 16%,transparent);color:var(--mtc);flex:none}
.mt-ak em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink2);letter-spacing:.06em}
ol.mt-alur b{display:block;font-size:13px;line-height:1.3}
ol.mt-alur small{display:block;color:var(--ink2);font-size:11.8px;line-height:1.35;margin-top:2px}
@media (max-width:820px){
  ol.mt-alur{grid-auto-flow:row;grid-auto-columns:auto;gap:16px}
  ol.mt-alur>li{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;border-top-width:1px;border-left:3px solid var(--mtc)}
  ol.mt-alur>li .mt-ak{grid-row:span 2;margin:0}
  ol.mt-alur>li .mt-ak em{display:none}
  ol.mt-alur>li+li::before{left:50%;top:-12px;transform:translateX(-50%) rotate(45deg)}
}

/* contoh hitung: tangga */
.mt-contoh{border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;background:linear-gradient(180deg,color-mix(in oklab,var(--mt-hijau) 6%,transparent),transparent 120px)}
.mt-ch{margin-bottom:10px}
.mt-ch b{display:block;font-size:14px;margin-top:2px}
.mt-ch small{display:block;color:var(--ink2);font-size:12px;line-height:1.4;margin-top:2px}
ol.mt-tangga{list-style:none;margin:0;padding:0}
ol.mt-tangga>li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:8px 6px 8px 0}
ol.mt-tangga>li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
ol.mt-tangga>li:first-child::before{top:14px}
ol.mt-tangga>li:last-child::before{bottom:calc(100% - 14px)}
.mt-tt{position:relative;z-index:1;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--brand2);color:var(--brand2);font-size:11px;font-weight:800;line-height:1}
.mt-tl{min-width:0;font-size:13px;line-height:1.4}
.mt-tl b{font-weight:650}
.mt-tl small{display:block;color:var(--ink2);font-size:12px;line-height:1.4;margin-top:1px}
.mt-tv{font-family:var(--display);font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;max-width:48vw;overflow-wrap:anywhere}
.mt-tv small{display:block;font-family:var(--font);font-weight:500;font-size:11px;color:var(--ink2)}
li.mt-in .mt-tt{border-color:var(--mt-biru);color:var(--mt-biru)}
li.mt-in .mt-tv{color:var(--mt-biru);font-size:14px}
li.mt-ok .mt-tt{border-color:var(--mt-hijau);background:var(--mt-hijau);color:#fff}
li.mt-no .mt-tt{border-color:var(--mt-merah);background:var(--mt-merah);color:#fff}
li.mt-ok .mt-tv{color:var(--mt-hijau)}
li.mt-no .mt-tv{color:var(--mt-merah)}
li.mt-hasil{background:color-mix(in oklab,var(--mt-oranye) 13%,transparent);border-radius:12px;padding-left:0;margin-top:4px}
li.mt-hasil .mt-tt{border-color:var(--mt-oranye);background:var(--mt-oranye);color:#fff}
li.mt-hasil .mt-tv{font-size:19px}
li.mt-hasil .mt-tl b{font-weight:800}
.mt-cat{margin:8px 0 2px;font-size:12px;color:var(--ink2);line-height:1.45}
.mt-muat{display:flex;gap:10px;align-items:center;color:var(--ink2);font-size:13px;padding:6px 0}
.mt-muat .spin{width:20px;height:20px;border-width:2px;margin:0}
@media (max-width:640px){
  ol.mt-tangga>li{grid-template-columns:22px minmax(0,1fr);padding-right:0}
  .mt-tv{grid-column:2;text-align:left;max-width:none}
  .mt-tv small{display:inline;margin-left:6px}
}

/* rincian teknis & batasan */
details.mt-tek{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
details.mt-tek>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--ink2)}
details.mt-tek>summary::-webkit-details-marker{display:none}
details.mt-tek>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s}
details.mt-tek[open]>summary::after{transform:rotate(-135deg)}
.mt-tekisi{padding:0 14px 12px;font-size:13px;min-width:0}
.mt-tekisi .rumus{background:var(--card)}
.mt-tekisi p{margin:6px 0}
.mt-batas{font-size:13px}
.mt-batas ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.mt-batas li{display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.mt-batas li::before{content:"";flex:none;width:7px;height:7px;margin-top:7px;border-radius:2px;background:var(--mt-kuning);transform:rotate(45deg)}
.mt-pil{display:inline-flex;flex-wrap:wrap;gap:6px}
.mt-tekisi code,.mt-tl,.mt-cat{overflow-wrap:anywhere}

<div id="basi" role="alert" hidden style="position:fixed;top:calc(var(--top) + 8px);left:50%;transform:translateX(-50%);z-index:40;background:var(--bad);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg)"></div>

<script>
"use strict";
/* ================================================================ util (sama dengan Posko Karhutla) */
const $ = s => document.querySelector(s);
const fmt = n => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("id-ID", {maximumFractionDigits: 1});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WIB = {timeZone: "Asia/Jakarta"};
const jamWIB = d => new Date(d).toLocaleString("id-ID", {...WIB, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}).replace(",", "") + " WIB";
const tglPendek = t => new Date(t + "T12:00:00+07:00").toLocaleDateString("id-ID", {weekday: "short", day: "numeric", month: "short"});
const nanti = fn => { let ok = false; const go = () => { if (!ok) { ok = true; fn(); } }; requestAnimationFrame(() => requestAnimationFrame(go)); setTimeout(go, 120); };
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); };
const simpanLokal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const bacaLokal = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const rb = v => v >= 1e6 ? fmt(Math.round(v / 1e5) / 10) + " jt" : v >= 1e4 ? fmt(Math.round(v / 1e3)) + " rb" : v >= 1e3 ? fmt(Math.round(v / 100) / 10) + " rb" : fmt(Math.round(v));
async function muatJSON(u) { const r = await fetch(u, {cache: "no-cache"}); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
function gradasi(st, v) { for (let k = 1; k < st.length; k++) if (v <= st[k][0]) { const [a, ca] = st[k - 1], [b, cb] = st[k], t = (v - a) / (b - a);
    return ca.map((c, j) => Math.round(c + (cb[j] - c) * t)); } return st[st.length - 1][1]; }

/* ================================================================ istilah */
/* Tingkat peringatan mengikuti istilah BNPB/BPBD: Normal, Waspada, Siaga, Awas */
const LEVEL = ["Normal", "Waspada", "Siaga", "Awas"], WARNA_LV = ["#5a9e74", "#e3b94e", "#e58a45", "#c9503a"];
const NAMA_B = {b: "banjir", l: "longsor"};
/* hujan harian (mm): skala BMKG ringan < 20, sedang 20-50, lebat 50-100, sangat lebat 100-150, ekstrem > 150 */
const ST_HUJAN = [[0, [120, 170, 230, 0]], [1, [150, 205, 240, 90]], [5, [110, 180, 235, 150]], [20, [60, 140, 220, 200]], [50, [40, 80, 200, 225]], [100, [110, 50, 190, 235]], [150, [190, 40, 140, 245]], [250, [120, 20, 60, 250]]];
const kelasHujan = v => v < 20 ? "ringan" : v < 50 ? "sedang" : v < 100 ? "lebat" : v < 150 ? "sangat lebat" : "ekstrem";
const AKSI = {
  b: [["Pantau prakiraan harian dan tinggi muka air", "Bersihkan saluran dan pintu air"],
      ["Siapkan jalur dan titik evakuasi", "Cek pompa, perahu karet, dan logistik dasar", "Sebarkan informasi ke RT/RW di bantaran sungai"],
      ["Aktifkan posko siaga di kecamatan", "Siagakan tim evakuasi dan dapur umum", "Koordinasi buka-tutup pintu air dengan BBWS/BPBD", "Evakuasi dini kelompok rentan di zona genangan langganan"],
      ["Evakuasi warga di bantaran dan dataran banjir", "Tutup akses jalan yang tergenang", "Aktifkan posko komando kabupaten", "Usulkan status tanggap darurat ke kepala daerah bila meluas"]],
  l: [["Pantau retakan tanah dan rembesan di lereng", "Hindari menambah beban di bibir lereng"],
      ["Periksa lereng di atas permukiman dan jalan", "Siapkan jalur evakuasi menjauhi alur sungai"],
      ["Ungsikan sementara rumah di kaki lereng curam saat hujan lebat", "Siagakan alat berat untuk buka akses"],
      ["Evakuasi permukiman di zona longsor", "Tutup ruas jalan rawan", "Siagakan tim SAR"]],
};

/* ================================================================ state */
const S = {meta: null, st: null, hujan: null, sungai: null, bahaya: {}, kejadian: null, geo: {prov: null, kab: {}, kec: {}},
  b: "b", hari: 0, jalur: [], mode: "status"};
const namaProv = k => S.meta?.provinsi?.[k] ?? k;

/* ================================================================ tabs */
const TABS = [["peta", "Peta"], ["informasi", "Informasi"], ["insight", "Insight"], ["prakiraan", "Prakiraan"], ["posko", "Posko"], ["daftar", "Wilayah siaga"], ["provinsi", "Provinsi"], ["rob", "Rob"], ["sungai", "Sungai"], ["tren", "Tren"], ["keputusan", "Keputusan"], ["simulasi", "Simulasi"], ["sarana", "Sarana"], ["metode", "Metode"]];
function bukaTab(id, dorong = true) {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.t === id ? "page" : "false"));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + id));
  if (dorong) history.replaceState(null, "", "#" + id);
  nanti(() => { if (id === "peta" && peta) peta.resize(); if (id === "informasi") window.Informasi?.render(); const f = {insight: Insight, prakiraan: Prakiraan, daftar: Daftar, provinsi: Provinsi, rob: Rob, sungai: Sungai, tren: Tren, keputusan: Keputusan, simulasi: Simulasi, posko: Posko, sarana: Sarana, metode: Metode}[id]; f && f.render(); });
}
$("#tabs").innerHTML = TABS.map(([k, n]) => `<button data-t="${k}" aria-current="${k === "peta" ? "page" : "false"}">${n}</button>`).join("");
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) bukaTab(b.dataset.t); });
const temaAwal = bacaLokal("pb-tema", null); if (temaAwal) document.documentElement.dataset.theme = temaAwal;
const gelap = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
$("#tema").onclick = () => { const t = gelap() ? "light" : "dark"; document.documentElement.dataset.theme = t; simpanLokal("pb-tema", t); nanti(() => peta && peta.setStyle(DASAR(), {diff: false})); };
let LAMBANG = {}; muatJSON("../lambang/kabkota.json").then(d => LAMBANG = d).catch(() => {});
const lambang = (prov, kab) => { const f = kab ? LAMBANG[prov + "|" + kab] && `../lambang/kabkota/${LAMBANG[prov + "|" + kab]}.png` : prov && `../lambang/provinsi/${prov}.png`;
  return f ? `<img class="lambang" src="${f}" alt="" loading="lazy" onerror="this.remove()">` : ""; };

/* ================================================================ data */
async function muatData() {
  const [meta, st, hujan, sungai, prov] = await Promise.all([muatJSON("data/meta.json"), muatJSON("data/status.json"), muatJSON("data/hujan.json"),
    muatJSON("data/sungai.json").catch(() => ({hari: [], titik: []})), muatJSON("../geo/provinsi.json")]);
  Object.assign(S, {meta, st, hujan, sungai}); S.geo.prov = prov;
  S.rob = await muatJSON("data/rob.json").catch(() => null);
  muatJSON("data/bahaya.json").then(d => S.bahaya = d.kec || {}).catch(() => {});
  muatJSON("data/kejadian.json").then(d => S.kejadian = d).catch(() => {});
  /* sel hujan: indeks cepat lat,lon -> sel */
  S.selHujan = new Map(hujan.grid.map(g => [g.lat.toFixed(2) + "," + g.lon.toFixed(2), g]));
  S.hari = 0;
  $("#upd").textContent = "Data " + jamWIB(meta.dibuat);
  const umur = (Date.now() - new Date(meta.dibuat)) / 36e5;
  if (umur > 30) { $("#basi").hidden = false; $("#basi").textContent = `Prakiraan terakhir diperbarui ${Math.round(umur)} jam lalu (${jamWIB(meta.dibuat)}).`; }
}
/* level kecamatan untuk bahaya & hari aktif; agregat ke kab/prov = level tertinggi, plus hitungan per level */
const lvKec = (k, b = S.b, h = S.hari) => S.st.kec[k]?.[b]?.[h] || 0;
function agregat(b = S.b, h = S.hari) {
  const o = {};
  for (const [k, v] of Object.entries(S.st.kec)) { const l = v[b]?.[h] || 0; if (!l) continue; const [p, kb] = k.split("|");
    for (const key of [p, p + "|" + kb, k]) { const a = o[key] ||= {lv: 0, n: [0, 0, 0, 0]}; a.lv = Math.max(a.lv, l); a.n[l]++; } }
  return o; }
const selDekat = (lat, lon) => { const s = S.hujan.sel, a = Math.round((lat - s / 2) / s) * s + s / 2, o = Math.round((lon - s / 2) / s) * s + s / 2;
  return S.selHujan.get(a.toFixed(2) + "," + o.toFixed(2)) || null; };

/* ================================================================ peta */
let peta = null;
const DASAR = () => gelap() ? "https://tiles.openfreemap.org/styles/dark" : "https://tiles.openfreemap.org/styles/positron";
const kiriPad = () => innerWidth > 900 ? {top: 40, bottom: 80, left: 430, right: 280} : {top: 40, bottom: innerHeight * .48, left: 20, right: 20};
function kotak(fitur) { let a = [180, 90, -180, -90];
  const jalan = c => { if (typeof c[0] === "number") { a[0] = Math.min(a[0], c[0]); a[1] = Math.min(a[1], c[1]); a[2] = Math.max(a[2], c[0]); a[3] = Math.max(a[3], c[1]); } else c.forEach(jalan); };
  fitur.forEach(f => jalan(f.geometry.coordinates)); return [[a[0], a[1]], [a[2], a[3]]]; }
const Peta = {
  async init() {
    peta = new maplibregl.Map({container: "peta", style: DASAR(), center: [118, -2.4], zoom: 4.1, minZoom: 3, maxZoom: 15, attributionControl: {compact: true}, dragRotate: false, pitchWithRotate: false});

/* ================================================================ insight */
/* Exhibit bergaya konsultan (judul = kesimpulan, angka kunci disorot), setara Insight karhutla. Tiap exhibit punya kontrol

const BLN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const Insight = {
  st: {status: "b", hari: 0, hujan: "h3", sungai: "rasio", tren: "banjir", kab: "banjir", musim: "banjir", dampak: "meninggal"},
  EX: ["status", "hujan", "sungai", "rob", "tren", "musim", "kab", "dampak"],

  /* 1. status per provinsi untuk hari terpilih */

      `Kecamatan berstatus per provinsi`, `jumlah kecamatan; warna = tingkat status. Klik provinsi untuk membukanya di peta.`,
      pv.length ? `<svg viewBox="0 0 ${W} ${pv.length * rh + 6}" role="img" aria-label="Status per provinsi">${g}</svg>` : `<p class="kosong">Semua kecamatan normal.</p>`, `Aturan status ada di tab Metode. Sumber: Open-Meteo, GloFAS, InaRISK.`,
      this.seg("status", [["b", "Banjir"], ["l", "Longsor"]]) + this.seg("hari", S.st.hari.map((t, i) => [i, i ? tglPendek(t) : "Hari ini"]))); },

  /* 2. hujan: sebaran sel per provinsi */
  exHujan() {
    const m = this.st.hujan, H = S.hujan, iH = H.hari.indexOf(H.hari_ini), nilai = g => m === "h3" ? g.h3 : m === "a7" ? g.a7 : Math.max(...g.h.slice(iH, iH + 7));

    const W = 940, rh = 28, L = 200, mx = Math.max(10, ...pv.map(x => x.max)), X = v => L + v / mx * (W - L - 80);
    const ambang = m === "h3" ? [[50, "50"], [100, "100"], [150, "150"]] : m === "a7" ? [[70, "basah"], [150, "jenuh"]] : [[50, "lebat"], [100, "sangat lebat"]];

  /* 3. sungai: puncak dibanding ambang */
  exSungai() {
    const T = S.sungai.titik.filter(t => t.q2).map(t => ({...t, r: t.puncak / t.q2})).sort((a, b) => b.r - a.r).slice(0, 15);

      <rect class="gx" style="--i:${i}" x="${L}" y="${i * rh + 6}" width="${Math.max(2, X(t.r) - L)}" height="${rh - 12}" rx="3" fill="${t.kelas ? WARNA_LV[t.kelas] : "#4f8fc4"}" data-tip="<b>${esc(t.kec)}</b>, ${esc(t.kab)}<br>puncak ${fmt(Math.round(t.puncak))} m³/s · Q2 ${fmt(Math.round(t.q2))}<br>klik untuk hidrograf"/>
      <text x="${X(t.r) + 6}" y="${i * rh + 18}" font-size="12" font-weight="700">${t.r.toFixed(2).replace(".", ",")}×</text></g>`).join("");
    const n = S.sungai.titik.filter(t => t.kelas >= 1).length, nA = S.sungai.titik.filter(t => t.q2).length;

      `Puncak debit 7 hari dibanding ambang banjir 2 tahunan (Q2)`, `rasio puncak ÷ Q2; ${fmt(nA)} dari ${fmt(S.sungai.titik.length)} titik sudah punya ambang`,

  /* 4. rob: titik pantai x hari */
  exRob() {
    if (!S.rob) return "";
    const R = S.rob, iH = Math.max(0, R.hari.indexOf(S.hujan.hari_ini)), hr = R.hari.slice(iH, iH + 10), T = R.titik.map((t, i) => ({...t, i, lvs: t.lv.slice(iH, iH + 10)}))
      .filter(t => t.p95 != null).sort((a, b) => Math.max(...b.lvs) - Math.max(...a.lvs) || Math.max(...b.h.slice(iH).map((v, j) => v - b.p95)) - Math.max(...a.h.slice(iH).map((v, j) => v - a.p95))).slice(0, 16);

      `Klik titik untuk grafik pasang dan peringatan BMKG. Ambang diuji terhadap kejadian rob DIBI: ${esc(R.validasi?.ringkas || "lihat tab Rob")}. Sumber: Open-Meteo Marine, BMKG Maritim, DIBI BNPB.`); },

  /* 5. tren kejadian nasional */
  exTren() {
    const K = S.kejadian; if (!K) return "";
    const j = this.st.tren, th = K.tahun.map(String).filter(t => K.nasional?.[j]?.[t]?.kejadian != null || Object.values(K.prov).some(p => p[j]?.[t]));
    const v = th.map(t => K.nasional?.[j]?.[t]?.kejadian ?? Object.values(K.prov).reduce((a, p) => a + (p[j]?.[t]?.kejadian || 0), 0));
    const W = 940, B = 230, L = 46, gap = (W - L) / th.length, bw = gap * .7, mx = Math.max(1, ...v), rata = v.slice(0, -1).reduce((a, b) => a + b, 0) / Math.max(1, v.length - 1);
    let g = [0, .5, 1].map(f => `<line x1="${L}" x2="${W}" y1="${B - f * 190}" y2="${B - f * 190}" stroke="currentColor" opacity=".08"/><text x="${L - 6}" y="${B - f * 190 + 4}" text-anchor="end" font-size="11" opacity=".6">${rb(mx * f)}</text>`).join("");
    g += v.map((x, i) => { const h = x / mx * 190; return `<rect class="gy" style="--i:${i}" x="${L + i * gap + (gap - bw) / 2}" y="${B - h}" width="${bw}" height="${h}" rx="3" fill="${i === v.length - 1 ? "#5f6fb0" : "#4f8fc4"}" opacity="${i === v.length - 1 ? .6 : .9}" data-tip="<b>${th[i]}</b><br>${fmt(x)} kejadian${i === v.length - 1 ? " (berjalan)" : ""}"/><text x="${L + i * gap + gap / 2}" y="${B + 15}" text-anchor="middle" font-size="10.5" opacity=".7">${th[i].slice(2)}</text>`; }).join("");
    g += `<line x1="${L}" x2="${W}" y1="${B - rata / mx * 190}" y2="${B - rata / mx * 190}" stroke="currentColor" stroke-dasharray="4 3" opacity=".5"/><text x="${W}" y="${B - rata / mx * 190 - 5}" text-anchor="end" font-size="11" opacity=".7">rata-rata ${rb(rata)}</text>`;
    const iMax = v.slice(0, -1).indexOf(Math.max(...v.slice(0, -1))), nm = {banjir: "banjir", longsor: "tanah longsor", rob: "banjir rob", gelombang: "gelombang pasang & abrasi", cuaca: "cuaca ekstrem", kering: "kekeringan"}[j];
    return this.ex(`Kejadian ${nm} terbanyak pada ${this.hl(th[iMax])}: ${this.hl(fmt(v[iMax]))} kejadian, ${fmt(Math.round(v[iMax] / rata * 10) / 10)}× rata-rata`,
      `Kejadian ${nm} tercatat BNPB per tahun, ${th[0]}–${th.at(-1)}`, `jumlah kejadian (satu kejadian per kabupaten per tanggal)`,
      `<svg viewBox="0 0 ${W} ${B + 22}" role="img" aria-label="Kejadian per tahun">${g}</svg>`, `${esc(K.catatan || "")} Sumber: BNPB (data.bnpb.go.id) dan DIBI.`,
      this.seg("tren", [["banjir", "Banjir"], ["longsor", "Longsor"], ["rob", "Rob"], ["cuaca", "Cuaca ekstrem"], ["gelombang", "Gelombang"]])); },

  /* 6. musim: bulan kejadian dari daftar DIBI 3 tahun terakhir, per provinsi */
  exMusim() {
    const K = S.kejadian, E = K?.kejadian_dibi || []; if (!E.length) return "";

    const pv = Object.entries(per).map(([k, v]) => ({k, v, n: v.reduce((a, b) => a + b, 0)})).sort((a, b) => b.n - a.n).slice(0, 16);
    if (!pv.length) return "";
    const W = 940, L = 200, cw = (W - L - 70) / 12, rh = 26, T0 = 22, H = T0 + pv.length * rh;
    let g = BLN.map((b, i) => `<text x="${L + i * cw + cw / 2}" y="14" text-anchor="middle" font-size="11" font-weight="${i === new Date().getMonth() ? 800 : 400}">${b}</text>`).join("") + `<text x="${W - 4}" y="14" text-anchor="end" font-size="11" font-weight="700">Total</text>`;
    g += pv.map((x, i) => { const m = Math.max(1, ...x.v); return `<text x="${L - 10}" y="${T0 + i * rh + 17}" text-anchor="end" font-size="12.5" font-weight="600">${esc(namaProv(x.k))}</text>` + x.v.map((n, b) => `<rect x="${L + b * cw + 1.5}" y="${T0 + i * rh + 3}" width="${cw - 3}" height="${rh - 6}" rx="4" style="fill:${n ? `color-mix(in oklch, #3f7fb8 ${Math.round(15 + n / m * 80)}%, var(--surface))` : "var(--surface)"}" data-tip="<b>${esc(namaProv(x.k))} · ${BLN[b]}</b><br>${fmt(n)} kejadian"/>`).join("") + `<text x="${W - 4}" y="${T0 + i * rh + 17}" text-anchor="end" font-size="12" font-weight="700">${fmt(x.n)}</text>`; }).join("");
    const bulan = Array(12).fill(0); pv.forEach(x => x.v.forEach((n, b) => bulan[b] += n)); const pk = bulan.indexOf(Math.max(...bulan));
    const tahun = [...new Set(E.map(e => e.tanggal.slice(0, 4)))].sort();
    return this.ex(`Kejadian ${j === "banjir" ? "banjir" : j === "longsor" ? "longsor" : "rob"} memuncak pada ${this.hl(BLN[pk])}; bulan ini (${BLN[new Date().getMonth()]}) ${this.hl(fmt(Math.round(bulan[new Date().getMonth()] / Math.max(...bulan) * 100)) + "%")} dari puncak`,
      `Kalender kejadian per bulan, ${tahun[0]}–${tahun.at(-1)}`, `makin pekat = makin sering; per provinsi (16 terbanyak)`,
      `<div class="tw" style="border:0;box-shadow:none"><svg viewBox="0 0 ${W} ${H}" style="min-width:720px" role="img" aria-label="Kalender kejadian">${g}</svg></div>`,
      `Dari daftar kejadian DIBI BNPB ${tahun[0]}–${tahun.at(-1)}; tiga tahun belum cukup untuk pola jangka panjang. Sumber: DIBI BNPB.`,
      this.seg("musim", [["banjir", "Banjir"], ["longsor", "Longsor"], ["rob", "Rob"]])); },

  /* 7. kabupaten paling sering */
  exKab() {
    const K = S.kejadian; if (!K) return "";
    const j = this.st.kab, T = Object.entries(K.kab || {}).map(([k, v]) => { const y = v[j] || {}, th = Object.keys(y).sort(); return {k, y, th, n: th.reduce((a, t) => a + (y[t] || 0), 0)}; }).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 15);
    if (!T.length) return "";
    const semuaTh = [...new Set(T.flatMap(x => x.th))].sort(), W = 940, L = 260, rh = 28, mx = Math.max(...T.map(x => x.n)), X = v => v / mx * (W - L - 230);
    const g = T.map((x, i) => { const [p, kb] = x.k.split("|"), mm = Math.max(1, ...semuaTh.map(t => x.y[t] || 0));
      return `<g data-kab="${esc(x.k)}" style="cursor:pointer"><text x="${L - 10}" y="${i * rh + 18}" text-anchor="end" font-size="12.5"><tspan font-weight="700">${esc(kb)}</tspan><tspan opacity=".6"> ${esc(this.pendek(p))}</tspan></text>
      <rect class="gx" style="--i:${i}" x="${L}" y="${i * rh + 6}" width="${X(x.n)}" height="${rh - 12}" rx="3" fill="#3f7fb8" data-tip="<b>${esc(kb)}</b><br>${fmt(x.n)} kejadian ${semuaTh[0]}–${semuaTh.at(-1)}<br>klik untuk analisa"/><text x="${L + X(x.n) + 6}" y="${i * rh + 18}" font-size="12" font-weight="700">${fmt(x.n)}</text>` +
      semuaTh.map((t, b) => { const h = (x.y[t] || 0) / mm * (rh - 10); return `<rect x="${W - 200 + b * (190 / semuaTh.length)}" y="${i * rh + rh - 4 - h}" width="${190 / semuaTh.length - 1.5}" height="${Math.max(.5, h)}" fill="#4f8fc4"/>`; }).join("") + `</g>`; }).join("");
    const nm = {banjir: "banjir", longsor: "longsor", rob: "rob"}[j];
    return this.ex(`${esc(T[0].k.split("|")[1])} paling sering dilanda ${nm}: ${this.hl(fmt(T[0].n) + " kejadian")} sejak ${semuaTh[0]}`,
      `15 kabupaten/kota dengan kejadian ${nm} terbanyak`, `jumlah kejadian; kanan = pola per tahun ${semuaTh[0]}–${semuaTh.at(-1)}`,
      `<svg viewBox="0 0 ${W} ${T.length * rh + 6}" role="img" aria-label="Kabupaten paling sering">${g}</svg>`, `Klik baris untuk analisa kabupaten. Sumber: BNPB/DIBI.`,
      this.seg("kab", [["banjir", "Banjir"], ["longsor", "Longsor"], ["rob", "Rob"]])); },

  /* 8. dampak per provinsi (tahun terakhir lengkap) */
  exDampak() {

    const W = 940, L = 200, rh = 28, mx = Math.max(1, ...T.map(x => x.n)), X = v => v / mx * (W - L - 90), tot = T.reduce((a, x) => a + x.n, 0);
    const g = T.map((x, i) => `<text x="${L - 10}" y="${i * rh + 18}" text-anchor="end" font-size="13" font-weight="600">${esc(namaProv(x.k))}</text>
      <rect class="gx" style="--i:${i}" x="${L}" y="${i * rh + 6}" width="${X(x.b)}" height="${rh - 12}" fill="#3f7fb8" data-tip="<b>${esc(namaProv(x.k))}</b><br>banjir: ${fmt(x.b)}"/><rect class="gx" style="--i:${i}" x="${L + X(x.b)}" y="${i * rh + 6}" width="${X(x.l)}" height="${rh - 12}" fill="#9a7448" data-tip="<b>${esc(namaProv(x.k))}</b><br>longsor: ${fmt(x.l)}"/>
      <text x="${L + X(x.n) + 6}" y="${i * rh + 18}" font-size="12" font-weight="700">${rb(x.n)}</text>`).join("");
    const nm = {meninggal: "korban meninggal", terdampak: "warga terdampak", mengungsi: "warga mengungsi", rumah_rusak: "rumah rusak"}[f];
    return this.ex(`${th}: ${this.hl(f === "meninggal" ? fmt(tot) : rb(tot))} ${nm} akibat banjir dan longsor di 15 provinsi teratas; ${esc(namaProv(T[0]?.k))} terbanyak`,
      `Dampak banjir dan longsor per provinsi, ${th}`, `biru = banjir, cokelat = longsor`,
      `<svg viewBox="0 0 ${W} ${T.length * rh + 22}" role="img" aria-label="Dampak per provinsi">${g}</svg>`, `Sumber: rekap kejadian & dampak BNPB ${th}.`,
      this.seg("dampak", [["meninggal", "Meninggal"], ["mengungsi", "Mengungsi"], ["terdampak", "Terdampak"], ["rumah_rusak", "Rumah rusak"]])); },

  gambar(id) { const f = this["ex" + id[0].toUpperCase() + id.slice(1)]; try { return f.call(this); } catch (e) { console.error(e); return ""; } },
  async render() {
    if (!S.kejadian) S.kejadian = await muatJSON("data/kejadian.json").catch(() => null);
    const el = $("#insight");
    el.innerHTML = `<div class="head"><div><h2>Insight banjir, longsor & rob</h2><p>${new Date().toLocaleDateString("id-ID", {...WIB, weekday: "long", day: "numeric", month: "long", year: "numeric"})} · data ${jamWIB(S.meta.dibuat)}</p></div></div>
      ${this.EX.map(id => `<div data-ex="${id}">${this.gambar(id)}</div>`).join("")}`;
    const ulang = n => { const box = n.closest("[data-ex]"); if (box) nanti(() => { box.innerHTML = this.gambar(box.dataset.ex); }); };
    el.onclick = e => {

      const pv = e.target.closest("[data-prov]"); if (pv) { bukaTab("peta"); return turun(pv.dataset.prov); }
      const sg = e.target.closest("[data-sg]"); if (sg && +sg.dataset.sg >= 0) return Analisa.sungai(+sg.dataset.sg);
      const rb_ = e.target.closest("[data-rob]"); if (rb_) return Rob.titik(+rb_.dataset.rob);
      const kb = e.target.closest("[data-kab]"); if (kb) { const p = kb.dataset.kab.split("|"); S.jalur = [p[0]]; bukaTab("peta"); return Peta.aturWilayah().then(() => Analisa.wilayah(kb.dataset.kab)); } };
  },
};

          pengungsi x hari mengungsi x biaya per orang per hari;
          meninggal x nilai nyawa statistik = PILIHAN KEBIJAKAN, baris terpisah, bisa dinolkan.

    this.grup.forEach(([g, it], gi) => { let gn = 0, ga = 0, gk = 0;
      it.forEach(([nm, s, m, , kali], ii) => { const q = jumlahItem(m, kali, this.regu, this.ungsi), h = HARGA[nm], v = !!this.isi[this.kunci(gi, ii)], beli = h && m && !SEWA.has(nm) && !LOGISTIK(s), el = $(`#sk${gi}_${ii}`);
        n++; gn++; if (v) { ada++; ga++; } if (beli) { butuh += h[0] * q; if (!v) { kurang += h[0] * q; gk += h[0] * q; } }
        el.innerHTML = `<small class="m">Kekurangan </small>` + (v ? `<span class="pill l0">Ada</span>` : beli ? rp(h[0] * q) : `<span style="color:var(--ink2);font-size:12px">${SEWA.has(nm) ? "sewa" : LOGISTIK(s) ? "logistik" : !m ? "survei" : "belum ada harga"}</span>`); });
      $(`#sg${gi}`).textContent = Math.round(ga / gn * 100) + "%"; $(`#sr${gi}`).textContent = gk ? "kurang " + rp(gk) : ""; });
    $("#sKpi").innerHTML = [["Kelengkapan", Math.round(ada / n * 100) + "%", `${fmt(ada)} dari ${fmt(n)} item`], ["Biaya kekurangan", rp(kurang), "alat yang belum dicentang"],
      ["Biaya kebutuhan penuh", rp(butuh), "alat beli, tanpa sewa & logistik"], ["Item belum ada", fmt(n - ada), "perlu pengadaan atau pinjam"]].map(([l, v, s]) => kot(l, v, s)).join("");
  },
};
</script>
