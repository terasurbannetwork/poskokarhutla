<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Posko Banjir Indonesia</title>
<meta name="description" content="Prakiraan banjir dan longsor per kecamatan: hujan, debit sungai, indeks bahaya, dan riwayat kejadian untuk 38 provinsi Indonesia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
:root{
  --paper:oklch(97.6% .006 255); --card:oklch(100% 0 0); --surface:oklch(95.5% .012 255);
  --ink:oklch(25.5% .075 256); --ink2:oklch(50% .045 258); --line:oklch(90% .015 255);
  --brand:oklch(25.5% .075 256); --brand2:oklch(42% .11 255); --accent:oklch(68% .09 252);
  --ok:oklch(62% .16 150); --warn:oklch(76% .16 75); --bad:oklch(57% .21 27); --info:oklch(66% .13 235);
  --f0:oklch(72% .15 150); --f1:oklch(86% .16 98); --f2:oklch(73% .17 58); --f3:oklch(57% .21 27);
  --shadow:0 2px 14px oklch(25% .07 256 / .08); --shadow-lg:0 8px 28px oklch(25% .07 256 / .16);
  --r:16px; --r-sm:10px; --top:58px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Plus Jakarta Sans",var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:oklch(18% .035 256); --card:oklch(22.5% .045 256); --surface:oklch(26% .05 256);
  --ink:oklch(94% .012 255); --ink2:oklch(76% .035 255); --line:oklch(33% .05 256);
  --brand:oklch(64% .12 252); --brand2:oklch(70% .11 250); --accent:oklch(72% .1 252);
  --shadow:0 2px 14px oklch(0% 0 0 / .35); --shadow-lg:0 8px 28px oklch(0% 0 0 / .5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:oklch(18% .035 256); --card:oklch(22.5% .045 256); --surface:oklch(26% .05 256);
  --ink:oklch(94% .012 255); --ink2:oklch(76% .035 255); --line:oklch(33% .05 256);
  --brand:oklch(64% .12 252); --brand2:oklch(70% .11 250); --accent:oklch(72% .1 252);
  --shadow:0 2px 14px oklch(0% 0 0 / .35); --shadow-lg:0 8px 28px oklch(0% 0 0 / .5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.018em;margin:0}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
header.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:30;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(135deg,oklch(42% .11 255),oklch(25.5% .075 256));color:#fff}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.mark svg{flex:none}
.mark b{font-family:var(--display);font-weight:800;font-size:15.5px;white-space:nowrap}
.mark small{display:block;font-size:11px;opacity:.75;white-space:nowrap}
nav.tabs{display:flex;gap:2px;margin:0 auto;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto;mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
.stat,.mark{flex:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;color:#fff;opacity:.78;padding:8px 13px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{opacity:1;background:oklch(100% 0 0 / .08)}
nav.tabs button[aria-current="page"]{opacity:1;background:oklch(100% 0 0 / .16)}
.stat{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.stat .jam{font-family:var(--display);font-weight:700;font-size:14px}
.iconbtn{border:0;background:oklch(100% 0 0 / .12);color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:oklch(100% 0 0 / .22)}
@media (max-width:900px){.stat .upd,.mark small{display:none}}
@media (max-width:1500px){.mark small,.stat .upd{display:none}}
@media (max-width:1100px){.mark > div{display:none}}
@media (max-width:640px){header.top{gap:6px;padding:0 8px}.stat .jam{display:none}nav.tabs{margin:0;flex:1}nav.tabs button{padding:8px 10px;font-size:13px}}

/* ---------- pages ---------- */
main{position:fixed;inset:var(--top) 0 0 0}
.page{position:absolute;inset:0;display:none}
.page.on{display:block}
.scroll{overflow-y:auto;padding:22px 18px 60px}
.wrap{max-width:1240px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media (min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.head>*{min-width:0;max-width:100%}
.head p{margin:4px 0 0;color:var(--ink2);max-width:70ch}

/* ---------- map page ---------- */
#peta,#simPeta{position:absolute;inset:0}
canvas.angin{position:absolute;inset:0;pointer-events:none;z-index:1;display:none}
.garis-waktu{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:18px;width:min(620px,calc(100% - 820px));min-width:340px;padding:8px 10px;display:none;align-items:center;gap:10px}
.garis-waktu.on{display:flex}
.garis-waktu .skala{display:flex;height:8px;border-radius:4px;overflow:hidden;width:110px;flex:none}
@media (max-width:900px){.garis-waktu{bottom:auto;top:112px;width:calc(100% - 24px);min-width:0}.garis-waktu > .lbl,.garis-waktu .skala{display:none}}
.panel{position:absolute;z-index:5;top:12px;left:12px;bottom:12px;width:400px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.panel > *{pointer-events:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;text-align:center}
.kpi .lbl{display:block;background:var(--brand);color:#fff;padding:4px 6px;font-size:9.5px}
:root[data-theme="dark"] .kpi .lbl{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi .lbl{color:oklch(18% .035 256)}}
.kpi b{display:block;font-family:var(--display);font-size:22px;font-weight:800;padding:6px 4px 0;font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--ink2);font-size:11px;padding:0 6px 7px}
.list{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.list .top{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;margin-bottom:8px}
.crumb button{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--brand2);font-weight:600;cursor:pointer}
.crumb button:hover{background:var(--surface)}
.crumb span{color:var(--ink2)}
.cari{position:relative}
.cari input{width:100%;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 34px;font-size:13px}
.cari svg{position:absolute;left:12px;top:10px;color:var(--ink2)}
.hasil{position:absolute;left:0;right:0;top:40px;z-index:10;max-height:280px;overflow:auto;padding:4px}
.hasil button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.hasil button:hover,.hasil button:focus{background:var(--surface)}
.hasil small{color:var(--ink2)}
.rows{overflow-y:auto;flex:1;padding:4px 6px 8px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer}
.tb{display:grid;grid-template-columns:20px minmax(0,1fr) 56px 50px 70px;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;line-height:1.25;border-bottom:1px solid var(--line)}
.tb:hover{background:var(--surface)}
.tb.kepala{position:sticky;top:0;z-index:1;background:var(--card);cursor:default;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:6px 8px}
.tb > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .n{text-align:right;font-variant-numeric:tabular-nums}
.tb .rk{color:var(--ink2);font-size:11px;font-weight:700;text-align:right}
.tb .pill{height:19px;padding:0 7px;font-size:10.5px;justify-self:end}
.kartu{margin:-10px -12px;min-width:270px;overflow:hidden;border-radius:12px}
.kartu .kp{padding:8px 30px 8px 12px;color:#fff;display:flex;align-items:center;gap:10px}
.kartu .kp>div{min-width:0}
.lambang{flex:none;width:30px;height:36px;object-fit:contain;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .35))}
.dlg .dh .lambang{width:40px;height:48px}
.kartu .kp small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.8}
.kartu .kp b{display:block;font-family:var(--display);font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kartu .kg{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;padding:4px 12px 2px}
.kartu .kb{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.3;min-width:0}
.kartu .kb span{color:var(--ink2);white-space:nowrap}
.kartu .kb b{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kartu .kb.penuh{grid-column:1 / -1}
.kartu .kk{padding:6px 12px 10px;font-size:11px;color:var(--ink2);line-height:1.4}
.kartu .kk button{margin-top:6px;width:100%}
.maplibregl-popup-close-button{color:#fff;font-size:18px;right:4px;top:3px}
.row:hover{background:var(--surface)}
.row .rk{font-size:11px;color:var(--ink2);font-weight:700;text-align:right}
.row .nm{display:block;font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;color:var(--ink2);font-size:11px;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{height:4px;border-radius:4px;background:var(--surface);margin-top:5px;overflow:hidden}
.row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--f2),var(--f3));border-radius:4px}
.row .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.row .vl small{display:block;font-weight:500;color:var(--ink2);font-size:10.5px}
.prio{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.l0{background:oklch(62% .16 150 / .14);color:oklch(45% .13 150)}
.l1{background:oklch(66% .13 235 / .14);color:oklch(46% .12 240)}
.l2{background:oklch(76% .16 75 / .2);color:oklch(48% .12 65)}
.l3{background:oklch(57% .21 27 / .14);color:oklch(50% .2 27)}
:root[data-theme="dark"] .l0{color:oklch(80% .14 150)} :root[data-theme="dark"] .l1{color:oklch(80% .1 235)}
:root[data-theme="dark"] .l2{color:oklch(84% .13 75)} :root[data-theme="dark"] .l3{color:oklch(76% .15 27)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .l0{color:oklch(80% .14 150)}:root:not([data-theme="light"]) .l1{color:oklch(80% .1 235)}:root:not([data-theme="light"]) .l2{color:oklch(84% .13 75)}:root:not([data-theme="light"]) .l3{color:oklch(76% .15 27)}}

.tools{position:absolute;z-index:5;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;width:250px}
.seg{display:inline-flex;flex-shrink:0;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg.penuh{display:flex;width:100%}.seg.penuh button{flex:1;text-align:center}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:oklch(18% .035 256)}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;width:100%}
.lapis label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0 3px 4px;cursor:pointer}
.lapis details{border-top:1px solid var(--line);padding:4px 0}
.lapis summary{cursor:pointer;font-size:12px;font-weight:700;padding:3px 0;list-style:none;display:flex;justify-content:space-between}
.lapis summary::-webkit-details-marker{display:none}
.lapis summary::after{content:"▾";color:var(--ink2);transition:transform .15s}
.lapis details:not([open]) summary::after{transform:rotate(-90deg)}
.tools{max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:thin}
.tools #lapis{display:none}
.tools #lapis.buka{display:block}
#lapisBtn{align-self:flex-end}
#legenda summary{cursor:pointer;list-style:none}
.lapis input{accent-color:var(--brand2);width:15px;height:15px}
.leg{display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.leg .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.leg .dot{border-radius:50%}
.legscale{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:4px 0 2px}
.legscale i{flex:1}
.legnum{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2)}

.laci{position:absolute;z-index:8;top:12px;right:12px;bottom:12px;width:390px;display:none;flex-direction:column;overflow:hidden}
.laci.on{display:flex}
.laci .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.laci .hd h2{font-size:17px}
.laci .bd{overflow-y:auto;padding:14px 16px 18px}
.tutup{margin-left:auto;border:0;background:var(--surface);width:30px;height:30px;border-radius:8px;cursor:pointer;flex:none}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--surface);border-radius:10px;padding:8px 6px;text-align:center}
.kv b{display:block;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sop{border-left:3px solid var(--bad);padding:8px 12px;background:var(--surface);border-radius:0 10px 10px 0;margin:10px 0;font-size:13px}
.sop ul{margin:6px 0 0;padding-left:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:13.5px}
.btn.pri{background:linear-gradient(135deg,oklch(42% .11 255),oklch(25.5% .075 256));color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.muat{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:var(--paper);transition:opacity .3s}
.muat.hilang{opacity:0;pointer-events:none}
.muat div{text-align:center;color:var(--ink2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand2);margin:0 auto 10px;animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.handle{display:none}
.maplibregl-popup-content{background:var(--card);color:var(--ink);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px 12px;font:13px/1.45 var(--font)}
.maplibregl-popup-tip{border-top-color:var(--card)!important;border-bottom-color:var(--card)!important}
.maplibregl-ctrl-attrib{font-size:10px}

@media (max-width:900px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46%;gap:0;transition:height .25s}
  .panel.min{height:96px}
  .panel .kpis{display:none}
  .panel .list{border-radius:18px 18px 0 0}
  .handle{display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0;border:0;cursor:pointer}
  .tools{width:auto;right:8px;top:8px}
  .tools .box{display:none}
  .tools .box.buka{display:block;width:230px}
  .laci{inset:auto 0 0 0;width:auto;height:72%;border-radius:18px 18px 0 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- tables ---------- */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbar input{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 14px;min-width:220px}
.tbar .sp{flex:1}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;text-align:left;white-space:nowrap;border-bottom:2px solid var(--accent)}
:root[data-theme="dark"] thead th{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th{color:oklch(18% .035 256)}}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
thead th.n,td.n{text-align:right}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:oklch(50% .05 255 / .025)}
tbody tr:hover{background:oklch(42% .11 255 / .06)}
tfoot td{padding:9px 10px;background:var(--brand);color:#fff;font-weight:800}
:root[data-theme="dark"] tfoot td{color:oklch(18% .035 256)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tfoot td{color:oklch(18% .035 256)}}
td a,td button.link{color:var(--brand2);font-weight:600;background:none;border:0;cursor:pointer;padding:0}
.rp{display:flex;justify-content:space-between;gap:10px;min-width:96px}.rp i{font-style:normal;color:var(--ink2)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.kosong{padding:28px;text-align:center;color:var(--ink2)}

/* ---------- sim ---------- */
.simpanel{position:absolute;z-index:5;top:12px;left:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;padding:16px}
.simpanel h2{font-size:17px}
.fld{max-width:100%;display:flex;flex-direction:column;gap:4px;margin:10px 0}
.fld select,.fld input[type=number]{max-width:100%;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.waktu{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:18px;width:min(620px,calc(100% - 24px));padding:12px 16px;display:flex;gap:12px;align-items:center}
.waktu input[type=range]{flex:1;accent-color:var(--bad)}

<script>
"use strict";
/* ================================================================ util (sama dengan Posko Karhutla) */
const $ = s => document.querySelector(s);
const fmt = n => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("id-ID", {maximumFractionDigits: 1});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WIB = {timeZone: "Asia/Jakarta"};
const jamWIB = d => new Date(d).toLocaleString("id-ID", {...WIB, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}).replace(",", "") + " WIB";
const tglPendek = t => new Date(t + "T12:00:00+07:00").toLocaleDateString("id-ID", {weekday: "short", day: "numeric", month: "short"});
const nanti = fn => { let ok = false; const go = () => { if (!ok) { ok = true; fn(); } }; requestAnimationFrame(() => requestAnimationFrame(go)); setTimeout(go, 120); };
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); };
const simpanLokal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const bacaLokal = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const rb = v => v >= 1e6 ? fmt(Math.round(v / 1e5) / 10) + " jt" : v >= 1e4 ? fmt(Math.round(v / 1e3)) + " rb" : v >= 1e3 ? fmt(Math.round(v / 100) / 10) + " rb" : fmt(Math.round(v));
async function muatJSON(u) { const r = await fetch(u, {cache: "no-cache"}); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
function gradasi(st, v) { for (let k = 1; k < st.length; k++) if (v <= st[k][0]) { const [a, ca] = st[k - 1], [b, cb] = st[k], t = (v - a) / (b - a);
    return ca.map((c, j) => Math.round(c + (cb[j] - c) * t)); } return st[st.length - 1][1]; }

/* ================================================================ istilah */
/* Tingkat peringatan mengikuti istilah BNPB/BPBD: Normal, Waspada, Siaga, Awas */
const LEVEL = ["Normal", "Waspada", "Siaga", "Awas"], WARNA_LV = ["#4caf73", "#f2c94c", "#f29a3c", "#d6453a"];
const NAMA_B = {b: "banjir", l: "longsor"};
/* hujan harian (mm): skala BMKG ringan < 20, sedang 20-50, lebat 50-100, sangat lebat 100-150, ekstrem > 150 */
const ST_HUJAN = [[0, [120, 170, 230, 0]], [1, [150, 205, 240, 90]], [5, [110, 180, 235, 150]], [20, [60, 140, 220, 200]], [50, [40, 80, 200, 225]], [100, [110, 50, 190, 235]], [150, [190, 40, 140, 245]], [250, [120, 20, 60, 250]]];
const kelasHujan = v => v < 20 ? "ringan" : v < 50 ? "sedang" : v < 100 ? "lebat" : v < 150 ? "sangat lebat" : "ekstrem";
const AKSI = {
  b: [["Pantau prakiraan harian dan tinggi muka air", "Bersihkan saluran dan pintu air"],
      ["Siapkan jalur dan titik evakuasi", "Cek pompa, perahu karet, dan logistik dasar", "Sebarkan informasi ke RT/RW di bantaran sungai"],

    `<div class="lbl">Status ${NAMA_B[S.b]} per wilayah</div><div class="leg" style="margin:4px 0 8px">${[3, 2, 1].map(l => `<span><i class="sw" style="background:${WARNA_LV[l]}"></i>${LEVEL[l]}</span>`).join("")}</div>`}
    ${Peta.lihat("sungai") ? `<div class="lbl">Debit sungai (GloFAS)</div><div class="leg" style="margin:4px 0 8px"><span><i class="sw dot" style="background:#2f80c0"></i>di bawah banjir 2 tahunan</span>${[1, 2, 3].map(l => `<span><i class="sw dot" style="background:${WARNA_LV[l]}"></i>≥ banjir ${[0, 2, 5, 20][l]} tahunan</span>`).join("")}</div>` : ""}
    ${Peta.lihat("rob") && S.rob ? `<div class="lbl">Pasang laut (rob)</div><div class="leg" style="margin:4px 0 8px"><span><b style="color:#14a3a3">▲</b> normal</span>${[1, 2, 3].map(l => `<span><b style="color:${WARNA_LV[l]}">▲</b> ${["", "≥ persentil 95", "≥ persentil 99", "di atas rekor"][l]}</span>`).join("")}</div>` : ""}
    ${hj ? `<div class="lbl">${Peta.lihat("h3") && !Peta.lihat("hujan") ? "Hujan 3 hari puncak" : "Hujan harian"} (mm)</div><div class="legscale">${[3, 12, 35, 75, 125, 200].map(v => `<i style="background:rgb(${gradasi(ST_HUJAN, v).slice(0, 3).join(",")})"></i>`).join("")}</div>
      <div class="legnum">${(Peta.lihat("h3") && !Peta.lihat("hujan") ? [5, 25, 70, 150, 250, 400] : [1, 20, 50, 100, 150, 250]).map(v => `<span>${v}</span>`).join("")}</div>` : ""}</div></details>`; }

/* ================================================================ riwayat: kejadian BNPB per kab/kota */
const Riwayat = {
  SKALA: ["#e3f0fb", "#a9d0f0", "#5aa3dd", "#2366b4", "#123d7a"],
  async pasang() { if (!S.kejadian) S.kejadian = await muatJSON("data/kejadian.json").catch(() => null);
    if (!S.kejadian) return toast("Data riwayat kejadian belum tersedia");
    if (S.jalur.length === 0) toast("Pilih provinsi untuk melihat kejadian per kabupaten/kota");
    const jenis = S.b === "b" ? "banjir" : "longsor", tot = k => Object.values(S.kejadian.kab?.[k]?.[jenis] || {}).reduce((a, b) => a + b, 0);
    peta.setPaintProperty("wil-fill", "fill-color", ["step", ["get", "rw"], "rgba(0,0,0,0)", 1, this.SKALA[0], 5, this.SKALA[1], 10, this.SKALA[2], 20, this.SKALA[3], 40, this.SKALA[4]]);
    const f = S.fiturWil.map(x => ({...x, properties: {...x.properties, rw: S.jalur.length === 1 ? tot(x.properties.kunci) : 0}}));
    peta.getSource("wil").setData({type: "FeatureCollection", features: f}); },
  lepas() { if (!peta?.getLayer("wil-fill")) return; peta.setPaintProperty("wil-fill", "fill-color", ["match", ["get", "lv"], 3, WARNA_LV[3], 2, WARNA_LV[2], 1, WARNA_LV[1], "rgba(0,0,0,0)"]); Peta.aturWilayah(false); },
};
</script>
<script>
"use strict";
/* ================================================================ popup analisa */
const lipat = (judul, isi, buka = true) => `<details class="lipat" ${buka ? "open" : ""}><summary>${judul}</summary><div class="isi">${isi}</div></details>`;
const kot = (l, v, s) => `<div class="kpi"><span class="lbl">${l}</span><b>${v}</b><small>${s}</small></div>`;
const km = (a, b, c, d) => { const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
/* grafik batang hujan 10 hari (3 lalu + 7 prakiraan), garis ambang 50 & 100 mm */
function grafikHujan(c) {
  const H = S.hujan, W = 660, B = 130, m = Math.max(110, ...c.h), gap = W / c.h.length, iH = H.hari.indexOf(H.hari_ini);
  let g = [50, 100].map(v => `<line x1="0" x2="${W}" y1="${B - v / m * 110}" y2="${B - v / m * 110}" stroke="currentColor" stroke-dasharray="4 3" opacity=".35"/><text x="${W}" y="${B - v / m * 110 - 4}" text-anchor="end" font-size="10" opacity=".6">${v} mm</text>`).join("");
  c.h.forEach((v, j) => { const h = (v || 0) / m * 110, lalu = j < iH;
    g += `<rect x="${j * gap + gap * .15}" y="${B - h}" width="${gap * .7}" height="${Math.max(1, h)}" rx="3" fill="rgb(${gradasi(ST_HUJAN, Math.max(v, 8)).slice(0, 3).join(",")})" opacity="${lalu ? .55 : 1}" data-tip="<b>${tglPendek(H.hari[j])}</b>${lalu ? " · teramati" : " · prakiraan"}<br>${fmt(v)} mm (${kelasHujan(v)})${c.p?.[j] != null ? `<br>peluang hujan ${c.p[j]}%` : ""}"/>
      <text x="${j * gap + gap / 2}" y="${B - h - 4}" text-anchor="middle" font-size="10.5" font-weight="700">${v >= 1 ? fmt(Math.round(v)) : ""}</text>
      <text x="${j * gap + gap / 2}" y="${B + 14}" text-anchor="middle" font-size="10" opacity="${j === iH ? 1 : .65}" font-weight="${j === iH ? 800 : 400}">${j === iH ? "Hari ini" : H.hari[j].slice(8) + "/" + H.hari[j].slice(5, 7)}</text>`; });
  return `<svg viewBox="0 -12 ${W} ${B + 22}" width="100%" role="img" aria-label="Hujan harian">${g}</svg>`; }
/* hidrograf sungai: debit ansambel rata-rata dan maksimum vs Q2/Q5/Q20 */
function grafikSungai(t) {
  const hr = S.sungai.hari, W = 660, B = 140, m = Math.max(t.q20 * 1.1, ...t.qmax.map(x => x || 0), ...t.q), X = j => j / (hr.length - 1) * (W - 40) + 20, Y = v => B - v / m * 120;
  let g = [[t.q2, 1], [t.q5, 2], [t.q20, 3]].map(([q, l]) => `<line x1="20" x2="${W - 20}" y1="${Y(q)}" y2="${Y(q)}" stroke="${WARNA_LV[l]}" stroke-dasharray="5 3"/><text x="${W - 20}" y="${Y(q) - 4}" text-anchor="end" font-size="10" style="fill:${WARNA_LV[l]}">banjir ${[0, 2, 5, 20][l]} tahunan · ${fmt(Math.round(q))} m³/s</text>`).join("");
  g += `<path d="${t.qmax.map((v, j) => (j ? "L" : "M") + X(j) + "," + Y(v || 0)).join("")} ${t.q.map((v, j) => "L" + X(hr.length - 1 - j) + "," + Y(t.q[hr.length - 1 - j] || 0)).join("")}Z" fill="#2f80c0" opacity=".15"/>`;
  g += `<path d="${t.q.map((v, j) => (j ? "L" : "M") + X(j) + "," + Y(v || 0)).join("")}" fill="none" stroke="#2f80c0" stroke-width="2.5"/>`;
  g += t.q.map((v, j) => `<circle cx="${X(j)}" cy="${Y(v || 0)}" r="3.5" fill="#2f80c0" data-tip="<b>${tglPendek(hr[j])}</b><br>debit ${fmt(Math.round(v))} m³/s (maks ansambel ${fmt(Math.round(t.qmax[j]))})"/><text x="${X(j)}" y="${B + 14}" text-anchor="middle" font-size="10" opacity=".65">${hr[j].slice(8)}/${hr[j].slice(5, 7)}</text>`).join("");
  return `<svg viewBox="0 -8 ${W} ${B + 22}" width="100%" role="img" aria-label="Debit sungai">${g}</svg>`; }
const Analisa = {
  buka(html, kepala) { const d = $("#dlg"); d.innerHTML = `<div class="dh">${kepala}<button aria-label="Tutup" data-tutup>×</button></div><div class="db">${html}</div>`;
    d.querySelector("[data-tutup]").onclick = () => d.close(); d.onclick = e => { if (e.target === d) return d.close();
      const s = e.target.closest("[data-sg]"); if (s) return this.sungai(+s.dataset.sg); const w = e.target.closest("[data-wil]"); if (w) return this.wilayah(w.dataset.wil); };
    d.showModal(); },
  wilayah(kunci) {
    const p = kunci.split("|"), jenis = ["prov", "kab", "kec"][p.length - 1], f = S.fiturWil?.find(x => x.properties.kunci === kunci);
    const [lat, lon] = f ? pusat(kunci) : [0, 0], c = selDekat(lat, lon), v = S.st.kec[kunci], ag = agregat(S.b, 0);
    const lvH = h => jenis === "kec" ? (v?.[S.b]?.[h] || 0) : (agregat(S.b, h)[kunci]?.lv || 0);
    const sg = S.sungai.titik.map((t, i) => ({...t, i, d: km(lat, lon, t.lat, t.lon)})).filter(t => t.d <= (jenis === "prov" ? 400 : jenis === "kab" ? 80 : 30)).sort((a, b) => b.kelas - a.kelas || a.d - b.d).slice(0, 6);
    const bh = S.bahaya[kunci], kj = S.kejadian, jn = S.b === "b" ? "banjir" : "longsor";
    const riw = jenis === "prov" ? kj?.prov?.[p[0]]?.[jn] : jenis === "kab" ? Object.fromEntries(Object.entries(kj?.kab?.[kunci]?.[jn] || {}).map(([t, n]) => [t, {kejadian: n}])) : null;
    const thR = riw ? Object.keys(riw).sort() : [], mR = Math.max(1, ...thR.map(t => riw[t].kejadian || 0));
    const nama = jenis === "prov" ? namaProv(p[0]) : p.at(-1), sub = {prov: "Provinsi", kab: "Kabupaten/kota · " + namaProv(p[0]), kec: "Kecamatan · " + p[1] + " · " + namaProv(p[0])}[jenis];
    const kepala = `${jenis === "prov" ? lambang(p[0]) : lambang(p[0], p[1])}<div><h3 id="dlgJudul">${esc(nama)}</h3><p>${esc(sub)}</p></div>`;
    const isi = `<div class="grid g4">${S.st.hari.map((t, h) => kot(h ? tglPendek(t) : "Hari ini", `<span style="color:${WARNA_LV[lvH(h)]}">${LEVEL[lvH(h)]}</span>`, NAMA_B[S.b])).join("")}</div>
      ${jenis !== "kec" && ag[kunci] ? `<p class="fnd">Hari ini: ${[3, 2, 1].map(l => `${fmt(ag[kunci].n[l])} kecamatan ${LEVEL[l].toLowerCase()}`).join(" · ")}.</p>` : ""}
      ${c ? lipat("Hujan 10 hari · 3 hari teramati + 7 hari prakiraan", `${grafikHujan(c)}<div class="grid g4">${kot("Puncak 3 hari", fmt(Math.round(c.h3)) + " mm", kelasHujan(c.h3 / 3) + " rata-rata")}${kot("Hujan 7 hari lalu", fmt(Math.round(c.a7)) + " mm", c.a7 >= 150 ? "tanah jenuh" : c.a7 >= 70 ? "tanah basah" : "tanah relatif kering")}${kot("Hari hujan lebat", fmt(c.h.filter((x, j) => j >= S.hujan.hari.indexOf(S.hujan.hari_ini) && x >= 50).length), "≥ 50 mm, 7 hari")}${kot("Hembusan maks", fmt(Math.round(Math.max(...(c.g || [0])))) + " km/jam", "7 hari")}</div>
        <p class="fnd">Sel 0,25° terdekat (${c.lat.toFixed(2)}, ${c.lon.toFixed(2)}). Garis putus = 50 mm (lebat) dan 100 mm (sangat lebat), skala BMKG.</p>`) : ""}
      ${sg.length ? lipat("Sungai terdekat (GloFAS)", `<table class="tb3"><thead><tr><th>Titik sungai</th><th class="n">Puncak 7 hari</th><th class="n">Q2</th><th class="n">Jarak</th><th class="n">Status</th></tr></thead><tbody>${sg.map(t => `<tr data-sg="${t.i}" style="cursor:pointer"><td><b>${esc(t.kec)}</b><small>${esc(t.kab)}</small></td><td class="n num">${fmt(Math.round(t.puncak))} m³/s</td><td class="n num">${fmt(Math.round(t.q2))}</td><td class="n num">${fmt(Math.round(t.d))} km</td><td class="n">${pill(t.kelas)}</td></tr>`).join("")}</tbody></table><p class="fnd">Klik baris untuk hidrograf. Q2 = debit banjir 2 tahunan dari data 1984–2025.</p>`) : ""}
      ${bh ? lipat("Indeks bahaya InaRISK (0–1)", `<table class="tb2"><tbody>${[["banjir", "Banjir"], ["bandang", "Banjir bandang"], ["longsor", "Tanah longsor"], ["kering", "Kekeringan"], ["gelombang", "Gelombang ekstrem & abrasi"]].filter(([k]) => bh[k] != null).map(([k, n]) => `<tr><td>${n}</td><td class="n">${fmt(Math.round(bh[k] * 100) / 100)} · ${bh[k] >= .66 ? "tinggi" : bh[k] >= .33 ? "sedang" : "rendah"}</td></tr>`).join("")}</tbody></table><p class="fnd">Sampel raster InaRISK BNPB di titik tengah kecamatan.</p>`) : ""}
      ${thR.length ? lipat(`Kejadian ${NAMA_B[S.b]} tercatat BNPB`, `<svg viewBox="0 0 ${thR.length * 26} 90" width="100%" role="img" aria-label="Kejadian per tahun">${thR.map((t, j) => { const n = riw[t].kejadian || 0, h = n / mR * 64;
          return `<rect x="${j * 26 + 3}" y="${72 - h}" width="20" height="${Math.max(1, h)}" rx="3" fill="#2f80c0" data-tip="<b>${t}</b><br>${fmt(n)} kejadian${riw[t].meninggal != null ? `<br>${fmt(riw[t].meninggal)} meninggal · ${rb(riw[t].terdampak || 0)} terdampak` : ""}"/><text x="${j * 26 + 13}" y="${68 - h}" text-anchor="middle" font-size="9.5">${n || ""}</text><text x="${j * 26 + 13}" y="86" text-anchor="middle" font-size="9" opacity=".6">${t.slice(2)}</text>`; }).join("")}</svg>
        <p class="fnd">Total ${fmt(thR.reduce((a, t) => a + (riw[t].kejadian || 0), 0))} kejadian, ${thR[0]}–${thR.at(-1)}. Sumber: BNPB (data.bnpb.go.id).</p>`, false) : ""}
      ${lipat("Tindakan yang disarankan", `<ul style="margin:0;padding-left:18px;font-size:12.5px">${AKSI[S.b][Math.max(...S.st.hari.map((_, h) => lvH(h)))].map(a => `<li>${esc(a)}</li>`).join("")}</ul><p class="fnd">Mengikuti status tertinggi 4 hari ke depan. Disusun dari praktik penanggulangan banjir/longsor; ikuti arahan BPBD setempat.</p>`)}
      <p class="fnd">Status dari aturan di tab Metode. Data ${jamWIB(S.meta.dibuat)}.</p>`;
    this.buka(isi, kepala); },
  sungai(i) {
    const t = S.sungai.titik[i]; if (!t) return;
    const isi = `<div class="grid g4">${kot("Status", `<span style="color:${t.kelas ? WARNA_LV[t.kelas] : "inherit"}">${LEVEL[t.kelas]}</span>`, "puncak 7 hari")}${kot("Debit puncak", fmt(Math.round(t.puncak)) + " m³/s", "rata-rata ansambel")}${kot("Q2", fmt(Math.round(t.q2)), "m³/s · banjir 2 tahunan")}${kot("Puncak ÷ Q2", fmt(Math.round(t.puncak / t.q2 * 100) / 100) + "×", t.puncak >= t.q2 ? "di atas ambang" : "di bawah ambang")}</div>
      ${lipat("Hidrograf 10 hari", `${grafikSungai(t)}<p class="fnd">Garis biru = debit rata-rata ansambel GloFAS; pita = sampai maksimum ansambel. Garis putus = ambang periode ulang dari maksimum tahunan 1984–2025 (Gumbel).</p>`)}
      <p class="fnd">GloFAS memodelkan sungai besar pada kisi ± 5 km; sungai kecil dan banjir lokal (drainase kota, rob) tidak tertangkap. Koordinat ${t.lat.toFixed(3)}, ${t.lon.toFixed(3)}.</p>`;
    this.buka(isi, `<div><h3 id="dlgJudul">Sungai di ${esc(t.kec)}</h3><p>${esc(t.kab)} · ${esc(namaProv(t.prov))}</p></div>`); },
};

/* ================================================================ prakiraan per provinsi */
const Prakiraan = {
  render() {
    const pv = Object.keys(S.meta.provinsi).sort((a, b) => namaProv(a).localeCompare(namaProv(b)));
    const baris = pv.map(k => { const lv = S.st.hari.map((_, h) => agregat(S.b, h)[k]); const sel = S.hujan.grid.filter(g => g.prov === k);
      return {k, lv, h3: Math.max(0, ...sel.map(g => g.h3 || 0)), n: lv[0]?.n || [0, 0, 0, 0], skor: Math.max(...lv.map(a => a?.lv || 0)) * 1e6 + (lv[0]?.n[3] || 0) * 1e3 + (lv[0]?.n[2] || 0)}; }).sort((a, b) => b.skor - a.skor || b.h3 - a.h3);
    $("#prakiraan").innerHTML = `<div class="head"><div><h2>Prakiraan ${NAMA_B[S.b]} 4 hari · 38 provinsi</h2><p>Status tertinggi kecamatan di tiap provinsi per hari.</p></div>
      <div class="seg" id="pkB">${[["b", "Banjir"], ["l", "Longsor"]].map(([v, n]) => `<button data-b="${v}" aria-pressed="${S.b === v}">${n}</button>`).join("")}</div></div>
      <div class="tw"><table><thead><tr><th>Provinsi</th>${S.st.hari.map((t, h) => `<th>${h ? tglPendek(t) : "Hari ini"}</th>`).join("")}<th class="n">Awas hari ini</th><th class="n">Siaga hari ini</th><th class="n">Hujan 3 hari maks</th></tr></thead><tbody>
      ${baris.map(r => `<tr data-k="${r.k}" style="cursor:pointer"><td><b>${esc(namaProv(r.k))}</b></td>${r.lv.map(a => `<td>${a ? pill(a.lv) : `<span style="color:var(--ink2);font-size:12px">Normal</span>`}</td>`).join("")}
        <td class="n num">${r.n[3] ? `<b style="color:var(--bad)">${fmt(r.n[3])}</b>` : "–"}</td><td class="n num">${r.n[2] ? fmt(r.n[2]) : "–"}</td><td class="n num">${fmt(Math.round(r.h3))} mm</td></tr>`).join("")}</tbody></table></div>
      <p class="fnd" style="margin-top:8px">Klik provinsi untuk membukanya di peta. Hujan 3 hari maks = sel 0,25° terbasah di provinsi itu.</p>`;
    $("#pkB").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.b = b.dataset.b; $("#bahayaSeg").querySelector(`[data-b="${S.b}"]`).click(); nanti(() => this.render()); };
    $("#prakiraan").querySelector("tbody").onclick = e => { const tr = e.target.closest("[data-k]"); if (tr) { bukaTab("peta"); turun(tr.dataset.k); } }; },
};

/* ================================================================ sungai */
const Sungai = {
  urut: "rasio",
  render() {
    const T = S.sungai.titik.map((t, i) => ({...t, i, r: t.puncak / t.q2})).sort(this.urut === "debit" ? (a, b) => b.puncak - a.puncak : (a, b) => b.r - a.r).slice(0, 120);
    const n = [1, 2, 3].map(l => S.sungai.titik.filter(t => t.kelas === l).length);
    $("#sungaiTab").innerHTML = `<div class="head"><div><h2>Sungai besar · prakiraan debit GloFAS 7 hari</h2><p>${fmt(S.sungai.titik.length)} titik sungai; ${fmt(n[2])} di atas banjir 20 tahunan, ${fmt(n[1])} di atas 5 tahunan, ${fmt(n[0])} di atas 2 tahunan.</p></div>
      <div class="seg" id="sgU"><button data-u="rasio" aria-pressed="${this.urut === "rasio"}">Urut: puncak ÷ Q2</button><button data-u="debit" aria-pressed="${this.urut === "debit"}">Urut: debit</button></div></div>
      <div class="tw"><table><thead><tr><th>Lokasi</th><th>Provinsi</th><th class="n">Puncak 7 hari</th><th class="n">Q2</th><th class="n">Q5</th><th class="n">Q20</th><th class="n">Puncak ÷ Q2</th><th>Status</th></tr></thead><tbody>
      ${T.map(t => `<tr data-i="${t.i}" style="cursor:pointer"><td><b>${esc(t.kec)}</b> · ${esc(t.kab)}</td><td>${esc(namaProv(t.prov))}</td><td class="n num">${fmt(Math.round(t.puncak))} m³/s</td><td class="n num">${fmt(Math.round(t.q2))}</td><td class="n num">${fmt(Math.round(t.q5))}</td><td class="n num">${fmt(Math.round(t.q20))}</td>
        <td class="n num"><b>${fmt(Math.round(t.r * 100) / 100)}×</b></td><td>${pill(t.kelas)}</td></tr>`).join("")}</tbody></table></div>
      <p class="fnd" style="margin-top:8px">Klik baris untuk hidrograf. Ambang dari maksimum tahunan 1984–2025, distribusi Gumbel. Sumber: Copernicus GloFAS lewat Open-Meteo.</p>`;
    $("#sgU").onclick = e => { const b = e.target.closest("button"); if (b) { this.urut = b.dataset.u; nanti(() => this.render()); } };
    $("#sungaiTab").querySelector("tbody").onclick = e => { const tr = e.target.closest("[data-i]"); if (tr) Analisa.sungai(+tr.dataset.i); }; },
};

/* ================================================================ riwayat kejadian (BNPB) */
const Tren = {
  jenis: "banjir",
  async render() {
    const el = $("#tren"); if (!S.kejadian) S.kejadian = await muatJSON("data/kejadian.json").catch(() => null);
    if (!S.kejadian) { el.innerHTML = `<div class="kosong">Data kejadian BNPB belum tersedia.</div>`; return; }
    const K = S.kejadian, JENIS = [["banjir", "Banjir"], ["longsor", "Tanah longsor"], ["cuaca", "Cuaca ekstrem"], ["kering", "Kekeringan"], ["gelombang", "Gelombang & abrasi"], ["rob", "Rob"], ["semua", "Semua bencana"]].filter(([j]) => Object.values(K.prov || {}).some(p => p[j])), th = K.tahun.map(String);
    const prov = Object.keys(K.prov || {}), nil = (k, t, f = "kejadian") => K.prov[k]?.[this.jenis]?.[t]?.[f] || 0;
    const tot = th.map(t => prov.reduce((a, k) => a + nil(k, t), 0)), totM = th.map(t => prov.reduce((a, k) => a + nil(k, t, "meninggal"), 0)), mx = Math.max(1, ...tot);

/* ================================================================ rob */
/* grafik pasang: tinggi muka laut maksimum harian vs ambang p95 / p99 / maks titik itu */
function grafikPasang(t) {
  const hr = S.rob.hari, W = 660, B = 140, lo = Math.min(...t.h.filter(v => v != null), t.p95) - .1, hi = Math.max(...t.h.filter(v => v != null), t.amax) + .05, Y = v => B - (v - lo) / (hi - lo) * 120, X = j => j / (hr.length - 1) * (W - 40) + 20;
  const iH = hr.indexOf(S.hujan.hari_ini);
  let g = [[t.p95, 1, "persentil 95"], [t.p99, 2, "persentil 99"], [t.amax, 3, "tertinggi tercatat"]].map(([v, l, n]) => `<line x1="20" x2="${W - 20}" y1="${Y(v)}" y2="${Y(v)}" stroke="${WARNA_LV[l]}" stroke-dasharray="5 3"/><text x="${W - 20}" y="${Y(v) - 4}" text-anchor="end" font-size="10" style="fill:${WARNA_LV[l]}">${n} · ${fmt(Math.round(v * 100) / 100)} m</text>`).join("");
  g += `<path d="${t.h.map((v, j) => (j ? "L" : "M") + X(j) + "," + Y(v ?? lo)).join("")}" fill="none" stroke="#14a3a3" stroke-width="2.5"/>`;
  g += t.h.map((v, j) => `<circle cx="${X(j)}" cy="${Y(v ?? lo)}" r="${j === iH ? 5 : 3.5}" fill="${t.lv[j] ? WARNA_LV[t.lv[j]] : "#14a3a3"}" data-tip="<b>${tglPendek(hr[j])}</b>${j < iH ? " · lalu" : ""}<br>muka laut maks ${fmt(Math.round(v * 100) / 100)} m${t.w?.[j] != null ? `<br>gelombang maks ${fmt(Math.round(t.w[j] * 10) / 10)} m` : ""}<br>${LEVEL[t.lv[j] || 0]}"/><text x="${X(j)}" y="${B + 14}" text-anchor="middle" font-size="10" opacity="${j === iH ? 1 : .6}" font-weight="${j === iH ? 800 : 400}">${j === iH ? "Hari ini" : hr[j].slice(8) + "/" + hr[j].slice(5, 7)}</text>`).join("");
  return `<svg viewBox="0 -8 ${W} ${B + 22}" width="100%" role="img" aria-label="Pasang laut harian">${g}</svg>`; }
const Rob = {
  /* peringatan resmi BMKG yang menyebut kabupaten/kecamatan titik ini */
  bmkg(t) { const kunci = [t.kab, t.kec].filter(Boolean).map(x => x.toLowerCase().replace(/^kota /, ""));
    return (S.rob.bmkg?.rob || []).filter(w => kunci.some(k => (w.lokasi || w.wilayah || "").toLowerCase().includes(k))); },
  titik(i) {
    const t = S.rob.titik[i]; if (!t) return; const iH = S.rob.hari.indexOf(S.hujan.hari_ini), maju = t.lv.slice(Math.max(0, iH)), puncak = Math.max(0, ...maju);
    const jP = iH + maju.indexOf(puncak), bm = this.bmkg(t), kt = S.rob.kab_tahun?.[t.prov + "|" + t.kab];
    const isi = `<div class="grid g4">${kot("Status puncak", `<span style="color:${puncak ? WARNA_LV[puncak] : "inherit"}">${LEVEL[puncak]}</span>`, puncak ? tglPendek(S.rob.hari[jP]) : "10 hari ke depan")}${kot("Muka laut maks", fmt(Math.round(Math.max(...t.h.slice(iH).filter(v => v != null)) * 100) / 100) + " m", "10 hari, terhadap MSL")}${kot("Ambang siaga", fmt(Math.round(t.p99 * 100) / 100) + " m", "persentil 99 sejak 2022")}${kot("Peringatan BMKG", bm.length ? `<span style="color:var(--bad)">${bm.length}</span>` : "–", bm.length ? "menyebut wilayah ini" : "tidak menyebut")}</div>
      ${lipat("Pasang 13 hari · 3 lalu + 10 prakiraan", `${grafikPasang(t)}<p class="fnd">Muka laut maksimum harian dari Open-Meteo Marine (pasang + efek tekanan udara), terhadap muka laut rata-rata global. Ambang dihitung dari arsip titik ini sejak 2022.</p>`)}
      ${bm.length ? lipat("Peringatan dini rob BMKG", `<table class="tb3"><thead><tr><th>Lokasi</th><th>Periode</th><th>Keterangan</th></tr></thead><tbody>${bm.map(w => `<tr><td>${esc(w.lokasi || w.wilayah)}</td><td>${esc(w.tanggal_mulai || "")}${w.tanggal_selesai ? " – " + esc(w.tanggal_selesai) : ""}</td><td>${esc(w.keterangan || "")}</td></tr>`).join("")}</tbody></table><p class="fnd">Sumber resmi: BMKG Maritim (${esc(S.rob.bmkg?.sumber || "")}).</p>`) : ""}
      ${t.ioc ? lipat("Alat ukur pasut terdekat (IOC)", `<table class="tb2"><tbody><tr><td>Stasiun</td><td class="n">${esc(t.ioc.stasiun)}</td></tr><tr><td>Selisih model – alat ukur</td><td class="n">${fmt(Math.round(t.ioc.offset * 100) / 100)} m</td></tr><tr><td>Korelasi pola pasang</td><td class="n">${fmt(Math.round(t.ioc.r * 100) / 100)}</td></tr><tr><td>Data terakhir</td><td class="n">${t.ioc.lag_jam != null ? fmt(Math.round(t.ioc.lag_jam)) + " jam lalu" : "–"}</td></tr></tbody></table>`, false) : ""}
      ${kt ? lipat("Kejadian rob tercatat (DIBI BNPB)", `<table class="tb2"><tbody>${Object.entries(kt).sort().map(([th, n]) => `<tr><td>${th}</td><td class="n">${fmt(n)} kejadian</td></tr>`).join("")}</tbody></table>`, false) : ""}
      ${lipat("Tindakan yang disarankan", `<ul style="margin:0;padding-left:18px;font-size:12.5px">${[["Pantau jadwal pasang tertinggi harian"], ["Siapkan pompa dan karung pasir di titik tanggul rendah", "Informasikan jam pasang tertinggi ke warga pesisir"], ["Siagakan pompa dan tim di tanggul dan pintu air", "Pindahkan barang berharga dan ternak ke tempat tinggi", "Atur lalu lintas di jalan pantai yang rawan tergenang"], ["Evakuasi kelompok rentan di permukiman pesisir terendah", "Tutup jalan pantai yang tergenang", "Koordinasi BPBD, PUPR, dan pengelola pelabuhan"]][puncak].map(a => `<li>${esc(a)}</li>`).join("")}</ul>`)}
      <p class="fnd">Koordinat titik ${t.lat.toFixed(3)}, ${t.lon.toFixed(3)}. Ketinggian adalah muka laut, bukan tinggi genangan di darat; dampak di darat bergantung pada tanggul dan penurunan tanah setempat.</p>`;
    Analisa.buka(isi, `${lambang(t.prov, t.kab)}<div><h3 id="dlgJudul">Pantai ${esc(t.kec || t.kab)}</h3><p>${esc(t.kab)} · ${esc(namaProv(t.prov))}</p></div>`); },
  render() {
    const el = $("#robTab"); if (!S.rob) { el.innerHTML = `<div class="kosong">Data rob belum tersedia.</div>`; return; }
    const iH = S.rob.hari.indexOf(S.hujan.hari_ini), T = S.rob.titik.map((t, i) => ({...t, i, pk: Math.max(0, ...t.lv.slice(Math.max(0, iH))), hm: Math.max(...t.h.slice(Math.max(0, iH)).filter(v => v != null))}))
      .sort((a, b) => b.pk - a.pk || (b.hm - b.p99) - (a.hm - a.p99));
    const n = [1, 2, 3].map(l => T.filter(t => t.pk === l).length), V = S.rob.validasi || {}, bm = S.rob.bmkg?.rob || [];
    el.innerHTML = `<div class="head"><div><h2>Banjir rob · prakiraan pasang 10 hari</h2><p>${fmt(T.length)} titik pantai; ${fmt(n[2])} awas, ${fmt(n[1])} siaga, ${fmt(n[0])} waspada dalam 10 hari ke depan.</p></div></div>
      ${bm.length ? `<article class="ex"><h3>Peringatan dini rob resmi BMKG: <span class="hl">${fmt(bm.length)} wilayah</span></h3><p class="sub">Dibaca otomatis dari dokumen BMKG Maritim</p><p class="unit">diambil ${S.rob.bmkg.diambil ? jamWIB(S.rob.bmkg.diambil) : "–"}</p>
        <div class="tw" style="border:0;box-shadow:none"><table><thead><tr><th>Lokasi</th><th>Periode</th><th>Keterangan</th></tr></thead><tbody>${bm.map(w => `<tr><td>${esc(w.lokasi || w.wilayah)}</td><td>${esc(w.tanggal_mulai || "")}${w.tanggal_selesai ? " – " + esc(w.tanggal_selesai) : ""}</td><td>${esc(w.keterangan || "")}</td></tr>`).join("")}</tbody></table></div>
        <p class="fn">Pembacaan dokumen bisa meleset bila format BMKG berubah; dokumen asli: <a href="${esc(S.rob.bmkg.sumber)}" target="_blank" rel="noopener">${esc(S.rob.bmkg.sumber)}</a>.</p></article>` : ""}
      <div class="tw"><table><thead><tr><th>Titik pantai</th><th>Provinsi</th>${S.rob.hari.slice(Math.max(0, iH), Math.max(0, iH) + 7).map((d, j) => `<th class="n">${j ? tglPendek(d) : "Hari ini"}</th>`).join("")}<th class="n">Maks 10 hari</th><th class="n">Ambang p99</th></tr></thead><tbody>
      ${T.map(t => `<tr data-i="${t.i}" style="cursor:pointer"><td><b>${esc(t.kec || t.kab)}</b><small style="display:block;color:var(--ink2)">${esc(t.kab)}</small></td><td>${esc(namaProv(t.prov))}</td>
        ${t.lv.slice(Math.max(0, iH), Math.max(0, iH) + 7).map(l => `<td class="n">${l ? pill(l) : `<span style="color:var(--ink2);font-size:11.5px">–</span>`}</td>`).join("")}<td class="n num"><b>${fmt(Math.round(t.hm * 100) / 100)} m</b></td><td class="n num">${fmt(Math.round(t.p99 * 100) / 100)} m</td></tr>`).join("")}</tbody></table></div>
      ${V.ringkas ? `<p class="fnd" style="margin-top:8px">Uji terhadap kejadian rob DIBI: ${esc(V.ringkas)}</p>` : ""}
      <p class="fnd">Klik baris untuk grafik pasang. Sumber: Open-Meteo Marine (CC BY 4.0), IOC Sea Level Monitoring, BMKG Maritim, DIBI BNPB.</p>`;
    el.querySelectorAll("[data-i]").forEach(tr => tr.onclick = () => this.titik(+tr.dataset.i)); },
};

/* ================================================================ cari */
$("#cari").addEventListener("input", async e => {
  const q = e.target.value.trim().toLowerCase(), h = $("#hasil"); if (q.length < 2) { h.hidden = true; return; }
  const idx = [...Object.entries(S.meta.provinsi).map(([k, n]) => ({k, n, j: "Provinsi"})), ...Object.keys(S.st.kec).map(k => { const p = k.split("|"); return {k, n: p[2], j: "Kec. · " + p[1]}; })];
  const hs = idx.filter(i => i.n.toLowerCase().includes(q)).slice(0, 12);
  h.innerHTML = hs.length ? hs.map(i => `<button data-k="${esc(i.k)}">${esc(i.n)}<br><small>${esc(i.j)}</small></button>`).join("") : `<div class="kosong" style="padding:12px">Tidak ditemukan di wilayah berstatus.</div>`; h.hidden = false; });
$("#hasil").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; $("#hasil").hidden = true; $("#cari").value = ""; const p = b.dataset.k.split("|");
  if (p.length === 3) { S.jalur = p.slice(0, 2); Peta.aturWilayah().then(() => Analisa.wilayah(b.dataset.k)); } else turun(b.dataset.k); });

/* tooltip */
(() => { const t = $("#tip");
  document.addEventListener("pointerover", e => { const x = e.target.closest?.("[data-tip]"); if (!x) return t.classList.remove("on"); t.innerHTML = x.dataset.tip; t.classList.add("on"); });
  document.addEventListener("pointermove", e => { if (!t.classList.contains("on")) return; t.style.left = Math.min(innerWidth - t.offsetWidth - 8, e.clientX + 14) + "px"; t.style.top = Math.max(8, e.clientY - t.offsetHeight - 12) + "px"; });
  document.addEventListener("scroll", () => t.classList.remove("on"), true); })();

/* ================================================================ mulai */
(async () => {
  try { await muatData(); } catch (e) { $("#muat").innerHTML = `<div><b>Data belum tersedia.</b><br>${esc(e.message)}</div>`; return; }
  renderHari(); await Peta.init(); renderLegenda();
  $("#muat").classList.add("hilang");
  const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) bukaTab(h, false);
})();
/* panel kiri & kanan bisa ditarik untuk dilebarkan; lebar diingat per perangkat */
(() => { const atur = (el, kunci, sisi, min, max) => { if (!el) return; const w0 = bacaLokal(kunci, null); if (w0 && innerWidth > 900) el.style.width = w0 + "px";
  const h = document.createElement("div"); h.className = "tarik"; h.title = "Tarik untuk mengubah lebar"; h.setAttribute("role", "separator"); h.setAttribute("aria-orientation", "vertical"); el.appendChild(h);
  h.addEventListener("pointerdown", e => { e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add("aktif"); const x0 = e.clientX, w = el.getBoundingClientRect().width;
    const gerak = ev => { const lebar = Math.max(min, Math.min(max, w + (sisi === "kanan" ? ev.clientX - x0 : x0 - ev.clientX))); el.style.width = lebar + "px"; };
    const lepas = () => { h.classList.remove("aktif"); h.removeEventListener("pointermove", gerak); h.removeEventListener("pointerup", lepas); simpanLokal(kunci, Math.round(el.getBoundingClientRect().width)); if (typeof peta !== "undefined" && peta) peta.resize(); };
    h.addEventListener("pointermove", gerak); h.addEventListener("pointerup", lepas); });
  h.addEventListener("dblclick", () => { el.style.width = ""; simpanLokal(kunci, null); }); };
  atur(document.querySelector(".panel"), "lebar-panel", "kanan", 320, Math.min(900, innerWidth * .6));
  atur(document.querySelector(".tools"), "lebar-tools", "kiri", 220, 520); })();
document.addEventListener("click", e => { const d = document.querySelector(".bencana"); if (d && d.open && !e.target.closest(".bencana")) d.open = false; });
</script>
</body>
</html>
