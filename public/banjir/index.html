"use strict";
/* ================================================================ util ($, fmt, esc, escUrl, WIB, jamWIB, rb ada di inti/format.js) */
const tglPendek = t => new Date(t + "T12:00:00+07:00").toLocaleDateString("id-ID", {weekday: "short", day: "numeric", month: "short"});
const nanti = fn => { let ok = false; const go = () => { if (!ok) { ok = true; fn(); } }; requestAnimationFrame(() => requestAnimationFrame(go)); setTimeout(go, 120); };
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); };
const simpanLokal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const bacaLokal = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
async function muatJSON(u) { const r = await fetch(u, {cache: "no-cache"}); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
function gradasi(st, v) { for (let k = 1; k < st.length; k++) if (v <= st[k][0]) { const [a, ca] = st[k - 1], [b, cb] = st[k], t = (v - a) / (b - a);
    return ca.map((c, j) => Math.round(c + (cb[j] - c) * t)); } return st[st.length - 1][1]; }

/* ================================================================ istilah */
/* Tingkat peringatan mengikuti istilah BNPB/BPBD: Normal, Waspada, Siaga, Awas */
const LEVEL = ["Normal", "Waspada", "Siaga", "Awas"], WARNA_LV = ["#5a9e74", "#e3b94e", "#e58a45", "#c9503a"];
const NAMA_B = {b: "banjir", l: "longsor"};
/* hujan harian (mm): skala BMKG ringan < 20, sedang 20-50, lebat 50-100, sangat lebat 100-150, ekstrem > 150 */
const ST_HUJAN = [[0, [120, 170, 230, 0]], [1, [150, 205, 240, 90]], [5, [110, 180, 235, 150]], [20, [60, 140, 220, 200]], [50, [40, 80, 200, 225]], [100, [110, 50, 190, 235]], [150, [190, 40, 140, 245]], [250, [120, 20, 60, 250]]];
const kelasHujan = v => v < 20 ? "ringan" : v < 50 ? "sedang" : v < 100 ? "lebat" : v < 150 ? "sangat lebat" : "ekstrem";
const AKSI = {
  b: [["Pantau prakiraan harian dan tinggi muka air", "Bersihkan saluran dan pintu air"],
      ["Siapkan jalur dan titik evakuasi", "Cek pompa, perahu karet, dan logistik dasar", "Sebarkan informasi ke RT/RW di bantaran sungai"],
      ["Aktifkan posko siaga di kecamatan", "Siagakan tim evakuasi dan dapur umum", "Koordinasi buka-tutup pintu air dengan BBWS/BPBD", "Evakuasi dini kelompok rentan di zona genangan langganan"],
      ["Evakuasi warga di bantaran dan dataran banjir", "Tutup akses jalan yang tergenang", "Aktifkan posko komando kabupaten", "Usulkan status tanggap darurat ke kepala daerah bila meluas"]],
  l: [["Pantau retakan tanah dan rembesan di lereng", "Hindari menambah beban di bibir lereng"],
      ["Periksa lereng di atas permukiman dan jalan", "Siapkan jalur evakuasi menjauhi alur sungai"],
      ["Ungsikan sementara rumah di kaki lereng curam saat hujan lebat", "Siagakan alat berat untuk buka akses"],
      ["Evakuasi permukiman di zona longsor", "Tutup ruas jalan rawan", "Siagakan tim SAR"]],
};

/* ================================================================ state */
const S = {meta: null, st: null, hujan: null, sungai: null, bahaya: {}, kejadian: null, geo: {prov: null, kab: {}, kec: {}},
  b: "b", hari: 0, jalur: [], mode: "status"};
const namaProv = k => S.meta?.provinsi?.[k] ?? k;

/* ================================================================ tabs */
const TABS = [["peta", "Peta"], ["insight", "Insight"], ["berita", "Berita"], ["tren", "Tren"], ["dampak", "Dampak"], ["sim", "Simulasi"], ["replay", "Replay"], ["foto", "Foto"], ["tentang", "Tentang"],
  ["posko", "Posko"], ["informasi", "Informasi"], ["metode", "Metode"], ["prakiraan", "Prakiraan"], ["daftar", "Wilayah siaga"], ["provinsi", "Provinsi"], ["rob", "Rob"], ["sungai", "Sungai"], ["keputusan", "Keputusan"], ["sarana", "Sarana"]];
/* id lama -> id baru (tautan lama tetap hidup); sama dengan "alias" di public/bencana.json */
const ALIAS = {simulasi: "sim"};
/* tidak tampil di nav: Posko/Informasi/Metode ada tapi disembunyikan (A24); Berita/Dampak/Foto menunggu isinya (A18);
   Prakiraan, Wilayah siaga, Provinsi, Rob, Sungai bukan tab lagi, isinya pindah ke Insight/Peta (L6/L7), sementara tetap bisa dibuka lewat tautan */
const TAB_SEMBUNYI = new Set(["posko", "informasi", "metode", "prakiraan", "daftar", "provinsi", "rob", "sungai", "keputusan", "sarana", "replay"]);
const IK_TAB = {peta: '<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>', insight: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', tren: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  berita: '<path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7M7 16h4"/>', dampak: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>', sim: '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>', replay: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  foto: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', tentang: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'};
const ID_JADI = id => ALIAS[id] || id;
const halamanAda = id => { const p = $("#p-" + id); return !!p && !p.hidden; };
function bukaTab(id, dorong = true) {
  id = ID_JADI(id);
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.t === id ? "page" : "false"));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + id));
  /* tautan bersih tanpa tagar: /banjir/insight (worker mengarahkan jalur ini ke index.html, routing di peramban) */
  if (dorong) history.replaceState(null, "", "/banjir/" + id);
  nanti(() => { if (id === "peta" && peta) peta.resize(); if (id === "informasi") window.Informasi?.render();
    if (id === "replay") { const f = $("#replayBingkai"); if (!f.src) f.src = "/banjir/replay.html?tertanam=1"; }
    if (id === "tentang") { const f = $("#tentangBingkai"); if (!f.src) { f.style.opacity = 0; f.src = "/tentang.html?tertanam=1"; } }
    const f = {berita: Berita, dampak: Dampak, foto: Foto, insight: Insight, prakiraan: Prakiraan, daftar: Daftar, provinsi: Provinsi, rob: Rob, sungai: Sungai, tren: Tren, keputusan: Keputusan, sim: Simulasi, posko: Posko, sarana: Sarana, metode: Metode}[id]; f && f.render(); });
}
{ const tb = ([k, n]) => `<button data-t="${k}" aria-current="${k === "peta" ? "page" : "false"}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IK_TAB[k] || ""}</svg>${n}</button>`;
  $("#tabs").innerHTML = TABS.filter(t => !TAB_SEMBUNYI.has(t[0])).map(tb).join("");
  const hd = $("header.top"), bg = $("#burger"), atur = v => { hd.classList.toggle("buka", v); bg.setAttribute("aria-expanded", v); };
  bg.onclick = e => { e.stopPropagation(); atur(!hd.classList.contains("buka")); };
  document.addEventListener("click", e => { if (hd.classList.contains("buka") && !e.target.closest("#tabs")) atur(false); });
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; bukaTab(b.dataset.t); atur(false); }); }
const temaAwal = bacaLokal("pb-tema", null); if (temaAwal) document.documentElement.dataset.theme = temaAwal;
const gelap = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
$("#tema").onclick = () => { const t = gelap() ? "light" : "dark"; document.documentElement.dataset.theme = t; simpanLokal("pb-tema", t); nanti(() => peta && peta.setStyle(DASAR(), {diff: false})); };
let LAMBANG = {}; muatJSON("../lambang/kabkota.json").then(d => LAMBANG = d).catch(() => {});
const lambang = (prov, kab) => { const f = kab ? LAMBANG[prov + "|" + kab] && `../lambang/kabkota/${LAMBANG[prov + "|" + kab]}.png` : prov && `../lambang/provinsi/${prov}.png`;
  return f ? `<img class="lambang" src="${f}" alt="" loading="lazy" onerror="this.remove()">` : ""; };

/* ================================================================ data */
async function muatData() {
  const [meta, st, hujan, sungai, prov] = await Promise.all([muatJSON("data/meta.json"), muatJSON("data/status.json"), muatJSON("data/hujan.json"),
    muatJSON("data/sungai.json").catch(() => ({hari: [], titik: []})), muatJSON("../geo/provinsi.json")]);
  Object.assign(S, {meta, st, hujan, sungai}); S.geo.prov = prov;
  S.rob = await muatJSON("data/rob.json").catch(() => null);
  muatJSON("data/bahaya.json").then(d => S.bahaya = d.kec || {}).catch(() => {});
  muatJSON("data/kejadian.json").then(d => S.kejadian = d).catch(() => {});
  /* sel hujan: indeks cepat lat,lon -> sel */
  S.selHujan = new Map(hujan.grid.map(g => [g.lat.toFixed(2) + "," + g.lon.toFixed(2), g]));
  S.hari = 0;
  $("#upd").textContent = "Data " + jamWIB(meta.dibuat);
  const umur = (Date.now() - new Date(meta.dibuat)) / 36e5;
  if (umur > 30) { $("#basi").hidden = false; $("#basi").textContent = `Prakiraan terakhir diperbarui ${Math.round(umur)} jam lalu (${jamWIB(meta.dibuat)}).`; }
}
/* level kecamatan untuk bahaya & hari aktif; agregat ke kab/prov = level tertinggi, plus hitungan per level */
const lvKec = (k, b = S.b, h = S.hari) => S.st.kec[k]?.[b]?.[h] || 0;
function agregat(b = S.b, h = S.hari) {
  const o = {};
  for (const [k, v] of Object.entries(S.st.kec)) { const l = v[b]?.[h] || 0; if (!l) continue; const [p, kb] = k.split("|");
    for (const key of [p, p + "|" + kb, k]) { const a = o[key] ||= {lv: 0, n: [0, 0, 0, 0]}; a.lv = Math.max(a.lv, l); a.n[l]++; } }
  return o; }
const selDekat = (lat, lon) => { const s = S.hujan.sel, a = Math.round((lat - s / 2) / s) * s + s / 2, o = Math.round((lon - s / 2) / s) * s + s / 2;
  return S.selHujan.get(a.toFixed(2) + "," + o.toFixed(2)) || null; };
