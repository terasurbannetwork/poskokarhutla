<body>
<div id="tip" role="tooltip"></div>
<dialog class="dlg" id="dlg" aria-labelledby="dlgJudul"></dialog>
<header class="top">
  <div class="mark">
    <button class="iconbtn" id="burger" aria-label="Buka menu" aria-expanded="false" aria-controls="tabs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="logo" href="../" title="Pantau Bencana"><img src="../img/logo.svg?v=2" alt="Pantau Bencana" width="30" height="30"></a><details class="bencana" data-bencana="cuaca" data-tentang data-tanpa-segera><summary><svg class="bc-ik" viewBox="0 0 24 24" aria-hidden="true"><path fill="#7d8ca3" d="M7 18a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z"/><path fill="#e3b94e" d="m12 13-2 5h2.5l-1 4 4-6h-2.5l1.5-3z"/></svg>Cuaca Ekstrem</summary><div class="menu"></div></details>
  </div>
  <nav class="tabs" id="tabs" aria-label="Menu utama"></nav>
  <div class="stat">
    <span class="upd" id="upd">Memuat data…</span>
    <a class="iconbtn" href="/cuaca/simulasi.html" aria-label="Simulasi cuaca" title="Simulasi cuaca"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></a>
    <a class="iconbtn" href="/cuaca/laporan.html" aria-label="Laporan harian" title="Laporan harian"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg></a>
    <a class="iconbtn" href="/peringatan" aria-label="Peringatan Dini" title="Peringatan Dini"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></a>
    <button class="iconbtn" id="tema" aria-label="Ganti tema terang/gelap" title="Ganti tema">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="page on" id="p-peta" aria-label="Peta pemantauan">
    <div id="peta"></div>
    <div class="pil-sik" id="pilSiklon"></div>
    <div class="muat" id="muat"><div><div class="spin"></div>Memuat peringatan dan prakiraan cuaca…</div></div>
    <div class="panel" id="panel">
      <nav class="crumb" id="crumb" aria-label="Tingkat wilayah"></nav>
      <div class="card list">
        <button class="handle" id="handle" aria-label="Perbesar atau perkecil panel"></button>
        <div class="top">
          <div class="seg penuh" role="group" aria-label="Mode peta" id="modePeta" style="box-shadow:none;margin-bottom:8px"><button data-mp="hujan" aria-pressed="true">Hujan</button><button data-mp="angin" aria-pressed="false">Angin</button><button data-mp="ens" aria-pressed="false">Ansambel</button></div>
          <div class="seg penuh" role="group" aria-label="Isi panel" id="panelMode" style="box-shadow:none;margin-bottom:8px"></div>
          <div class="cari">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="cari" type="search" placeholder="Cari provinsi atau kecamatan" autocomplete="off" aria-label="Cari peringatan">
          </div>
        </div>
        <div class="rows" id="rows" role="list"></div>
      </div>
    </div>
    <div class="tools" id="tools">
      <div class="card garis-waktu on" id="garisWaktu" aria-label="Hari prakiraan"><span class="lbl" style="white-space:nowrap">Prakiraan cuaca (hari)</span><div id="hariSeg" style="flex:1"></div></div>
      <button class="iconbtn" id="lapisBtn" style="background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:grid" aria-label="Overlay peta" title="Lapisan peta">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <div class="box lapis" id="lapis">
        <div class="lapis-hd"><span>Overlay</span><button type="button" id="lapisLipat" aria-label="Tutup semua grup" title="Tutup semua grup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 5-5 5 5M7 18l5-5 5 5"/></svg></button></div>
        <details open><summary>Peringatan resmi</summary>
          <label><input type="checkbox" data-l="bmkg" checked> Nowcast BMKG</label>
          <label><input type="checkbox" data-l="gelombang" checked> Gelombang tinggi</label>
          <label><input type="checkbox" data-l="satelit" checked> Citra satelit</label>
        </details>
      </div>
    </div>
    <div class="dok" id="dok">
      <div class="box" id="legenda"></div>
    </div>
    <aside class="card laci" id="laci" aria-label="Rincian peringatan"></aside>
  </section>

  <section class="page scroll" id="p-insight" aria-label="Insight cuaca ekstrem"><div class="wrap" id="insight"></div></section>
  <section class="page scroll" id="p-berita" aria-label="Berita cuaca ekstrem"><div class="wrap" id="berita"></div></section>
  <section class="page scroll" id="p-tren" aria-label="Tren cuaca ekstrem"><div class="wrap" id="tren"></div></section>
  <section class="page scroll" id="p-dampak" aria-label="Dampak cuaca ekstrem"><div class="wrap" id="dampak"></div></section>
  <section class="page scroll" id="p-foto" aria-label="Foto warga"><div id="foto"></div></section>
  <section class="page scroll" id="p-metode" aria-label="Metode dan data"><div class="wrap" id="metode"></div></section>
  <section class="page" id="p-tentang" aria-label="Tentang Pantau Bencana"><iframe id="tentangBingkai" title="Tentang Pantau Bencana" style="width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .5s cubic-bezier(.16,1,.3,1)" onload="this.style.opacity=1" loading="lazy"></iframe></section>
