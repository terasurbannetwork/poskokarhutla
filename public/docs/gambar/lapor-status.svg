<svg viewBox="0 0 720 292"><defs><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" class="dg-garis dg-lemah"/></marker></defs><text x="360" y="24" text-anchor="middle" class="dg-teks" font-size="15">Peralihan status tiket yang sah</text><rect x="20" y="44" width="130" height="44" rx="8" class="dg-kotak"/><text x="85.0" y="71.0" text-anchor="middle" class="dg-teks" font-size="14" font-weight="600">baru</text><rect x="200" y="44" width="130" height="44" rx="8" class="dg-kotak"/><text x="265.0" y="71.0" text-anchor="middle" class="dg-teks" font-size="14" font-weight="600">dilihat</text><rect x="380" y="44" width="130" height="44" rx="8" class="dg-kotak"/><text x="445.0" y="71.0" text-anchor="middle" class="dg-teks" font-size="14" font-weight="600">ditelaah</text><rect x="560" y="44" width="130" height="44" rx="8" class="dg-kotak"/><text x="625.0" y="71.0" text-anchor="middle" class="dg-teks" font-size="14" font-weight="600">diteruskan</text><line x1="152" y1="66" x2="198" y2="66" class="dg-garis" stroke-width="2" marker-end="url(#p)"/><line x1="332" y1="66" x2="378" y2="66" class="dg-garis" stroke-width="2" marker-end="url(#p)"/><line x1="512" y1="66" x2="558" y2="66" class="dg-garis" stroke-width="2" marker-end="url(#p)"/><rect x="380" y="150" width="170" height="44" rx="8" class="dg-kotak-aksen"/><text x="465.0" y="177.0" text-anchor="middle" class="dg-teks" font-size="14" font-weight="600">ditindaklanjuti</text><rect x="590" y="150" width="100" height="44" rx="8" class="dg-ok"/><text x="640.0" y="177.0" text-anchor="middle" class="dg-teks" font-size="14" font-weight="600">selesai</text><rect x="20" y="150" width="130" height="44" rx="8" class="dg-bahaya"/><text x="85.0" y="177.0" text-anchor="middle" class="dg-teks" font-size="14" font-weight="600">tidak_valid</text><line x1="450" y1="90" x2="450" y2="148" class="dg-garis" stroke-width="2" marker-end="url(#p)"/><line x1="610" y1="90" x2="530" y2="148" class="dg-garis" stroke-width="2" marker-end="url(#p)"/><line x1="552" y1="172" x2="588" y2="172" class="dg-garis" stroke-width="2" marker-end="url(#p)"/><text x="360" y="232" text-anchor="middle" class="dg-teks" font-size="13">Dari dilihat, ditelaah, diteruskan, dan ditindaklanjuti, tiket dapat dialihkan ke tidak_valid</text><text x="360" y="254" text-anchor="middle" class="dg-teks" font-size="13">Selesai dan tidak_valid dapat dibuka kembali ke ditelaah, wajib dengan catatan</text><text x="360" y="276" text-anchor="middle" class="dg-teks-lemah" font-size="12">Tahap dilihat tertulis otomatis saat petugas membuka laporan baru</text></svg>
