<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390"><defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-garis" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="dg-kotak" x="10" y="15" width="410" height="56" rx="8"/><text class="dg-teks" font-size="14" x="215.0" y="39" text-anchor="middle">1. Ada bukti pulih, dan tidak ada bukti masih</text><text class="dg-teks" font-size="14" x="215.0" y="57" text-anchor="middle">yang lebih baru</text><rect class="dg-ok" x="480" y="15" width="230" height="56" rx="8"/><text class="dg-teks" font-size="14" x="595.0" y="39" text-anchor="middle">Kemungkinan selesai</text><text class="dg-teks-lemah" font-size="13" x="595.0" y="57" text-anchor="middle">dasar berita</text><line class="dg-garis" x1="420" y1="43" x2="478" y2="43" stroke-width="2" marker-end="url(#m2)"/><text class="dg-teks-lemah" font-size="13" x="449" y="35" text-anchor="middle">ya</text><line class="dg-garis" x1="215" y1="71" x2="215" y2="99" stroke-width="2" marker-end="url(#m2)"/><text class="dg-teks-lemah" font-size="13" x="225" y="91" text-anchor="start">tidak</text><rect class="dg-kotak" x="10" y="99" width="410" height="56" rx="8"/><text class="dg-teks" font-size="14" x="215.0" y="123" text-anchor="middle">2. Selain itu, ada bukti masih</text><text class="dg-teks" font-size="14" x="215.0" y="141" text-anchor="middle">(korban, penanganan, masih terendam)</text><rect class="dg-waspada" x="480" y="99" width="230" height="56" rx="8"/><text class="dg-teks" font-size="14" x="595.0" y="123" text-anchor="middle">Masih</text><text class="dg-teks-lemah" font-size="13" x="595.0" y="141" text-anchor="middle">dasar berita</text><line class="dg-garis" x1="420" y1="127" x2="478" y2="127" stroke-width="2" marker-end="url(#m2)"/><text class="dg-teks-lemah" font-size="13" x="449" y="119" text-anchor="middle">ya</text><line class="dg-garis" x1="215" y1="155" x2="215" y2="183" stroke-width="2" marker-end="url(#m2)"/><text class="dg-teks-lemah" font-size="13" x="225" y="175" text-anchor="start">tidak</text><rect class="dg-kotak" x="10" y="183" width="410" height="56" rx="8"/><text class="dg-teks" font-size="14" x="215.0" y="207" text-anchor="middle">3. Selain itu, hari senyap sudah mencapai</text><text class="dg-teks" font-size="14" x="215.0" y="225" text-anchor="middle">ambang jenis dan sinyal alam normal</text><rect class="dg-ok" x="480" y="183" width="230" height="56" rx="8"/><text class="dg-teks" font-size="14" x="595.0" y="207" text-anchor="middle">Kemungkinan selesai</text><text class="dg-teks-lemah" font-size="13" x="595.0" y="225" text-anchor="middle">dasar sinyal alam</text><line class="dg-garis" x1="420" y1="211" x2="478" y2="211" stroke-width="2" marker-end="url(#m2)"/><text class="dg-teks-lemah" font-size="13" x="449" y="203" text-anchor="middle">ya</text><line class="dg-garis" x1="215" y1="239" x2="215" y2="267" stroke-width="2" marker-end="url(#m2)"/><text class="dg-teks-lemah" font-size="13" x="225" y="259" text-anchor="start">tidak</text><rect class="dg-kotak" x="10" y="267" width="410" height="56" rx="8"/><text class="dg-teks" font-size="14" x="215.0" y="300" text-anchor="middle">4. Selain itu</text><rect class="dg-lemah" x="480" y="267" width="230" height="56" rx="8"/><text class="dg-teks" font-size="14" x="595.0" y="291" text-anchor="middle">Belum ada kabar luar</text><text class="dg-teks-lemah" font-size="13" x="595.0" y="309" text-anchor="middle">bukan berarti selesai</text><line class="dg-garis" x1="420" y1="295" x2="478" y2="295" stroke-width="2" marker-end="url(#m2)"/><text class="dg-teks-lemah" font-size="13" x="449" y="287" text-anchor="middle"></text><text class="dg-teks-lemah" font-size="12" x="360" y="372" text-anchor="middle">Ambang hari senyap: banjir 3, longsor 7, karhutla 3, kekeringan 14 (hipotesis awal). Label tidak pernah menutup kejadian.</text></svg>