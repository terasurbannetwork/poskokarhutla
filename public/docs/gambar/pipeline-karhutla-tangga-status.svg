<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <rect class="dg-ok" x="10" y="130" width="165" height="120" rx="6"/>
  <text class="dg-teks" x="22" y="154" font-size="14" font-weight="600">0 Pencegahan</text>
  <text class="dg-teks" x="22" y="171" font-size="14" font-weight="600">rutin</text>
  <text class="dg-teks-lemah" x="22" y="196" font-size="13">FWI kelas 0 sampai 1</text>
  <text class="dg-teks-lemah" x="22" y="213" font-size="13">dan keparahan S1</text>

  <rect class="dg-aksen" x="187" y="100" width="165" height="150" rx="6"/>
  <text class="dg-teks" x="199" y="124" font-size="14" font-weight="600">1 Patroli terpadu</text>
  <text class="dg-teks-lemah" x="199" y="150" font-size="13">S1 atau S2, tanpa</text>
  <text class="dg-teks-lemah" x="199" y="167" font-size="13">data cuaca</text>
  <text class="dg-teks-lemah" x="199" y="187" font-size="13">S2 dengan FWI 0-1</text>
  <text class="dg-teks-lemah" x="199" y="207" font-size="13">firespot mungkin:</text>
  <text class="dg-teks-lemah" x="199" y="224" font-size="13">paling tinggi di sini</text>

  <rect class="dg-waspada" x="364" y="70" width="165" height="180" rx="6"/>
  <text class="dg-teks" x="376" y="94" font-size="14" font-weight="600">2 Siaga pemadaman</text>
  <text class="dg-teks" x="376" y="111" font-size="14" font-weight="600">awal</text>
  <text class="dg-teks-lemah" x="376" y="138" font-size="13">keparahan S3</text>
  <text class="dg-teks-lemah" x="376" y="162" font-size="13">S2 dengan FWI</text>
  <text class="dg-teks-lemah" x="376" y="179" font-size="13">kelas 2 atau 3</text>

  <rect class="dg-bahaya" x="541" y="40" width="169" height="210" rx="6"/>
  <text class="dg-teks" x="553" y="64" font-size="14" font-weight="600">3 Prioritas</text>
  <text class="dg-teks" x="553" y="81" font-size="14" font-weight="600">pemadaman</text>
  <text class="dg-teks-lemah" x="553" y="108" font-size="13">px24 sama dengan</text>
  <text class="dg-teks-lemah" x="553" y="125" font-size="13">atau di atas 15,</text>
  <text class="dg-teks-lemah" x="553" y="142" font-size="13">dan FWI 7 atau lebih</text>
  <text class="dg-teks-lemah" x="553" y="159" font-size="13">(atau data FWI tak ada)</text>

  <line class="dg-garis" x1="10" y1="250" x2="710" y2="250"/>
  <text class="dg-teks-lemah" x="10" y="275" font-size="13">Cuaca hanya boleh menaikkan status. Tanggap darurat adalah status hukum, bukan keluaran model.</text>
  <text class="dg-teks-lemah" x="10" y="293" font-size="13">px24 = jumlah piksel unik di garis depan api 24 jam terakhir. S1, S2, S3 = tingkat keparahan.</text>
</svg>
