<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330"><text x="10" y="24" font-size="15" class="dg-teks">Kelayakan terbang base dari METAR terdekat (perkiraan, bukan keputusan terbang)</text><rect x="10" y="42" width="170" height="58" rx="8" class="dg-bahaya"/><text x="95" y="77" font-size="15" text-anchor="middle" class="dg-teks">Tidak layak</text><rect x="190" y="42" width="520" height="58" rx="8" class="dg-kotak"/><text x="202" y="66" font-size="14" class="dg-teks">Jarak pandang kurang dari 1.500 m, atau badai guntur (TS),</text><text x="202" y="86" font-size="14" class="dg-teks">atau angin atau embusan lebih dari 30 knot</text><rect x="10" y="112" width="170" height="58" rx="8" class="dg-waspada"/><text x="95" y="147" font-size="15" text-anchor="middle" class="dg-teks">Terbatas</text><rect x="190" y="112" width="520" height="58" rx="8" class="dg-kotak"/><text x="202" y="136" font-size="14" class="dg-teks">Jarak pandang kurang dari 5.000 m, atau asap atau kabut asap (FU, HZ),</text><text x="202" y="156" font-size="14" class="dg-teks">atau angin atau embusan lebih dari 20 knot</text><rect x="10" y="182" width="170" height="58" rx="8" class="dg-ok"/><text x="95" y="217" font-size="15" text-anchor="middle" class="dg-teks">Layak</text><rect x="190" y="182" width="520" height="58" rx="8" class="dg-kotak"/><text x="202" y="206" font-size="14" class="dg-teks">Selain dua baris di atas, dengan METAR terdekat yang masih baru</text><text x="202" y="226" font-size="14" class="dg-teks">(stasiun dalam 60 km, umur 3 jam atau kurang)</text><rect x="10" y="252" width="170" height="58" rx="8" class="dg-lemah"/><text x="95" y="287" font-size="15" text-anchor="middle" class="dg-teks">Tanpa METAR / basi</text><rect x="190" y="252" width="520" height="58" rx="8" class="dg-kotak"/><text x="202" y="276" font-size="14" class="dg-teks">Tidak ada stasiun dalam 60 km, atau laporan lebih dari 3 jam:</text><text x="202" y="296" font-size="14" class="dg-teks">ditulis tanda tanya, tidak pernah dianggap layak</text><text x="10" y="326" font-size="13" class="dg-teks-lemah">Dinilai dari atas ke bawah. Ambang rancangan agent, belum diuji balik.</text></svg>