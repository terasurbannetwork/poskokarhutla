<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230">
<defs><marker id="pb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" class="dg-garis"/></marker></defs>
<rect x="5" y="20" width="150" height="120" rx="8" class="dg-kotak"/>
<text x="80" y="46" text-anchor="middle" font-size="15" font-weight="700" class="dg-teks">1. Titik</text>
<text x="80" y="70" text-anchor="middle" font-size="13" class="dg-teks-lemah">deteksi mentah</text>
<text x="80" y="90" text-anchor="middle" font-size="13" class="dg-teks-lemah">satu per lintasan</text>
<text x="80" y="110" text-anchor="middle" font-size="13" class="dg-teks-lemah">tiap satelit</text>
<rect x="190" y="20" width="150" height="120" rx="8" class="dg-kotak"/>
<text x="265" y="46" text-anchor="middle" font-size="15" font-weight="700" class="dg-teks">2. Lokasi unik</text>
<text x="265" y="70" text-anchor="middle" font-size="13" class="dg-teks-lemah">satu sel 375 m</text>
<text x="265" y="90" text-anchor="middle" font-size="13" class="dg-teks-lemah">dihitung sekali</text>
<text x="265" y="110" text-anchor="middle" font-size="13" class="dg-teks-lemah">per hari WIB</text>
<rect x="375" y="20" width="150" height="120" rx="8" class="dg-kotak-aksen"/>
<text x="450" y="46" text-anchor="middle" font-size="15" font-weight="700" class="dg-teks">3. Cluster</text>
<text x="450" y="70" text-anchor="middle" font-size="13" class="dg-teks-lemah">jarak 0,6 sampai</text>
<text x="450" y="90" text-anchor="middle" font-size="13" class="dg-teks-lemah">1,5 km, selisih</text>
<text x="450" y="110" text-anchor="middle" font-size="13" class="dg-teks-lemah">waktu 48 jam</text>
<rect x="560" y="20" width="150" height="120" rx="8" class="dg-kotak-aksen"/>
<text x="635" y="46" text-anchor="middle" font-size="15" font-weight="700" class="dg-teks">4. Insiden</text>
<text x="635" y="70" text-anchor="middle" font-size="13" class="dg-teks-lemah">ID stabil, tingkat</text>
<text x="635" y="90" text-anchor="middle" font-size="13" class="dg-teks-lemah">2 ke atas, jarak</text>
<text x="635" y="110" text-anchor="middle" font-size="13" class="dg-teks-lemah">sambung 0,6 km</text>
<line x1="155" y1="80" x2="188" y2="80" class="dg-garis" marker-end="url(#pb)"/>
<line x1="340" y1="80" x2="373" y2="80" class="dg-garis" marker-end="url(#pb)"/>
<line x1="525" y1="80" x2="558" y2="80" class="dg-garis" marker-end="url(#pb)"/>
<rect x="150" y="162" width="230" height="52" rx="8" class="dg-waspada"/>
<text x="265" y="184" text-anchor="middle" font-size="13" class="dg-teks">Sumber panas tetap (smelter,</text>
<text x="265" y="202" text-anchor="middle" font-size="13" class="dg-teks">tambang, kilang) dibuang dulu</text>
<line x1="265" y1="162" x2="265" y2="143" class="dg-garis" marker-end="url(#pb)"/>
<text x="635" y="174" text-anchor="middle" font-size="13" class="dg-teks-lemah">Tak terdeteksi</text>
<text x="635" y="192" text-anchor="middle" font-size="13" class="dg-teks-lemah">belum berarti padam</text>
</svg>
