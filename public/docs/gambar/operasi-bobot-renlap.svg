<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340"><text x="10" y="22" font-size="15" class="dg-teks">Sumbangan maksimum tiap komponen ke skor sel renlap (HIPOTESIS)</text><line x1="290" y1="36" x2="290" y2="296" class="dg-grid"/><text x="290" y="314" font-size="13" text-anchor="middle" class="dg-teks-lemah">0</text><line x1="362" y1="36" x2="362" y2="296" class="dg-grid"/><text x="362" y="314" font-size="13" text-anchor="middle" class="dg-teks-lemah">2</text><line x1="434" y1="36" x2="434" y2="296" class="dg-grid"/><text x="434" y="314" font-size="13" text-anchor="middle" class="dg-teks-lemah">4</text><line x1="506" y1="36" x2="506" y2="296" class="dg-grid"/><text x="506" y="314" font-size="13" text-anchor="middle" class="dg-teks-lemah">6</text><line x1="578" y1="36" x2="578" y2="296" class="dg-grid"/><text x="578" y="314" font-size="13" text-anchor="middle" class="dg-teks-lemah">8</text><line x1="650" y1="36" x2="650" y2="296" class="dg-grid"/><text x="650" y="314" font-size="13" text-anchor="middle" class="dg-teks-lemah">10</text><text x="280" y="63" font-size="13" text-anchor="end" class="dg-teks">Titik baru (6 jam), maks 5 titik</text><rect x="290" y="47" width="360" height="24" rx="4" class="dg-aksen"/><text x="658" y="64" font-size="13" class="dg-teks">10,0</text><text x="280" y="99" font-size="13" text-anchor="end" class="dg-teks">Hari berturut berapi, maks 6 hari</text><rect x="290" y="83" width="324" height="24" rx="4" class="dg-aksen"/><text x="622" y="100" font-size="13" class="dg-teks">9,0</text><text x="280" y="135" font-size="13" text-anchor="end" class="dg-teks">Di atas gambut</text><rect x="290" y="119" width="108" height="24" rx="4" class="dg-aksen"/><text x="406" y="136" font-size="13" class="dg-teks">3,0</text><text x="280" y="171" font-size="13" text-anchor="end" class="dg-teks">Kekeringan bahan bakar (FFMC)</text><rect x="290" y="155" width="72" height="24" rx="4" class="dg-aksen"/><text x="370" y="172" font-size="13" class="dg-teks">2,0</text><text x="280" y="207" font-size="13" text-anchor="end" class="dg-teks">Permukiman dalam 2 km</text><rect x="290" y="191" width="72" height="24" rx="4" class="dg-aksen"/><text x="370" y="208" font-size="13" class="dg-teks">2,0</text><text x="280" y="243" font-size="13" text-anchor="end" class="dg-teks">Belum ditangani pilot</text><rect x="290" y="227" width="54" height="24" rx="4" class="dg-aksen"/><text x="352" y="244" font-size="13" class="dg-teks">1,5</text><text x="280" y="279" font-size="13" text-anchor="end" class="dg-teks">Clear lama, muncul titik baru</text><rect x="290" y="263" width="72" height="24" rx="4" class="dg-bahaya"/><text x="370" y="280" font-size="13" class="dg-teks">-2,0</text><text x="10" y="334" font-size="13" class="dg-teks-lemah">Bobot dari bobot_renlap.json; sel masuk bila skor 0,1 atau lebih. Belum diuji balik.</text></svg>