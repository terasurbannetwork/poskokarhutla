<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170">
<title id="t4">Pembagian tahun latih, validasi, dan uji</title>
<g font-size="14">
<text class="dg-teks" x="20" y="26" font-size="15">Pembagian waktu data model sebaran</text>
<rect class="dg-aksen" x="20" y="45" width="400" height="50"/><text class="dg-teks" x="220" y="68" text-anchor="middle">Latih 2015 sampai 2022</text><text class="dg-teks-lemah" x="220" y="86" text-anchor="middle" font-size="12">model belajar di sini</text>
<rect class="dg-waspada" x="420" y="45" width="100" height="50"/><text class="dg-teks" x="470" y="68" text-anchor="middle">Validasi</text><text class="dg-teks-lemah" x="470" y="86" text-anchor="middle" font-size="12">2023</text>
<rect class="dg-bahaya" x="520" y="45" width="180" height="50"/><text class="dg-teks" x="610" y="68" text-anchor="middle">Uji 2024 sampai 2026</text><text class="dg-teks-lemah" x="610" y="86" text-anchor="middle" font-size="12">dibuka sekali</text>
</g>
<text class="dg-teks-lemah" x="20" y="125" font-size="13">Semua penyetelan memakai validasi 2023; uji dibuka sekali di langkah 6.</text>
<text class="dg-teks-lemah" x="20" y="146" font-size="12">Sumber: latih.py:36 (fungsi bagian) dan latih_jalan.py:412.</text>
</svg>
