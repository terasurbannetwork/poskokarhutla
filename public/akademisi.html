      <div id="akCariPanel" class="ak-cr" hidden></div></div>
    <div id="akAngka" class="ak-ringkas" aria-label="Ringkasan direktori"></div>
  </div>
  <div class="ak-kepala-nav">
  <nav id="akTampil" class="ak-seg ak-tampil" role="group" aria-label="Tampilan direktori" hidden></nav>

  <p id="akBuka" class="ak-buka" hidden></p>
  <section id="akMasuk" class="ak-panel ak-kosong" hidden>
    <h2>Masuk untuk membuka direktori</h2>
    <p>Direktori ini hanya untuk staf BNPB dan admin karena memuat data pribadi akademisi.</p>
    <a class="ak-tbl" href="/masuk?ke=%2Fdirektori#sandi">Masuk sebagai staf BNPB</a>
  </section>
  <p id="akGalat" class="ak-panel" hidden></p>

  <section id="akIsi" hidden>

    <div class="ak-baris ak-baris3">
      <div class="ak-kampus-pilih ak-prov-pilih" id="akVBox" hidden>

          <svg class="ak-panah" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div id="akVPop" class="ak-kpop" hidden>
          <label class="ak-kcari"><span class="sr">Cari provinsi</span><input id="akVQ" type="search" autocomplete="off" placeholder="Cari provinsi"></label>
          <div id="akVDaftar" class="ak-kdaftar" role="listbox" aria-multiselectable="true" aria-label="Provinsi"></div>
        </div>
      </div>
      <div class="ak-kampus-pilih">
        <button id="akKBtn" class="ak-kbtn" type="button" aria-haspopup="listbox" aria-expanded="false"><svg class="ak-ikon ak-kik" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5"/></svg><span id="akKIsi"><em>Semua kampus dan lembaga</em></span>

          <div id="akKDaftar" class="ak-kdaftar" role="listbox" aria-multiselectable="true" aria-label="Kampus"></div>
        </div>
      </div>
      <div class="ak-kampus-pilih ak-prodi-pilih">
        <button id="akPBtn" class="ak-kbtn" type="button" aria-haspopup="listbox" aria-expanded="false"><svg class="ak-ikon ak-kik" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg><span id="akPIsi"><em>Semua program studi</em></span>
          <svg class="ak-panah" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>

        </div>
      </div>
      <div id="akBdSlot"></div>
    </div>
    <div class="ak-baris">
      <div class="ak-seg" id="akS" role="group" aria-label="Sumber">
        <button type="button" data-v="" aria-pressed="true"><svg class="ak-ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c3 0 5.5 2 5.5 5"/></svg>Semua</button><button type="button" data-v="bukanx" aria-pressed="false"><svg class="ak-ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 5l9 5-9 5z"/><path d="M7 12v4c2 2 8 2 10 0v-4"/></svg>Dosen Indonesia</button><button type="button" data-v="s" aria-pressed="false"><svg class="ak-ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.5 2 3.2-.3.8 3.1 2.7 1.8-1.3 3 1.3 3-2.7 1.8-.8 3.1-3.2-.3L12 21l-2.5-2-3.2.3-.8-3.1L2.8 14.4l1.3-3-1.3-3 2.7-1.8.8-3.1 3.2.3z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>SINTA</button><button type="button" data-v="d" aria-pressed="false"><svg class="ak-ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Diaspora</button>

      <nav id="akHal" class="ak-hal" aria-label="Halaman daftar pakar" aria-live="polite"></nav>

  <section id="akv-lembaga" class="ak-tampilan" hidden></section>

  <div class="ak-dpaksi">
    <button type="button" class="ak-dpb" data-dpa="lihat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Lihat</button>
    <button type="button" class="ak-dpb" data-dpa="kosong"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Kosongkan</button>
    <button type="button" class="ak-dpb utama" data-dpa="unduh" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>Unduh</button>

    <button type="button" role="menuitem" data-dpf="docx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>Word</button>
    <button type="button" role="menuitem" data-dpf="pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 17v-4h1.5a1.2 1.2 0 0 1 0 2.4H9"/></svg>PDF</button>
