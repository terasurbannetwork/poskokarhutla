<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uji model sebaran</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link href="cerita_karhutla.css" rel="stylesheet">
<style>:root{--paper:#f6f7fb;--card:#fff;--surface:#eef1f6;--ink:#1d2a44;--ink2:#5b6782;--line:#e3e7ef;--brand:#1d2a5c;--brand2:#3f5fa0;--bad:#c9503a;--ok:#5a9e74}
body{margin:0;background:var(--paper);font-family:system-ui,sans-serif;padding:16px}#hasil{font:12px monospace;white-space:pre-wrap;background:#fff;padding:10px;border-radius:8px}</style>
</head><body>
<pre id="hasil">menguji…</pre>
<div id="cerita"></div>
<script src="sebaran_model.js"></script>
<script src="cerita_karhutla.js"></script>
<script>
(async () => {
  const out = document.getElementById("hasil"), log = s => out.textContent += "\n" + s;
  try {
    const M = await SebaranModel.muat();
    log(`model: ${M.pohon.length} pohon, ${M.fitur.length} fitur, tau ${M.tau}`);
    const ok = (c, m) => { if (!c) throw new Error("GAGAL: " + m); log("ok  " + m); };
    let tolak = false; try { SebaranModel.ramal({model: M, lat: 30, lon: 113, waktu: Date.now(), cuaca: {ws: []}}); } catch (e) { tolak = true; } ok(tolak, "menolak lintang 30");
    tolak = false; try { SebaranModel.ramal({model: M, lat: -2, lon: 113, waktu: "x", cuaca: {ws: []}}); } catch (e) { tolak = true; } ok(tolak, "menolak waktu rusak");
    const lat = -2.85, lon = 113.95, waktu = Date.now() - 2 * 864e5;
    const [cuaca, ...L] = await Promise.all([SebaranModel.cuacaTanggal(lat, lon, waktu), ...["lahan/gambut.geojson", "lahan/kawasan.geojson", "lahan/konsesi.geojson", "kanal.json", "jalan.geojson", "osm/desa.json", "riwayat_grid.json", "penduduk.json"].map(u => fetch("data/" + u).then(r => r.json()))]);
    const [gambut, kawasan, konsesi, kanal, jalan, desa, riwayat, penduduk] = L;
    const t0 = performance.now();
    const r = SebaranModel.ramal({model: M, lat, lon, waktu, cuaca, lahan: {gambut, kawasan, konsesi, kanal, jalan, desa, riwayat, penduduk}, mc: 40});
    log(`ramal ${((performance.now() - t0) / 1000).toFixed(2)} dtk; luas p50 ${r.luas.map(x => Math.round(x.p50)).join("/")} ha; p_lepas ${r.p_lepas}; arah ${JSON.stringify(r.arah)}; desa ${r.kena.desa.length}; jiwa ${r.kena.jiwa}`);
    ok(r.sel.every(s => s.p.every(p => p >= 0 && p <= 1)), "peluang dalam [0,1]");
    ok(r.luas[0].p50 <= r.luas[2].p50, "luas kumulatif tidak turun");
    ok(r.luasJam.length === 73, "luas per jam 73 titik");
    window.HASIL_UJI = "lulus";
    log("SEMUA LULUS");
  } catch (e) { log(String(e)); window.HASIL_UJI = "gagal: " + e.message; }
  Cerita.buka(document.getElementById("cerita"));
})();
</script>
</body></html>
