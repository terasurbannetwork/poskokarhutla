<!doctype html>

<head>

<link rel="icon" href="../img/logo.svg?v=2" type="image/svg+xml">

<meta property="og:url" content="https://centurisk97.id/pesisir/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="stylesheet" href="../inti/kepala.css">
<!-- rupa dasar, peta, tabel, Insight, dan Tren dipakai bersama banjir dan cuaca (public/inti); pesisir.css hanya tambahannya -->
<link rel="stylesheet" href="../inti/tema.css">
<link rel="stylesheet" href="../inti/gaya.css">
<link rel="stylesheet" href="../inti/peta.css">
<link rel="stylesheet" href="../inti/tabel.css">
<link rel="stylesheet" href="../inti/insight.css">
<link rel="stylesheet" href="../inti/tren.css">
<link rel="stylesheet" href="../inti/kartu.css">
<link rel="stylesheet" href="pesisir.css">
</head>
<body>
<div id="tip" role="tooltip"></div>
<header class="top">
  <div class="mark">
    <button class="iconbtn" id="burger" aria-label="Buka menu" aria-expanded="false" aria-controls="tabs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="logo" href="../" title="Centurisk97"><img src="../img/logo.svg?v=2" alt="Centurisk97" width="30" height="30"></a><details class="bencana" data-bencana="pesisir" data-tanpa-segera><summary><svg class="bc-ik" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#2f7fb8" stroke-width="2" stroke-linecap="round" d="M2.5 9c2.2-2.4 4.3-2.4 6.5 0s4.3 2.4 6.5 0 4.3-2.4 6 0M2.5 14c2.2-2.4 4.3-2.4 6.5 0s4.3 2.4 6.5 0 4.3-2.4 6 0M2.5 19c2.2-2.4 4.3-2.4 6.5 0s4.3 2.4 6.5 0 4.3-2.4 6 0"/></svg>Gelombang Pasang &amp; Abrasi</summary><div class="menu"></div></details>
  </div>
  <nav class="tabs" id="tabs" aria-label="Menu utama"></nav>
  <div class="stat">
    <span class="upd" id="upd">Memuat data…</span>
    <button class="iconbtn" id="tema" aria-label="Ganti tema terang/gelap" title="Ganti tema">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="page on" id="p-peta" aria-label="Peta pesisir">
    <div id="peta"></div>
    <div class="muat" id="muat"><div><div class="spin"></div>Memuat data abrasi, rob, pasang surut, dan gelombang…</div></div>
    <div class="panel" id="panel">
      <div class="card list">
        <button class="handle" id="handle" aria-label="Perbesar atau perkecil panel"></button>
        <div class="top">
          <div class="seg penuh" role="group" aria-label="Isi panel" id="panelMode" style="box-shadow:none;margin-bottom:8px"></div>
          <div class="cari">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="cari" type="search" placeholder="Cari lokasi atau provinsi" autocomplete="off" aria-label="Cari lokasi">
          </div>
        </div>
        <div class="rows" id="rows" role="list"></div>
      </div>
    </div>
    <div class="tools" id="tools">
      <div class="card garis-waktu on" id="garisWaktu" aria-label="Hari"><span class="lbl" style="white-space:nowrap">Hari (rob, pasang, ombak)</span><div id="hariSeg" style="flex:1"></div></div>
      <button class="iconbtn" id="lapisBtn" style="background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:grid" aria-label="Overlay peta" title="Lapisan peta">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <div class="box lapis" id="lapis">
        <div class="lapis-hd"><span>Overlay</span></div>
        <details open><summary>Pesisir</summary>
          <label><input type="checkbox" data-l="abrasi" checked> Abrasi garis pantai</label>
          <label><input type="checkbox" data-l="rob"> Status rob</label>
          <label><input type="checkbox" data-l="pasut"> Pasang surut</label>
          <label><input type="checkbox" data-l="ombak"> Gelombang model</label>
          <label><input type="checkbox" data-l="bmkg"> Peringatan gelombang BMKG</label>
        </details>
      </div>
    </div>
    <div class="dok" id="dok">
      <div class="box" id="legenda"></div>
    </div>
    <aside class="card laci" id="laci" aria-label="Rincian"></aside>
  </section>

  <section class="page scroll" id="p-insight" aria-label="Insight pesisir"><div class="wrap" id="insight"></div></section>
  <section class="page scroll" id="p-tren" aria-label="Tren pesisir"><div class="wrap" id="tren"></div></section>
  <section class="page scroll" id="p-tentang" aria-label="Tentang data pesisir"><div class="wrap" id="tentang"></div></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="../inti/format.js"></script>
<script src="../inti/nanti.js"></script>
<script src="../inti/kartu.js"></script>
<script src="../inti/tip.js"></script><script src="../inti/geser_lapis.js" defer></script>
<script src="hitung.js"></script>
<script src="grafik.js"></script>
<script src="peta.js"></script>
<script src="insight.js"></script>
<script src="tren.js"></script>
<script src="tentang.js"></script>
<script src="pesisir.js"></script>
<script src="../kaki.js" defer></script>
<script type="module" src="../inti/kepala.js"></script>
</body>
</html>
