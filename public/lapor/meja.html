<main class="mj">
  <header class="mj-pita">
    <a class="mj-merek" href="/lapor/"><img src="/lapor/lambang-bnpb.png" alt="" width="40" height="40"><span>Meja Laporan<small>Lapor Bencana BNPB, khusus staf</small></span></a>
    <div class="mj-angka" id="angka" role="group" aria-label="Saring menurut status tiket"></div>
    <button class="mj-segar" id="bSegar" type="button"><svg aria-hidden="true"><use href="#m-segar"/></svg><span id="waktuSegar">Memuat...</span></button>
  </header>
  <!-- baris saring bersama peta dan tabel, tiru /bnpb/dalops (pemilik 19 Nov 2026 "ada filter-filternya juga kaya dalops") -->
  <div class="mj-saring" role="search" aria-label="Saring laporan">
    <label class="mj-cari"><svg aria-hidden="true"><use href="#m-cari"/></svg><input id="qCari" type="search" placeholder="Cari tiket, pelapor, nomor WA, desa, kab/kota" aria-label="Cari laporan"></label>
    <select id="sJenis" aria-label="Jenis bencana"></select>
    <select id="sStatus" aria-label="Status tiket"></select>
    <select id="sKab" aria-label="Kabupaten atau kota"></select>
    <select id="sPeriode" aria-label="Periode laporan">
      <option value="1">24 jam terakhir</option><option value="7">7 hari terakhir</option><option value="30">30 hari terakhir</option><option value="0" selected>Semua waktu</option>
    </select>
    <div class="mj-seg" id="saringCepat" role="group" aria-label="Saring cepat"></div>
    <button class="mj-ulang" id="bUlang" type="button" aria-label="Hapus semua saringan" title="Hapus semua saringan"><svg aria-hidden="true"><use href="#m-ulang"/></svg><span>Hapus saringan</span></button>
  </div>
  <div class="mj-isi" id="isi">
    <!-- peta dasbor: saring jenis berikon di atas peta, periode dan saring cepat di kanan, ringkasan di kiri, legenda tengah bawah (tiru /bnpb/dalops) -->
    <section class="mj-peta-wadah" aria-label="Peta laporan">
      <div class="mj-peta" id="peta"></div>
      <div class="mj-peta-atas">
        <div class="mj-jenis" id="saringJenis" role="group" aria-label="Saring jenis bencana"></div>
        <div class="mj-alat">
          <div class="mj-seg" id="saringCepat" role="group" aria-label="Saring cepat"></div>
          <select id="sPeriode" aria-label="Periode laporan">
            <option value="1">24 jam terakhir</option><option value="7">7 hari terakhir</option><option value="30">30 hari terakhir</option><option value="0" selected>Semua waktu</option>
          </select>
          <button class="mj-ikon-peta" id="bPas" type="button" aria-label="Tampilkan semua titik" title="Tampilkan semua titik"><svg aria-hidden="true"><use href="#m-luas"/></svg></button>
        </div>
      </div>
      <aside class="mj-ringkas" id="ringkas" aria-label="Ringkasan laporan tersaring"></aside>
      <div class="mj-legenda" id="legenda"></div>
    </section>
    <section class="mj-tabel-wadah">
      <div class="mj-tabel-kepala">
        <h2><svg aria-hidden="true"><use href="#m-daftar"/></svg>Daftar laporan <span id="nTabel"></span></h2>
        <label class="mj-cari"><svg aria-hidden="true"><use href="#m-cari"/></svg><input id="qCari" type="search" placeholder="Cari nomor tiket, nama pelapor, nomor WA, atau kab/kota" aria-label="Cari laporan"></label>
      </div>
      <div class="mj-tabel-gulung"><table class="mj-tabel"><thead><tr>
        <th>Waktu lapor</th><th>Tiket</th><th>Jenis</th><th>Lokasi</th><th title="Meninggal, hilang, luka-luka">Korban</th><th>Pelapor</th><th>Lengkap</th><th>Foto</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </section>
  </div>
  <dialog class="mj-rinci" id="rinci" closedby="any" aria-labelledby="rinciJudul"></dialog>
</main>
