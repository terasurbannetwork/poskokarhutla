<!-- kerangka standar staf (pemilik 26 Nov 2026): kepala + panel kiri Pusdalops hanya dipasang bila sesi punya menu staf (data-opsional); akun BPBD tampil apa adanya -->
<header class="ad-top"><a class="ad-logo" href="/"><img src="/img/logo.svg?v=2" alt="" width="30" height="30">Centurisk97</a><span class="ad-sep">Meja laporan</span></header>
<script src="/bnpb/menu_pusdalops.js?v=29" data-opsional></script>
<main class="mj">
  <!-- bilah atas khusus layar sempit (QA 24 Nov 2026: di HP menu samping tersembunyi, tidak ada jalan ke Daftar, antrean, tema): tombol buka laci menu + nama halaman -->
  <div class="mj-hp-bar">
    <button class="mj-hp-menu" id="bMenu" type="button" aria-label="Buka menu" aria-controls="menuSamping" aria-expanded="false"><svg aria-hidden="true"><use href="#m-menu"/></svg></button>
    <img src="/lapor/lambang-bnpb.png" alt="" width="28" height="28"><b>Meja Laporan</b>
  </div>
  <div class="mj-laci-latar" id="laciLatar" hidden></div>
  <!-- menu samping ala dasbor (pemilik 19 Nov 2026 "kaya menu dashboard, di kiri sidebar"): tampilan, antrean kerja per status, pintu lain -->
  <!-- kepala navy dihapus (pemilik 19 Nov 2026 "header ini ga ada lagi"): merek di atas menu samping, segarkan di bawahnya -->
  <aside class="mj-samping" id="menuSamping">
    <div class="mj-merek-baris"><a class="mj-merek" href="/lapor/"><img src="/lapor/lambang-bnpb.png" alt="" width="36" height="36"><span>Meja Laporan<small>Pantau Bencana, khusus staf</small></span></a><button class="mj-tema" id="bTema" type="button" aria-label="Ganti tema terang/gelap" data-tip="<b>Ganti tema terang/gelap</b>"><svg class="mj-bulan" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="mj-matahari" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
    <!-- label waktu data di menu samping (pemilik 19 Nov 2026 "agar di side bar"): titik hidup + jam; ketuk untuk memuat ulang -->
    <button class="mj-segar" id="bSegar" type="button" title="Muat ulang data"><i aria-hidden="true"></i><span id="waktuSegar">Memuat data...</span><svg aria-hidden="true"><use href="#m-segar"/></svg></button>
    <nav class="mj-nav" id="nav" aria-label="Menu meja laporan"></nav>
    <button class="mj-tarik" id="tarikMenu" type="button" role="separator" aria-orientation="vertical" aria-label="Tarik untuk mengubah lebar menu" title="Tarik untuk mengubah lebar menu"></button>
  </aside>
  <!-- baris saring bersama peta dan tabel, tiru /bnpb/dalops (pemilik 19 Nov 2026 "ada filter-filternya juga kaya dalops") -->
  <!-- SATU baris saring penuh lebar (pemilik 19 Nov 2026 "ini agar sebaris semua"): cari, pil jenis bergulir mendatar, status, kab/kota, waktu, saring cepat.
       Berlaku sekaligus untuk peta, ringkasan, dan tabel. -->
  <div class="mj-saring" id="saring" role="search" aria-label="Filter laporan">
    <!-- satu baris (pemilik 19 Nov 2026): cari, pil jenis berangka, waktu, saring cepat berangka; gaya chip /bnpb/dalops -->
    <label class="mj-cari"><svg aria-hidden="true"><use href="#m-cari"/></svg><input id="qCari" type="search" placeholder="Cari tiket, pelapor, nomor WA" aria-label="Cari laporan"></label>
    <!-- HP: tombol ciut/buka pilihan saring (pemilik 24 Nov 2026 "di hp bisa toggle minimize/max panel2 yang menutupi peta"); angka = saringan aktif -->
    <button class="mj-saring-lipat" id="bSaringLipat" type="button" aria-expanded="false" aria-controls="saring"><svg aria-hidden="true"><use href="#m-saring"/></svg><span>Filter</span><b id="nSaringAktif" hidden></b><svg class="mj-saring-panah" aria-hidden="true"><use href="#m-bawah"/></svg></button>
    <!-- pil jenis bergulir mendatar: panah dipasang meja.js pasangGeser (pemilik 24 Nov 2026 "orang biasa gaakan tau ada tombol lagi") -->
    <div class="mj-jenis-wadah" id="wadahJenis">
      <div class="mj-chip mj-chip-jenis" id="pilihJenis" role="group" aria-label="Filter jenis bencana"></div>
    </div>
    <div class="mj-periode" id="saringWaktu" role="group" aria-label="Periode laporan"></div>
    <!-- saring cepat dan tombol ulang satu kelompok: bila baris tak muat, turun bersama, tombol ulang tidak tertinggal sendirian (pemilik 24 Nov 2026 "nanggung") -->
    <div class="mj-saring-ujung">
      <div class="mj-chip" id="saringCepat" role="group" aria-label="Filter cepat"></div>
      <button class="mj-ulang" id="bUlang" type="button" aria-label="Hapus semua filter" data-tip="<b>Hapus semua filter</b>"><svg aria-hidden="true"><use href="#m-ulang"/></svg></button>
    </div>
  </div>
  <div class="mj-isi" id="isi">
    <!-- Lapor darurat (K68): panel mengambang kiri bawah di atas peta; berbunyi saat ada yang baru; BNPB dan BPBD wilayahnya (pemilik 20 Nov 2026) -->
    <section class="mj-darurat" id="pitaDarurat" aria-label="Laporan darurat" aria-live="polite" hidden></section>
    <!-- peta dasbor: saring jenis berikon di atas peta, ringkasan di kiri, legenda tengah bawah (tiru /bnpb/dalops) -->
    <section class="mj-peta-wadah" id="bagPeta" aria-label="Peta laporan">
      <div class="mj-peta" id="peta"></div>
      <div class="mj-peta-atas">
        <button class="mj-ikon-peta" id="bPas" type="button" aria-label="Tampilkan semua titik" title="Tampilkan semua titik"><svg aria-hidden="true"><use href="#m-luas"/></svg></button>
      </div>
      <div class="mj-kiri-peta">
      <aside class="mj-ringkas" id="ringkas" aria-label="Ringkasan laporan sesuai filter"></aside>
      </div>
      <div class="mj-legenda" id="legenda"></div>
    </section>
    <section class="mj-tabel-wadah" id="bagDaftar">
      <div class="mj-tabel-kepala" id="kepalaDaftar">
        <h2><svg aria-hidden="true"><use href="#m-daftar"/></svg>Daftar laporan <span id="nTabel"></span></h2>
      </div>
      <!-- kepala kolom = tombol urut (aria-sort) -->
      <div class="mj-tabel-gulung"><table class="mj-tabel"><thead><tr id="kepalaTabel"></tr></thead><tbody id="tbody"></tbody></table></div>
    </section>
  </div>
  <dialog class="mj-rinci" id="rinci" closedby="any" aria-labelledby="rinciJudul"></dialog>
</main>
