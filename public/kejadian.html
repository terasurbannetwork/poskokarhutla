<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Laporan kejadian otomatis per kab/kota yang menembus Siaga: kronologi, asal, model vs alat ukur, dan dampak jiwa.">
<meta name="robots" content="noindex">
<title>Laporan Kejadian · Centurisk97</title>
<meta name="theme-color" content="#0b2545">
<script src="/i18n.js"></script>
<link rel="icon" href="/img/logo.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script>try { const t = JSON.parse(localStorage.getItem("pk-tema")); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/tabel.css">
<link rel="stylesheet" href="/inti/insight.css">
<link rel="stylesheet" href="/inti/kartu.css">
<link rel="stylesheet" href="/inti/laporan.css">
</head>
<body>
<div id="tip" role="tooltip"></div>
<header class="top">
  <div class="mark">
    <a class="logo" href="/" title="Centurisk97"><img src="/img/logo.svg?v=2" alt="Centurisk97" width="30" height="30"></a><details class="bencana" data-bencana="banjir" id="kjBencana"><summary>Laporan kejadian</summary><div class="menu"></div></details>
  </div>
  <div class="stat">
    <span class="upd" id="upd">Memuat data…</span>
    <button class="iconbtn" id="tema" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  </div>
</header>

<main>
  <section class="page on scroll" id="p-laporan" aria-label="Laporan kejadian">
    <div id="laporan"></div>
  </section>
</main>

<script src="/inti/format.js"></script>
<script src="/inti/kartu.js"></script>
<script src="/inti/pilih.js"></script>
<script src="/inti/tip.js"></script>
<script src="/inti/tabel.js"></script>
<script src="/inti/laporan.js"></script>
<script>
/* /kejadian.html?b=<modul>&k=<kode kab>: berkas dari scripts/umum/laporan_kejadian.py; hanya modul dan kode yang dikenal yang dimuat */
(() => {
  const DIR = {banjir: "/banjir/data/kejadian/", cuaca: "/banjir/data/kejadian/", udara: "/udara/data/kejadian/", kekeringan: "/data/kejadian/"};
  const q = new URLSearchParams(location.search), b = q.get("b"), k = q.get("k");
  if (!Object.hasOwn(DIR, b) || !/^\d{4}$/.test(k || "")) { document.getElementById("laporan").innerHTML = '<div class="kosong" role="alert">Laporan kejadian tidak ditemukan.</div>'; return; }
  document.getElementById("kjBencana").dataset.bencana = b;
  Laporan.pasang({id: b, url: `${DIR[b]}${b}-${k}.json`});
})();
</script>
<script type="module" src="/inti/kepala.js"></script>
</body>
</html>
