name: Graf jalan dan sumber air (bangun ulang)

# Hanya graf rute regu (akses.py) dan titik sumber air (air_dem.py), tanpa commit. Untuk dipicu manual saat cache graf- / air-
# hilang (cache data- yang besar membuat GitHub membuang cache lain; 21 Okt 2026 akses.py gagal karena graf tidak ada).
# Hasil disimpan ke cache DAN ke R2 (arsip/graf_jalan.json.gz, arsip/air_titik.json.gz) supaya data.yml bisa memulihkannya.
# Grup concurrency sendiri: tidak menahan data.yml / titik.yml.
on:
  workflow_dispatch:

concurrency:
  group: graf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  graf:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # Overpass publik sering 504; tarik_osm mengulang sendiri dengan jeda
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik OSM jalan, sungai, sumber air
        run: |
          python3 scripts/scrape/tarik_osm.py jalan
          python3 scripts/scrape/tarik_osm.py sungai
          python3 scripts/scrape/tarik_osm.py air

      - name: Bangun graf dan titik air
        run: |
          python3 scripts/scrape/akses.py graf
          python3 scripts/scrape/air_dem.py bangun

      - name: Simpan graf jalan
        uses: actions/cache/save@v4
        with:
          path: data/graf_jalan.json.gz
          key: graf-${{ github.run_id }}

      - name: Simpan titik sumber air
        uses: actions/cache/save@v4
        with:
          path: data/air_titik.json.gz
          key: air-${{ github.run_id }}

      - name: Arsipkan ke R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/arsip/graf_jalan.json.gz --file data/graf_jalan.json.gz --remote
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/arsip/air_titik.json.gz --file data/air_titik.json.gz --remote
