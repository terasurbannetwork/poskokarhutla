# Probe: apakah runner Actions bisa menjangkau API publik BMKG (dari Mac pemilik: 403 Forbidden)? Hasil di Job Summary.
# Sengaja grup concurrency sendiri: tidak menyentuh data/terbit, tidak commit. Selalu hijau kecuali skrip crash.
name: Uji akses BMKG

on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:

concurrency:
  group: uji-bmkg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uji akses BMKG
        run: python3 scripts/cuaca/uji_akses_bmkg.py
