name: Perbarui jarak pandang BMKG

# Tiap jam 05.12-17.12 WIB (22-10 UTC, 13 run/hari). Bukan tiap 30 menit: METAR dilaporkan per jam (SPECI hanya bila berubah),
# gerbang-anggaran-cf menolak cron lebih rapat dari per jam, dan tiap commit memicu terbit_antre -> terbit.yml (deploy tampilan penuh).
# Server BMKG Aviation hanya TLS 1.3: wajib Python 3.12. Tanpa cache/pip: metar.py hanya stdlib dan membaca scripts/cuaca/data/bandara.json.
# Keluaran di-commit ke main (pola udara.yml/gempa.yml); terbit lewat terbit_antre.yml (diredam 60 detik, antre di grup data), bukan deploy sendiri.
on:
  schedule:
    - cron: "12 22-23,0-10 * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  jarak-pandang:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uji aturan
        run: python3 scripts/cuaca/metar.py uji

      - name: Tarik METAR (jarak pandang BMKG + embusan NOAA)
        run: python3 scripts/cuaca/metar.py || { echo "::error title=metar.py gagal::jarak_pandang.json dan cuaca_metar.json tidak diperbarui"; exit 1; }

      - name: Commit dua berkas keluaran ke main
        run: |
          B="public/udara/data/jarak_pandang.json public/banjir/data/cuaca_metar.json"
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $B
          git diff --cached --quiet -- $B && { echo "jarak pandang tidak berubah"; exit 0; }
          git commit -q -m "data: jarak pandang $(TZ=Asia/Jakarta date '+%F %H:%M') WIB" -- $B
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push -q && exit 0
            sleep $((i * 10))
          done
          echo "::error title=Push jarak pandang gagal::git push ke main gagal 3 kali"; exit 1
