name: Perbarui kualitas udara

# Dua kali sehari: 06.40 dan 18.40 UTC, sesudah jalan CAMS 00 dan 12 UTC tersedia di Open-Meteo.
# Masukan karhutla (kluster, kompleks, metar, riwayat udara) dipulihkan dari cache data-, dibuat data.yml/titik.yml.
# Keluaran SELALU di-commit ke main (public/udara/data) supaya deploy workflow lain, yang mengambil isi main, ikut membawanya.
on:
  schedule:
    - cron: "40 6,18 * * *"
  workflow_dispatch:

# Grup sendiri, bukan "data": GitHub hanya menyimpan satu run menunggu per grup, jadi jarak_pandang.yml (tiap jam) menggugurkan
# run udara yang antre (2 Nov 19.28 dan 3 Nov 07.47 UTC batal tanpa job; PM2,5 2 Nov tidak masuk). Push sudah pull --rebase dulu.
concurrency:
  group: udara
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulihkan arsip udara sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: |
            public/udara/data
            data/raw/udara
          key: udara-${{ github.run_id }}
          restore-keys: udara-

      - name: Pulihkan data karhutla terakhir
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      # cache data- bisa hilang (batas 10 GB) atau lebih tua dari yang tayang: tarik dari situs live, jangan dari git (insiden 23 Okt 2026)
      - name: Data tidak lebih tua dari yang tayang
        run: python3 scripts/terbit/isi_data.py perlu

      # berkas statis yang di-commit jangan digantikan versi cache (pola banjir.yml); pltu.json statis di public/udara/data
      # jarak_pandang.json milik jarak_pandang.yml (tiap jam): versi cache-nya basi dan membuat rebase bentrok (insiden 10 Nov 2026)
      - name: Pakai lapisan statis dari repo, bukan dari cache
        run: |
          f=$(git ls-files public/data/penduduk.json public/data/sekolah.json public/udara/data/pltu.json public/udara/data/jarak_pandang.json)
          git ls-files -z -- $f | xargs -0 -r git checkout HEAD --

      - name: Uji aturan
        run: |
          for s in scripts/udara/*.py; do
            grep -q "def uji" "$s" || continue
            python3 "$s" uji || { echo "::error title=Uji udara gagal::$s uji gagal; data udara tidak diperbarui"; exit 1; }
          done

      - name: Jalankan pipeline udara
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}   # tropomi.py (langkah di jalan.py): tanpa token dilewati dengan peringatan
        run: python3 scripts/udara/jalan.py || { echo "::error title=Pipeline udara gagal::scripts/udara/jalan.py gagal; public/udara/data tidak diperbarui di run ini"; exit 1; }

      # Panen #9 #10: MOS PM2,5 (OpenAQ; tanpa OPENAQ_KEY memakai stasiun BMKG sebagai pengganti berlabel) dan ensambel CAMS + GEOS-CF.
      # Berkas bergulir tetap di public/udara/data (ikut commit & cache udara-). Uji sudah jalan di langkah "Uji aturan".
      - name: MOS PM2,5 dan ensambel GEOS-CF (boleh gagal)
        continue-on-error: true
        timeout-minutes: 15
        env:
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
        run: |
          python3 scripts/udara/openaq_mos.py || echo "::warning title=openaq_mos::gagal; berkas lamanya dibiarkan"
          python3 scripts/udara/geoscf.py || echo "::warning title=geoscf::gagal; berkas lamanya dibiarkan"

      - name: Simpan arsip udara untuk jalan berikutnya
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            public/udara/data
            data/raw/udara
          key: udara-${{ github.run_id }}

      # selalu, dengan atau tanpa token Cloudflare: main jadi sumber data udara bagi deploy data/titik/banjir/terbit
      - name: Commit data udara ke main
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/udara/data
          git diff --cached --quiet -- public/udara/data && { echo "data udara tidak berubah"; exit 0; }
          git commit -q -m "data: udara $(TZ=Asia/Jakarta date '+%F %H:%M') WIB" -- public/udara/data
          git pull -q --rebase --autostash && git push -q || { echo "::error title=Push data udara gagal::git push ke main gagal (bentrok atau token tanpa scope workflow/contents:write); data udara belum masuk main"; exit 1; }

      # Deploy mengirim seluruh situs. Tanpa cache ini public/banjir/data terkirim dari git (Oktober) dan menimpa data tayang: banjir, rob, cuaca, gelombang,
      # gunung api, berita mundur sampai deploy berikutnya (4, 7, 9 Nov 2026). Sesudah commit, supaya --autostash tidak bentrok dengan berkas banjir yang
      # sering diperbarui bot. Jalur HARUS sama persis dengan simpanan banjir.yml. Tanpa cache sama sekali: gagal, lebih baik tidak terbit daripada data mundur.
      - name: Pulihkan data banjir terakhir
        uses: actions/cache/restore@v4
        with:
          path: |
            public/banjir/data
            data/raw/banjir
          key: banjir-${{ github.run_id }}
          restore-keys: banjir-
          fail-on-cache-miss: true

      - name: Salin peringatan BMKG terbaru
        run: cp public/banjir/data/peringatan.json public/data/ 2>/dev/null || true

      # citra satelit punya cache sendiri dan tidak ada di git: tanpa ini deploy mengirim situs tanpa citra. Jalur harus sama persis dengan simpanannya.
      - name: Pulihkan citra satelit
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/citra
            public/data/citra.json
          key: citra-${{ github.run_id }}
          restore-keys: citra-

      - name: Terbitkan ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "tanpa token Cloudflare: terbit lewat build lain"; exit 0; }
          git fetch -q origin main && git checkout FETCH_HEAD -- . ':!public/data' ':!public/banjir/data' ':!public/udara/data' ':!data/raw'
          python3 scripts/terbit/versi.py || { echo "::error title=Versi gagal::scripts/terbit/versi.py gagal"; exit 1; }
          python3 scripts/terbit/jaga_segar.py
          python3 scripts/terbit/isi_data.py buat
          npx --yes wrangler@4.42.0 deploy || { echo "::error title=Deploy gagal::wrangler deploy gagal"; exit 1; }
