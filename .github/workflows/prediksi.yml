name: Prediksi harian

# Sekali sehari 08.50 WIB, setelah banjir.yml (07.20 WIB): bekukan prediksi, nilai yang matang, kalibrasi berpenjaga, terbitkan JSON.
# Hanya meng-commit public/prediksi/data/**; tampilan terbit lewat terbit.yml, bukan dari sini.
on:
  schedule:
    - cron: "50 1 * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediksi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # riwayat penuh: arsip append-only dijaga dari menyusut (keluar kode 3)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uji mandiri
        run: |
          for s in catat konfirmasi nilai kalibrasi koreksi terbit dampak jalan; do python3 scripts/prediksi/$s.py uji; done

      # Masukan segar dari situs live: banjir.yml/titik.yml/udara.yml menerbitkan data ini tanpa meng-commit,
      # jadi salinan di git basi. Hanya ditimpa di runner; commit di bawah cuma public/prediksi/data.
      - name: Tarik masukan segar dari situs
        env:
          LIVE: https://centurisk97.terasurbannetwork.workers.dev
        run: |
          for f in banjir/data/status.json banjir/data/rob.json banjir/data/hujan_ansambel.json banjir/data/prakiraan72.json \
                   data/fwi_ansambel.json data/hotspot.json udara/data/prakiraan.json; do
            curl -fsS --retry 3 --max-time 120 "$LIVE/$f" -o "public/$f.baru" && mv "public/$f.baru" "public/$f" \
              || echo "::warning::$f gagal ditarik, pakai salinan git"
          done

      # PIPA_TOKEN kosong/401/503 = konfirmasi lapangan dilewati dengan log (nilai.py tidak gagal)
      - name: Catat, nilai, kalibrasi, terbit
        env:
          PIPA_TOKEN: ${{ secrets.PIPA_TOKEN }}
        run: |
          python3 scripts/prediksi/catat.py
          python3 scripts/prediksi/nilai.py
          python3 scripts/prediksi/kalibrasi.py
          python3 scripts/prediksi/koreksi.py
          python3 scripts/prediksi/terbit.py
          python3 scripts/prediksi/dampak.py

      # Ruas jalan tunggal OSM, sampai 15 kab per hari dalam anggaran 15 menit, bergilir (yang belum/terlama dulu); Overpass publik sering 502/504, gagal = dicoba lagi besok
      - name: Giliran ruas jalan tunggal
        continue-on-error: true
        timeout-minutes: 25
        env:
          JALAN_COBA: "2"
          JALAN_DETIK: "900"
        run: python3 scripts/prediksi/jalan.py giliran --maks 15

      - name: Commit data prediksi
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/prediksi/data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: prediksi harian $(TZ=Asia/Jakarta date +%F)"
          git checkout -- .   # buang masukan segar yang ditarik dari situs (tidak di-commit) supaya pull --rebase jalan
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          echo "::error::push data prediksi gagal"; exit 1
