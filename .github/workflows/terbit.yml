name: Terbitkan tampilan

# Perubahan tampilan (HTML/JS/CSS, worker) terbit lewat sini, BUKAN `wrangler deploy` dari laptop: data harian diambil dari
# cache jalan data.yml / banjir.yml terakhir, jadi tidak ada data yang mundur. ± 5 menit (2 menit terbit + uji node).
# Uji node (agen + worker) jalan SEBELUM apa pun diterbitkan: merah = tidak deploy.
on:
  push:
    branches: [main, staging]
    paths:
      - "public/**"
      - "!public/data/**"
      - "!public/banjir/data/**"
      - "src/**"
      - "wrangler.jsonc"
      - "migrations/**"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  terbit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Gerbang uji node pertama di CI. Jalan di checkout bersih (keadaan yang ada di git), sebelum cache data dipulihkan.
      # miniflare dari package-lock.json untuk uji worker; wrangler 4.42.0 untuk deploy tetap diunduh npx di langkah terbit.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pasang dependensi uji
        run: npm ci
      - name: Uji agen (gerbang)
        run: npm run uji:agen
      - name: Uji worker (D1, route, foto)
        run: npm run uji:warga

      - name: Pulihkan data karhutla terakhir
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      # luas_resmi.json TIDAK di sini: data.yml menariknya harian dari SiPongi; versi repo akan menimpa bulan baru
      - name: Pakai lapisan statis dari repo, bukan dari cache
        run: |
          f=$(git ls-files public/data/penduduk.json public/data/fasilitas.json public/data/kanal.json public/data/jalan.geojson \
            public/data/lapisan_tambahan.json public/data/model_sebaran.json public/data/musim.json public/data/musim_awal.json \
            public/data/tren_karhutla.json 'public/data/sebaran_*.json' public/data/sejarah.json public/data/sejarah_modis.json \
            public/data/riwayat_grid.json public/data/riwayat_sel public/data/riwayat_desa public/data/riwayat_langganan.json public/data/riwayat_sel_uji.json public/data/riwayat_hierarki.json public/data/riwayat_wilayah public/data/kalibrasi_wilayah.json public/data/prioritas_uji.json public/data/luas_satelit.json public/data/udara.json \
            public/data/daops.json public/data/preventif.json public/data/operasi_resmi.json public/data/aktor_karhutla.json public/data/aktor_greenpeace.json public/data/konsesi2026 public/data/factsheet_karhutla.json \
            public/data/kontak.json public/data/mitra.json public/data/tim.json public/data/pabrik_sawit.json public/data/cari.json public/data/lahan public/data/osm public/data/titik_palsu.json)
          git ls-files -z -- $f | xargs -0 -r git checkout HEAD --

      # aktor_karhutla.json dari repo menunjuk ID kompleks saat dibuat; samakan dengan kluster.json cache yang ikut terbit
      - name: Aktor WALHI x kompleks terkini (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/aktor_walhi.py

      - name: Pulihkan data banjir terakhir
        uses: actions/cache/restore@v4
        with:
          # jalur HARUS sama persis dengan simpanan banjir.yml (versi cache dihitung dari daftar jalur); beda = cache tidak ditemukan
          path: |
            public/banjir/data
            data/raw/banjir
          key: banjir-${{ github.run_id }}
          restore-keys: banjir-

      - name: Salin peringatan BMKG terbaru
        run: cp public/banjir/data/peringatan.json public/data/ 2>/dev/null || true

      # citra satelit punya cache sendiri (PNG besar, tidak ikut cache data-); jalur harus sama persis dengan simpanannya
      - name: Pulihkan citra satelit
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/citra
            public/data/citra.json
          key: citra-${{ github.run_id }}
          restore-keys: citra-

      # main = produksi (`wrangler deploy`). staging = versi PRATINJAU di URL tetap (`versions upload --preview-alias`): tidak
      # dipromosikan, jadi workers.dev produksi, domain kustom, dan cron tidak berubah. Awas: staging memakai D1/R2 produksi yang
      # sama, jadi laporan uji di staging masuk DB produksi. Dipromosikan dengan merge ke main. data.yml/banjir.yml/titik.yml
      # tetap men-deploy main, jadi kode yang belum siap jangan masuk main. workflow_dispatch dari staging ikut cabang staging.
      - name: Terbitkan ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/terbit/versi.py
          if [ "$GITHUB_REF_NAME" = main ]; then
            python3 scripts/terbit/jaga_segar.py
            npx --yes wrangler@4.42.0 deploy
          else
            npx --yes wrangler@4.42.0 versions upload --preview-alias staging --message "staging ${GITHUB_SHA::7}"
          fi
