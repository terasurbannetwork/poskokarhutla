name: laporan-harian
# Darurat (3 Nov 2026): bangun Laporan Kejadian Bencana Harian dari data/laporan-bnpb/harian-<tanggal>/jalan.py di runner,
# saat laptop pemilik tidak bisa dipakai. Tanpa skill ppt-konsultan: bingkai deck.py dilewati (TANPA_DECK), format templat 221026.
# PDF dan PPTX di-commit ke folder harian-<tanggal>.
on:
  workflow_dispatch:
    inputs:
      tanggal:
        description: "Tanggal laporan YYYY-MM-DD (folder data/laporan-bnpb/harian-<tanggal> berisi jalan.py dan bahan WA)"
        required: true
permissions:
  contents: write
concurrency: { group: laporan-harian, cancel-in-progress: false }
jobs:
  bangun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Pasang LibreOffice, Pillow, playwright-core
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-impress fonts-roboto > /dev/null
          pip install -q pillow
          npm i -q --prefix data/laporan-bnpb/generator/cache/node playwright-core@1.52.0
          mkdir -p data/laporan-bnpb/generator/cache/templat
          cp data/laporan-bnpb/harian-2026-10-23/templat-221026.pptx data/laporan-bnpb/generator/cache/templat/harian-221026.pptx
      - name: Bangun laporan
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TANPA_DECK: "1"
          CHROMIUM_SHELL: /usr/bin/google-chrome
          PYTHONUTF8: "1"
        run: python3 "data/laporan-bnpb/harian-${{ inputs.tanggal }}/jalan.py" 2>&1 | tee "data/laporan-bnpb/harian-${{ inputs.tanggal }}/jalan.log"; exit ${PIPESTATUS[0]}
      - name: Commit PDF dan PPTX
        if: always()
        run: |
          D="data/laporan-bnpb/harian-${{ inputs.tanggal }}"
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for f in "$D"/*.pdf "$D"/*.pptx "$D"/jalan.log; do [ -e "$f" ] && git add "$f" || true; done
          git diff --cached --quiet && { echo "tidak ada keluaran"; exit 0; }
          git commit -m "Laporan harian ${{ inputs.tanggal }} dari Actions (tanpa bingkai deck.py)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
