name: Prasarana OSM 38 provinsi

# Manual saja. Overpass publik lambat dan sering 504, jadi satu jalan bisa tidak selesai:
# mentah per provinsi disimpan di cache (juga saat jalan terhenti), jalan berikutnya melanjutkan dari situ.
# Grup sendiri, bukan "data": jalan 6 jam tidak boleh menahan pipeline harian.
on:
  workflow_dispatch:

concurrency:
  group: osm-nasional
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulihkan mentah jalan sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: data/raw/osm
          key: osm-nasional-${{ github.run_id }}
          restore-keys: osm-nasional-

      # batas 320 menit supaya langkah simpan cache dan commit tetap sempat jalan
      - name: Tarik fasilitas dan prasarana vital per provinsi
        continue-on-error: true
        timeout-minutes: 320
        run: |
          for k in $(python3 -c "import sys; sys.path.insert(0,'scripts/data'); from wilayah import PROVINSI; print(*PROVINSI)"); do
            python3 scripts/scrape/tarik_osm.py vital $k || echo "::warning::vital $k gagal"
            python3 scripts/scrape/tarik_osm.py fasilitas $k || echo "::warning::fasilitas $k gagal"
          done

      - name: Simpan mentah untuk jalan berikutnya
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/osm
          key: osm-nasional-${{ github.run_id }}

      - name: Bangun berkas per provinsi
        run: python3 scripts/scrape/osm_nasional.py

      - name: Commit
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/osm_nasional
          git diff --cached --quiet && exit 0
          git commit -m "Prasarana OSM nasional: $(python3 -c "import json; print(len(json.load(open('public/data/osm_nasional/ringkas.json'))['provinsi']))") dari 38 provinsi"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 10; done
          exit 1
