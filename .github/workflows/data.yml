name: Perbarui data

# Sekali sehari pukul 21.20 WIB: titik panas FIRMS, kompleks api, posko, BNPB, lalu terbitkan ke Cloudflare.
# Jamnya dipilih setelah lintasan siang VIIRS/MODIS (± 13.30 waktu setempat) masuk NRT (latensi ± 3 jam),
# jadi hitungan "hari ini" sudah memuat lintasan utama hari itu.
on:
  schedule:
    - cron: "20 14 * * *"
  workflow_dispatch:
    inputs:
      sippa_tahunan:
        description: "1 = unggah juga berkas tahunan SIPPA ke R2 sippa/"
        required: false
        default: "0"

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    # jalan dengan cache kosong: harian.py sendiri ± 45 menit (pemanasan FWI ERA5), ditambah berita/citra/penerbangan
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data hasil olahan tidak di-commit (berkas besar); dibawa antar-jalan lewat cache
      - name: Pulihkan data jalan sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      # cache data- bisa hilang (batas 10 GB) atau lebih tua dari yang tayang: tarik dari situs live, jangan dari git (insiden 23 Okt 2026)
      - name: Data tidak lebih tua dari yang tayang
        run: python3 scripts/terbit/isi_data.py perlu

      # cache public/data lama tidak boleh menimpa berkas yang di-commit tapi TIDAK dibuat ulang di sini: lapisan statis
      # (statis.yml) dan keluaran skrip lokal (sebaran/*, sejarah.py, riwayat_grid.py, lahan.py, osm.py, udara.py, daops.py,
      # musim.py, luas_satelit.py). ls-files membuang path yang tidak ada, jadi satu path hilang tidak menggagalkan semuanya.
      - name: Pakai lapisan statis dari repo, bukan dari cache
        run: |
          f=$(git ls-files public/data/penduduk.json public/data/fasilitas.json public/data/kanal.json public/data/jalan.geojson \
            public/data/lapisan_tambahan.json public/data/model_sebaran.json public/data/musim.json public/data/musim_awal.json \
            public/data/tren_karhutla.json 'public/data/sebaran_*.json' public/data/sejarah.json public/data/sejarah_modis.json \
            public/data/riwayat_grid.json public/data/riwayat_sel public/data/riwayat_desa public/data/riwayat_langganan.json public/data/riwayat_sel_uji.json public/data/riwayat_hierarki.json public/data/riwayat_wilayah public/data/kalibrasi_wilayah.json public/data/prioritas_uji.json public/data/luas_resmi.json public/data/luas_satelit.json public/data/udara.json \
            public/data/daops.json public/data/preventif.json public/data/operasi_resmi.json public/data/aktor_karhutla.json public/data/aktor_greenpeace.json public/data/konsesi2026 public/data/factsheet_karhutla.json \
            public/data/kontak.json public/data/mitra.json public/data/tim.json public/data/pabrik_sawit.json public/data/cari.json public/data/kawasan_cari.json public/data/kawasan_cari.geojson public/data/desa_cari.json public/data/sekolah.json public/data/lahan public/data/osm public/data/titik_palsu.json)
          git ls-files -z -- $f | xargs -0 -r git checkout HEAD --

      # arsip cluster hari LAMPAU yang di-commit (dibangun ulang, mis. definisi kolom berubah) menang atas cache: cache hanya
      # menyimpan apa yang ditulis jalan sebelumnya. Arsip hari ini tetap dari cache/harian.py (25 Okt 2026: FS jadi titik).
      - name: Arsip cluster hari lampau dari repo
        run: |
          kini=$(TZ=Asia/Jakarta date +%F)
          for f in $(git ls-files 'public/data/kluster_hari/*.json'); do
            [[ "$(basename "$f" .json)" < "$kini" ]] && git checkout HEAD -- "$f"
          done; true
          # arsip titik per hari dari CSV FIRMS standar (commit) menang atas salinan NRT di cache (scripts/data/titik_hari.py)
          for f in $(git ls-files 'public/data/titik_hari/2*.json'); do git checkout HEAD -- "$f"; done; true

      # sekali jalan: riwayat titik dibangun ulang lokal dengan definisi titik_unik.py terkini (25 Okt 2026: lokasi unik 4 satelit; 28 Okt 2026: semua
      # keyakinan). Cache data- berdefinisi lama tidak boleh menang atas versi repo: musim_harian.json (latar median + "semua keyakinan"), titik_tahun.json
      # dan titik_hari/indeks.json ("semua keyakinan" di definisi/sumber). Cache yang sudah baru -> dibiarkan (bergulir). Hapus langkah ini sesudah semua cache baru.
      - name: Pulihkan riwayat titik dari repo bila cache berdefinisi lama
        run: |
          python3 -c "import json,sys; m=json.load(open('public/data/musim_harian.json')); sys.exit(0 if m['latar']['stat']=='median' and 'semua keyakinan' in m['definisi'] else 1)" 2>/dev/null \
            || { f=$(git ls-files public/data/musim_harian.json); git ls-files -z -- $f | xargs -0 -r git checkout HEAD --; }
          for f in $(git ls-files public/data/titik_tahun.json public/data/titik_hari/indeks.json); do
            python3 -c "import json,sys; sys.exit(0 if 'semua keyakinan' in json.load(open(sys.argv[1])).get('sumber', '') else 1)" "$f" 2>/dev/null || git checkout HEAD -- "$f"
          done

      # koefisien operasi dikalibrasi dari isian lapangan (Bearer PIPA_TOKEN); token kosong = dilewati dengan log, berkas lama/bawaan dipakai
      - name: Kalibrasi koefisien dari isian lapangan (boleh gagal)
        continue-on-error: true
        env:
          PIPA_TOKEN: ${{ secrets.PIPA_TOKEN }}
          PIPA_URL: ${{ vars.PIPA_URL }}
        run: python3 scripts/data/kalibrasi.py uji && python3 scripts/data/kalibrasi.py

      # FIRMS kadang tak terjangkau dari runner (20 & 22 Okt 2026): jangan jatuhkan seluruh jalan harian (berita, cuaca, udara, dll).
      # Langkah sesudahnya memakai titik/kompleks terakhir dari cache (titik.yml memperbaruinya tiap 3 jam). Deploy tetap dijaga
      # scripts/terbit/jaga_segar.py: data basi atau lebih tua dari yang tayang tidak pernah terbit.
      - name: Titik panas, kompleks, FWI, BNPB
        id: harian
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python3 scripts/data/harian.py || { echo "::error title=harian.py gagal::FIRMS/BNPB tidak terjangkau; langkah lain lanjut dengan titik terakhir dari cache"; exit 1; }

      # arsip titik per hari 2026 untuk kalender Tanggal lain di peta (scripts/data/titik_hari.py): hari utuh >= ambang dari hotspot.json
      - name: Arsip titik panas per hari
        continue-on-error: true
        run: python3 scripts/data/titik_hari.py dari-hotspot

      - name: Kompleks x konsesi (perusahaan)
        run: python3 scripts/data/konsesi_kompleks.py

      # ID kompleks berganti tiap kluster.json dibuat ulang: titik terkini & kompleks tiap perusahaan Aktor dihitung ulang di sini
      - name: Aktor WALHI x titik terkini (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/aktor_walhi.py

      # titik panas 24 jam untuk lencana "terkonfirmasi satelit" di laporan warga (tab Informasi)
      - name: Titik 24 jam untuk laporan warga
        run: python3 scripts/warga/titik24.py

      # Peluang api 7 hari P1 (docs/riset/RISIKO-MINGGUAN.md): eksperimental, dibaca Worker hanya untuk akun login dari R2 risiko/.
      # Arsip NOAA-20 bergulir + catatan prospektif (ramalan beku, nilai, tolak) di data/raw/risiko/p1: cache Actions DAN R2 arsip/.
      # Salinan R2 selalu digabung dulu (risiko_produksi.py pulih: hanya menambah); unggah balik HANYA bila pemulihan R2 berhasil
      # atau objeknya memang belum ada, supaya salinan yang lebih miskin (cache hilang + R2 tak terjangkau) tidak menimpa arsip.
      - name: Pulihkan arsip risiko P1
        uses: actions/cache/restore@v4
        with:
          path: data/raw/risiko/p1
          key: risiko-p1-${{ github.run_id }}
          restore-keys: risiko-p1-

      - name: Pulihkan arsip risiko P1 dari R2 (boleh gagal)
        id: risiko_r2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # r2 = ok (digabung) | kosong (objek belum ada: jalan pertama) | gagal (jaringan/izin/berkas rusak)
          r2=ok
          for b in risiko_p1 risiko_n20; do
            rm -f /tmp/$b.jsonl.gz
            if npx --yes wrangler@4.42.0 r2 object get poskokarhutla-foto/arsip/$b.jsonl.gz --file /tmp/$b.jsonl.gz --remote > /tmp/$b.log 2>&1; then
              python3 scripts/sebaran/risiko_produksi.py pulih /tmp/$b.jsonl.gz || { r2=gagal; echo "::error title=Risiko P1 pulih R2::$b tidak bisa digabung"; }
            elif grep -q "specified key does not exist" /tmp/$b.log; then
              [ "$r2" = ok ] && r2=kosong
              echo "$b belum ada di R2 (jalan pertama)"
            else
              r2=gagal; cat /tmp/$b.log
              echo "::error title=Risiko P1 pulih R2::arsip/$b.jsonl.gz tidak terbaca; unggah ke R2 dilewati di jalan ini"
            fi
          done
          echo "r2=$r2" >> "$GITHUB_OUTPUT"

      - name: Peluang api 7 hari P1 (boleh gagal)
        id: risiko
        continue-on-error: true
        timeout-minutes: 20
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python3 scripts/sebaran/risiko_produksi.py uji || { echo "::error title=Risiko P1 swauji merah::risiko_produksi.py uji gagal (paritas artefak atau logika tolak); tidak ada ramalan/nilai di jalan ini"; exit 1; }
          python3 scripts/sebaran/risiko_produksi.py harian || { echo "::error title=Risiko P1 gagal::risiko_produksi.py harian gagal; ramalan/nilai tidak diperbarui, R2 dan cache tidak disentuh"; exit 1; }

      # Worker mengalirkan risiko/*.json apa adanya: JSON polos (tanpa Content-Encoding), < 8 MB (dijaga di risiko_produksi.py)
      - name: Unggah risiko P1 ke R2 (boleh gagal)
        id: risiko_unggah
        if: steps.risiko.outcome == 'success' && (steps.risiko_r2.outputs.r2 == 'ok' || steps.risiko_r2.outputs.r2 == 'kosong')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 scripts/sebaran/risiko_produksi.py kemas /tmp/risiko_p1.jsonl.gz
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/arsip/risiko_p1.jsonl.gz --file /tmp/risiko_p1.jsonl.gz --content-type application/gzip --remote
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/arsip/risiko_n20.jsonl.gz --file data/raw/risiko/p1/n20.jsonl.gz --content-type application/gzip --remote
          for f in terbaru prospektif; do
            npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/risiko/$f.json --file data/risiko_p1/keluaran/$f.json --content-type application/json --remote
          done

      - name: Risiko P1 tidak terunggah (peringatan)
        if: steps.risiko.outcome == 'success' && steps.risiko_unggah.outcome != 'success'
        run: |
          echo "::error title=Risiko P1 tidak diunggah::pemulihan R2 = '${{ steps.risiko_r2.outputs.r2 }}' atau unggah gagal; risiko/terbaru.json di R2 tetap versi lama"
          echo "### Risiko P1 TIDAK diunggah ke R2" >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan arsip risiko P1
        if: always() && steps.risiko.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw/risiko/p1
          key: risiko-p1-${{ github.run_id }}

      # SIPPA (SP-090): berkas turunan di-commit ke data/sippa/keluaran/, dibaca Worker lewat GET /api/sippa/data/<nama> dari R2 sippa/.
      # Self-check dulu (tanpa jaringan); satu berkas gagal tidak menghentikan yang lain. Tidak ada jadwal baru.
      - name: Unggah data SIPPA ke R2 (boleh gagal)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/data/sippa/cat.py uji
          python3 scripts/data/sippa/jembatan.py uji
          gagal=0
          for f in data/sippa/keluaran/*.json; do
            npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/sippa/$(basename "$f") --file "$f" --content-type application/json --remote || { echo "::warning title=SIPPA R2::$f gagal diunggah"; gagal=1; }
          done
          exit $gagal

      # arsip berita bergulir 120 hari dibawa lewat cache tersendiri (bukan commit: berubah tiap hari).
      # Cache hilang -> berita.py membangun ulang arsip 120 hari sendiri (± 8 menit).
      - name: Pulihkan iklim tanah
        uses: actions/cache/restore@v4
        with:
          path: data/raw/tanah_klim.json
          key: tanah-${{ github.run_id }}
          restore-keys: tanah-

      # ansambel ECMWF dan kelembapan tanah: kuota Open-Meteo ~3.200/hari (lihat docstring masing-masing)
      - name: Ansambel FWI dan kelembapan tanah (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/data/ansambel.py
          python3 scripts/data/peluang_karhutla.py || echo "::warning title=peluang karhutla::gagal; berkas lama dibiarkan"
          python3 scripts/data/tanah.py

      - name: Simpan iklim tanah
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/tanah_klim.json
          key: tanah-${{ github.run_id }}

      - name: Pulihkan arsip berita
        uses: actions/cache/restore@v4
        with:
          path: data/raw/berita/arsip.json
          key: berita-${{ github.run_id }}
          restore-keys: berita-

      - name: Pulihkan cache gambar berita
        uses: actions/cache/restore@v4
        with:
          path: data/raw/berita/gambar.json
          key: berita-gambar-${{ github.run_id }}
          restore-keys: berita-gambar-

      - name: Pulihkan cache terjemahan judul berita
        uses: actions/cache/restore@v4
        with:
          path: data/raw/berita/terjemah.json
          key: berita-terjemah-${{ github.run_id }}
          restore-keys: berita-terjemah-

      - name: Bot berita (boleh gagal)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/data/berita.py

      # Daftar video YouTube (API resmi). Tanpa secret YOUTUBE_API_KEY langkah ini dilewati diam-diam.
      - name: Bot video YouTube (boleh gagal)
        continue-on-error: true
        timeout-minutes: 5
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/data/video.py

      # Analisis post media sosial kurasi admin (/api/sosmed) dengan leksikon berita -> public/data/sosmed.json.
      - name: Analisis post sosmed (boleh gagal)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/umum/sosmed.py --uji && python3 scripts/umum/sosmed.py

      - name: Simpan arsip berita
        uses: actions/cache/save@v4
        with:
          path: data/raw/berita/arsip.json
          key: berita-${{ github.run_id }}

      - name: Simpan cache gambar berita
        if: hashFiles('data/raw/berita/gambar.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/berita/gambar.json
          key: berita-gambar-${{ github.run_id }}

      - name: Simpan cache terjemahan judul berita
        if: hashFiles('data/raw/berita/terjemah.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/berita/terjemah.json
          key: berita-terjemah-${{ github.run_id }}

      - name: Rekomendasi posko
        run: python3 scripts/data/posko.py

      - name: Rencana pencegahan kecamatan langganan (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/data/preventif.py uji
          python3 scripts/data/preventif.py ringan

      - name: Pulihkan graf jalan
        uses: actions/cache/restore@v4
        with:
          path: data/graf_jalan.json.gz
          key: graf-${{ github.run_id }}
          restore-keys: graf-

      - name: Pulihkan titik sumber air
        uses: actions/cache/restore@v4
        with:
          path: data/air_titik.json.gz
          key: air-${{ github.run_id }}
          restore-keys: air-

      # cache graf-/air- bisa dibuang GitHub (cache data- besar); arsip R2 dari statis.yml/graf.yml jadi cadangan. Tanpa keduanya akses.py gagal.
      - name: Pulihkan graf dan titik air dari R2 bila cache hilang (boleh gagal)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p data
          for b in graf_jalan air_titik; do
            [ -s data/$b.json.gz ] && continue
            npx --yes wrangler@4.42.0 r2 object get poskokarhutla-foto/arsip/$b.json.gz --file data/$b.json.gz --remote || { rm -f data/$b.json.gz; echo "::warning title=$b::cache dan arsip R2 kosong; jalankan graf.yml"; }
          done

      # jejak GPS regu 30 hari terakhir; token kosong atau respons bukan 200 = tidak ada berkas (akses.py anggap tanpa jejak)
      - name: Tarik jejak regu (boleh gagal)
        continue-on-error: true
        env:
          PIPA_TOKEN: ${{ secrets.PIPA_TOKEN }}
          PIPA_URL: ${{ vars.PIPA_URL || 'https://centurisk97.id' }}
        run: |
          if [ -z "$PIPA_TOKEN" ]; then echo "PIPA_TOKEN kosong, jejak regu dilewati"; exit 0; fi
          sejak=$(( ($(date +%s) - 30*86400) * 1000 ))
          mkdir -p data
          kode=$(curl -sS --max-time 30 -H "Authorization: Bearer $PIPA_TOKEN" "$PIPA_URL/api/pipa/jejak?sejak=$sejak" -o data/jejak_regu.tmp -w '%{http_code}' || true)
          if [ "$kode" = "200" ]; then mv data/jejak_regu.tmp data/jejak_regu.json; else echo "jejak regu HTTP $kode, dilewati"; rm -f data/jejak_regu.tmp; fi

      - name: Waktu tempuh regu (boleh gagal)
        continue-on-error: true
        run: python3 scripts/scrape/akses.py

      # SiPongi KLHK merilis rekap luas bulanan dengan jeda; tarik harian supaya bulan baru langsung masuk luas_resmi.json
      - name: Luas terbakar resmi KLHK SiPongi (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/scrape/luas_satelit.py uji
          python3 scripts/scrape/luas_satelit.py resmi

      - name: Rencana operasi & kebutuhan sumber daya
        run: |
          python3 scripts/data/operasi.py uji
          python3 scripts/data/operasi.py

      # prioritas pembasahan per KHG (titik panas di dalam poligon KHG) dan kendala lapangan per kompleks. khg_hari.json (penghitung harian,
      # ikut cache public/data) terisi mundur dari FIRMS maks 45 permintaan per jalan, jadi musim 2026 lengkap setelah beberapa jalan.
      - name: Prioritas KHG dan kendala lapangan (boleh gagal)
        continue-on-error: true
        timeout-minutes: 30
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python3 scripts/data/kendala.py --uji && python3 scripts/data/kendala.py || echo "::warning title=kendala::kendala.py gagal; berkas lamanya dibiarkan"
          python3 scripts/data/taktik.py uji && python3 scripts/data/taktik.py || echo "::warning title=taktik::taktik.py gagal; tugas_kompleks.json tanpa rekomendasi"

      # SIPPA: pemicu pra-posisi harian (DESAIN-TEKNIS §7.4). Hanya ke R2 sippa/ (dibaca Worker untuk staf), BUKAN public/data.
      # pemicu.py menerima --keluar <dir> (bukan env), jadi /tmp/sippa dipakai lewat argumen.
      - name: Pemicu SIPPA (boleh gagal)
        id: sippa_pemicu
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/sippa
          python3 scripts/data/sippa/pemicu.py uji || { echo "::error title=Pemicu SIPPA swauji merah::pemicu.py uji gagal"; exit 1; }
          python3 scripts/data/sippa/pemicu.py --keluar /tmp/sippa
          python3 scripts/data/sippa/prioritas.py uji && python3 scripts/data/sippa/prioritas.py --keluar /tmp/sippa || echo "::warning title=Prioritas SIPPA::prioritas.py gagal; peringkat memakai berkas lama"

      - name: Unggah SIPPA ke R2 (boleh gagal)
        if: steps.sippa_pemicu.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          sha256sum /tmp/sippa/pemicu.json
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/sippa/pemicu.json --file /tmp/sippa/pemicu.json --content-type application/json --remote
          if [ -f /tmp/sippa/prioritas.json ]; then npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/sippa/prioritas.json --file /tmp/sippa/prioritas.json --content-type application/json --remote; fi
          if [ "${{ github.event.inputs.sippa_tahunan }}" = "1" ]; then
            for f in kelayakan_kompleks kelayakan_sel zona sel22 kit_nasional aoi_calon brgm_pembasahan konsesi_kompleks akses_kompleks; do
              if [ -f data/sippa/keluaran/$f.json ]; then
                sha256sum data/sippa/keluaran/$f.json
                npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/sippa/$f.json --file data/sippa/keluaran/$f.json --content-type application/json --remote
              fi
            done
          fi

      # harian.py menulis ulang tugas_kompleks.json tanpa kunci insiden; tanpa langkah ini Kartu Api kosong sampai putaran titik.yml berikutnya
      - name: Insiden api, front, luas terkoreksi (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/data/insiden.py --uji && python3 scripts/data/insiden.py || echo "::warning title=insiden::insiden.py gagal; tugas_kompleks.json tanpa kunci insiden"
          python3 scripts/data/watak_kluster.py uji && python3 scripts/data/watak_kluster.py || echo "::warning title=watak::watak_kluster.py gagal; cluster tanpa pola lokasi"
          python3 scripts/data/kabar_kab.py --uji && python3 scripts/data/kabar_kab.py || echo "::warning title=kabar::kabar_kab.py gagal; /kabar memakai data sebelumnya"

      # luas terukur Sentinel-2 (dNBR) per insiden yang sudah >= 7 hari tak terdeteksi; hasil menumpuk di public/data/luas_citra.json,
      # ikut cache data- (sama seperti insiden.json) dan terbit lewat deploy/`git add public/data`
      - name: Luas terbakar terukur dari citra (boleh gagal)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/data/luas_citra.py uji && python3 scripts/data/luas_citra.py
          python3 scripts/data/khg_prioritas.py --uji && python3 scripts/data/khg_prioritas.py || echo "::warning title=khg::khg_prioritas.py gagal; berkas lamanya dibiarkan"

      # ONI & status CPC bulanan, DMI mingguan: cukup tiap Senin (atau bila berkas belum ada)
      - name: Indeks iklim ENSO/IOD (boleh gagal)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ ! -f public/data/iklim.json ]; then python3 scripts/data/iklim.py; fi
          # outlook hujan Niño x Dipol (CHIRPS 1981-sekarang, ±3 menit tanpa cache): mingguan bersama iklim.py
          if [ "$(date -u +%u)" = 1 ] || [ ! -f public/data/iklim_outlook.json ]; then python3 scripts/umum/iklim_outlook.py uji && python3 scripts/umum/iklim_outlook.py; fi

      - name: Data keputusan & InaRISK/BPBD (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/data/keputusan.py
          python3 scripts/data/bnpb_gis.py
          # SK status keadaan darurat (CKAN data.bnpb.go.id) dan kejadian + dampak DIBI 365 hari, untuk /semua
          python3 scripts/umum/status_darurat.py uji && python3 scripts/umum/status_darurat.py || echo "::warning title=status_darurat::gagal; berkas lamanya dibiarkan"
          python3 scripts/umum/dibi_kejadian.py uji && python3 scripts/umum/dibi_kejadian.py || echo "::warning title=dibi_kejadian::gagal; berkas lamanya dibiarkan"

      - name: Rekomendasi pangkalan udara
        run: python3 scripts/data/udara_rekom.py

      # Sentinel-2 (Earth Search/AWS Open Data) + VIIRS GIBS, tanpa kunci; batas kerja 360 dtk, sisanya besok lewat cache
      # citra satelit punya cache sendiri (PNG besar, tidak ikut cache data-); jalur harus sama persis dengan simpanannya
      - name: Pulihkan citra satelit
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/citra
            public/data/citra.json
          key: citra-${{ github.run_id }}
          restore-keys: citra-

      - name: Citra satelit kompleks prioritas (boleh gagal)
        continue-on-error: true
        timeout-minutes: 9
        run: python3 scripts/data/citra.py

      - name: Simpan citra satelit
        if: always() && hashFiles('public/data/citra.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            public/data/citra
            public/data/citra.json
          key: citra-${{ github.run_id }}

      - name: Prakiraan asap CAMS (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/asap.py

      # elemen orbit (TLE) 4 satelit dari CelesTrak -> public/data/tle.json, dibaca layar untuk "Satelit berikutnya melintas pukul ...".
      # Berkas bergulir lewat cache data- (BUKAN di daftar git checkout HEAD) dan terbit bersama public/data; gagal = tle.json lama dibiarkan.
      - name: Elemen orbit satelit TLE (boleh gagal)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/data/tle.py uji || { echo "::error title=TLE uji merah::tle.py uji gagal; tle.json lama dibiarkan"; exit 1; }
          python3 scripts/data/tle.py || { echo "::warning title=TLE gagal::CelesTrak tidak terjangkau; tle.json lama dibiarkan"; exit 1; }

      - name: Data pelengkap (boleh gagal, data lama tetap dipakai)
        continue-on-error: true
        run: |
          for s in scripts/scrape/metar.py; do
            [ -f "$s" ] && timeout 300 python3 "$s" || echo "lewati $s"
          done

      - name: Pulihkan arsip penerbangan
        uses: actions/cache/restore@v4
        with:
          path: data/raw/penerbangan/arsip.json
          key: penerbangan-${{ github.run_id }}
          restore-keys: penerbangan-

      - name: Gangguan penerbangan akibat asap (boleh gagal)
        continue-on-error: true
        run: timeout 600 python3 scripts/data/penerbangan.py

      - name: Simpan arsip penerbangan
        if: hashFiles('data/raw/penerbangan/arsip.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/penerbangan/arsip.json
          key: penerbangan-${{ github.run_id }}

      - name: Dampak kebakaran musim berjalan
        run: python3 scripts/data/dampak.py

      # cuaca per jam Simulasi per sel 0,5 derajat (kompleks Siaga/Prioritas): peramban tidak lagi memanggil Open-Meteo sendiri.
      # <= 400 sel x bobot 3,3 = <= 1.320 panggilan kuota. Gagal: peramban jatuh ke Open-Meteo langsung.
      - name: Cuaca per jam Simulasi (boleh gagal)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/data/cuaca_jam.py

      # muatan ringan tab Ringkasan (potongan berita/penerbangan/musim_awal + titik per hari); gagal -> berkas asli dipakai
      - name: Ringkasan ringan (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/ringkasan.py

      # laporan harian + kurva musim (musim_harian.json ditimpa perbarui() di dalamnya). musim_harian.json SENGAJA tidak di daftar
      # git checkout HEAD: ia bergulir lewat cache data-; versi repo hanya dasar saat cache kosong.
      - name: Laporan harian & kurva musim (boleh gagal)
        id: laporan
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}   # sekali: migrasi titik arsip ke lokasi unik (laporan.migrasi_titik)
        run: python3 scripts/data/laporan.py

      - name: Kurva titik panas kumulatif antartahun (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/kumulatif.py

      - name: Laporan harian gagal (peringatan)
        if: steps.laporan.outcome == 'failure'
        run: |
          echo "::error title=Laporan harian gagal::scripts/data/laporan.py gagal; laporan.json dan musim_harian.json tidak diperbarui di run ini (deploy data lain tetap jalan)"
          echo "### Laporan harian GAGAL" >> "$GITHUB_STEP_SUMMARY"
          echo "laporan.py gagal di run ini. laporan.json dan musim_harian.json memakai versi sebelumnya (cache). Lihat log langkah 'Laporan harian & kurva musim'." >> "$GITHUB_STEP_SUMMARY"

      - name: Uji aturan
        run: |
          python3 scripts/data/fwi.py
          python3 scripts/data/aturan.py
          python3 scripts/data/harian.py uji
          python3 scripts/data/taktik.py uji
          python3 scripts/geo/batas.py uji
          python3 scripts/data/posko.py uji
          python3 scripts/data/udara_rekom.py uji
          python3 scripts/data/berita.py uji
          python3 scripts/data/citra.py uji
          python3 scripts/data/asap.py uji
          python3 scripts/data/konsesi_kompleks.py uji
          python3 scripts/data/aktor_walhi.py uji
          python3 scripts/data/dampak.py uji
          python3 scripts/data/penerbangan.py uji
          python3 scripts/data/ansambel.py uji
          for s in titik_palsu peluang_karhutla kumulatif; do python3 scripts/data/$s.py uji; done
          python3 scripts/data/tanah.py uji
          python3 scripts/data/penduduk.py paparan > /dev/null
          python3 scripts/scrape/akses.py uji
          python3 scripts/data/cuaca_jam.py uji
          python3 scripts/data/ringkasan.py uji
          python3 scripts/terbit/versi.py uji

      - name: Simpan data untuk jalan berikutnya
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}

      # Ada token Cloudflare: terbit langsung. Tidak ada: commit data ke main (cadangan lama, tidak terbit sendiri).
      # JANGAN sambungkan lagi Workers Builds (build git Cloudflare): ia menerbitkan public/data hasil commit di tiap push dan
      # menimpa data segar; 16 Okt 2026 situs tertahan 4 hari di data 12 Okt karenanya. Triggernya dihapus; jaga.yml memantau.
      # satu situs dengan banjir: pulihkan data banjir terakhir supaya ikut terbit utuh
      - name: Pulihkan data banjir terakhir
        uses: actions/cache/restore@v4
        with:
          # jalur HARUS sama persis dengan simpanan banjir.yml (versi cache dihitung dari daftar jalur); beda = cache tidak ditemukan
          path: |
            public/banjir/data
            data/raw/banjir
          key: banjir-${{ github.run_id }}
          restore-keys: banjir-

      - name: Salin peringatan BMKG terbaru dari data banjir
        run: cp public/banjir/data/peringatan.json public/data/ 2>/dev/null || true

      - name: Terbitkan ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # tampilan diambil dari main terbaru, bukan dari commit saat run dimulai: push di tengah run tidak boleh tertimpa
          git fetch -q origin main && git checkout FETCH_HEAD -- . ':!public/data' ':!public/banjir/data'
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then python3 scripts/terbit/jaga_segar.py && python3 scripts/terbit/isi_data.py buat && python3 scripts/terbit/versi.py && npx --yes wrangler@4.42.0 deploy; exit; fi
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: pembaruan harian $(TZ=Asia/Jakarta date +%F)"
          git pull -q --rebase && git push -q

      # /api/status menjawab 503 bila sumber kunci basi (titik > 8 jam, banjir/berita > 30 jam): run jadi merah, tidak gagal diam.
      # Tanpa token Cloudflare (jalur commit) terbitnya lewat build lain, jadi dilewati.
      - name: Periksa kesegaran data yang tayang
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          URL_STATUS: ${{ vars.URL_STATUS || 'https://centurisk97.id/api/status' }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 0
          for i in 1 2 3; do
            kode=$(curl -sS -m 30 -o status.json -w '%{http_code}' "$URL_STATUS") || kode=000
            echo "percobaan $i: HTTP $kode"; cat status.json 2>/dev/null || true; echo
            [ "$kode" = 200 ] && exit 0
            sleep 30
          done
          echo "::error title=Data basi::/api/status HTTP $kode $(cat status.json 2>/dev/null)"
          exit 1
