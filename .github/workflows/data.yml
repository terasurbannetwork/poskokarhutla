name: Perbarui data

# Tiap jam: titik panas FIRMS, kompleks api, posko, BNPB, lalu terbitkan ke Cloudflare.
# FWI dihitung ulang sekali sehari (cuaca jam 12 waktu setempat); jam lain memakai hasil hari itu.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data hasil olahan tidak di-commit (berkas besar); dibawa antar-jalan lewat cache
      - name: Pulihkan data jalan sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Titik panas, kompleks, FWI, BNPB
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FWI: "0"
        run: python3 scripts/data/harian.py

      - name: Rekomendasi posko
        run: python3 scripts/data/posko.py

      - name: Rekomendasi pangkalan udara
        run: python3 scripts/data/udara_rekom.py

      - name: Prakiraan asap CAMS (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/asap.py

      - name: Data pelengkap (boleh gagal, data lama tetap dipakai)
        continue-on-error: true
        run: |
          for s in scripts/scrape/metar.py scripts/scrape/sipalaga.py scripts/scrape/ispu.py; do
            [ -f "$s" ] && timeout 300 python3 "$s" || echo "lewati $s"
          done

      - name: Uji aturan
        run: |
          python3 scripts/data/fwi.py
          python3 scripts/data/aturan.py
          python3 scripts/data/posko.py uji
          python3 scripts/data/udara_rekom.py uji

      - name: Simpan data untuk jalan berikutnya
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}

      - name: Terbitkan ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy
