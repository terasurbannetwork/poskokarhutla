name: Paparan bangunan (Open Buildings)

# Data TERKUNCI: tidak di-commit, tidak di public/. Keluaran data/terkunci/bangunan/*.json diunggah ke R2
# (poskokarhutla-foto, awalan bangunan/) dan dibaca worker setelah login.
# bulanan : unduh Open Buildings (278 ubin, ~12,7 GB, skrip bisa dilanjutkan) -> grid -> paparan -> R2.
# harian  : grid dari cache, hitung ulang terpapar.json dari data karhutla/banjir/gempa terbaru -> R2.
# Grup concurrency sendiri (bukan `data`): tidak commit/terbit, dan unduhan berjam-jam tak boleh menahan data.yml.
# Cron: statis 02 tgl 19:00, banjir 00:20, gempa 01:10, lintas 02:10, udara 06:40/18:40, data 14:20 (UTC).
on:
  schedule:
    - cron: "30 20 3 * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: bulanan (unduh ulang grid) atau harian (paparan saja)
        type: choice
        options: [bulanan, harian]
        default: harian

concurrency:
  group: bangunan
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # Matriks per kelompok pulau: bangunan.py --prov hanya memuat ubin provinsi itu, dan grid/halus per provinsi
  # identik dengan jalan --semua (ubin yang melintasi dua kelompok diunduh dua kali, hasilnya per provinsi tetap).
  # Perkiraan (SK-032, dari ukuran 278 ubin 12,7 GB; laju terukur 20 Okt: ~140 dtk/GB = unduh 9 MB/s + urai 32 dtk/GB):
  #   sumatera ~3,3 GB ~8 mnt; jawa-barat ~1,0; jawa-timur ~1,4; bali-nusra ~0,9; kalimantan ~2,4; sulawesi ~1,3; maluku-papua ~2,4.
  #   Tembok waktu terburuk (unduh 20x lebih lambat, 0,5 MB/s): sumatera ~110 mnt, kalimantan/maluku-papua ~80 mnt: tetap < 330.
  #   Satu job tunggal ~30 mnt (terbaik) sampai ~600 mnt (terburuk, melewati 360): inilah alasan matriks.
  # Disk: --hapus-mentah menghapus CSV.gz tiap ubin; ubin terbesar 1,7 GB, jauh di bawah 14 GB.
  # R2 awalan bangunan/ masuk anggaran KA 27 (perkiraan 150-300 MB): ukur dengan `wrangler r2 object list` sesudah dispatch pertama.
  bangun:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 20 3 * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'bulanan')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kelompok: sumatera, prov: "11,12,13,14,15,16,17,18,19,21"}
          - {kelompok: jawa-barat, prov: "31,32,36"}
          - {kelompok: jawa-timur, prov: "33,34,35"}
          - {kelompok: bali-nusra, prov: "51,52,53"}
          - {kelompok: kalimantan, prov: "61,62,63,64,65"}
          - {kelompok: sulawesi, prov: "71,72,73,74,75,76"}
          - {kelompok: maluku-papua, prov: "81,82,91,92,93,94,95,96"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uji mandiri
        run: python3 scripts/umum/bangunan.py --uji

      - name: Pulihkan hasil per ubin (lanjutkan unduhan)
        uses: actions/cache/restore@v4
        with:
          path: data/raw/bangunan/hasil
          key: bangunan-hasil-${{ matrix.kelompok }}-${{ github.run_id }}
          restore-keys: bangunan-hasil-${{ matrix.kelompok }}-

      - name: Bangun grid kelompok
        run: |
          set -e
          python3 scripts/umum/bangunan.py --prov "${{ matrix.prov }}" --hapus-mentah
          # kec.json hanya memuat provinsi kelompok ini; digabung di job gabung
          mv data/terkunci/bangunan/kec.json "data/terkunci/bangunan/kec_${{ matrix.kelompok }}.json"

      - name: Simpan hasil per ubin
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/bangunan/hasil
          key: bangunan-hasil-${{ matrix.kelompok }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: bangunan-${{ matrix.kelompok }}
          path: data/terkunci/bangunan/*.json
          retention-days: 1

  # Berjalan walau sebagian kelompok gagal: provinsi tanpa grid baru tetap memakai grid cache sebelumnya,
  # atau terliput:false bila belum pernah ada (paparan_bangunan.py). Harian tidak merah.
  gabung:
    needs: bangun
    if: ${{ !cancelled() && needs.bangun.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulihkan grid bulan lalu (untuk kelompok yang gagal)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/terkunci/bangunan/grid_*.json
            data/terkunci/bangunan/kec.json
          key: bangunan-grid-${{ github.run_id }}
          restore-keys: bangunan-grid-

      - uses: actions/download-artifact@v4
        with:
          pattern: bangunan-*
          path: data/terkunci/bangunan
          merge-multiple: true

      - name: Gabung kec.json
        run: |
          python3 - <<'PY'
          import glob, json, os
          d = "data/terkunci/bangunan"
          baru = sorted(glob.glob(d + "/kec_*.json"))
          if not baru:
              raise SystemExit("::warning::tidak ada kelompok yang berhasil")
          doc = json.load(open(d + "/kec.json")) if os.path.exists(d + "/kec.json") else None
          for f in baru:
              k = json.load(open(f))
              if doc is None:
                  doc = k
                  continue
              for bagian in ("prov", "kab", "kec"):
                  doc[bagian].update(k[bagian])
              for r in ("baris_dibaca", "dibuang_keyakinan_rendah", "di_luar_kecamatan"):
                  doc["ringkasan"][r] = doc["ringkasan"].get(r, 0) + k["ringkasan"].get(r, 0)
              doc["dibuat"] = max(doc["dibuat"], k["dibuat"])
          for bagian in ("prov", "kab", "kec"):
              doc[bagian] = dict(sorted(doc[bagian].items()))
          r = doc["ringkasan"]
          r["bangunan"] = sum(v[0] for v in doc["kec"].values())
          r["luas_m2"] = sum(v[1] for v in doc["kec"].values())
          r["provinsi"] = sorted(doc["prov"])
          json.dump(doc, open(d + "/kec.json", "w"), separators=(",", ":"), ensure_ascii=False)
          for f in baru:
              os.remove(f)
          print(len(r["provinsi"]), "provinsi,", r["bangunan"], "bangunan")
          PY
          ls -l data/terkunci/bangunan | head -100

      # simpan segera: bila langkah sesudahnya gagal, grid tidak hilang
      - name: Simpan grid untuk job harian
        uses: actions/cache/save@v4
        with:
          path: |
            data/terkunci/bangunan/grid_*.json
            data/terkunci/bangunan/kec.json
          key: bangunan-grid-${{ github.run_id }}

      - name: Pulihkan data karhutla terakhir
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Pulihkan data banjir terakhir
        uses: actions/cache/restore@v4
        with:
          path: |
            public/banjir/data
            data/raw/banjir
          key: banjir-${{ github.run_id }}
          restore-keys: banjir-

      - name: Uji mandiri paparan
        run: python3 scripts/umum/paparan_bangunan.py --uji

      - name: Hitung paparan
        run: python3 scripts/umum/paparan_bangunan.py

      - name: Unggah ke R2
        run: |
          set -e
          for f in data/terkunci/bangunan/*.json; do
            npx --yes wrangler@4.42.0 r2 object put "poskokarhutla-foto/bangunan/$(basename "$f")" --file "$f" --content-type application/json --remote
          done

  harian:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 8 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'harian')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uji mandiri
        run: |
          set -e
          python3 scripts/umum/bangunan.py --uji
          python3 scripts/umum/paparan_bangunan.py --uji

      - name: Pulihkan grid bulanan
        uses: actions/cache/restore@v4
        with:
          path: |
            data/terkunci/bangunan/grid_*.json
            data/terkunci/bangunan/kec.json
          key: bangunan-grid-${{ github.run_id }}
          restore-keys: bangunan-grid-

      - name: Pulihkan data karhutla terakhir
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Pulihkan data banjir terakhir
        uses: actions/cache/restore@v4
        with:
          path: |
            public/banjir/data
            data/raw/banjir
          key: banjir-${{ github.run_id }}
          restore-keys: banjir-

      # grid belum pernah dibangun (cache kosong/kedaluwarsa): jalankan mode bulanan dulu, jangan gagal merah
      - name: Cek grid
        id: grid
        run: |
          if ls data/terkunci/bangunan/grid_*.json >/dev/null 2>&1; then echo ada=1 >> "$GITHUB_OUTPUT"
          else echo "::warning::grid bangunan tidak ada di cache; jalankan workflow ini mode bulanan"; fi

      - name: Hitung paparan
        if: steps.grid.outputs.ada == '1'
        run: python3 scripts/umum/paparan_bangunan.py

      - name: Unggah terpapar.json ke R2
        if: steps.grid.outputs.ada == '1'
        run: npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/bangunan/terpapar.json --file data/terkunci/bangunan/terpapar.json --content-type application/json --remote
