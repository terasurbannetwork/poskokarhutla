name: Panen S1 banjir (Sentinel-1 RTC per kabupaten)

# Dispatch manual. Skrip: scripts/banjir/s1_genangan.py (Planetary Computer, runner Azure dekat datanya).
# Keluaran HANYA ke R2 poskokarhutla-foto/arsip/lab_banjir/s1/<KODE>.json; tidak ada commit data, tidak menerbitkan.
# Sengaja DI LUAR grup concurrency `data` (pola panen-lab-banjir.yml).
on:
  workflow_dispatch:
    inputs:
      dari:
        description: "tanggal awal YYYY-MM-DD"
        default: "2017-01-01"
      sampai:
        description: "tanggal akhir YYYY-MM-DD (kosong = kemarin)"
        default: ""
      kab:
        description: "kode kab dipisah koma (kosong = 20 kab prioritas teratas, pilot)"
        default: ""
      maks_paralel:
        description: "job paralel"
        default: "4"

concurrency:
  group: panen-s1-banjir
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2: poskokarhutla-foto/arsip/lab_banjir/s1
  WR: npx --yes wrangler@4.42.0
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  siapkan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matriks: ${{ steps.m.outputs.matriks }}
      sampai: ${{ steps.m.outputs.sampai }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          KAB: ${{ inputs.kab }}
          DARI: ${{ inputs.dari }}
          SAMPAI: ${{ inputs.sampai }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os, re, subprocess
          d = os.environ["DARI"]
          s = os.environ["SAMPAI"] or (dt.date.today() - dt.timedelta(days=1)).isoformat()
          assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", d) and re.fullmatch(r"\d{4}-\d{2}-\d{2}", s), "format YYYY-MM-DD"
          semua = subprocess.check_output(["python3", "scripts/banjir/s1_genangan.py", "daftar_kab"], text=True).split()
          kab = [k.strip() for k in os.environ["KAB"].split(",") if k.strip()] or semua[:20]
          assert all(re.fullmatch(r"\d{4}", k) and k in semua for k in kab), "kode kab tidak dikenal"
          print("matriks=" + json.dumps({"kab": kab}))
          print("sampai=" + s)
          PY

  s1:
    needs: siapkan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.maks_paralel || '4') }}
      matrix: ${{ fromJSON(needs.siapkan.outputs.matriks) }}
    env:
      KODE: ${{ matrix.kab }}
      DARI: ${{ inputs.dari }}
      SAMPAI: ${{ needs.siapkan.outputs.sampai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy rasterio pystac-client planetary-computer

      - name: Pulihkan berkas kab dari R2 (boleh gagal)
        continue-on-error: true
        run: |
          mkdir -p keluar
          $WR r2 object get "$R2/$KODE.json" --file "keluar/s1_$KODE.json" --remote \
            || { rm -f "keluar/s1_$KODE.json"; echo "belum ada di R2, mulai dari nol"; }

      - name: Uji mandiri
        run: python3 scripts/banjir/s1_genangan.py uji

      # timeout shell supaya unggah tetap jalan; 124 = habis waktu (cache adegan hilang bersama runner, dispatch ulang membaca lagi)
      - name: Panen S1 kab ini
        run: |
          set +e
          timeout 20400 python3 scripts/banjir/s1_genangan.py kab --kode "$KODE" --dari "$DARI" --sampai "$SAMPAI" --keluar keluar
          rc=$?
          echo "rc=$rc" >> "$GITHUB_ENV"
          [ "$rc" = 124 ] && echo "::warning title=s1 $KODE::habis waktu; persempit rentang dari/sampai"
          exit 0

      # Unggah hanya bila berkas ada dan lebih baru versi arsipnya (tanggal sampai tak mundur): ukuran tidak cukup, jadi bandingkan meta.sampai.
      - name: Unggah ke R2
        run: |
          set -e
          F="keluar/s1_$KODE.json"
          [ -f "$F" ] || { echo "::warning title=s1 $KODE::tidak ada berkas"; [ "${rc:-0}" = 1 ] && exit 1; exit 0; }
          if $WR r2 object get "$R2/$KODE.json" --file /tmp/r2.json --remote > /dev/null 2>&1; then
            python3 - "$F" /tmp/r2.json <<'PY' || { echo "R2 sama/lebih lengkap, tidak ditimpa"; exit 0; }
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          ok = (a["meta"]["dari"], a["meta"]["sampai"]) != (b["meta"]["dari"], b["meta"]["sampai"]) and len(a["adegan"]) >= len(b["adegan"])
          sys.exit(0 if ok else 1)
          PY
          fi
          $WR r2 object put "$R2/$KODE.json" --file "$F" --content-type application/json --remote
          [ "${rc:-0}" = 1 ] && { echo "::error title=s1 $KODE::s1_genangan keluar 1"; exit 1; }
          exit 0
