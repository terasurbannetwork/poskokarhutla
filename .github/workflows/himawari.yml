name: Titik Himawari tiap 30 menit

# Himawari-9 WLF (JAXA P-Tree) -> public/data/himawari.json -> langsung ke R2, tanpa deploy penuh.
# H90: langkah terakhir menambah awan_tumbuh.py (NOAA S3 pita 13, 2 pindaian, ±18 MB, ±90 dtk) di kadens 30 menit yang SAMA, jadi tidak ada
# workflow baru. Keluarannya TIDAK di-commit (48 commit/hari memicu 48 terbit_antre: public/udara/data/** tidak dikecualikan) tetapi diunggah ke R2
# data/awan_tumbuh.json seperti himawari.json; berkas tayang ini menimpa dirinya tiap 30 menit, tanpa arsip git.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: himawari
  cancel-in-progress: true

jobs:
  himawari:
    runs-on: ubuntu-latest
    timeout-minutes: 16   # 8 + awan_tumbuh (±90 dtk di Actions; uji lokal sekali 1035 dtk di jaringan lambat; batas langkah 6 mnt) + unggah
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ST-01: himawari.py membaca keluaran lama untuk mempertahankan status_sumber.terputus_sejak (awal galat PERTAMA) dan data lama.
      # Pulihkan dari R2 (berkas tayang); belum ada / gagal = mulai kosong, himawari.py menangani.
      - name: Pulihkan keluaran lama dari R2 (boleh gagal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p public/data
          npx --yes wrangler@4.42.0 r2 object get poskokarhutla-foto/data/himawari.json --file public/data/himawari.json --remote || { rm -f public/data/himawari.json; echo "::warning title=himawari::keluaran lama R2 tidak terpulihkan; terputus_sejak mulai dari sekarang"; }  # wrangler 4: --remote wajib

      # Sumber terputus = himawari.py keluar 0 dan tetap menulis himawari.json bersetatus terputus; langkah unggah di bawah SENGAJA jalan.
      - name: Tarik titik Himawari
        env:
          PTREE_USER: ${{ secrets.PTREE_USER }}
          PTREE_PASS: ${{ secrets.PTREE_PASS }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}   # opsional: kosong = himawari.py jatuh ke hotspot72.json
          HIMAWARI_JAM_PENANDA: "13"
        run: python3 scripts/data/himawari.py

      - name: Unggah ke R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/data/himawari.json --file public/data/himawari.json --content-type application/json --remote  # wrangler 4: bawaan LOKAL, --remote wajib

      # Arsip bertanggal untuk melatih/menguji model per jam (deteksi awal, sebaran 1 jam).
      # Kunci: arsip/himawari/YYYY/MM/DD/<HHMM acuan>.json.gz, acuan dari medan "acuan" di himawari.json
      # (UTC; acuan yang sama menimpa kunci yang sama, jadi putaran tanpa data baru tidak menggandakan).
      # Biaya R2 (paket Free 10 GB): jendela 3 jam berisi ratusan-ribuan baris x ~40 B = ~10-60 KB
      # setelah gzip; paling banyak 48 objek/hari = ~0,5-3 MB/hari = ~15-90 MB/bulan = ~0,2-1 GB/tahun.
      # Jauh di bawah 10 GB, jadi TANPA retensi/penghapusan: arsip sengaja dibiarkan menumpuk.
      # Pantau ukuran awalan arsip/himawari/ tiap triwulan; bila mendekati 5 GB, rapatkan (mis. simpan tiap jam).
      # Jendela tumpang tindih 3 jam (tiap titik muncul di hingga ~6 arsip): deduplikasi saat melatih lewat kolom u/u0.
      - name: Arsipkan salinan bertanggal ke R2 (boleh gagal)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          [ -f public/data/himawari.json ] || { echo "tidak ada himawari.json, arsip dilewati"; exit 0; }
          KUNCI=$(python3 -c "import json;a=json.load(open('public/data/himawari.json'))['acuan'];print('arsip/himawari/%s/%s/%s/%s%s.json.gz'%(a[0:4],a[5:7],a[8:10],a[11:13],a[14:16]))")
          gzip -9 -c public/data/himawari.json > himawari.json.gz
          echo "arsip: $KUNCI ($(stat -c %s himawari.json.gz) B)"
          npx --yes wrangler@4.42.0 r2 object put "poskokarhutla-foto/$KUNCI" --file himawari.json.gz --content-type application/gzip --remote  # wrangler 4: bawaan LOKAL, --remote wajib

      # Awan tumbuh cepat per kabupaten (H12, A2). Terpisah dari WLF: sumber NOAA, jadi gagal sendiri tanpa menahan himawari.json.
      # `uji` sengaja TIDAK dijalankan di sini (unduh ±24 MB tambahan tiap 30 menit); ia jalan di `npm run uji:hidromet` dan arsip-bmkg.yml (awan_himawari).
      - name: Awan tumbuh cepat Himawari (boleh gagal)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/udara/awan_tumbuh.py || { echo "::warning title=awan_tumbuh::gagal; berkas R2 lama dibiarkan"; exit 0; }
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/data/awan_tumbuh.json --file public/udara/data/awan_tumbuh.json --content-type application/json --remote  # wrangler 4: bawaan LOKAL, --remote wajib
