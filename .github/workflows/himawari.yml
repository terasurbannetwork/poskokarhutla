name: Titik Himawari tiap 30 menit

# Himawari-9 WLF (JAXA P-Tree) -> public/data/himawari.json -> langsung ke R2, tanpa deploy penuh.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: himawari
  cancel-in-progress: true

jobs:
  himawari:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik titik Himawari
        env:
          PTREE_USER: ${{ secrets.PTREE_USER }}
          PTREE_PASS: ${{ secrets.PTREE_PASS }}
        run: python3 scripts/data/himawari.py

      - name: Unggah ke R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 r2 object put poskokarhutla-foto/data/himawari.json --file public/data/himawari.json --content-type application/json --remote
