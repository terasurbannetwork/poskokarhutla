name: Titik panas tiap 3 jam

# Lintasan VIIRS/MODIS masuk FIRMS NRT sepanjang hari; tiap 3 jam titik panas, kompleks, posko, dan kebutuhan operasi
# dihitung ulang lalu diterbitkan. FWI tidak dihitung ulang (FWI=0: cuaca siang cukup sekali sehari, hemat kuota Open-Meteo).
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  titik:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 30 + jejak api harian (sampai 15 menit) di putaran 21-23 UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulihkan data karhutla terakhir
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      # luas_resmi.json TIDAK di sini: data.yml menariknya harian dari SiPongi; versi repo akan menimpa bulan baru
      - name: Pakai lapisan statis dari repo, bukan dari cache
        run: |
          f=$(git ls-files public/data/penduduk.json public/data/fasilitas.json public/data/kanal.json public/data/jalan.geojson \
            public/data/lapisan_tambahan.json public/data/model_sebaran.json public/data/musim.json public/data/musim_awal.json \
            public/data/tren_karhutla.json 'public/data/sebaran_*.json' public/data/gerbang_model.json public/data/sejarah.json public/data/sejarah_modis.json \
            public/data/riwayat_grid.json public/data/riwayat_sel public/data/riwayat_desa public/data/riwayat_langganan.json public/data/riwayat_sel_uji.json public/data/luas_satelit.json public/data/udara.json \
            public/data/daops.json public/data/preventif.json public/data/operasi_resmi.json public/data/aktor_karhutla.json public/data/aktor_greenpeace.json public/data/konsesi2026 public/data/factsheet_karhutla.json \
            public/data/kontak.json public/data/mitra.json public/data/tim.json public/data/pabrik_sawit.json public/data/cari.json public/data/lahan public/data/osm public/data/titik_palsu.json)
          [ -z "$f" ] || git checkout HEAD -- $f

      # sekali jalan: musim_harian.json dibangun ulang dengan latar median; cache data- lama (latar lain) tidak boleh menang.
      # Cache sudah bermedian -> dibiarkan (bergulir). Hapus langkah ini sesudah semua cache bermedian.
      - name: Pulihkan musim_harian dari repo bila latar cache bukan median
        run: |
          python3 -c "import json,sys; sys.exit(0 if json.load(open('public/data/musim_harian.json'))['latar']['stat']=='median' else 1)" 2>/dev/null \
            || { f=$(git ls-files public/data/musim_harian.json); [ -z "$f" ] || git checkout HEAD -- $f; }

      - name: Titik panas, kompleks (FWI dipakai ulang)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FWI: "0"
        run: python3 scripts/data/harian.py

      - name: Turunan kompleks (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/data/konsesi_kompleks.py
          python3 scripts/warga/titik24.py
          python3 scripts/data/posko.py
          python3 scripts/data/operasi.py
          python3 scripts/data/ringkasan.py
          python3 scripts/data/aktor_walhi.py  # terakhir: gagalnya tidak menahan turunan lain

      # Luas terbakar / belum padam metode deck BNPB (indikator Real Time, overlay kabupaten, laporan, API v1). Hari WIB d lengkap
      # sesudah d+1 04.00, jadi putaran pagi menerbitkan kemarin. Harian hanya mengunduh hari baru + 4 hari terakhir (± 2 menit);
      # trio prov/kab/wil yang hilang atau tak selaras = bangun ulang penuh (± 35 menit), dicicil antarputaran lewat cache peta-utc-.
      - name: Pulihkan cache FIRMS per hari UTC untuk peta luas
        uses: actions/cache/restore@v4
        with:
          path: data/raw/peta_karhutla/utc
          key: peta-utc-${{ github.run_id }}
          restore-keys: peta-utc-

      - name: Peta luas terbakar dan belum padam (boleh gagal)
        continue-on-error: true
        timeout-minutes: 12
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          # cache data- bisa membawa trio yang lebih tua atau tak lengkap dari versi repo: pakai versi repo bila lebih baru
          akhir() { python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['hari'][-1])" "$1" 2>/dev/null || echo 0; }
          git show HEAD:public/data/peta_karhutla.json > /tmp/pk_repo.json 2>/dev/null || true
          if [ ! -f public/data/peta_karhutla_kab.json ] || [ ! -f public/data/peta_karhutla_wil.json ] \
             || [[ "$(akhir /tmp/pk_repo.json)" > "$(akhir public/data/peta_karhutla.json)" ]]; then
            f=$(git ls-files 'public/data/peta_karhutla*.json'); [ -z "$f" ] || git checkout HEAD -- $f
          fi
          python3 scripts/data/peta_karhutla.py --uji
          python3 scripts/data/peta_karhutla.py

      - name: Simpan cache FIRMS per hari UTC untuk peta luas
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw/peta_karhutla/utc
          key: peta-utc-${{ github.run_id }}

      - name: Kendala lapangan per kompleks (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/kendala.py --uji && python3 scripts/data/kendala.py

      - name: Taktik per kompleks (boleh gagal)
        continue-on-error: true
        run: python3 scripts/data/taktik.py uji && python3 scripts/data/taktik.py || echo "::warning title=taktik::taktik.py gagal; tugas_kompleks.json tanpa rekomendasi"

      # ID insiden stabil + front/masuk/luas terkoreksi/tren; status bergulir di public/data/insiden.json (cache data-, BUKAN dari repo:
      # jangan masukkan ke daftar "lapisan statis"). Menyisipkan kunci ke tugas_kompleks.json, jadi HARUS sesudah taktik.py.
      - name: Insiden api, front, luas terkoreksi (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/data/insiden.py --uji && python3 scripts/data/insiden.py || echo "::warning title=insiden::insiden.py gagal; tugas_kompleks.json tanpa kunci insiden"
          python3 scripts/data/watak_kluster.py uji && python3 scripts/data/watak_kluster.py || echo "::warning title=watak::watak_kluster.py gagal; cluster tanpa pola lokasi"
          python3 scripts/data/kabar_kab.py --uji && python3 scripts/data/kabar_kab.py || echo "::warning title=kabar::kabar_kab.py gagal; /kabar memakai data sebelumnya"

      - name: Laporan harian & kurva musim (boleh gagal)
        id: laporan
        continue-on-error: true
        run: python3 scripts/data/laporan.py

      - name: Laporan harian gagal (peringatan)
        if: steps.laporan.outcome == 'failure'
        run: |
          echo "::error title=Laporan harian gagal::scripts/data/laporan.py gagal; laporan.json dan musim_harian.json tidak diperbarui di run ini (deploy data lain tetap jalan)"
          echo "### Laporan harian GAGAL" >> "$GITHUB_STEP_SUMMARY"
          echo "laporan.py gagal di run ini. laporan.json dan musim_harian.json memakai versi sebelumnya (cache). Lihat log langkah 'Laporan harian & kurva musim'." >> "$GITHUB_STEP_SUMMARY"

      # Uji prospektif model "akan membesar": catat ramalan titik api baru, nilai 72 jam kemudian (stdlib; data dari hotspot.json,
      # cuaca Open-Meteo <= 400 bobot/jalan). Catatan bergulir lewat cache Actions, ringkasan -> public/data/prospektif.json.
      - name: Pulihkan catatan uji prospektif
        uses: actions/cache/restore@v4
        with:
          path: data/raw/sebaran/prospektif
          key: prospektif-${{ github.run_id }}
          restore-keys: prospektif-

      # arsip jangka panjang di R2: cache Actions bisa hilang (7 hari tak dipakai / evict), arsip tidak. Gagal = lanjut dengan cache saja.
      - name: Pulihkan arsip prospektif dari R2 (boleh gagal)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.42.0 r2 object get poskokarhutla-foto/arsip/prospektif.jsonl.gz --file /tmp/arsip.jsonl.gz --remote  # wrangler 4: bawaan LOKAL, --remote wajib
          python3 scripts/sebaran/prospektif.py pulih /tmp/arsip.jsonl.gz

      # hanya sel kompleks Siaga/Prioritas BARU (berkas sel < 20 jam dilewati), maks 60 sel = ± 200 panggilan kuota
      - name: Cuaca per jam sel baru (boleh gagal)
        continue-on-error: true
        timeout-minutes: 5
        env:
          CUACA_SEL_MAKS: "60"
        run: python3 scripts/data/cuaca_jam.py

      - name: Uji prospektif model membesar (boleh gagal)
        id: prosp
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/sebaran/prospektif.py

      # Gerbang "model harus menang lawan pembanding sederhana" -> public/data/gerbang_model.json (terbit bersama public/data lewat
      # cache + deploy, seperti prospektif.json). Sesudah prospektif.py karena membaca ringkasannya. Self-check dulu.
      - name: Gerbang model vs pembanding sederhana (boleh gagal)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/sebaran/gerbang.py uji && python3 scripts/sebaran/gerbang.py

      - name: Arsipkan catatan prospektif ke R2 (boleh gagal)
        if: steps.prosp.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # arsip lama dari R2 sebagai pembanding: prospektif.py menolak (kode 3, unggah tidak jalan) bila arsip baru menyusut.
          # Object belum ada / unduh gagal = tanpa pembanding (penanda arsip_tanda.json di cache masih menjaga).
          npx --yes wrangler@4.42.0 r2 object get poskokarhutla-foto/arsip/prospektif.jsonl.gz --file /tmp/lama.jsonl.gz --remote || rm -f /tmp/lama.jsonl.gz
          python3 scripts/sebaran/prospektif.py arsip /tmp/arsip.jsonl.gz /tmp/lama.jsonl.gz
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/arsip/prospektif.jsonl.gz --file /tmp/arsip.jsonl.gz --content-type application/gzip --remote

      # Jejak api: simulasi sebaran +24/+48/+72 jam tiap kompleks aktif (model data + cuaca prakiraan) -> public/data/jejak_api.json
      # (dibaca src/ews.js untuk peringatan email). Cache cuaca ikut folder prospektif (disimpan di langkah berikutnya). Anggaran sendiri 420 dtk.
      - name: Jejak api kompleks aktif (boleh gagal)
        continue-on-error: true
        timeout-minutes: 17   # JEJAK_DETIK 900 (300 kompleks, 16 Okt 2026: 40 kompleks = 49 dtk) + kelonggaran tulis berkas
        # sekali sehari (pemilik: "pipeline harian"; sampai ~15 menit per jalan, tiap 3 jam = ~3.600 menit Actions/bulan): putaran 21:40 UTC
        # = 04:40 WIB, jadi email terkirim pagi. Jendela 21-23 UTC menampung keterlambatan jadwal GitHub. Manual (dispatch) selalu jalan.
        run: |
          jam=$(date -u +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$jam" -lt 21 ]; then echo "jejak dilewati (jam UTC $jam, harian 21-23)"; exit 0; fi
          python3 scripts/sebaran/jejak.py

      # run yang gagal sebelum langkah pulihkan (mis. FIRMS putus 20 Okt) dulu menyimpan salinan kosong dari git dan memutus rantai catatan
      - name: Simpan catatan uji prospektif
        if: always() && steps.prosp.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw/sebaran/prospektif
          key: prospektif-${{ github.run_id }}

      - name: Pulihkan data banjir terakhir
        uses: actions/cache/restore@v4
        with:
          # jalur HARUS sama persis dengan simpanan banjir.yml (versi cache dihitung dari daftar jalur); beda = cache tidak ditemukan
          path: |
            public/banjir/data
            data/raw/banjir
          key: banjir-${{ github.run_id }}
          restore-keys: banjir-

      # Prioritas dampak tiap 6 jam (Ruang Koordinasi F2): jalan 00, 06, 12, 18 UTC menumpang titik panas segar dari langkah di atas; bahaya lain dari
      # cache banjir- yang dipulihkan. Uji balik prospektif tetap harian di lintas.yml. Worker membaca hasilnya menit 55 (src/pengingat.js).
      - name: Indeks risiko dan prioritas dampak tiap 6 jam (boleh gagal)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # cron 40 */3 telat 30-45 menit, jadi jam jatuh di 1,4,7,..; j%6 <= 2 menangkap satu dari tiap dua putaran (sekali per 6 jam)
          j=$((10#$(date -u +%H)))
          if [ $((j % 6)) -gt 2 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "jam $j UTC: bukan giliran 6 jam"; exit 0; fi
          python3 scripts/bnpb/risiko.py --cek && python3 scripts/bnpb/risiko.py
          python3 scripts/bnpb/prioritas.py --cek && python3 scripts/bnpb/prioritas.py

      # citra satelit ikut tiap 3 jam supaya galeri Insight & laci kompleks tidak pernah kosong (cache gambar dipakai ulang, jadi cepat)
      - name: Citra satelit kompleks prioritas (boleh gagal)
        continue-on-error: true
        timeout-minutes: 12
        env:
          CITRA_DETIK: "300"
        run: python3 scripts/data/citra.py

      - name: Gambar pratinjau tautan (boleh gagal)
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/og/buat.py

      - name: Simpan data untuk jalan berikutnya
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}

      - name: Salin peringatan BMKG terbaru
        run: cp public/banjir/data/peringatan.json public/data/ 2>/dev/null || true

      # citra satelit punya cache sendiri (PNG besar, tidak ikut cache data-); jalur harus sama persis dengan simpanannya
      - name: Pulihkan citra satelit
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/citra
            public/data/citra.json
          key: citra-${{ github.run_id }}
          restore-keys: citra-

      - name: Terbitkan ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/terbit/versi.py
          npx --yes wrangler@4.42.0 deploy

      # /api/status menjawab 503 bila sumber kunci basi (titik > 8 jam, banjir/berita > 30 jam): run jadi merah, tidak gagal diam.
      # Tanpa token Cloudflare (jalur commit) terbitnya lewat build lain, jadi dilewati.
      - name: Periksa kesegaran data yang tayang
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          URL_STATUS: ${{ vars.URL_STATUS || 'https://centurisk97.id/api/status' }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 0
          for i in 1 2 3; do
            kode=$(curl -sS -m 30 -o status.json -w '%{http_code}' "$URL_STATUS") || kode=000
            echo "percobaan $i: HTTP $kode"; cat status.json 2>/dev/null || true; echo
            [ "$kode" = 200 ] && exit 0
            sleep 30
          done
          echo "::error title=Data basi::/api/status HTTP $kode $(cat status.json 2>/dev/null)"
          exit 1
