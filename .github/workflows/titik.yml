name: Titik panas tiap 3 jam

# Lintasan VIIRS/MODIS masuk FIRMS NRT sepanjang hari; tiap 3 jam titik panas, kompleks, posko, dan kebutuhan operasi
# dihitung ulang lalu diterbitkan. FWI tidak dihitung ulang (FWI=0: cuaca siang cukup sekali sehari, hemat kuota Open-Meteo).
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  titik:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulihkan data karhutla terakhir
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Pakai lapisan statis dari repo, bukan dari cache
        run: |
          f=$(git ls-files public/data/penduduk.json public/data/fasilitas.json public/data/kanal.json public/data/jalan.geojson \
            public/data/lapisan_tambahan.json public/data/model_sebaran.json public/data/musim.json public/data/musim_awal.json \
            public/data/tren_karhutla.json 'public/data/sebaran_*.json' public/data/sejarah.json public/data/sejarah_modis.json \
            public/data/riwayat_grid.json public/data/luas_resmi.json public/data/luas_satelit.json public/data/udara.json \
            public/data/daops.json public/data/preventif.json public/data/operasi_resmi.json public/data/lahan public/data/osm)
          [ -z "$f" ] || git checkout HEAD -- $f

      - name: Titik panas, kompleks (FWI dipakai ulang)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FWI: "0"
        run: python3 scripts/data/harian.py

      - name: Turunan kompleks (boleh gagal)
        continue-on-error: true
        run: |
          python3 scripts/data/konsesi_kompleks.py
          python3 scripts/warga/titik24.py
          python3 scripts/data/posko.py
          python3 scripts/data/operasi.py
          python3 scripts/data/ringkasan.py

      # Uji prospektif model "akan membesar": catat ramalan titik api baru, nilai 72 jam kemudian (stdlib; data dari hotspot.json,
      # cuaca Open-Meteo <= 400 bobot/jalan). Catatan bergulir lewat cache Actions, ringkasan -> public/data/prospektif.json.
      - name: Pulihkan catatan uji prospektif
        uses: actions/cache/restore@v4
        with:
          path: data/raw/sebaran/prospektif
          key: prospektif-${{ github.run_id }}
          restore-keys: prospektif-

      # hanya sel kompleks Siaga/Prioritas BARU (berkas sel < 20 jam dilewati), maks 60 sel = ± 200 panggilan kuota
      - name: Cuaca per jam sel baru (boleh gagal)
        continue-on-error: true
        timeout-minutes: 5
        env:
          CUACA_SEL_MAKS: "60"
        run: python3 scripts/data/cuaca_jam.py

      - name: Uji prospektif model membesar (boleh gagal)
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/sebaran/prospektif.py

      # Jejak api: simulasi sebaran +24/+48/+72 jam tiap kompleks aktif (model data + cuaca prakiraan) -> public/data/jejak_api.json
      # (dibaca src/ews.js untuk peringatan email). Cache cuaca ikut folder prospektif (disimpan di langkah berikutnya). Anggaran sendiri 420 dtk.
      - name: Jejak api kompleks aktif (boleh gagal)
        continue-on-error: true
        timeout-minutes: 10
        # sekali sehari (pemilik: "pipeline harian"; ~7 menit per jalan, tiap 3 jam = ~1.800 menit Actions/bulan): putaran 21:40 UTC
        # = 04:40 WIB, jadi email terkirim pagi. Jendela 21-23 UTC menampung keterlambatan jadwal GitHub. Manual (dispatch) selalu jalan.
        run: |
          jam=$(date -u +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$jam" -lt 21 ]; then echo "jejak dilewati (jam UTC $jam, harian 21-23)"; exit 0; fi
          python3 scripts/sebaran/jejak.py

      - name: Simpan catatan uji prospektif
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw/sebaran/prospektif
          key: prospektif-${{ github.run_id }}

      - name: Pulihkan data banjir terakhir
        uses: actions/cache/restore@v4
        with:
          # jalur HARUS sama persis dengan simpanan banjir.yml (versi cache dihitung dari daftar jalur); beda = cache tidak ditemukan
          path: |
            public/banjir/data
            data/raw/banjir
          key: banjir-${{ github.run_id }}
          restore-keys: banjir-

      # citra satelit ikut tiap 3 jam supaya galeri Insight & laci kompleks tidak pernah kosong (cache gambar dipakai ulang, jadi cepat)
      - name: Citra satelit kompleks prioritas (boleh gagal)
        continue-on-error: true
        timeout-minutes: 12
        env:
          CITRA_DETIK: "300"
        run: python3 scripts/data/citra.py

      - name: Gambar pratinjau tautan (boleh gagal)
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/og/buat.py

      - name: Simpan data untuk jalan berikutnya
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}

      - name: Salin peringatan BMKG terbaru
        run: cp public/banjir/data/peringatan.json public/data/ 2>/dev/null || true

      # citra satelit punya cache sendiri (PNG besar, tidak ikut cache data-); jalur harus sama persis dengan simpanannya
      - name: Pulihkan citra satelit
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/citra
            public/data/citra.json
          key: citra-${{ github.run_id }}
          restore-keys: citra-

      - name: Terbitkan ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/terbit/versi.py
          npx --yes wrangler@3 deploy

      # /api/status menjawab 503 bila sumber kunci basi (titik > 8 jam, banjir/berita > 30 jam): run jadi merah, tidak gagal diam.
      # Tanpa token Cloudflare (jalur commit) terbitnya lewat build lain, jadi dilewati.
      - name: Periksa kesegaran data yang tayang
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          URL_STATUS: ${{ vars.URL_STATUS || 'https://poskokarhutla.terasurbannetwork.workers.dev/api/status' }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 0
          for i in 1 2 3; do
            kode=$(curl -sS -m 30 -o status.json -w '%{http_code}' "$URL_STATUS") || kode=000
            echo "percobaan $i: HTTP $kode"; cat status.json 2>/dev/null; echo
            [ "$kode" = 200 ] && exit 0
            sleep 30
          done
          echo "::error title=Data basi::/api/status HTTP $kode $(cat status.json 2>/dev/null)"
          exit 1
