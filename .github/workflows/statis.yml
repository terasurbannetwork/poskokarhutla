name: Lapisan statis (OSM, WorldPop)

# Tanggal 2 tiap bulan pukul 02.00 WIB, saat Overpass publik sepi: jalan, fasilitas, kanal, penduduk.
# Sesudah itu lapisan bulanan lintas bencana (gempa, embung kekeringan), langkah dan commit TERPISAH supaya yang gagal tidak menahan yang lama.
on:
  schedule:
    - cron: "0 19 2 * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  statis:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # Overpass publik sering 504; tarik_osm mengulang sendiri dengan jeda; + bukti gempa (Overpass) dan embung
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik OSM (jalan, fasilitas, kanal) 9 provinsi
        run: |
          python3 scripts/scrape/tarik_osm.py fasilitas
          python3 scripts/scrape/tarik_osm.py jalan
          python3 scripts/scrape/tarik_osm.py sungai

      - name: Bangun lapisan
        run: |
          python3 scripts/scrape/fasilitas.py
          python3 scripts/scrape/kanal.py
          python3 scripts/scrape/akses.py graf
          python3 scripts/data/penduduk.py

      - name: Konsesi (Kemenhut PPKH/PBPH, Trase HTI, GFW sawit/HPH)
        run: |
          python3 scripts/scrape/konsesi.py
          python3 scripts/scrape/konsesi.py periksa || true

      # urutan: pabrik dulu (cari memakainya), cari sesudah konsesi.geojson baru
      - name: Pabrik sawit & indeks cari
        run: |
          python3 scripts/scrape/pabrik.py
          python3 scripts/scrape/cari_konsesi.py

      - name: Simpan graf jalan untuk jalan harian
        uses: actions/cache/save@v4
        with:
          path: data/graf_jalan.json.gz
          key: graf-${{ github.run_id }}

      - name: Commit
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/fasilitas.json public/data/kanal.json public/data/jalan.geojson public/data/penduduk.json public/data/lahan/konsesi.geojson public/data/pabrik_sawit.json public/data/cari.json data/raw/konsesi/sanksi_karhutla.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: lapisan statis $(TZ=Asia/Jakarta date +%F)"
          git pull -q --rebase && git push -q

      # ---- Lapisan bulanan lintas bencana. Semua boleh gagal; keluaran di folder di luar cache, jadi HARUS di-commit ke main (terbit.yml/titik.yml
      # mengambilnya dari checkout). Dijalankan SESUDAH Commit di atas: berkas yang setengah tertulis tidak boleh menghalangi `git pull --rebase`.
      # Urutan gempa: riwayat, bahaya, sesar, bukti (bukti.py membaca sesar.geojson, jadi sesar dulu). Tanpa tangan: semua tanpa argumen, tanpa input.
      - name: Gempa bulanan, riwayat USGS, InaRISK, sesar, bukti (boleh gagal)
        continue-on-error: true
        timeout-minutes: 120
        run: |
          for s in riwayat bahaya sesar bukti; do
            python3 scripts/gempa/$s.py uji && { python3 scripts/gempa/$s.py || echo "::warning title=gempa-$s::$s.py gagal; berkas lamanya dibiarkan"; } || echo "::warning title=gempa-$s::uji $s.py gagal"
          done

      - name: Embung dan waduk kekeringan (boleh gagal)
        continue-on-error: true
        timeout-minutes: 45
        run: python3 scripts/kekeringan/embung.py uji && python3 scripts/kekeringan/embung.py

      # bahaya.py MENGHAPUS lapisan lama bila sumbernya tak terjangkau (aturan A18): berkas yang hilang dipulihkan dari index, bukan di-commit sebagai hapus.
      - name: Commit lapisan bulanan lintas bencana
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          B="public/gempa/data/riwayat_m5.json public/gempa/data/riwayat_prov.json public/gempa/data/riwayat_grid.json public/gempa/data/risiko.json public/gempa/data/meta.json public/gempa/data/inarisk_gempa.json public/gempa/data/inarisk_tsunami.json public/gempa/data/batas_lempeng.geojson public/gempa/data/bahaya_meta.json public/gempa/data/sesar.geojson public/gempa/data/bukti.json public/kekeringan/data/embung.json"
          for f in $B; do [ ! -f "$f" ] || git add "$f"; done
          git checkout -- public/gempa/data public/kekeringan/data
          git diff --cached --quiet && { echo "lapisan bulanan tidak berubah"; exit 0; }
          git commit -q -m "data: lapisan bulanan gempa dan kekeringan $(TZ=Asia/Jakarta date +%F)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push -q && exit 0
            echo "push bentrok, ulang $i"; sleep $((i * 10))
          done
          echo "::error title=Push lapisan bulanan gagal::git push ke main gagal 3x"
          exit 1
