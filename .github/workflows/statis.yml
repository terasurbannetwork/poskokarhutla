name: Lapisan statis (OSM, WorldPop)

# Tanggal 2 tiap bulan pukul 02.00 WIB, saat Overpass publik sepi: jalan, fasilitas, kanal, penduduk.
# Sesudah itu lapisan bulanan lintas bencana (gempa, embung kekeringan), langkah dan commit TERPISAH supaya yang gagal tidak menahan yang lama.
on:
  schedule:
    - cron: "0 19 2 * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  statis:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # Overpass publik sering 504; tarik_osm mengulang sendiri dengan jeda; + bukti gempa (Overpass) dan embung
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik OSM (jalan, fasilitas, kanal, sumber air) 9 provinsi
        run: |
          python3 scripts/scrape/tarik_osm.py fasilitas
          python3 scripts/scrape/tarik_osm.py jalan
          python3 scripts/scrape/tarik_osm.py sungai
          python3 scripts/scrape/tarik_osm.py air

      - name: Bangun lapisan
        run: |
          python3 scripts/scrape/fasilitas.py
          python3 scripts/scrape/kanal.py
          python3 scripts/scrape/kanal_garis.py || echo "::warning::kanal_garis gagal, garis kanal tidak diperbarui"
          python3 scripts/scrape/akses.py graf
          python3 scripts/scrape/air_dem.py bangun
          python3 scripts/data/penduduk.py

      - name: Konsesi (Kemenhut PPKH/PBPH, Trase HTI, GFW sawit/HPH)
        env:
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
        run: |
          python3 scripts/scrape/konsesi.py
          python3 scripts/scrape/konsesi.py periksa || true

      # urutan: pabrik dulu (cari memakainya), cari sesudah konsesi.geojson baru
      - name: Pabrik sawit & indeks cari
        run: |
          python3 scripts/scrape/pabrik.py
          python3 scripts/scrape/cari_konsesi.py

      - name: Simpan graf jalan untuk jalan harian
        uses: actions/cache/save@v4
        with:
          path: data/graf_jalan.json.gz
          key: graf-${{ github.run_id }}

      - name: Simpan titik sumber air untuk jalan harian
        uses: actions/cache/save@v4
        with:
          path: data/air_titik.json.gz
          key: air-${{ github.run_id }}

      # arsip permanen: cache graf-/air- bisa dibuang GitHub saat cache data- membengkak; data.yml memulihkannya dari sini
      - name: Arsipkan graf dan titik air ke R2 (boleh gagal)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/arsip/graf_jalan.json.gz --file data/graf_jalan.json.gz --remote
          npx --yes wrangler@4.42.0 r2 object put poskokarhutla-foto/arsip/air_titik.json.gz --file data/air_titik.json.gz --remote

      - name: Commit
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          [ ! -d public/data/kanal ] || git add public/data/kanal/
          git add public/data/fasilitas.json public/data/kanal.json public/data/jalan.geojson public/data/penduduk.json public/data/lahan/konsesi.geojson public/data/pabrik_sawit.json public/data/cari.json data/raw/konsesi/sanksi_karhutla.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: lapisan statis $(TZ=Asia/Jakarta date +%F)"
          git pull -q --rebase && git push -q

  # Job TERPISAH (15 Nov 2026): langkah OSM di atas menggantung 6 jam (Overpass) dan run dibatalkan, jadi semua yang di bawah tidak pernah jalan
  # (riwayat gempa, meta, embung, paparan gunung api berhenti sejak Okt). Tanpa needs: berjalan paralel dan tak bergantung OSM.
  bulanan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- Lapisan bulanan lintas bencana. Semua boleh gagal; keluaran di folder di luar cache, jadi HARUS di-commit ke main (terbit.yml/titik.yml
      # mengambilnya dari checkout). Dijalankan SESUDAH Commit di atas: berkas yang setengah tertulis tidak boleh menghalangi `git pull --rebase`.
      # Urutan gempa: riwayat, bahaya, sesar, bukti (bukti.py membaca sesar.geojson, jadi sesar dulu), citra (Sentinel-2 STAC M>=6,5 darat dari riwayat_m5.json, ±9 menit). Tanpa tangan: semua tanpa argumen, tanpa input.
      - name: Gempa bulanan, riwayat USGS, InaRISK, sesar, bukti (boleh gagal)
        continue-on-error: true
        timeout-minutes: 120
        run: |
          for s in riwayat bahaya sesar bukti citra; do
            python3 scripts/gempa/$s.py uji && { python3 scripts/gempa/$s.py || echo "::warning title=gempa-$s::$s.py gagal; berkas lamanya dibiarkan"; } || echo "::warning title=gempa-$s::uji $s.py gagal"
          done

      - name: Embung dan waduk kekeringan (boleh gagal)
        continue-on-error: true
        timeout-minutes: 45
        run: python3 scripts/kekeringan/embung.py uji && python3 scripts/kekeringan/embung.py

      # Mentah gunung api (krb.geojson, wiup_*, pop_piksel) memakai kunci lintas- yang SAMA dengan lintas.yml: KRB ESDM sering mati, dan salinan
      # cache membuat paparan tetap bisa dihitung. Jalur HARUS sama persis dengan lintas.yml (PB-68.10).
      - name: Pulihkan data mentah gunung api
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/kekeringan
            data/raw/kekeringan_hujan.json
            data/raw/gunungapi
          key: lintas-${{ github.run_id }}
          restore-keys: lintas-

      # paparan.py (KRB ESDM, InaRISK, Overpass) lalu citra.py (Sentinel-2 STAC): citra.py menjaga kolom `citra` di paparan.json, jadi urutannya ini.
      # KRB ESDM mati = gunung tanpa KRB jatuh ke InaRISK/cincin radius (paparan.py:16), bukan dikarang.
      - name: Paparan dan citra gunung api (boleh gagal)
        continue-on-error: true
        timeout-minutes: 90
        run: |
          # TIF WorldPop dulu: paparan.py menghitung penduduk gunung baru dari TIF, pop_grid.py memakai cache atau TIF yang sama
          if [ ! -f data/raw/penduduk/idn_pop_2026_CN_1km_R2025A_UA_v1.tif ]; then
            mkdir -p data/raw/penduduk
            curl -fsSL -m 900 -A "poskokarhutla/1.0" -o data/raw/penduduk/idn_pop_2026_CN_1km_R2025A_UA_v1.tif \
              https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/2026/IDN/v1/1km_ua/constrained/idn_pop_2026_CN_1km_R2025A_UA_v1.tif || echo "::warning::TIF WorldPop gagal diunduh"
          fi
          python3 scripts/gunungapi/paparan.py uji && { python3 scripts/gunungapi/paparan.py || echo "::warning title=gunungapi-paparan::paparan.py gagal; berkas lamanya dibiarkan"; }
          python3 scripts/gunungapi/citra.py uji && { python3 scripts/gunungapi/citra.py || echo "::warning title=gunungapi-citra::citra.py gagal; berkas lamanya dibiarkan"; }

      # Indeks risiko riwayat letusan (GVP) bulanan; dulu tanpa jadwal sehingga risiko.json beku (19 Okt 2026). Keluaran di-commit di langkah di bawah.
      - name: Indeks risiko riwayat letusan gunung api (boleh gagal)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/gunungapi/risiko.py uji && { python3 scripts/gunungapi/risiko.py || echo "::warning title=gunungapi-risiko::risiko.py gagal; berkas lamanya dibiarkan"; }

      # Piksel penduduk per gunung untuk simulasi (pop_grid.py membaca cache pop_piksel.json dari paparan.py, atau TIF WorldPop bila belum ada).
      - name: Piksel penduduk gunung api (boleh gagal)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python3 scripts/gunungapi/pop_grid.py && python3 scripts/gunungapi/pop_grid.py --uji

      - name: Simpan data mentah gunung api
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/kekeringan
            data/raw/kekeringan_hujan.json
            data/raw/gunungapi
          key: lintas-${{ github.run_id }}

      # Abrasi garis pantai tahunan (Landsat via Planetary Computer): hanya Januari, Februari, atau dispatch tangan; cache adegan supaya tahun berikutnya hanya membaca adegan baru.
      - name: Bulan abrasi?
        id: abrasi
        run: |
          if [ "$(date -u +%m)" = "01" ] || [ "$(date -u +%m)" = "02" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "jalan=1" >> "$GITHUB_OUTPUT"; fi

      - name: Pulihkan cache adegan abrasi
        if: steps.abrasi.outputs.jalan == '1'
        uses: actions/cache/restore@v4
        with:
          path: data/raw/pesisir/adegan
          key: abrasi-${{ github.run_id }}
          restore-keys: abrasi-

      - name: Abrasi garis pantai tahunan (boleh gagal)
        if: steps.abrasi.outputs.jalan == '1'
        continue-on-error: true
        timeout-minutes: 200
        run: python3 scripts/pesisir/abrasi.py uji && python3 scripts/pesisir/abrasi.py

      # KI-25: tabel pelabuhan -> kab (tanpa jaringan, dari rob.json + cuaca_sarana.json di repo); setahun sekali cukup.
      - name: Pelabuhan di zona rob (boleh gagal)
        if: steps.abrasi.outputs.jalan == '1'
        continue-on-error: true
        run: python3 -I scripts/pesisir/pelabuhan.py uji && python3 -I scripts/pesisir/pelabuhan.py

      - name: Simpan cache adegan abrasi
        if: always() && steps.abrasi.outputs.jalan == '1'
        uses: actions/cache/save@v4
        with:
          path: data/raw/pesisir/adegan
          key: abrasi-${{ github.run_id }}

      # bahaya.py MENGHAPUS lapisan lama bila sumbernya tak terjangkau (aturan A18): berkas yang hilang dipulihkan dari index, bukan di-commit sebagai hapus.
      - name: Commit lapisan bulanan lintas bencana
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          B="public/gempa/data/riwayat_m5.json public/gempa/data/riwayat_prov.json public/gempa/data/riwayat_grid.json public/gempa/data/risiko.json public/gempa/data/meta.json public/gempa/data/inarisk_gempa.json public/gempa/data/inarisk_tsunami.json public/gempa/data/batas_lempeng.geojson public/gempa/data/bahaya_meta.json public/gempa/data/sesar.geojson public/gempa/data/bukti.json public/gempa/data/citra.json public/gempa/data/citra public/kekeringan/data/embung.json public/gunungapi/data/paparan.json public/gunungapi/data/risiko.json public/gunungapi/data/citra public/gunungapi/data/pop public/pesisir/data/abrasi.json public/pesisir/data/abrasi_prospektif.json public/pesisir/data/pelabuhan_kab.json public/data/gerbang/pesisir.json"
          for f in $B; do [ ! -e "$f" ] || git add "$f"; done
          git checkout -- public/gempa/data public/kekeringan/data public/gunungapi/data public/pesisir/data
          git diff --cached --quiet && { echo "lapisan bulanan tidak berubah"; exit 0; }
          git commit -q -m "data: lapisan bulanan gempa, kekeringan, gunung api $(TZ=Asia/Jakarta date +%F)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push -q && exit 0
            echo "push bentrok, ulang $i"; sleep $((i * 10))
          done
          echo "::error title=Push lapisan bulanan gagal::git push ke main gagal 3x"
          exit 1

      # ---- Panen bulanan (30 Okt 2026, docs/panen/RENCANA-PANEN-DATA.md #3 #5 #6 #13 #19 #22 #28-33 #39 #41 dan harga CPO #51). Semua boleh gagal, tiap skrip
      # uji dulu; berkas lamanya dibiarkan bila gagal. Kunci hanya lewat nama secret; tanpa kunci skripnya sendiri menulis status MENUNGGU KUNCI (bukan angka karangan).
      # Urutan bnpb: kerentanan, ikd, terpapar dulu, risiko_hvc terakhir (membaca ketiganya). TIDAK dijalankan di sini: GRACE-FO (butuh pip h5py), TMAT (SiPALAGA
      # diblokir Cloudflare), kanopi/logistik/MapBiomas/PM2,5 1 km (raster besar, lab.yml), SLSTR (CDSE belum ada kunci), label_lapangan (keluaran mentah gitignored).
      - name: Panen bulanan, GNSS, iklim stasiun, harga CPO, kerentanan BNPB, izin, menara (boleh gagal)
        continue-on-error: true
        timeout-minutes: 90
        env:
          BPS_KEY: ${{ secrets.BPS_KEY }}
          OPENCELLID_KEY: ${{ secrets.OPENCELLID_KEY }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          jalan() { # jalan <skrip> <argumen uji> [argumen jalan...]
            s=$1; u=$2; shift 2
            python3 scripts/$s $u && { python3 scripts/$s "$@" || echo "::warning title=panen $s::gagal; berkas lamanya dibiarkan"; } || echo "::warning title=panen $s::uji $s gagal"
          }
          jalan gempa/gnss.py uji ambil
          jalan gempa/gnss.py uji hitung
          jalan cuaca/iklim_stasiun.py uji --unduh
          jalan panen/harga_komoditas.py uji
          jalan bnpb/kerentanan.py --cek
          jalan bnpb/ikd.py --cek
          jalan bnpb/terpapar.py --cek
          jalan bnpb/puso.py --cek
          jalan bnpb/risiko_hvc.py --cek
          jalan data/panen/ps.py uji panen
          jalan data/panen/ps.py uji
          jalan data/panen/tambang.py uji panen
          jalan data/panen/tambang.py uji
          jalan data/panen/hgu_api.py uji
          jalan umum/menara.py uji
          jalan umum/foto_dasar.py uji
          jalan longsor/kejadian.py uji
          jalan umum/citra_terbuka.py uji
          jalan cuaca/ibtracs.py uji
          jalan umum/sirup.py uji

      - name: Commit panen bulanan
        run: |
          git config user.name "poskokarhutla-bot"
          git config user.email "actions@users.noreply.github.com"
          B="public/gempa/data/gnss.json public/data/iklim_stasiun.json public/data/harga_komoditas.json public/data/bnpb/kerentanan.json public/data/bnpb/ikd.json public/data/bnpb/terpapar.json public/data/bnpb/risiko_hvc.json public/data/bnpb/puso.json public/data/ps.json public/data/tambang.json public/data/hgu_api.json public/data/menara.json public/data/foto_dasar.json public/longsor/data/kejadian.json public/data/citra_terbuka.json public/cuaca/data/ibtracs.json public/data/sirup_bencana.json"
          for f in $B; do [ ! -e "$f" ] || git add "$f"; done
          git diff --cached --quiet && { echo "panen bulanan tidak berubah"; exit 0; }
          git commit -q -m "data: panen bulanan $(TZ=Asia/Jakarta date +%F)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push -q && exit 0
            echo "push bentrok, ulang $i"; sleep $((i * 10))
          done
          echo "::error title=Push panen bulanan gagal::git push ke main gagal 3x"
          exit 1

      # Penjaga data beku (PB-68.10): langkah `continue-on-error` di atas menelan galat, jadi periksa umur berkas keluaran di akhir. Merah = galat.
      - name: Periksa data tidak beku
        if: always()
        run: python3 scripts/agents/cek_basi.py statis
